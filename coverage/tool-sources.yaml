    tools: [search_ipos_manuals, get_ipos_manual_section, list_ipos_manuals]
    connector_modules: [patent_client_agents.ipos_manuals]
  - server: trademarks_mcp
    tools: [search_trademarks]
    connector_modules: [patent_client_agents.uspto_tmsearch]
  - server: trademarks_mcp
    tools: [get_trademark, get_trademark_status, get_trademark_documents, get_trademark_last_update]
    connector_modules: [patent_client_agents.uspto_tsdr]
  - server: trademarks_mcp
    tools: [search_tmep, get_tmep_section]
    connector_modules: [patent_client_agents.tmep]
  - server: trademarks_mcp
    tools: [search_trademark_assignments]
    connector_modules: [patent_client_agents.uspto_trademark_assignments]
  - server: upc_mcp
