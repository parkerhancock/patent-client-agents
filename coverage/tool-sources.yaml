# MCP tool groups linked to the authoritative rows in coverage/sources.yaml.
#
# A group without `tools` covers every tool exposed by that named subserver.
# A group with `tools` covers only that subset. The contract validator rejects
# missing tools, duplicate mappings, unknown source modules, inactive sources,
# and groups whose source rows do not resolve to one non-null category.

version: 1
groups:
  - server: cafc_mcp
    connector_modules: [patent_client_agents.cafc]
  - server: canlii_mcp
    connector_modules: [patent_client_agents.canlii]
  - server: copyright_mcp
    connector_modules: [patent_client_agents.copyright]
  - server: cpc_mcp
    connector_modules: [patent_client_agents.cpc]
