# Gitleaks configuration for patent-client-agents.
#
# Extends the default rule set and allowlists specific upstream documentation
# files that contain illustrative placeholders and example URLs published by
# USPTO / JPO / EPO themselves. These aren't secrets we control, and the
# files are imported verbatim from upstream — reviewing them for leaks here
# is redundant and produces false positives every time upstream ships new
# examples.

[extend]
useDefault = true

[[allowlists]]
description = "Upstream USPTO / JPO / EPO OpenAPI specs and reference bundles"
paths = [
    '''resources/uspto/uspto_odp_swagger\.yaml''',
    '''resources/epo/en-ops\.txt''',
    '''resources/jpo/jpo_api_openapi\.json''',
    '''resources/jpo/jpo_api_reference_e\.js''',
    '''src/patent_client_agents/uspto_odp/data/odp_swagger\.yaml''',
]

[[allowlists]]
description = "Generated public fee snapshots: top-level corpus key"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
    '''coverage/fees-snapshot/[^/]+\.json''',
]
regexTarget = "line"
regexes = [
    '''^\s*"key":\s*"[^"]+",?\s*$''',
]

[[allowlists]]
description = "Public TÜRKPATENT HTML fixtures containing browser-side site keys"
targetRules = ["generic-api-key", "gcp-api-key"]
paths = [
    '''tests/fees/fixtures/tr_turkpatent_designs_2026-05-19\.html''',
    '''tests/fees/fixtures/tr_turkpatent_patents_2026-05-19\.html''',
    '''tests/fees/fixtures/tr_turkpatent_trademarks_2026-05-19\.html''',
]

[[allowlists]]
description = "Local agent worktrees are separate checkouts, not repository content"
paths = [
    '''^\.claude/worktrees/''',
]
