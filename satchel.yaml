schema: satchel/v0
name: patent-client-agents
version: 0.27.0
description: Intellectual property research toolkit with 136 default MCP tools for patent, trademark, litigation, fee, and substantive-law research.
author:
  name: Parker Hancock
  url: https://github.com/parkerhancock
homepage: https://patentclient.com/
repository: https://github.com/parkerhancock/patent-client-agents
license: Apache-2.0
keywords:
  - patent
  - trademark
  - intellectual-property
  - uspto
  - epo
  - mcp

components:
  mcp:
    path: ./plugins/patent-client-agents/.mcp.json

targets:
  codex:
    enabled: true
    manifest: ./plugins/patent-client-agents/.codex-plugin/plugin.json
    marketplace:
      path: ./.agents/plugins/marketplace.json
      name: patent-client-agents
      displayName: Patent Client Agents
      source:
        source: local
        path: ./plugins/patent-client-agents
      category: Education & Research
      installation: AVAILABLE
      authentication: ON_INSTALL
    interface:
      displayName: Patent Client Agents
      shortDescription: Research patents, trademarks, fees, and IP law.
      longDescription: Use 136 default MCP tools for source-backed patent, trademark, design, copyright, litigation, fee, and substantive-law research. Private credentials can expose up to 234 tools.
      developerName: Parker Hancock
      category: Education & Research
      capabilities:
        - Interactive
        - Read
      websiteURL: https://patentclient.com/
      privacyPolicyURL: https://mcp.patentclient.com/privacy
      termsOfServiceURL: https://mcp.patentclient.com/terms
      defaultPrompt:
        - Find and explain a patent by publication number.
        - Compare current patent fees across offices.
        - Find the controlling MPEP or TMEP section.
      brandColor: "#2A5FDF"

  claude:
    enabled: true
    manifest: ./plugins/patent-client-agents/.claude-plugin/plugin.json
    marketplace:
      path: ./.claude-plugin/marketplace.json
      name: patent-client-agents
      source: ./plugins/patent-client-agents
      category: Education & Research
    displayName: Patent Client Agents

  antigravity:
    enabled: true
    experimental: true
    output: ./plugins/patent-client-agents
