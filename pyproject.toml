[project]
name = "patent-client-agents"
version = "0.25.0"
description = "Intellectual property research toolkit for AI agents — patents, trademarks, and prosecution data from USPTO, EPO, JPO, EUIPO, Google Patents, CanLII, WIPO Lex, MPEP, and CPC"
readme = "README.md"
authors = [
    { name = "Parker Hancock", email = "633163+parkerhancock@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["patent", "intellectual property", "trademark", "ai", "agents", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp-data-core>=0.1.0",
    "anyio>=4.4",
    "httpx>=0.27",
    "h2>=4.1",
    "lxml>=5.2",
    "cssselect>=1.2",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "tenacity>=8.4",
    "hishel[async]>=1.1.3",
    "markitdown[pdf]>=0.1.3",
    "pypdf>=4.2",
    "pyyaml>=6.0",
    "zstandard>=0.22",
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.2.3",
    "starlette>=1.0.1",
    # fastmcp imports `from griffe import ...` — the 2.x release split the
    # top-level module out into a separate `griffelib` distribution, so
    # fastmcp's import fails on griffe>=2. Pin here until upstream fastmcp
    # either migrates to griffelib or re-adds the compat shim.
    "griffe<2",
]
tmsearch = [
    # USPTO Trademark Search sits behind AWS WAF. curl_cffi gives us the
    # Chrome TLS fingerprint the WAF expects on API calls. Playwright is
    # used to mint a fresh ``aws-waf-token`` cookie when the cache is
    # empty/stale; once acquired, the token lasts ~4 days. Headless server
    # deployments typically run a separate Playwright job to mint tokens
    # and feed them in via PCA_WAF_TOKEN_JSON, so curl_cffi alone is
    # enough at request time.
    "curl_cffi>=0.7",
    "playwright>=1.40",
]

[project.scripts]
patent-client-agents-mcp = "patent_client_agents.mcp.server:main"
patent-client-agents-skill-install = "patent_client_agents.skill_install:main"
patent-client-agents-bootstrap-corpora = "patent_client_agents.corpus_bootstrap:main"
patent-client-agents-build-mpep-corpus = "patent_client_agents.mpep.corpus.build:main"
patent-client-agents-build-tmep-corpus = "patent_client_agents.tmep.corpus.build:main"
patent-client-agents-build-upc-statutes-corpus = "patent_client_agents.upc_statutes.corpus.build:main"
patent-client-agents-build-mopp-corpus = "patent_client_agents.ukipo_mopp.corpus.build:main"
patent-client-agents-build-guidelines-corpus = "patent_client_agents.epo_guidelines.corpus.build:main"
patent-client-agents-build-epc-corpus = "patent_client_agents.epc.corpus.build:main"
patent-client-agents-build-caselaw-corpus = "patent_client_agents.epo_case_law.corpus.build:main"
patent-client-agents-build-pct-guidelines-corpus = "patent_client_agents.epo_pct_guidelines.corpus.build:main"
patent-client-agents-build-up-guidelines-corpus = "patent_client_agents.epo_up_guidelines.corpus.build:main"
patent-client-agents-build-legifrance-ip-corpus = "patent_client_agents.legifrance_ip.corpus.build:main"
patent-client-agents-build-ipo-in-statutes-corpus = "patent_client_agents.ipo_in_statutes.corpus.build:main"
patent-client-agents-build-ipo-in-mppp-corpus = "patent_client_agents.ipo_in_mppp.corpus.build:main"
patent-client-agents-build-dpma-statutes-corpus = "patent_client_agents.dpma_statutes.corpus.build:main"
patent-client-agents-build-tw-trade-secrets-corpus = "patent_client_agents.tw_trade_secrets.corpus.build:main"
patent-client-agents-build-ipos-statutes-corpus = "patent_client_agents.ipos_statutes.corpus.build:main"
patent-client-agents-build-ipos-manuals-corpus = "patent_client_agents.ipos_manuals.corpus.build:main"
patent-client-agents-build-inpi-br-statutes-corpus = "patent_client_agents.inpi_br_statutes.corpus.build:main"
patent-client-agents-build-ilpo-statutes-corpus = "patent_client_agents.ilpo_statutes.corpus.build:main"

[project.urls]
Homepage = "https://github.com/parkerhancock/patent-client-agents"
Repository = "https://github.com/parkerhancock/patent-client-agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_client_agents"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "vcrpy>=6.0",
    "ruff>=0.9.0",
    "ty>=0.0.9",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=6.2",
    # pygments 2.20 changed filename handling in a way that breaks
    # pymdownx.highlight (filename=None passed through to html.escape).
    # Pin until pymdownx releases a fix.
    "pygments<2.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["patent_client_agents", "mcp_data_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_tsdr: marks tests that hit live USPTO TSDR API (requires USPTO_TSDR_API_KEY)",
  "live_mpep: tagged for grep parity with prior suites; the corpus-backed MpepClient no longer hits live USPTO, so these tests run offline",
  "live_tmep: tagged for grep parity with prior suites; the corpus-backed TmepClient no longer hits live USPTO, so these tests run offline",
  "live_trademark_assignments: marks tests that replay or re-record USPTO Trademark Assignment Center calls",
]

[tool.uv]
# 7-day supply-chain cooldown — rejects upstream packages newer than this
# window so a brand-new compromised release on PyPI doesn't get pulled in
# unnoticed.
exclude-newer = "7 days"

# First-party packages are exempt from the cooldown. Starlette is also
# exempted here because 1.0.1 is a time-sensitive security fix.
exclude-newer-package = { "mcp-data-core" = "2099-01-01", "starlette" = "2099-01-01" }
