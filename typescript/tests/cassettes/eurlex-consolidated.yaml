      content: "\r\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML//EN\" \"xhtml-strict.dtd\">\r\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\r\n<!-- fmx2xhtml # converter_version:9.15.0 # generated_on:20231017-2154 -->\r\n<head>\n   <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"/>\n   <title>Consolidated TEXT: 31996L0009 — EN — 06.06.2019</title>\n   <link type=\"text/css\" rel=\"stylesheet\"\n         href=\"http://publications.europa.eu/resource/presentation-style-sheet/clg/clg.css\"/>\n</head>\n<body>\n   <p class=\"reference\">01996L0009 — EN — 06.06.2019 — 001.001</p>\n   <hr class=\"separator\"/>\n   <p class=\"disclaimer\">This text is meant purely as a documentation tool and has no legal effect. The Union's institutions do not assume any liability for its contents. The authentic versions of the relevant acts, including their preambles, are those published in the Official Journal of the European Union and available in EUR-Lex. Those official texts are directly accessible through the links embedded in this document</p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"5\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"arrow\">\n               <a href=\"http://publications.europa.eu/resource/celex/31996L0009\"\n                  onclick=\"window.open(this.href,'_blank'); return false;\"\n                  title=\"31996L0009\">►B</a>\n            </p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"title-doc-first\" id=\"id-5284e8fc-7818-4306-9bbc-41b9d0efeda8\">\n                        DIRECTIVE 96/9/EC OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL\n                     </p>\n            <p class=\"title-doc-first\" id=\"id-67f91273-17f6-409c-bfc9-106f1bfefe7f\">of 11 March 1996\n                     </p>\n            <p class=\"title-doc-last\" id=\"id-a49408ca-6f59-4632-874c-69d846c0205d\">\n               <a href=\"http://publications.europa.eu/resource/celex/31996L0009\"\n                  onclick=\"window.open(this.href,'_blank'); return false;\"\n                  title=\"31996L0009\">on the legal protection of databases</a>\n            </p>\n            <p class=\"title-doc-oj-reference\" id=\"id-7a638248-1cc1-4925-982a-9485a9f36035\">(OJ L 077 27.3.1996, p. 20)</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"hd-modifiers\">Amended by:</p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"5\" cellpadding=\"0\">\n      <col width=\"10%\"/>\n      <col width=\"55%\"/>\n      <col width=\"10%\"/>\n      <col width=\"10%\"/>\n      <col width=\"15%\"/>\n      <tr>\n         <td valign=\"top\" rowspan=\"2\">\n            <p class=\"norm\"> </p>\n         </td>\n         <td valign=\"top\" rowspan=\"2\">\n            <p class=\"norm\"> </p>\n         </td>\n         <td valign=\"top\" colspan=\"3\">\n            <p class=\"hd-toc-1\">Official Journal</p>\n         </td>\n      </tr>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"hd-toc-2\">  No</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"hd-toc-3\">page</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"hd-toc-3\">date</p>\n         </td>\n      </tr>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"arrow\">\n               <a href=\"http://publications.europa.eu/resource/celex/32019L0790\"\n                  onclick=\"window.open(this.href,'_blank'); return false;\"\n                  title=\"32019L0790\">►M1</a>\n            </p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"title-fam-member-star\" id=\"id-a56bbb9c-8478-4dfe-920d-803e00a01ef0\">\n               <a href=\"http://publications.europa.eu/resource/celex/32019L0790\"\n                  onclick=\"window.open(this.href,'_blank'); return false;\"\n                  title=\"32019L0790\">\n                              DIRECTIVE (EU) 2019/790 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL\n                            of 17 April 2019\n                           </a>\n            </p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"toc-1\">  L 130</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"toc-2\">92</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"toc-2\">17.5.2019</p>\n         </td>\n      </tr>\n   </table>\n   <p>\n      <br/>\n   </p>\n   <hr class=\"separator\"/>\n   <div class=\"eli-container\">\n      <p>\n         <br/>\n      </p>\n      <p class=\"arrow\">\n         <a href=\"http://publications.europa.eu/resource/celex/31996L0009\"\n            onclick=\"window.open(this.href,'_blank'); return false;\"\n            title=\"31996L0009\">▼B</a>\n      </p>\n      <div class=\"eli-main-title\" id=\"tit_1\">\n         <p class=\"title-doc-first\" id=\"id-458421af-e881-4b96-9f4c-93aff707c76e\">\n               DIRECTIVE 96/9/EC OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL\n            </p>\n         <p class=\"title-doc-first\" id=\"id-60e4e8a2-59fd-47a5-b705-62cca79c764e\">of 11 March 1996\n            </p>\n         <p class=\"title-doc-last\" id=\"id-f40b3525-f567-4382-be54-ad695709a6c3\">on the legal protection of databases</p>\n      </div>\n      <div class=\"eli-subdivision\" id=\"enc_1\">\n         <p>\n            <br/>\n            <br/>\n         </p>\n         <div id=\"cpt_I\">\n            <p class=\"title-division-1\" id=\"id-1661bdde-b0d5-4d6c-bc01-1ca62df326c6\">CHAPTER I</p>\n            <p class=\"title-division-2\" id=\"id-f3ccd248-629b-4d8d-acd6-d4778b3e4472\">\n               <span class=\"boldface\">SCOPE</span>\n            </p>\n            <div class=\"eli-subdivision\" id=\"art_1\">\n               <p class=\"title-article-norm\" id=\"id-ad1eca6e-93a3-4980-b68f-2acf8a9d89b6\">Article 1</p>\n               <div class=\"eli-title\" id=\"art_1.tit_1\">\n                  <p class=\"stitle-article-norm\">Scope</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">This Directive concerns the legal protection of databases in any form.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">For the purposes of this Directive, ‘database’ shall mean a collection of independent works, data or other materials arranged in a systematic or methodical way and individually accessible by electronic or other means.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">Protection under this Directive shall not apply to computer programs used in the making or operation of databases accessible by electronic means.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_2\">\n               <p class=\"title-article-norm\" id=\"id-d309647e-51e8-44b9-8295-145ebee31d9e\">Article 2</p>\n               <div class=\"eli-title\" id=\"art_2.tit_1\">\n                  <p class=\"stitle-article-norm\">Limitations on the scope</p>\n               </div>\n               <p class=\"norm\">This Directive shall apply without prejudice to Community provisions relating to:</p>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(a) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">the legal protection of computer programs;</p>\n                  </div>\n               </div>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(b) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">rental right, lending right and certain rights related to copyright in the field of intellectual property,</p>\n                  </div>\n               </div>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(c) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">the term of protection of copyright and certain related rights.</p>\n                  </div>\n               </div>\n            </div>\n         </div>\n         <div id=\"cpt_II\">\n            <p class=\"title-division-1\" id=\"id-f098d646-16a3-4a89-9f54-6f5356eb3045\">CHAPTER II</p>\n            <p class=\"title-division-2\" id=\"id-3fc16fcf-77f2-46e5-96f4-68093511ea85\">\n               <span class=\"boldface\">COPYRIGHT</span>\n            </p>\n            <div class=\"eli-subdivision\" id=\"art_3\">\n               <p class=\"title-article-norm\" id=\"id-02db0087-5f4d-4592-bec8-1c79f8998f13\">Article 3</p>\n               <div class=\"eli-title\" id=\"art_3.tit_1\">\n                  <p class=\"stitle-article-norm\">Object of protection</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">In accordance with this Directive, databases which, by reason of the selection or arrangement of their contents, constitute the author's own intellectual creation shall be protected as such by copyright. No other criteria shall be applied to determine their eligibility for that protection.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">The copyright protection of databases provided for by this Directive shall not extend to their contents and shall be without prejudice to any rights subsisting in those contents themselves.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_4\">\n               <p class=\"title-article-norm\" id=\"id-e614cee1-74e2-4afa-abe6-10f2a266b0fb\">Article 4</p>\n               <div class=\"eli-title\" id=\"art_4.tit_1\">\n                  <p class=\"stitle-article-norm\">Database authorship</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">The author of a database shall be the natural person or group of natural persons who created the base or, where the legislation of the Member States so permits, the legal person designated as the rightholder by that legislation.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">Where collective works are recognized by the legislation of a Member State, the economic rights shall be owned by the person holding the copyright.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">In respect of a database created by a group of natural persons jointly, the exclusive rights shall be owned jointly.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_5\">\n               <p class=\"title-article-norm\" id=\"id-6959f2a9-768c-49f0-9e56-afc851117c24\">Article 5</p>\n               <div class=\"eli-title\" id=\"art_5.tit_1\">\n                  <p class=\"stitle-article-norm\">Restricted acts</p>\n               </div>\n               <p class=\"norm\">In respect of the expression of the database which is protectable by copyright, the author of a database shall have the exclusive right to carry out or to authorize:</p>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(a) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">temporary or permanent reproduction by any means and in any form, in whole or in part;</p>\n                  </div>\n               </div>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(b) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">translation, adaptation, arrangement and any other alteration;</p>\n                  </div>\n               </div>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(c) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">any form of distribution to the public of the database or of copies thereof. The first sale in the Community of a copy of the database by the rightholder or with his consent shall exhaust the right to control resale of that copy within the Community;</p>\n                  </div>\n               </div>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(d) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">any communication, display or performance to the public;</p>\n                  </div>\n               </div>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(e) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">any reproduction, distribution, communication, display or performance to the public of the results of the acts referred to in (b).</p>\n                  </div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_6\">\n               <p class=\"title-article-norm\" id=\"id-f3a8f3a1-403c-47df-b280-50dcf564d2a7\">Article 6</p>\n               <div class=\"eli-title\" id=\"art_6.tit_1\">\n                  <p class=\"stitle-article-norm\">Exceptions to restricted acts</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">The performance by the lawful user of a database or of a copy thereof of any of the acts listed in Article 5 which is necessary for the purposes of access to the contents of the databases and normal use of the contents by the lawful user shall not require the authorization of the author of the database. Where the lawful user is authorized to use only part of the database, this provision shall apply only to that part.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">\n                     <p class=\"norm inline-element\">Member States shall have the option of providing for limitations on the rights set out in Article 5 in the following cases:</p>\n                     <div class=\"grid-container grid-list\">\n                        <div class=\"list grid-list-column-1\">\n                           <span>(a) </span>\n                        </div>\n                        <div class=\"grid-list-column-2\">\n                           <p class=\"norm\">in the case of reproduction for private purposes of a non-electronic database;</p>\n                        </div>\n                     </div>\n                     <p class=\"modref\">\n                        <a href=\"http://publications.europa.eu/resource/celex/32019L0790\"\n                           onclick=\"window.open(this.href,'_blank'); return false;\"\n                           title=\"32019L0790: REPLACED\">▼M1</a>\n                     </p>\n                     <div class=\"grid-container grid-list\">\n                        <div class=\"list grid-list-column-1\">\n                           <span>(b) </span>\n                        </div>\n                        <div class=\"grid-list-column-2\">\n                           <p class=\"norm\">where there is use for the sole purpose of illustration for teaching or scientific research, as long as the source is indicated and to the extent justified by the non-commercial purpose to be achieved, without prejudice to the exceptions and limitations provided for in Directive (EU) 2019/790 of the European Parliament and of the Council (<a href=\"#E0001\" id=\"src.E0001\">\n                                 <span class=\"superscript\">1</span>\n                              </a>);</p>\n                        </div>\n                     </div>\n                     <p class=\"modref\">\n                        <a href=\"http://publications.europa.eu/resource/celex/31996L0009\"\n                           onclick=\"window.open(this.href,'_blank'); return false;\"\n                           title=\"31996L0009\">▼B</a>\n                     </p>\n                     <div class=\"grid-container grid-list\">\n                        <div class=\"list grid-list-column-1\">\n                           <span>(c) </span>\n                        </div>\n                        <div class=\"grid-list-column-2\">\n                           <p class=\"norm\">where there is use for the purposes of public security of for the purposes of an administrative or judicial procedure;</p>\n                        </div>\n                     </div>\n                     <div class=\"grid-container grid-list\">\n                        <div class=\"list grid-list-column-1\">\n                           <span>(d) </span>\n                        </div>\n                        <div class=\"grid-list-column-2\">\n                           <p class=\"norm\">where other exceptions to copyright which are traditionally authorized under national law are involved, without prejudice to points (a), (b) and (c).</p>\n                        </div>\n                     </div>\n                  </div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">In accordance with the Berne Convention for the protection of Literary and Artistic Works, this Article may not be interpreted in such a way as to allow its application to be used in a manner which unreasonably prejudices the rightholder's legitimate interests or conflicts with normal exploitation of the database.</div>\n               </div>\n            </div>\n         </div>\n         <div id=\"cpt_III\">\n            <p class=\"title-division-1\" id=\"id-f1b4b4cc-d14c-4322-ba71-a66b4b18dc8a\">CHAPTER III</p>\n            <p class=\"title-division-2\" id=\"id-8d37c638-584a-4655-a12c-c7f9ce0be41b\">\n               <span class=\"boldface\">\n                  <span class=\"italics\">SUI GENERIS</span> RIGHT</span>\n            </p>\n            <div class=\"eli-subdivision\" id=\"art_7\">\n               <p class=\"title-article-norm\" id=\"id-d572c934-0d35-40c4-bb1e-4765c5c99ebe\">Article 7</p>\n               <div class=\"eli-title\" id=\"art_7.tit_1\">\n                  <p class=\"stitle-article-norm\">Object of protection</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">Member States shall provide for a right for the maker of a database which shows that there has been qualitatively and/or quantitatively a substantial investment in either the obtaining, verification or presentation of the contents to prevent extraction and/or re-utilization of the whole or of a substantial part, evaluated qualitatively and/or quantitatively, of the contents of that database.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">\n                     <p class=\"norm inline-element\">For the purposes of this Chapter:</p>\n                     <div class=\"grid-container grid-list\">\n                        <div class=\"list grid-list-column-1\">\n                           <span>(a) </span>\n                        </div>\n                        <div class=\"grid-list-column-2\">\n                           <p class=\"norm\">‘extraction’ shall mean the permanent or temporary transfer of all or a substantial part of the contents of a database to another medium by any means or in any form;</p>\n                        </div>\n                     </div>\n                     <div class=\"grid-container grid-list\">\n                        <div class=\"list grid-list-column-1\">\n                           <span>(b) </span>\n                        </div>\n                        <div class=\"grid-list-column-2\">\n                           <p class=\"norm\">‘re-utilization’ shall mean any form of making available to the public all or a substantial part of the contents of a database by the distribution of copies, by renting, by on-line or other forms of transmission. The first sale of a copy of a database within the Community by the rightholder or with his consent shall exhaust the right to control resale of that copy within the Community;</p>\n                        </div>\n                     </div>\n                  </div>\n               </div>\n               <p class=\"norm\">Public lending is not an act of extraction or re-utilization.</p>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">The right referred to in paragraph 1 may be transferred, assigned or granted under contractual licence.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">4.  </span>\n                  <div class=\"norm inline-element\">The right provided for in paragraph 1 shall apply irrespective of the eligibility of that database for protection by copyright or by other rights. Moreover, it shall apply irrespective of eligibility of the contents of that database for protection by copyright or by other rights. Protection of databases under the right provided for in paragraph 1 shall be without prejudice to rights existing in respect of their contents.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">5.  </span>\n                  <div class=\"norm inline-element\">The repeated and systematic extraction and/or re-utilization of insubstantial parts of the contents of the database implying acts which conflict with a normal exploitation of that database or which unreasonably prejudice the legitimate interests of the maker of the database shall not be permitted.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_8\">\n               <p class=\"title-article-norm\" id=\"id-69cc5c06-bc62-4f86-ba04-aa38255c7fd7\">Article 8</p>\n               <div class=\"eli-title\" id=\"art_8.tit_1\">\n                  <p class=\"stitle-article-norm\">Rights and obligations of lawful users</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">The maker of a database which is made available to the public in whatever manner may not prevent a lawful user of the database from extracting and/or re-utilizing insubstantial parts of its contents, evaluated qualitatively and/or quantitatively, for any purposes whatsoever. Where the lawful user is authorized to extract and/or re-utilize only part of the database, this paragraph shall apply only to that part.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">A lawful user of a database which is made available to the public in whatever manner may not perform acts which conflict with normal exploitation of the database or unreasonably prejudice the legitimate interests of the maker of the database.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">A lawful user of a database which is made available to the public in any manner may not cause prejudice to the holder of a copyright or related right in respect of the works or subject matter contained in the database.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_9\">\n               <p class=\"title-article-norm\" id=\"id-271ece82-4589-434c-93b7-acccbbdfd368\">Article 9</p>\n               <div class=\"eli-title\" id=\"art_9.tit_1\">\n                  <p class=\"stitle-article-norm\">Exceptions to the <span class=\"italics\">sui generis</span> right</p>\n               </div>\n               <p class=\"norm\">Member States may stipulate that lawful users of a database which is made available to the public in whatever manner may, without the authorization of its maker, extract or re-utilize a substantial part of its contents:</p>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(a) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">in the case of extraction for private purposes of the contents of a non-electronic database;</p>\n                  </div>\n               </div>\n               <p class=\"modref\">\n                  <a href=\"http://publications.europa.eu/resource/celex/32019L0790\"\n                     onclick=\"window.open(this.href,'_blank'); return false;\"\n                     title=\"32019L0790: REPLACED\">▼M1</a>\n               </p>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(b) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">in the case of extraction for the purposes of illustration for teaching or scientific research, as long as the source is indicated and to the extent justified by the non-commercial purpose to be achieved, without prejudice to the exceptions and limitations provided for in Directive (EU) 2019/790;</p>\n                  </div>\n               </div>\n               <p class=\"modref\">\n                  <a href=\"http://publications.europa.eu/resource/celex/31996L0009\"\n                     onclick=\"window.open(this.href,'_blank'); return false;\"\n                     title=\"31996L0009\">▼B</a>\n               </p>\n               <div class=\"grid-container grid-list\">\n                  <div class=\"list grid-list-column-1\">\n                     <span>(c) </span>\n                  </div>\n                  <div class=\"grid-list-column-2\">\n                     <p class=\"norm\">in the case of extraction and/or re-utilization for the purposes of public security or an administrative or judicial procedure.</p>\n                  </div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_10\">\n               <p class=\"title-article-norm\" id=\"id-8a810ffd-b7fd-4113-b29d-dbecf5a8f04f\">Article 10</p>\n               <div class=\"eli-title\" id=\"art_10.tit_1\">\n                  <p class=\"stitle-article-norm\">Term of protection</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">The right provided for in Article 7 shall run from the date of completion of the making of the database. It shall expire fifteen years from the first of January of the year following the date of completion.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">In the case of a database which is made available to the public in whatever manner before expiry of the period provided for in paragraph 1, the term of protection by that right shall expire fifteen years from the first of January of the year following the date when the database was first made available to the public.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">Any substantial change, evaluated qualitatively or quantitatively, to the contents of a database, including any substantial change resulting from the accumulation of successive additions, deletions or alterations, which would result in the database being considered to be a substantial new investment, evaluated qualitatively or quantitatively, shall qualify the database resulting from that investment for its own term of protection.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_11\">\n               <p class=\"title-article-norm\" id=\"id-f8a51294-aba0-4f57-b92e-2018e38a79ed\">Article 11</p>\n               <div class=\"eli-title\" id=\"art_11.tit_1\">\n                  <p class=\"stitle-article-norm\">Beneficiaries of protection under the <span class=\"italics\">sui generis</span> right</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">The right provided for in Article 7 shall apply to database whose makers or rightholders are nationals of a Member State or who have their habitual residence in the territory of the Community.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">Paragraph 1 shall also apply to companies and firms formed in accordance with the law of a Member State and having their registered office, central administration or principal place of business within the Community; however, where such a company or firm has only its registered office in the territory of the Community, its operations must be genuinely linked on an ongoing basis with the economy of a Member State.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">Agreements extending the right provided for in Article 7 to databases made in third countries and falling outside the provisions of paragraphs 1 and 2 shall be concluded by the Council acting on a proposal from the Commission. The term of any protection extended to databases by virtue of that procedure shall not exceed that available pursuant to Article 10.</div>\n               </div>\n            </div>\n         </div>\n         <div id=\"cpt_IV\">\n            <p class=\"title-division-1\" id=\"id-14503c84-ff00-4478-8413-920846d18e98\">CHAPTER IV</p>\n            <p class=\"title-division-2\" id=\"id-a1983036-ceed-4240-b152-19a051897025\">COMMON PROVISIONS</p>\n            <div class=\"eli-subdivision\" id=\"art_12\">\n               <p class=\"title-article-norm\" id=\"id-ccb36598-14f3-43b9-a3d1-f89f0f362ebd\">Article 12</p>\n               <div class=\"eli-title\" id=\"art_12.tit_1\">\n                  <p class=\"stitle-article-norm\">Remedies</p>\n               </div>\n               <p class=\"norm\">Member States shall provide appropriate remedies in respect of infringements of the rights provided for in this Directive.</p>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_13\">\n               <p class=\"title-article-norm\" id=\"id-d9b421fb-3b1a-4453-8c3f-2d430b555e0d\">Article 13</p>\n               <div class=\"eli-title\" id=\"art_13.tit_1\">\n                  <p class=\"stitle-article-norm\">Continued application of other legal provisions</p>\n               </div>\n               <p class=\"norm\">This Directive shall be without prejudice to provisions concerning in particular copyright, rights related to copyright or any other rights or obligations subsisting in the data, works or other materials incorporated into a database, patent rights, trade marks, design rights, the protection of national treasures, laws on restrictive practices and unfair competition, trade secrets, security, confidentiality, data protection and privacy, access to public documents, and the law of contract.</p>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_14\">\n               <p class=\"title-article-norm\" id=\"id-8ea92849-3e3d-47f1-b3e4-ea2df9d60908\">Article 14</p>\n               <div class=\"eli-title\" id=\"art_14.tit_1\">\n                  <p class=\"stitle-article-norm\">Application over time</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">Protection pursuant to this Directive as regards copyright shall also be available in respect of databases created prior to the date referred to Article 16 (1) which on that date fulfil the requirements laid down in this Directive as regards copyright protection of databases.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">Notwithstanding paragraph 1, where a database protected under copyright arrangements in a Member State on the date of publication of this Directive does not fulfil the eligibility criteria for copyright protection laid down in Article 3 (1), this Directive shall not result in any curtailing in that Member State of the remaining term of protection afforded under those arrangements.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">Protection pursuant to the provisions of this Directive as regards the right provided for in Article 7 shall also be available in respect of databases the making of which was completed not more than fifteen years prior to the date referred to in Article 16 (1) and which on that date fulfil the requirements laid down in Article 7.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">4.  </span>\n                  <div class=\"norm inline-element\">The protection provided for in paragraphs 1 and 3 shall be without prejudice to any acts concluded and rights acquired before the date referred to in those paragraphs.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">5.  </span>\n                  <div class=\"norm inline-element\">In the case of a database the making of which was completed not more than fifteen years prior to the date referred to in Article 16 (1), the term of protection by the right provided for in Article 7 shall expire fifteen years from the first of January following that date.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_15\">\n               <p class=\"title-article-norm\" id=\"id-96af3ec2-a3a8-4304-a99d-1ef0a57fc444\">Article 15</p>\n               <div class=\"eli-title\" id=\"art_15.tit_1\">\n                  <p class=\"stitle-article-norm\">Binding nature of certain provisions</p>\n               </div>\n               <p class=\"norm\">Any contractual provision contrary to Articles 6 (1) and 8 shall be null and void.</p>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_16\">\n               <p class=\"title-article-norm\" id=\"id-a39d7952-7edd-40a1-b684-67f15052784c\">Article 16</p>\n               <div class=\"eli-title\" id=\"art_16.tit_1\">\n                  <p class=\"stitle-article-norm\">Final provisions</p>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">1.  </span>\n                  <div class=\"norm inline-element\">Member States shall bring into force the laws, regulations and administrative provisions necessary to comply with this Directive before 1 January 1998.</div>\n               </div>\n               <p class=\"norm\">When Member States adopt these provisions, they shall contain a reference to this Directive or shall be accompanied by such reference on the occasion of their official publication. The methods of making such reference shall be laid down by Member States.</p>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">2.  </span>\n                  <div class=\"norm inline-element\">Member States shall communicate to the Commission the text of the provisions of domestic law which they adopt in the field governed by this Directive.</div>\n               </div>\n               <div class=\"norm\">\n                  <span class=\"no-parag\">3.  </span>\n                  <div class=\"norm inline-element\">Not later than at the end of the third year after the date refered to in paragraph 1, and every three years thereafter, the Commission shall submit to the European Parliament, the Council and the Economic and Social Committee a report on the application of this Directive, in which, <span class=\"italics\">inter alia</span>, on the basis of specific information supplied by the Member States, it shall examine in particular the application of the <span class=\"italics\">sui generis</span> right, including Articles 8 and 9, and shall verify especially whether the application of this right has led to abuse of a dominant position or other interference with free competition which would justify appropriate measures being taken, including the establishment of non-voluntary licensing arrangements. Where necessary, it shall submit proposals for adjustment of this Directive in line with developments in the area of databases.</div>\n               </div>\n            </div>\n            <div class=\"eli-subdivision\" id=\"art_17\">\n               <p class=\"title-article-norm\" id=\"id-e0dd81d3-ef42-41c4-97a8-ee8db4cf3137\">Article 17</p>\n               <p class=\"norm\">This Directive is addressed to the Member States.</p>\n            </div>\n         </div>\n      </div>\n   </div>\n   <p>\n      <br/>\n   </p>\n   <hr class=\"separator-short\"/>\n   <p class=\"footnote\">(<a href=\"#src.E0001\" id=\"E0001\">\n         <span class=\"superscript\">1</span>\n      </a>) Directive (EU) 2019/790 of the European Parliament and of the Council of 17 April 2019 on copyright and related rights in the Digital Single Market and amending Directives 96/9/EC and 2001/29/EC (OJ L 130, 17.5.2019, p. 92).</p>\n</body>\r\n</html>\r\n"
