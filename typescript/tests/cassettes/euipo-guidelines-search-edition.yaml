            - Id: ish_2058424-1925685-16
              Content: "5.4 Invisible component parts of complex products                   5.4 Invisible component parts of complex products                                    Features of a Community design applied to, or incorporated in, a ‘component part of a complex product’, will be disregarded            if they are invisible during normal use of the complex product in question (Article 4(2) CDR).                                    ‘Complex product’ means a product that is composed of multiple components that can be replaced, permitting disassembly and            reassembly of the product (Article 3(c) CDR). For instance, the visibility requirement does not apply to a Community design            representing the appearance of a dustbin as a whole, since dustbins may be complex products as such, but not component parts            of complex products (23/06/2008, ICD No 4 919).                                    ‘Normal use’ means use by the end user, excluding maintenance, servicing or repair work (Article 4(3) CDR). ‘Normal use’ is            the use made in accordance with the purpose for which the complex product is intended.                                    For instance, for safety reasons, an electrical connector is a component part that is normally incorporated in a casing in            order to be shielded from any contact with potential users when a complex product, such as a train or an electric vehicle,            is in operation. The fact that this component part of a complex product can theoretically be made visible when inserted in            a transparent casing or cover constitutes a purely hypothetical and random criterion that must be disregarded (03/08/2009,            R 1052/2008‑3, Contacteurs électriques, § 42-53).                                    Where none of the features of a Community design applied to a component part (e.g. a sealing ring) is visible during normal            use of the complex product (e.g. a heat pump system), the Community design will be invalidated as a whole (20/01/2015, T‑616/13, Heat Exchanger Inserts, EU:T:2015:30, § 14-16).                                    However, Article 4(2) CDR does not require a component part to be clearly visible in its entirety at every moment of use of            the complex product. It is sufficient if the whole of the component can be seen some of the time in such a way that all its            essential features can be apprehended (22/10/2009, R 690/2007‑3, Chaff cutters, § 21).                                                                                                                        Parent topic: 5 The Different Grounds for Invalidity                                             "
