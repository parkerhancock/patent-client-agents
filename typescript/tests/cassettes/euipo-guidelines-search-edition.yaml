            - Id: ish_2058424-1787820-16
              Content: "13.4.1.1 Grounds for invalidity that are applicable independently of the enlargement of the EU                   13.4.1.1 Grounds for invalidity that are applicable independently of the enlargement of the EU                                    The accession of a new Member State has no effect on the applicability of the following four grounds for invalidity. Article\_110a(3)            CDR therefore does not offer any protection against their application to Community designs filed before 01/05/2004, 01/01/2007            or 01/07/2013 respectively.                                                Non-visibility and functionality                                                The non-visibility of a Community design applied to a part of a complex product and the restrictions applying to features            of a design that are solely dictated by technical function or the requirements of interconnection are grounds for invalidity            that must be evaluated on the basis of the design itself and not of a factual situation that exists in any given Member State            (Article\_25(1)(b) CDR in conjunction with Articles\_4 and 8\_CDR).                                                Novelty and individual character                                                Under normal circumstances, lack of novelty or individual character of a Community design will not be affected by enlargement            of the EU (Article\_25(1)(b) CDR in conjunction with Articles\_5 and 6\_ CDR).                                    The disclosure of a design prior to the filing or priority date of a Community design can destroy the latter’s novelty or            individual character, even if such disclosure took place in a country before the date of its accession to the EU. The sole            requirement is that such disclosure could ‘reasonably have become known in the normal course of business to the circles specialised            in the sector concerned, operating within the Community’ (Article\_7(1) CDR).                                                Entitlement to the Community design                                                The fact that the holder is not entitled to the Community design as a result of a court decision is another ground for invalidity            that is not affected by enlargement (Article\_25(1)(c) CDR). Article\_14 CDR does not impose any nationality requirement for            the person claiming to be entitled to the Community design, nor does it require that the court decision originates from a            court located in a Member State.                                                Improper use of one or more of the elements listed in Article\_6ter of the Paris Convention                                                The invalidity ground of improper use of one or more of the elements listed in Article\_6ter of the Paris Convention is not affected by enlargement of the EU either. There is no requirement for the sign of which use            is prohibited to come from a Member State (Article\_25(1)(g) CDR).                                                                                             Parent topic: 13.4.1 General principles                                             "
