            - Id: ish_2319054-2328812-16
              Content: "6.1.2.3 Use in relation to goods                   6.1.2.3 Use in relation to goods                                    Trade marks have traditionally been used on goods (printed on the goods, on labels, etc.) or their packaging. However, showing            use on goods or their packaging is not the only way of proving use in relation to goods. It is sufficient, if there is a proper            connection between the mark and the goods, for the mark to be used ‘in relation to’ the goods or services, such as on brochures,            flyers, stickers, signs inside places of sale, etc.                                    For example, when the opponent sells its goods only through catalogues (mail-order sales) or the internet, the mark may not            always appear on the packaging or even on the goods themselves. In such cases, use on the (internet) pages where the goods            are presented — provided it is otherwise genuine in terms of time, place, extent and nature — will generally be considered            sufficient. The owner of the mark will not have to provide proof that the mark actually appeared on the goods themselves. themselves (12/07/2023, T‑27/22, th pharma (fig.) / Th (fig.), EU:T:2023:390, § 31-34).                                                                                                                                                                                                                                                                                          Earlier sign                                                                                                                                                                                                                                                                  Case No                                                                                                                                                                                                                                                                                                                                                                                                   PETER STORM                                                                                                                                                                                    08/07/2010, T-30/09, Peerstorm, EU:T:2010:298                                                                                                                                                                                                                                                                                                         The evidence produced to show genuine use of the mark at issue may include catalogues. ‘It must be pointed out that, in addition                           to items of clothing designated by different marks, more than 80 different items are offered for sale in that catalogue under                           the mark PETER STORM. They comprise men’s and women’s jackets, jumpers, trousers, tee-shirts, footwear, socks, hats and gloves,                           the respective characteristics of which are briefly described. The earlier mark appears, in stylised characters, next to each                           item. In that catalogue, the prices of the items in GBP and the reference number for each item are stated’ (paras\_38-39).                                                                                                                                                                                                                                                                                       However, the situation is different when a trade mark is used, for example, in a catalogue or advertisements, or on bags or            invoices, to designate the retailer of the goods and not the goods themselves.                                                                                                                                                                                                                                                                                                   Earlier sign                                                                                                                                                                                                                                                                  Case No                                                                                                                                                                                                                                                                                                                                                                                                   Schuhpark                                                                                                                                                                                    13/05/2009, T-183/08, Jello Schuhpark\_II, EU:T:2009:156                                                                                                                                                                                                                                                                                                         The General Court found that the use of the sign Schuhpark for footwear on advertisements, bags and invoices was not meant to identify the origin of the shoes (which bore their own                           mark or no mark at all) but rather the company name or trade name of the shoe retailer. This was considered insufficient to establish a link between the sign Schuhpark and the shoes. In other words, Schuhpark may well be a mark for the retail of shoes, but it was not used as a trade mark for goods (paras\_31-32).                                                                                                                                                                                                                                                                                                                                                Parent topic: 6.1.2 Use in the course of trade                                             "
