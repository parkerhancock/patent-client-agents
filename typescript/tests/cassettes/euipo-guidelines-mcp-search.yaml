            - Id: ish_2319054-2214675-16
              Content: "5.1.2 Earlier mark registered for not less than 5\_years (mark outside the ‘grace period’)                   5.1.2 Earlier mark registered for not less than 5\_years (mark outside the ‘grace period’)                                    The owner must put the mark to genuine use within a period of 5 years following its registration (Article 18(1) EUTMR). However, the owner has a ‘grace period’ of 5 years after registration, during which it cannot be required to demonstrate            use of the mark in order to rely upon it. During the ‘grace period’, the mere formal registration gives the mark full protection.            Once this period lapses, the proprietor may be required to prove genuine use of the earlier mark.                                    For oppositions filed against EUTM applications, the opponent may be required to prove genuine use if, on the date of filing or on the date of priority\_(1) of the EUTM application, the earlier mark has been registered for not less than 5\_years (Article 47(2) EUTMR).                                    For oppositions filed against international registrations designating the EU, the opponent may be required to prove genuine use if, on the date of registration of the IR (INID code\_151) or on the date            of its priority (INID code\_300), or, as the case may be, the date of subsequent designation of the European Union (INID code\_891)\_(2), the earlier mark has been registered for not less than 5\_years.                                    If the earlier mark is still within the grace period for non-use, any request for proof of use will be refused. This will            be the case even if the applicant alleges that the earlier mark had been refiled with the intention of circumventing the limitation            of the grace period, since such a claim cannot be examined in opposition proceedings (19/10/2017, T‑736/15, SKYLITE (fig.) / SKY et al., EU:T:2017:729, § 20-28; 16/05/2019, T‑354/18, SKYFi / SKY et al., EU:T:2019:33, § 41-43, 46-48).                                                                                             5.1.2.1 Earlier EUTMs                                                   5.1.2.2 Earlier international registrations designating the European Union                                                   5.1.2.3 Earlier national marks                                                   5.1.2.4 Earlier international registrations designating a Member State                                                   5.1.2.5 Summary of calculation of the beginning of the grace period                                                                                                   Parent topic: 5.1 Admissibility of the request for proof of use                                                1           For EUTM applications filed before 23/03/2016, the relevant date is the date of publication.                     2           For international registrations designating the EU filed before 23/03/2016, the relevant date is the date of first publication            of the contested IR or its subsequent designation in the EUTM Bulletin.                           "
