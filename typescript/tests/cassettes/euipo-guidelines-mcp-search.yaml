            - Id: ish_2319054-2328639-16
              Content: "5.1 Criteria                   5.1 Criteria                                    In this regard, it has to be evaluated whether, in view of the market situation in the particular industry or trade concerned,            it can be deduced from the material submitted that the owner has seriously tried to acquire a commercial position in the relevant market. The trade mark has to be used for goods or services already marketed or about to be marketed and for which preparations by            the undertaking to secure customers are under way, particularly in the form of advertising campaigns (11/03/2003, C-40/01, Minimax, EU:C:2003:145, §\_37). This does not mean that the opponent has to reveal the total volume of sales or turnover            figures.                                    Concerning the extent of use made of the earlier mark, account must be taken, in particular, of the commercial volume of all the acts of use on the one hand and the duration of the period in which those acts of use occurred, as well as the frequencyof those acts, on the other (08/07/2004, T-334/01, Hipoviton, EU:T:2004:223, §\_35).                                    The assessment entails a degree of interdependence between the factors taken into account. Thus, the fact that commercial volume achieved under the mark was not high may be offset by the fact            that use of the mark was extensive or very regular, and vice versa (08/07/2004, T-203/02, Vitafruit, EU:T:2004:225, §\_42).                                    Under certain circumstances, even circumstantial evidence such as catalogues featuring the trade mark, despite not providing direct information on the quantity of goods actually sold,            can be sufficient by themselves to prove the extent of use in an overall assessment (15/07/2015, T-398/13 TVR ITALIA (fig.) / TVR et al., EU:T:2015:503, §\_57-58; 08/07/2010, T-30/09, Peerstorm, EU:T:2010:298, §\_42 et seq.).                                    Use does not have to be made during a minimum period of time to qualify as ‘genuine’. In particular, use does not have to be continuous throughout the relevant period of 5\_years. It is sufficient if use was made at the very beginning or end of the period, provided            the use was genuine (16/12/2008, T-86/07, Deitech, EU:T:2008:577).                                    The exact decisive threshold proving genuine use cannot be defined out of context. The turnover and volume of sales of the product must always be assessed            in relation to all the other relevant factors, such as the volume of business, production or marketing capacity, or the degree            of diversification of the undertaking using the trade mark, and the characteristics of the products or services on the relevant            market. Use need not always be quantitatively significant for it to be deemed genuine, as that depends on the characteristics            of the goods or services concerned on the corresponding market (11/03/2003, C-40/01, Minimax, EU:C:2003:145, §\_39; 08/07/2004, T-203/02, Vitafruit, EU:T:2004:225, §\_42).                                    Low turnover and sales, in absolute terms, of a medium- or low-priced product might support the conclusion that use of the            trade mark in question is not genuine. However, with regard to expensive goods or an exclusive market, low turnover figures            or a low volume of sales can be sufficient (22/10/2020, C-720/18 & C-721/18,Testarossa, ECLI:EU:C:2020:854, § 51-52). It is, therefore, always necessary to take the characteristics of the market in            question into account (08/07/2004, T-334/01, Hipoviton, EU:T:2004:223, §\_51).                                    A de minimis rule cannot be laid down. Use of the mark by a single client, which imports the products for which the mark is registered,            can be sufficient to demonstrate that such use is genuine if it appears that the import operation has a genuine commercial            justification for the proprietor of the mark (27/01/2004, C-259/02, Laboratoire de la mer, EU:C:2004:50, §\_24 et seq.).                                    Genuine use is not excluded only because all use involves the same customer, as long as the trade mark is used publicly and            outwardly and not solely within the undertaking that owns the earlier trade mark or within a distribution network owned or            controlled by that undertaking (08/07/2004, T-203/02, Vitafruit, EU:T:2004:225, §\_50; 08/10/2014, T-300/12, Fairglobe, EU:T:2014:864, § 36). Moreover, evidence of genuine use such as invoices cannot be excluded on the sole ground that they are addressed to intermediaries               and not final consumers (04/12/2024, T‑538/23, CELEBRITI (fig.), EU:T:2024:877, § 39-40).                           The smaller the commercial volume of the exploitation of the mark, the more necessary it is for the opposing party to produce            additional evidence to dispel any doubts as to its genuineness (08/07/2004, T-334/01, Hipoviton, EU:T:2004:223, §\_37).                                    Concerning the ratio between the turnover generated by the sales of products under the earlier mark and the applicant’s annual            turnover, it should be noted that the degree of diversification of the activities of undertakings operating in one and the            same market varies. Moreover, the obligation to produce evidence of genuine use of an earlier trade mark is not designed to            monitor the commercial strategy of an undertaking. It may be economically and objectively justified for an undertaking to            market a product or a range of products even if their share in the annual turnover of the undertaking in question is minimal            (08/07/2004, T-334/01, Hipoviton, EU:T:2004:223, §\_49).                                    Special circumstances, for example, lower sales figures during the initial marketing phase of a product, could be of relevance            when assessing the genuineness of use (08/07/2004, T-334/01, Hipoviton, EU:T:2004:223, §\_53). The initial phase of marketing a product may last more than a few months but it cannot            be prolonged indefinitely (18/03/2015, T-250/13, SMART WATER, EU:T:2015:160, §\_54-55; confirmed 17/03/2016, C-252/15\_P, SMART WATER, EU:C:2016:178).                                                                                             Parent topic: 5 Extent of use                                             "
