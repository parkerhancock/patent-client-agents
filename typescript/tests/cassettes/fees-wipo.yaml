        <ol class="footnotes">
        <li><a name="note1"></a>For international applications filed by applicants whose sole entitlement is a connection with a Least Developed Country (LDC), in accordance with the list established by the United Nations, or with an intergovernmental organization the majority of whose member States are LDCs, the fees intended for the International Bureau are reduced to 10% of the prescribed amounts (rounded to the nearest full figure). The reduction also applies in respect of an international application filed by an applicant whose entitlement is not solely a connection with such an intergovernmental organization, provided that any other entitlement of the applicant is a connection with a Contracting Party which is an LDC or, if not an LDC, is a member State of that intergovernmental organization. If there are several applicants, each must fulfill the said criteria. Where such fee reduction applies, the basic fee is fixed at 40 Swiss francs (for one design) and 5 Swiss francs (for each additional design included in the same international application), the publication fee is fixed at 2 Swiss francs for each reproduction and 15 Swiss francs for each page, in addition to the first, on which one or more reproductions are shown, and the additional fee where the description exceeds 100 words is fixed at 1 Swiss franc per group of five words exceeding 100 words. <sup><a title="Back" href="#1">↑</a></sup></li>
        <li><a name="note2"></a>For international applications filed by applicants whose sole entitlement is a connection with a Least Developed Country (LDC), in accordance with the list established by the United Nations, or with an intergovernmental organization the majority of whose member States are LDCs, the standard fees are reduced to 10% of the prescribed amounts (rounded to the nearest full figure). The reduction also applies in respect of an international application filed by an applicant whose entitlement is not solely a connection with such an intergovernmental organization, provided that any other entitlement of the applicant is a connection with a Contracting Party which is an LDC or, if not an LDC, is a member State of that intergovernmental organization. If there are several applicants, each must fulfill the said criteria. Where such reduction applies, the standard designation fee is fixed at 4 Swiss francs (for one design) and 1 Swiss franc (for each additional design included in the same international application) under level one, 6 Swiss francs (for one design) and 2 Swiss francs (for each additional design included in the same international application) under level two, and 9 Swiss francs (for one design) and 5 Swiss francs (for each additional design included in the same international application) under level three. <sup><a title="Back">↑</a></sup></li>
        <li><a name="note3"></a>[WIPO Note]: Recommendation adopted by the Assembly of the Hague Union:<br>“Contracting Parties that make, or that have made, a declaration under Article 7(2) are encouraged to indicate, in that declaration or in a new declaration, that for international applications filed by applicants whose sole entitlement is a connection with a Least Developed Country, in accordance with the list established by the United Nations, or with an intergovernmental organization the majority of whose member States are Least Developed Countries, the individual fee payable with respect to their designation is reduced to 10% of the fixed amount (rounded, where appropriate, to the nearest full figure). Those Contracting Parties are further encouraged to indicate that the reduction also applies in respect of an international application filed by an applicant whose entitlement is not solely a connection with such an intergovernmental organization, provided that any other entitlement of the applicant is a connection with a Contracting Party which is a Least Developed Country or, if not a Least Developed Country, is a member State of that intergovernmental organization.” <sup><a title="Back">↑</a></sup></li>
        <li><a name="note4"></a>50% of the renewal basic fee. <sup><a title="Back">↑</a></sup></li>
