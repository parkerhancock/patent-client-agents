        	<div class="lfr-layout-structure-item-basic-component-html lfr-layout-structure-item-05de3bb2-b83e-d1dd-f8b4-988f1d2016eb " data-layout-structure-item-id="05de3bb2-b83e-d1dd-f8b4-988f1d2016eb"><div id="fragment-e9389bc5-6a29-0a8e-3785-5b89ba5fee77" > <div class="component-html" data-lfr-editable-id="element-html" data-lfr-editable-type="html"><p class="lead">Schedule of fees prescribed by the Regulations under the Madrid Protocol (as in force on February 1, 2023)</p>
        <table class="table table-bordered table-striped">
        <thead>
        <tr>
        <td width="80%">&nbsp;</td>
