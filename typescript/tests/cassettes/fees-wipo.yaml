        <tbody>
        <tr>
        <td><b>1. <i>[Deleted]</i></b></td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td><b>2. <i>International application</i></b> The following fees shall be payable and shall cover 10 years:</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>2.1 Basic fee (Article&nbsp;8(2)(i) of the Protocol)<sup><a name="P12_233" href="#P12_232">1</a></sup></td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>2.1.1 where no representation of the mark is in color</td>
        <td>653</td>
        </tr>
        <tr>
        <td>2.1.2 where any representation of the mark is in color</td>
        <td>903</td>
        </tr>
        <tr>
        <td>2.2 Supplementary fee for each class of goods and services beyond three classes, except if only Contracting Parties in respect of which individual fees (see 2.4, below) are payable are designated (Article 8(2)(ii) and (7)(a)(i) of the Protocol)</td>
        <td>100</td>
        </tr>
        <tr>
        <td>2.3 Complementary fee for each designated Contracting Party, except if the designated Contracting Party is a Contracting Party in respect of which an individual fee (see 2.4 below) is payable (Article 8(2)(iii) and (7)(a)(ii) of the Protocol)</td>
        <td>100</td>
        </tr>
        <tr>
        <td>2.4 Individual fee for each designated Contracting Party in respect of which an individual fee (rather than a complementary fee) is payable, except where the designated Contracting Party and the Contracting Party of the Office of origin are both States bound also by the Agreement, in which case, a complementary fee is payable in respect of such a designated Contracting Party (Articles 8(7)(a) and 9sexies(1)(b) of the Protocol)</td>
        <td>the amount of the individual fee is fixed by each Contracting Party concerned</td>
        </tr>
        <tr>
        <td><b>3. <i>[Deleted]</i></b></td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td><b>4. <i>Irregularities with respect to the classification of goods and services</i></b> The following fees shall be payable (Rule 12(1)(b)):</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>4.1 Where the goods and services are not grouped in classes</td>
        <td>77 plus 4 per term in excess of 20</td>
        </tr>
        <tr>
        <td>4.2 Where the classification, as appearing in the application, of one or more terms is incorrect<br>provided that, where the total amount due under this item in respect of an international application is less than 150 Swiss francs, no fees shall be payable.</td>
        <td>20 plus 4 per incorrectly classified term</td>
        </tr>
        <tr>
        <td><b><a id="manage"></a>5. <i>Designation subsequent to international registration</i></b> The following fees shall be payable and shall cover the period between the effective date of the designation and the expiry of the then current term of the international registration (Article 3ter(2) of the Protocol):</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>5.1 Basic fee</td>
        <td>300</td>
        </tr>
        <tr>
        <td>5.2 Complementary fee for each designated Contracting Party indicated in the same request where an individual fee is not payable in respect of such designated Contracting Party (see 5.3, below)</td>
        <td>100</td>
        </tr>
        <tr>
        <td>5.3 Individual fee for each designated Contracting Party in respect of which an individual fee (rather than a complementary fee) is payable, except where the designated Contracting Party and the Contracting Party of the holder are both States bound also by the Agreement, in which case, a complementary fee is payable in respect of such a designated Contracting Party (Articles 8(7)(a) and 9sexies(1)(b) of the Protocol)</td>
        <td>the amount of the individual fee is fixed by each Contracting Party concerned</td>
        </tr>
        <tr>
        <td><b>6. <i>Renewal</i></b> The following fees shall be payable and shall cover 10 years (Article 7(1) of the Protocol):</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>6.1 Basic fee</td>
        <td>653</td>
        </tr>
        <tr>
        <td>6.2 Supplementary fee, except if the renewal is made only for designated Contracting Parties in respect of which individual fees are payable (see 6.4, below)</td>
        <td>100</td>
        </tr>
        <tr>
        <td>6.3 Complementary fee for each designated Contracting Party in respect of which an individual fee is not payable (see 6.4, below)</td>
        <td>100</td>
        </tr>
        <tr>
        <td>6.4 Individual fee for each designated Contracting Party in respect of which an individual fee (rather than a complementary fee) is payable, except where the designated Contracting Party and the Contracting Party of the holder are both States bound also by the Agreement, in which case, a complementary fee is payable in respect of such a Contracting Party (Articles 8(7)(a) and 9sexies(1)(b) of the Protocol)</td>
        <td>the amount of the individual fee is fixed by each Contracting Party concerned</td>
        </tr>
        <tr>
        <td>6.5 Surcharge for the use of the period of grace (Article 7(4) of the Protocol)</td>
        <td>50% of the amount of the fee payable under item 6.1</td>
        </tr>
        <tr>
        <td><b>7. <i>Miscellaneous recordings (Article 9ter of the Protocol)</i></b></td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>7.1 Total transfer of an international registration</td>
        <td>177</td>
        </tr>
        <tr>
        <td>7.2 Partial transfer (for some of the goods and services or for some of the Contracting Parties) of an international registration</td>
        <td>177</td>
        </tr>
        <tr>
        <td>7.3 Limitation requested by the holder subsequent to international registration, provided that, if the limitation affects more than one Contracting Party, it is the same for all</td>
        <td>177</td>
        </tr>
        <tr>
        <td>7.4 Change in the name and/or address of the holder and/or, where the holder is a legal entity, introduction of or change in the indications concerning the legal nature of the holder and the State and, where applicable, the territorial unit within that State under the law of which the said legal entity has been organized for one or more international registrations for which the same recording or change is requested in the same form</td>
        <td>150</td>
        </tr>
        <tr>
        <td>7.5 Recording of a license in respect of an international registration or amendment of the recording of a license</td>
        <td>177</td>
        </tr>
        <tr>
        <td>7.6 Request for a continued processing under Rule 5bis(1)</td>
        <td>200</td>
        </tr>
        <tr>
        <td>7.7 Division of an international registration</td>
        <td>177</td>
        </tr>
        <tr>
        <td><b><a id="extracts"></a>8. <i>Information concerning international registrations (Article 5ter of the Protocol)</i></b></td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>8.1 Establishing a certified extract from the International Register consisting of an analysis of the situation of an international registration (detailed certified extract),</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>up to three pages</td>
        <td>155</td>
        </tr>
        <tr>
        <td>for each page after the third</td>
        <td>10</td>
        </tr>
        <tr>
        <td>8.2 Establishing a certified extract from the International Register consisting of a copy of all publications, and of all notifications of refusal, made with respect to an international registration (simple certified extract),</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>up to three pages</td>
        <td>77</td>
        </tr>
        <tr>
        <td>for each page after the third</td>
        <td>2</td>
        </tr>
        <tr>
        <td>8.3 A single attestation or information in writing</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td>for a single international registration</td>
        <td>77</td>
        </tr>
        <tr>
        <td>for each additional international registration if the same information is requested in the same request</td>
        <td>10</td>
        </tr>
        <tr>
        <td>8.4 Reprint or photocopy of the publication of an international registration, per page</td>
        <td>5</td>
        </tr>
        <tr>
        <td><b>9. <i>Special services</i></b> The International Bureau is authorized to collect a fee, whose amount it shall itself fix, for operations to be performed urgently and for services not covered by this Schedule of Fees</td>
        <td>&nbsp;</td>
        </tr>
        <tr>
        <td><em><strong>10. Continuation of Effects</strong></em><b><br></b></td>
        <td></td>
        </tr>
        <tr>
        <td>10.1 Fee for the International Bureau<em><strong><br></strong></em></td>
        <td>23</td>
        </tr>
        <tr>
        <td>10.2 Fee to be transferred by the International Bureau to the successor State</td>
        <td>41</td>
        </tr>
        </tbody>
        </table>
