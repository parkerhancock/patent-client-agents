        <td style="width: 43.5833px; height: 31px;" valign="top">3.<a name="_S_3"></a></td>
        <td style="width: 682.9px; height: 31px;" valign="top">Handling Fee:<br> (<a href="/en/web/pct-system/texts/rules/r57#_57_2">Rule 57.2</a>)</td>
        <td style="width: 87.1667px; height: 31px;" align="left" valign="top">&nbsp;</td>
        <td style="text-align: right; width: 58.1167px; height: 31px;" valign="top">&nbsp;&nbsp;&nbsp;200</td>
        <td style="width: 14.5167px; height: 31px;">&nbsp;</td>
        <td style="width: 523.067px; height: 31px;" valign="top">Swiss francs</td>
        </tr>
        <tr style="height: 47px;">
        <td colspan="6" style="width: 1409.35px; height: 47px;" valign="top">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br> <strong>Reductions</strong><br> &nbsp;</td>
        </tr>
        <tr style="height: 151.4px;">
        <td style="width: 43.5833px; height: 151.4px;" valign="top">4.&nbsp;<a name="_S_4"></a></td>
        <td colspan="5" style="width: 1365.77px; height: 151.4px;" valign="top">The international filing fee is reduced by the following amount if the international application is, as provided for in the Administrative Instructions, filed:
        <table width="100%" border="0">
        <tbody>
        <tr>
        <td width="3%" valign="top"><a name="_S_4_a"></a>(a)&nbsp;&nbsp;</td>
        <td align="left" width="49%" valign="top">in electronic form, the request not being in character coded format: &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 100 Swiss francs</td>
        </tr>
        </tbody>
        </table>
        <table width="100%" border="0">
        <tbody>
        <tr>
        <td style="width: 3.02691%;" valign="top"><a name="_S_4_b"></a>(b)&nbsp;&nbsp;</td>
        <td style="width: 47.9731%;" align="left" valign="top">in electronic form, the request being in character coded format:&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; 200 Swiss francs</td>
        </tr>
        </tbody>
        </table>
        <table width="100%" border="0">
        <tbody>
        <tr>
        <td width="3%" valign="top"><a name="_S_4_c"></a>(c)</td>
        <td align="left" width="49%" valign="top">in electronic form, the request, description, claims and abstract being in character coded format:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 300 Swiss francs</td>
        </tr>
        </tbody>
        </table>
        </td>
        </tr>
        </tbody>
        </table>
        <table width="100%" border="0">
        <tbody>
        <tr>
        <td>5.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a name="_S_5"></a>The international filing fee under <a href="#_S_1">item 1</a> (where applicable, as reduced under <a href="#_S_4">item 4</a>), the supplementary search handling fee under <a href="#_S_2">item 2</a> and the handling fee under <a href="#_S_3">item 3</a> are reduced by 90% if the international application is filed by:</td>
        </tr>
        </tbody>
        </table>
        <table width="100%" border="0">
        <tbody>
        <tr>
        <td width="3%" valign="top">(a)&nbsp; <a name="_S_5_a"></a></td>
        <td align="left" width="85%" valign="top">an applicant who is a natural person and who is a national of and resides in a State that is listed as being a State whose per capita gross domestic product is below US$ 25,000 (according to the most recent 10-year average per capita gross domestic product figures at constant 2005 US$ values published by the United Nations), and whose nationals and residents who are natural persons have filed less than 10 international applications per year (per million population) or less than 50 international applications per year (in absolute numbers) according to the most recent five-year average yearly filing figures published by the International Bureau; or</td>
        </tr>
        </tbody>
        </table>
        <table width="100%" border="0">
        <tbody>
        <tr>
        <td width="3%" valign="top">(b)&nbsp; <a name="_S_5_b"></a></td>
        <td align="left" width="85%" valign="top">an applicant, whether a natural person or not, who is a national of and resides in a State that is listed as being classified by the United Nations as a least developed country; <br>&nbsp;</td>
        </tr>
        <tr>
        <td colspan="2" width="94%" valign="top">provided that,&nbsp;at the time of filing of the international application, there are no beneficial owners of the international application who would not satisfy the criteria in<a href="#_S_5_a"> sub-item (a)</a> or<a href="#_S_5_b"> (b)</a> and provided that, if there are several applicants, each must satisfy the criteria set out in either <a href="#_S_5_a">sub-item&nbsp;(a)</a> or&nbsp;<a href="#_S_5_b">(b)</a>.&nbsp; The lists of States referred to in <a href="#_S_5_a">sub-items (a)</a> and <a href="#_S_5_b">(b)</a><a href="#note15"><sup>15</sup></a> shall be updated by the Director General at least every five years according to directives given by the Assembly. The criteria set out in <a href="#_S_5_a">sub-items (a)</a> and <a href="#_S_5_b">(b)</a> shall be reviewed by the Assembly at least every five years.</td>
        </tr>
        </tbody>
        </table>
