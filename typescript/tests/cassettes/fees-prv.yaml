lications of trademarks\"></button>\r\n            </div>\r\n    </li>\r\n    <li class=\"active expanded selected haschildren\"\r\n        data-page-id=\"1673\"\r\n        data-page-lang=\"en\">\r\n\r\n            <div class=\"side-menu-item\">\r\n                <a class=\"active selected haschildren\"\r\n                   aria-haspopup=\"true\"\r\n                   href=\"/en/trademarks/prepare-for-the-trademark-application/fees-and-payment/\"\r\n                   aria-current=\"page\"\r\n                   aria-label=\"Fees - trademarks\">\r\n                    Fees - trademarks\r\n                </a>\r\n                <button class=\"minus\"\r\n                        aria-label=\"Fold menu level/ Expand menu level\"\r\n                        aria-expanded=\"true\"></button>\r\n            </div>\r\n            <ul class=\"sub-menu\">\r\n                    <li\r\n        data-page-id=\"1674\"\r\n        data-page-lang=\"en\">\r\n\r\n            <div class=\"side-menu-item\">\r\n                <a class=\"extra-padding\"\r\n                   href=\"/en/trademarks/prepare-for-the-trademark-application/fees-and-payment/payment---trademarks/\"\r\n                   aria-current=\"false\"\r\n                   aria-label=\"Payment - trademarks\">\r\n                    Payment - trademarks\r\n                </a>\r\n            </div>\r\n    </li>\r\n\r\n            </ul>\r\n    </li>\r\n    <li class=\"haschildren\"\r\n        data-page-id=\"11429\"\r\n        data-page-lang=\"en\">\r\n\r\n            <div class=\"side-menu-item\">\r\n                <a class=\"haschildren\"\r\n                   aria-haspopup=\"true\"\r\n                   aria-expanded=\"false\"\r\n                   href=\"/en/trademarks/prepare-for-the-trademark-application/protecting-your-trademark-internationally/\"\r\n                   aria-current=\"false\"\r\n                   aria-label=\"Protecting your trademark internationally\">\r\n                    Protecting your trademark internationally\r\n                </a>\r\n                <button class=\"plus\" aria-label=\"Protecting your trademark internationally\"></button>\r\n            </div>\r\n    </li>\r\n    <li\r\n        data-page-id=\"1675\"\r\n        data-page-lang=\"en\">\r\n\r\n            <div class=\"side-menu-item\">\r\n                <a class=\"extra-padding\"\r\n                   href=\"/en/trademarks/prepare-for-the-trademark-application/laws-and-regulations-concerning-trademarks/\"\r\n                   aria-current=\"false\"\r\n                   aria-label=\"Laws and regulations concerning trademarks\">\r\n                    Laws and regulations concerning trademarks\r\n                </a>\r\n            </div>\r\n    </li>\r\n\r\n            </ul>\r\n    </li>\r\n    <li class=\"haschildren\"\r\n        data-page-id=\"11380\"\r\n        data-page-lang=\"en\">\r\n\r\n            <div class=\"side-menu-item\">\r\n                <a class=\"haschildren\"\r\n                   aria-haspopup=\"true\"\r\n                   aria-expanded=\"false\"\r\n                   href=\"/en/trademarks/when-you-have-a-registered-trademark/\"\r\n                   aria-current=\"false\"\r\n                   aria-label=\"When you have a registered trademark\">\r\n                    When you have a registered trademark\r\n                </a>\r\n                <button class=\"plus\" aria-label=\"When you have a registered trademark\"></button>\r\n            </div>\r\n    </li>\r\n    <li\r\n        data-page-id=\"16594\"\r\n        data-page-lang=\"en\">\r\n\r\n            <div class=\"side-menu-item\">\r\n                <a class=\"extra-padding\"\r\n                   href=\"/en/trademarks/trademark-processing-time/\"\r\n                   aria-current=\"false\"\r\n                   aria-label=\"Trademark processing time\">\r\n                    Trademark processing time\r\n                </a>\r\n            </div>\r\n    </li>\r\n\r\n        </ul>\r\n    </div>\r\n\r\n<script src=\"/Static/Javascript/leftMenu.js\"></script>\r\n                            <div class=\"menu-helptext\">\r\n                    <h2>Questions?</h2>\r\n                    <span>Get quick help from us by phone\n</span>\r\n                    <br />\r\n                    <div class=\"sub-menu-contact-info\">\r\n                        <a href=\"tel:+46 8 782 28 00\" class=\"disable-link\" aria-label=\"+46 8 782 28 00\"><strong>+46 8 782 28 00</strong></a><br />\r\n                        <a href=\"mailto:\" class=\"disable-link\" aria-label=\"Mejladdress till PRV\"><strong></strong></a>\r\n                    </div>\r\n                </div>\r\n\r\n        </div>\r\n    </nav>\r\n\r\n        </div>\r\n        <div class=\"col-sm-12 col-md-9\">\r\n            \r\n\r\n\r\n<div class=\"navigation-wrapper\">\r\n    <nav aria-label=\"You are here\">\r\n        <ol class=\"breadcrumb main-breadcrumb small\">\r\n            <li><a href=\"/en/\">Home</a></li>\r\n                        <li><a href=\"/en/trademarks/\">Trademarks</a></li>\r\n            <li><a href=\"/en/trademarks/prepare-for-the-trademark-application/\">Prepare for the trademark application</a></li>\r\n            <li class=\"current\">Fees - trademarks</li>\r\n\r\n        </ol>\r\n    </nav>\r\n    <div class=\"print hidden-xs\">\r\n        <button class=\"btn btn-link\" type=\"button\" aria-label=\"\n\t\t\t\tPrint\n\t\t\t\">\r\n            <svg class=\"print-icon\" aria-hidden=\"true\" focusable=\"false\" width=\"700\" heigth=\"700\">\r\n                <use xmlns:xlink=\"http://www.w3.org/1999/xlink\" xlink:href=\"/Static/images/icons/icons.svg#icon-print\"></use>\r\n            </svg><br />\r\n            <span role=\"complementary\">\n\t\t\t\tPrint\n\t\t\t</span>\r\n        </button>\r\n    </div>\r\n</div>\r\n            \r\n            <main class=\"main-content\" id=\"gotocontent\" role=\"main\">\r\n\r\n    <div  class=\"main-image\">\r\n    </div>\r\n    <h1 >\r\n        Fees - trademarks\r\n    </h1>\r\n<p class=\"preamble\">\r\n    Here you will find comprehensive information about fees for your trademark application.\r\n</p>\r\n    <div  class=\"main-image secondary-image\">\r\n    </div>\r\n\r\n    <div  class=\"main-image secondary-image-mobile\">\r\n    </div>\r\n\r\n                    <div class=\"article-inner\" data-enhancer=\"mainBody\">\r\n                        \r\n\r\n\r\n\r\n<p>Fees for government services are exempt from VAT. This applies to applications, registrations, copies and printouts of public documents.</p>\n<h2>Fees for Swedish trademark application</h2>\n<p>The fee must be paid regardless if your trademark application is approved or not, as it covers the handling costs. Application via e-service has a lower application fee.</p>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"6d001def-3b1d-455c-816e-dd6a193d6059\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for application via e-service <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"6d001def-3b1d-455c-816e-dd6a193d6059\">\r\n        <p>If you choose to add goods or services that are not approved in the pre-approved list, the fee will instead be the same as when applying on paper or through another service.</p>\n<table class=\"color selectable table-grey-line\" style=\"width: 100%;\" border=\"1\">\n<tbody>\n<tr>\n<td headers=\"tjanst_vm_a1\" width=\"80%\">Application for registration of a trademark for protection in one class, including a collective, guarantee or control trademark</td>\n<td headers=\"pris_vm_a1\" align=\"right\" width=\"20%\">2 700 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a1\">For each additional class</td>\n<td headers=\"pris_vm_a1\" align=\"right\">1 000 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"aedad588-98dc-4c83-8aaa-e9c26f71d249\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for application via paper or other service <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"aedad588-98dc-4c83-8aaa-e9c26f71d249\">\r\n        <p>Other service means applications that have been submitted in any other way than through PRV’s online application, for example applications submitted by e-mail.</p>\n<table class=\"color selectable table-grey-line\" style=\"width: 100%; height: 260px;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 82.2669%;\">Application for registration of a trademark for protection in one class, including a collective, guarantee or control trademark</td>\n<td style=\"width: 16.6362%;\">3 900 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px; width: 82.2669%;\" headers=\"tjanst_vm_a1\">For each additional class</td>\n<td style=\"height: 17px; width: 16.6362%;\" headers=\"pris_vm_a1\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr style=\"height: 34px;\">\n<td style=\"height: 34px; width: 82.2669%;\" headers=\"tjanst_vm_a1\">Application of division of a trademark registration or application, for each divisional registration</td>\n<td style=\"height: 34px; width: 16.6362%;\" headers=\"pris_vm_a1\" align=\"right\">1 800 SEK</td>\n</tr>\n<tr style=\"height: 34px;\">\n<td style=\"height: 34px; width: 82.2669%;\" headers=\"tjanst_vm_a1\">Application for transfer of trademark ownership, for each application</td>\n<td style=\"height: 34px; width: 16.6362%;\" headers=\"pris_vm_a1\" align=\"right\">1 000 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<h2>Fees for changing, renewing and reinstatement a Swedish trademark</h2>\n<p>The fee must be paid regardless if your trademark application is approved or not, as it covers the handling costs. Application via e-service has a lower application fee.</p>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"1c391d2a-ed52-41b9-8cb6-4595e05f07d8\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for changing and renewing via e-service <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"1c391d2a-ed52-41b9-8cb6-4595e05f07d8\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%;\" border=\"1\">\n<tbody>\n<tr style=\"height: 35px;\">\n<td style=\"height: 35px;\" headers=\"tjanst_vm_a2\" width=\"80%\">Renewal application for protection in one class, including collective, guarantee or control mark</td>\n<td style=\"height: 35px;\" headers=\"pris_vm_a2\" align=\"right\" width=\"20%\">2 700 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px;\" headers=\"tjanst_vm_a2\">For each additional class</td>\n<td style=\"height: 17px;\" headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px;\" headers=\"tjanst_vm_a2\">Increased fee for each class due to late renewal application</td>\n<td style=\"height: 17px;\" headers=\"pris_vm_a2\" align=\"right\">200 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px;\" headers=\"tjanst_vm_a2\">Application for registration of pledge agreement</td>\n<td style=\"height: 17px;\" headers=\"pris_vm_a2\" align=\"right\">1 800 SEK</td>\n</tr>\n<tr style=\"height: 35px;\">\n<td style=\"height: 35px;\" headers=\"tjanst_vm_a2\">Application for transfer of trademark ownership, for each registration</td>\n<td style=\"height: 35px;\" headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px;\" headers=\"tjanst_vm_a2\">Application for revocation of trademark registration</td>\n<td style=\"height: 17px;\" headers=\"pris_vm_a2\" align=\"right\">900 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"6cd26f86-9263-4433-b126-35788516cad1\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for changing and renewing via paper or other application <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"6cd26f86-9263-4433-b126-35788516cad1\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%;\" border=\"1\">\n<tbody>\n<tr>\n<td headers=\"tjanst_vm_a2\" align=\"left\" width=\"80%\">Renewal application for protection in one class, including collective, guarantee or control mark</td>\n<td headers=\"pris_vm_a2\" align=\"right\" width=\"20%\">3 900 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\" align=\"left\">For each additional class</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Increased fee for each class due to late renewal application</td>\n<td headers=\"pris_vm_a2\" align=\"right\">200 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Application for transfer of trademark ownership, for each registration</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Application for changes in a word mark or figurative mark</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Application for registration of licence</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Application of division of a trademark registration or application, for each divisional registration</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1 800 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Application for registration of pledge agreement or registration of new pledgee</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1800 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Reinstatement of dismissed application (according to chapter 2, article 20, second paragraph or chapter 2, article 36, third paragraph, VmL)</td>\n<td headers=\"pris_vm_a2\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a2\">Application for revocation of trademark registration</td>\n<td headers=\"pris_vm_a2\" align=\"right\">900 SEK</td>\n</tr>\n<tr>\n<td>An application for a change of company name (unchanged legal entity), an application for a change of attorney and an application for a change of address are free of charge.</td>\n<td> </td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<h2>Other fees</h2>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"be8e4c3a-a239-486a-8a4f-77124654cf2b\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fee for examination of application for permission to use Swedish official designation <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"be8e4c3a-a239-486a-8a4f-77124654cf2b\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%;\" border=\"1\">\n<tbody>\n<tr>\n<td headers=\"tjanst_vm_a3\" width=\"80%\">Application for permission to use Swedish official designation</td>\n<td headers=\"pris_vm_a3\" align=\"right\" width=\"20%\">1 890 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"750f52c5-e087-48be-8fda-da6e19ea4b53\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for registration certificates <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"750f52c5-e087-48be-8fda-da6e19ea4b53\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%; height: 186px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 36px;\">\n<td style=\"height: 36px;\" headers=\"tjanst_vm_a3\" width=\"80%\">Registration certificates (NOTE - you will receive a registration certificate free of charge when your application is registered.)</td>\n<td style=\"height: 36px;\" headers=\"pris_vm_a3\" align=\"right\" width=\"20%\">200 SEK</td>\n</tr>\n<tr style=\"height: 18px;\">\n<td style=\"height: 18px;\" headers=\"tjanst_vm_a3\">Historical certificate of registration</td>\n<td style=\"height: 18px;\" headers=\"pris_vm_a3\" align=\"right\">350 SEK</td>\n</tr>\n<tr style=\"height: 18px;\">\n<td style=\"height: 18px;\" headers=\"tjanst_vm_a3\">Priority document</td>\n<td style=\"height: 18px;\" headers=\"pris_vm_a3\" align=\"right\">350 SEK</td>\n</tr>\n<tr style=\"height: 96px;\">\n<td style=\"height: 96px;\">\n<p data-start=\"0\" data-end=\"55\">Dispatch fee (for invoice payments, excluding VAT)*</p>\n<p data-start=\"57\" data-end=\"172\" data-is-last-node=\"\" data-is-only-node=\"\"><em>*The dispatch fee is charged in accordance with the Swedish Fees Ordinance and applies to all government agencies.</em></p>\n</td>\n<td style=\"height: 96px;\">            30 SEK</td>\n</tr>\n<tr style=\"height: 18px;\">\n<td style=\"height: 18px;\">\n<p data-start=\"0\" data-end=\"74\">Dispatch fee (for payments made via a deposit account, excluding VAT)*</p>\n<p data-start=\"76\" data-end=\"191\" data-is-last-node=\"\" data-is-only-node=\"\"><em>*The dispatch fee is charged in accordance with the Swedish Fees Ordinance and applies to all government agencies.</em></p>\n</td>\n<td style=\"height: 18px;\">            20 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"25660a67-fced-4486-9d23-a3c49a821b83\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fee for registration of Swedish municipal coat of arms <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"25660a67-fced-4486-9d23-a3c49a821b83\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%; height: 17px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px;\" headers=\"tjanst_vm_a3\" width=\"80%\">Registration fee</td>\n<td style=\"height: 17px;\" headers=\"pris_vm_a3\" align=\"right\" width=\"20%\">2 400 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<h2>Fees for international trademark protection</h2>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"2910140c-17c2-4fbb-8e13-75fc5de282df\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees related to the EU trademark <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"2910140c-17c2-4fbb-8e13-75fc5de282df\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%;\" border=\"1\">\n<tbody>\n<tr>\n<td headers=\"tjanst_vm_a4\" valign=\"top\">Conversion of application for registration of a EU trademark or a collective mark, for protection in one class</td>\n<td headers=\"pris_vm_a4\" align=\"right\" width=\"20%\">3 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a4\">For each additional class</td>\n<td headers=\"pris_vm_a4\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td headers=\"tjanst_vm_a4\">Certificate relating to representation before EUIPO</td>\n<td headers=\"pris_vm_a4\" align=\"right\">1 200 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"02ae93ff-4772-4334-abc3-5fd09281dc2a\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for international application according to the Madrid Protocol <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"02ae93ff-4772-4334-abc3-5fd09281dc2a\">\r\n        <table class=\"color selectable table-grey-line\" style=\"width: 100%;\" border=\"1\">\n<tbody>\n<tr>\n<td style=\"width: 79.159%;\" headers=\"tjanst_vm_a5\">Application for international registration for protection in a class of trademark or collective mark</td>\n<td style=\"width: 19.7441%;\" headers=\"pris_vm_a5\" align=\"right\">3 900 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 79.159%;\" headers=\"tjanst_vm_a5\">For each additional class</td>\n<td style=\"width: 19.7441%;\" headers=\"pris_vm_a5\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 79.159%;\" headers=\"tjanst_vm_a5\">Reinstatement of dismissed application (according to chapter 5, article 6, second paragraph VmL)</td>\n<td style=\"width: 19.7441%;\" headers=\"pris_vm_a5\" align=\"right\">1 000 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 79.159%;\" headers=\"tjanst_vm_a5\">\n<p><span title=\"info\">First, a basic fee is paid directly to the international agency. Then, applicants must pay either 1) a supplementary fee for each additional class after the first three and a complementary fee per designated country, or 2) an individual fee to the countries that have chosen to charge such a fee.</span></p>\n<p><span title=\"info\">You can read more about the fees that apply on WIPO's website.</span></p>\n<p><a href=\"https://madrid.wipo.int/feecalcapp/\" target=\"_blank\" class=\"external-link\" rel=\"noopener\"><span title=\"info\">WIPO Fee-Calculator (external website)</span></a></p>\n</td>\n<td style=\"width: 19.7441%;\" headers=\"pris_vm_a5\" align=\"right\"> </td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"29ab4444-f012-43dd-a7ec-3dc07be78795\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for international registration according to the Madrid Protocol <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"29ab4444-f012-43dd-a7ec-3dc07be78795\">\r\n        <p> </p>\n<table class=\"color selectable table-grey-line\" style=\"width: 100%; height: 291px;\" border=\"1\">\n<tbody>\n<tr style=\"height: 18px;\">\n<td style=\"height: 18px; width: 78.7935%;\" headers=\"tjanst_vm_a5\">Replacement (according to Chapter 5, Section 20 of the Trade Marks Act)</td>\n<td style=\"height: 18px; width: 20.1096%;\" headers=\"pris_vm_a5\" align=\"right\">1 400 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 78.7935%;\">Transformation (according to Chapter 5, Section 22 of the Trade Marks Act)</td>\n<td style=\"width: 20.1096%;\">3 900 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 78.7935%;\">For each additional class</td>\n<td style=\"width: 20.1096%;\">1 000 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px; width: 78.7935%;\" headers=\"tjanst_vm_a5\">Application for registration of pledge agreement or registration of new pledgee, for the Swedish part of the international registration</td>\n<td style=\"height: 17px; width: 20.1096%;\" headers=\"pris_vm_a5\" align=\"right\">1 800 SEK</td>\n</tr>\n<tr style=\"height: 17px;\">\n<td style=\"height: 17px; width: 78.7935%;\" headers=\"tjanst_vm_a5\">Application for transfer of trademark ownership, for the Swedish part of the international registration (for each registration)</td>\n<td style=\"height: 17px; width: 20.1096%;\" headers=\"pris_vm_a5\" align=\"right\">1000 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 78.7935%;\">Application for registration of licence, for the Swedish part of the international registration</td>\n<td style=\"text-align: right; width: 20.1096%;\">1000 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 78.7935%;\">Application for revocation of the international registration</td>\n<td style=\"text-align: right; width: 20.1096%;\">900 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 78.7935%;\">\n<p>Reinstatement of an application for an international registration to have effect in Sweden (according to Chapter 5, Section 9 of the Trademark Act)</p>\n</td>\n<td style=\"text-align: right; width: 20.1096%;\">1000 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 78.7935%;\">\n<p>Division of an international registration having effect in Sweden, or of a pending application for such a registration (according to Chapter 5, section 10a of the Trademark Act)<br /><br />A fee is also charged by WIPO for division.</p>\n</td>\n<td style=\"text-align: right; width: 20.1096%;\">1800 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\r\n\r\n\r\n\r\n\r\n                    </div>\r\n            </main>\r\n\r\n                <section class=\"related-content m-xs-t-base\">\r\n                    \r\n\r\n    \r\n\r\n\r\n                </section>\r\n                            <div class=\"sdg\">\r\n                    <div class=\"sdg-content\">\r\n    <div class=\"sdg-imagelink\">\r\n        <a href=\"https://europa.eu/youreurope/index.htm#en\">\r\n            <img src=\"/Static/Images/SdgLogo.jpg\" alt=\"Single Digital Gateway\" loading=\"lazy\">\r\n        </a>\r\n    </div>\r\n\r\n        <a target=\"_blank\" href=\"https://foq.youreurope.europa.eu/info-service-noft\" class=\"external-link\">Information services survey (opens in a new window)</a>\r\n</div>\r\n\r\n                </div>\r\n\r\n                <div class=\"updated-date\" role=\"complementary\">\r\n\r\n        \n      Edited\n     2025-04-25\r\n    </div>\r\n\r\n                <div class=\"survey-conten\" id=\"espace-survey\"></div>\r\n\r\n        </div>\r\n    </div>\r\n</div>\r\n            \r\n\r\n\r\n\r\n<footer>\r\n    <div id=\"main-footer\">\r\n        <div class=\"top-footer-wrapper\">\r\n            <div class=\"container\">\r\n                <div class=\"footer-section col-lg-4 col-sm-6 col-xs-12\" data-equal-height>\r\n\r\n                            <div class=\"footer-section-title\">\r\n                                <h2>\r\n                                    Contact us\r\n                                </h2>\r\n                            </div>\r\n                        