m us by phone\n</span>\r\n                    <br />\r\n                    <div class=\"sub-menu-contact-info\">\r\n                        <a href=\"tel:+46 8 782 28 00\" class=\"disable-link\" aria-label=\"+46 8 782 28 00\"><strong>+46 8 782 28 00</strong></a><br />\r\n                        <a href=\"mailto:\" class=\"disable-link\" aria-label=\"Mejladdress till PRV\"><strong></strong></a>\r\n                    </div>\r\n                </div>\r\n\r\n        </div>\r\n    </nav>\r\n\r\n        </div>\r\n        <div class=\"col-sm-12 col-md-9\">\r\n            \r\n\r\n\r\n<div class=\"navigation-wrapper\">\r\n    <nav aria-label=\"You are here\">\r\n        <ol class=\"breadcrumb main-breadcrumb small\">\r\n            <li><a href=\"/en/\">Home</a></li>\r\n                        <li><a href=\"/en/designs/\">Designs</a></li>\r\n            <li><a href=\"/en/designs/prepare-for-the-design-application/\">Prepare for the design application</a></li>\r\n            <li class=\"current\">Fees for designs</li>\r\n\r\n        </ol>\r\n    </nav>\r\n    <div class=\"print hidden-xs\">\r\n        <button class=\"btn btn-link\" type=\"button\" aria-label=\"\n\t\t\t\tPrint\n\t\t\t\">\r\n            <svg class=\"print-icon\" aria-hidden=\"true\" focusable=\"false\" width=\"700\" heigth=\"700\">\r\n                <use xmlns:xlink=\"http://www.w3.org/1999/xlink\" xlink:href=\"/Static/images/icons/icons.svg#icon-print\"></use>\r\n            </svg><br />\r\n            <span role=\"complementary\">\n\t\t\t\tPrint\n\t\t\t</span>\r\n        </button>\r\n    </div>\r\n</div>\r\n            \r\n            <main class=\"main-content\" id=\"gotocontent\" role=\"main\">\r\n\r\n    <div  class=\"main-image\">\r\n    </div>\r\n    <h1 >\r\n        Fees for designs\r\n    </h1>\r\n<p class=\"preamble\">\r\n    When you submit your application for design registration, you must also pay the application fee.\r\n</p>\r\n    <div  class=\"main-image secondary-image\">\r\n    </div>\r\n\r\n    <div  class=\"main-image secondary-image-mobile\">\r\n    </div>\r\n\r\n                    <div class=\"article-inner\" data-enhancer=\"mainBody\">\r\n                        \r\n\r\n\r\n\r\n<h2>Application fees for design registration in Sweden</h2>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"3d9bc18e-93e9-4f5d-97e6-3dfc46b06803\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fee for application via e-service, you pay less <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"3d9bc18e-93e9-4f5d-97e6-3dfc46b06803\">\r\n        <table class=\"table-grey-line\" border=\"0\"><caption>Filing a designapplication using e-service</caption>\n<tbody>\n<tr>\n<td width=\"90%\">Filing fee for registration of 1 design using our electronic services. One five-year period. </td>\n<td align=\"right\" width=\"10%\">2 000 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"ca29a4c7-c288-4b3b-8899-7288ff3d98f0\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fee for application via paper or e-mail, you pay more <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"ca29a4c7-c288-4b3b-8899-7288ff3d98f0\">\r\n        <p>Other service refers to an application that has been submitted in another way than PRV's e-service, including applications that are submitted via e-mail.</p>\n<table class=\"color table-grey-line\" border=\"0\"><caption>Apply for design registration - via paper or e-mail</caption>\n<tbody>\n<tr>\n<td style=\"width: 90%;\">\n<p>Filing fee for registration of 1 design via paper och e-mail</p>\n</td>\n<td style=\"width: 10%;\" align=\"right\">2 500 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"bbd9cce5-007f-42f1-8bad-bfdc1710f202\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        For an additional five-year period <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"bbd9cce5-007f-42f1-8bad-bfdc1710f202\">\r\n        <table class=\"color table-grey-line\" border=\"0\"><caption>Apply for another five-year period</caption>\n<tbody>\n<tr>\n<td style=\"width: 90%;\">\n<p>For additional five-year period of 1 design. Applies in conjunction with first registration, see above.</p>\n</td>\n<td style=\"width: 10%;\" align=\"right\">2 200 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<h2>Additional fees</h2>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"974e4d20-c30a-4044-966a-f6decdd392b4\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Additional fees <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"974e4d20-c30a-4044-966a-f6decdd392b4\">\r\n        <table class=\"color table-grey-line\" border=\"0\"><caption>Additional fees for design</caption>\n<tbody>\n<tr>\n<td style=\"width: 90%;\">Multiple registration fee for additional design.</td>\n<td style=\"width: 10%;\">1 400 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 90%;\">Announcement fee for each image in addition to the first.</td>\n<td style=\"width: 10%;\" align=\"right\">200 SEK</td>\n</tr>\n<tr>\n<td>Class fee for each additional class a design or several designs from a multiple registration are classified in.</td>\n<td align=\"right\">500 SEK</td>\n</tr>\n<tr>\n<td>Storage fee for each specimen.</td>\n<td align=\"right\">800 SEK</td>\n</tr>\n<tr>\n<td>Surcharge when renewal fees are paid after the registration period has expired.</td>\n<td align=\"right\">500 SEK</td>\n</tr>\n<tr>\n<td>Surcharge when renewal fees are paid after the registration period has expired 500 SEK  </td>\n<td>      500  SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<h2>Renewal fees</h2>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"22e32489-11f0-432d-b171-b9ef40944277\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Renewal fees <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"22e32489-11f0-432d-b171-b9ef40944277\">\r\n        <table class=\"color table-grey-line\" style=\"height: 216px;\" border=\"0\"><caption>Renewal fees for design</caption>\n<tbody>\n<tr style=\"height: 36px;\">\n<td style=\"width: 497px; height: 36px;\">Renewal fee for a registered design using our electronic services. Per five-year period. <br />Class fee, multiple registration fee and storage fee are additional, see below.</td>\n<td style=\"width: 51px; height: 36px;\" align=\"right\">2 500 SEK</td>\n</tr>\n<tr style=\"height: 36px;\">\n<td style=\"height: 36px; width: 497px;\">Other renewal, 5 years. </td>\n<td style=\"height: 36px; width: 51px;\" align=\"right\">3 000 SEK</td>\n</tr>\n<tr>\n<td style=\"width: 497px;\">Storage fee for each specimen</td>\n<td style=\"width: 51px;\">800 SEK</td>\n</tr>\n</tbody>\n</table>\r\n    </div>\r\n</div>\n<h2>New owner and license</h2>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" aria-controls=\"c463cdfc-7acc-4c81-98c5-397eee58737a\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Fees for new owner and license <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"c463cdfc-7acc-4c81-98c5-397eee58737a\">\r\n        <table class=\"color table-grey-line\" border=\"0\"><caption>New owner and license</caption>\n<tbody>\n<tr>\n<td style=\"width: 90%;\">Application for register entry of a new owner</td>\n<td style=\"width: 10%;\" align=\"right\">900 SEK</td>\n</tr>\n<tr>\n<td