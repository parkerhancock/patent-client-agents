-application%2ffees-and-payment%2f\"\r\n                                            onclick=\"handleReadSpeakerClick(event, this); return false;\" data-target=\"xp1\" aria-label=\"Listen\" class=\"read-speaker rs_perserve rs_skip\">Listen</prv-button>\r\n                                        </span>\r\n\r\n\r\n\r\n        <span class=\"function-link\">\r\n            <i class=\"prv-icon-globe2\"></i>\r\n            <prv-button href=\"/sv/varumarke/forbered-dig-infor-varumarkesansokan/avgifter-for-varumarke/\"\r\n                        lang=\"sv\"\r\n                        title=\"L&#228;s hela siten p&#229; svenska\"\r\n                        reverse>P&#229; svenska</prv-button>\r\n                    </span>\r\n\r\n                        <span class=\"function-link\">\r\n                            <i class=\"prv-icon-database-search\"></i><prv-button href=\"/en/knowledge-and-support/search-databases/\">Databases</prv-button>\r\n                                                                            </span>\r\n                        <span class=\"function-link\">\r\n                            <i class=\"prv-icon-e-services-and-forms\"></i><prv-button href=\"/en/online-services-and-forms/\">Online services and forms</prv-button>\r\n                                                                            </span>\r\n                </div>\r\n            </prv-mini-menu>    \r\n</prv-header> \r\n<div class=\"alerts-container\">\r\n</div>\r\n\r\n\r\n        </div>\r\n        <div class=\"inner-wrap\">\r\n            \r\n<div class=\"container main-content-block\">\r\n    <div class=\"row\">\r\n        <div class=\"col-sm-4 col-md-3\">\r\n\r\n\r\n    <nav aria-label=\"Submenu\">\r\n        <div class=\"hidden-xs hidden-sm left-navigation-list\">\r\n                <h2 class=\"side-navigation-heading\">Trademarks</h2>\r\n\r\n            \r\n\r\n\r\n\r\n\r\n    <div class=\"list-container\">\r\n        <ul class=\"list-unstyled navigation-list top-level\">\r