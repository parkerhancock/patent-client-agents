a-label=\"\n\t\t\t\tPrint\n\t\t\t\">\r\n            <svg class=\"print-icon\" aria-hidden=\"true\" focusable=\"false\" width=\"700\" heigth=\"700\">\r\n                <use xmlns:xlink=\"http://www.w3.org/1999/xlink\" xlink:href=\"/Static/images/icons/icons.svg#icon-print\"></use>\r\n            </svg><br />\r\n            <span role=\"complementary\">\n\t\t\t\tPrint\n\t\t\t</span>\r\n        </button>\r\n    </div>\r\n</div>\r\n            \r\n            <main class=\"main-content\" id=\"gotocontent\" role=\"main\">\r\n\r\n    <div  class=\"main-image\">\r\n    </div>\r\n    <h1 >\r\n        Fees and payment\r\n    </h1>\r\n<p class=\"preamble\">\r\n    When you file a national patent application with us, you have to pay a filing fee. \r\n</p>\r\n    <div  class=\"main-image secondary-image\">\r\n    </div>\r\n\r\n    <div  class=\"main-image secondary-image-mobile\">\r\n    </div>\r\n\r\n                    <div class=\"article-inner\" data-enhancer=\"mainBody\">\r\n                        \r\n\r\n\r\n\r\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" id=\"howtopay\" aria-controls=\"a3f6b702-413a-4248-9a67-766f3a5cfe12\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Payment <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"a3f6b702-413a-4248-9a67-766f3a5cfe12\">\r\n        <p>You pay through our service online for electronic payment, by bank transfer or through our deposit account. We can not offer invoice.</p>\n<p><a href=\"/en/patents/the-advanced-patent-guide/fees-and-payment/payment/\" class=\"internal-link\">Read more about payment</a></p>\n<p><a href=\"https://tc.prv.se/patentwebshop/servlet/start/?lang=en\" target=\"_blank\" class=\"external-link\" rel=\"noopener\">Direct to electronic payment (opens in a new window)</a></p>\r\n    </div>\r\n</div>\n<div class=\"accordion-block\">\r\n    <button type=\"button\" class=\"accordion\" id=\"nontaxablefees\" aria-controls=\"4e852d77-a02f-4ad1-82e1-75402d94efa1\" aria-expanded=\"false\" aria-haspopup=\"true\">\r\n        Non-taxable fees <span class=\"accordion-button icon-expand\"></span>\r\n    </button>\r\n\r\n    <div class=\"accordion-body\" id=\"4e852d77-a02f-4ad1-82e1-75402d94efa1\">\r\n        <p>Fees for government services, such as applications and registrations, and copies and printouts of public documents, are exempt from VAT.<br /><br />Fees according to the Patents Decree (1967:838) and PRV's statutes (PRVFS).</p>\r\n    </div>\r\n</div>\n<p><strong>Please note that the fees may change during the year.</strong></p>\n\r\n\r\n\r\n    <section class=\"link-block red \" role=\"region\" aria-label=\"Important information regarding the fee for grant\">\r\n\r\n\r\n        <div class=\"link-block-content\">\r\n                        <h2 class=\"link-block-header\">\r\n                            Important information regarding the fee for grant\r\n                        </h2>\r\n\r\n<p>From 1 December 2025 the fee for grant; basic fee for publication, is 3000 SEK irrespective of when the national patent application has been filed at PRV.</p>\r\n        </div>\r\n    </section>\r\n\n        <h2>\r\n            Complete price list\r\n        </h2>\r\n\r\n<div class=\"pricelist\">\r\n    <div id=\"fee-category-container\" class=\"fee-category-container btn-group btn-group-toggle\" data-toggle=\"buttons\">\r\n            <button class=\"fee-category active\" data-target=\"#1\" data-toggle=\"tab\" data-active-class=\"info\">\r\n                National application and patent\r\n            </button>\r\n            <button class=\"fee-category \" data-target=\"#2\" data-toggle=\"tab\" data-active-class=\"info\">\r\n                International applications&#160;(PCT)\r\n            </button>\r\n            <button class=\"fee-category \" data-target=\"#3\" data-toggle=\"tab\" data-active-class=\"info\">\r\n                European patents&#160;(EP)\r\n            </button>\r\n            <button class=\"fee-category \" data-target=\"#4\" data-toggle=\"tab\" data-active-class=\"info\">\r\n                Certification\r\n            </button>\r\n            <button class=\"fee-category \" data-target=\"#5\" data-toggle=\"tab\" data-active-class=\"info\">\r\n                Consultancy services\r\n            </button>\r\n    </div>\r\n    <div id=\"fee-category-container-mobile\" class=\"fee-category-container-mobile btn-group btn-group-toggle\" data-toggle=\"buttons\">\r\n        <button class=\"btn btn-default btn-block dropdown-toggle text-left\" type=\"button\" id=\"dropdownMenu2\" data-toggle=\"dropdown\" aria-haspopup=\"true\" aria-expanded=\"true\">\r\n            Ärendetyp\r\n            <span class=\"caret\"></span>\r\n        </button>\r\n        <ul class=\"dropdown-menu\" aria-labelledby=\"dropdownMenuButton\">\r\n                <li><a class=\"dropdown-item\" data-target=\"#\">National application and patent</a></li>\r\n                <li><a class=\"dropdown-item\" data-target=\"#\">International applications&#160;(PCT)</a></li>\r\n                <li><a class=\"dropdown-item\" data-target=\"#\">European patents&#160;(EP)</a></li>\r\n                <li><a class=\"dropdown-item\" data-target=\"#\">Certification</a></li>\r\n                <li><a class=\"dropdown-item\" data-target=\"#\">Consultancy services</a></li>\r\n        </ul>\r\n    </div>\r\n\r\n    <div class=\"tab-content\">\r\n            <div id=\"1\" class=\"tab-pane input-group in active\" role=\"tabpanel\">\r\n                <div class=\"sort-and-search\">\r\n                    <div class=\"row\">\r\n                        <div class=\"col-md-4\">\r\n                            <label for=\"dropdown-menu\" style=\"display: none;\">Alla avgifter</label>\r\n                            <select id=\"dropdown-menu-1\" class=\"select-field\">\r\n                                <option id=\"tab-1-category-0\" class=\"select-values\" selected>All