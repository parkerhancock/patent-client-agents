        <ns2:MarkDescriptionText>The mark consists of A large vertically-oriented medium blue oval outlined with thin white and black oval lines with the letters "MAC" in the center written horizontally in black with white and black outlines on the letters with a thin white horizontal stripe above and below the letters with a small black circle intersecting the top of the large oval containing a white torch with three red flames flowing upward with a three-quarter medium blue semi-circle on each side of the torch and with a black ribbon crossing the bottom of the large oval with a medium blue pinstripe at the top and bottom of the ribbon with the words "MEMPHIS ATHLETIC CAMPUS" centered in the ribbon with a single white star on each end of the text and light blue outlines on the ribbon on the ends outside the boundary of the large oval.</ns2:MarkDescriptionText>
