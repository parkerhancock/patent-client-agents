">Systems status</a></div></div> </span></div></div></div></div></div></div></div> </nav></div><div class="region-header-bottom region-header-bottom--breadcrumb uspto-sticky-nav"><div class="container-lg"><div class="row d-none d-sm-flex"><div class="region region-header-breadcrumb col-12 px-3" id="header-breadcrumb"><div id="block-uspto-breadcrumbs" class="block block-system block-system-breadcrumb-block block-uspto-breadcrumbs"> <nav class="m-1" role="navigation" aria-labelledby="system-breadcrumb"><h2 id="system-breadcrumb" class="visually-hidden">Breadcrumb</h2><ol class="breadcrumb breadcrumb-wrap"><li class="breadcrumb-item"> <a href="/">Home</a></li><li class="breadcrumb-item"> <a href="/learning-resources">Learning and Resources</a></li><li class="breadcrumb-item"> <a href="/learning-and-resources/fees-and-payment">Fees and Payment</a></li><li class="breadcrumb-item active"> USPTO fee schedule</li></ol> </nav></div></div></div></div></div><div class="region-header-bottom region-header-bottom--hero"><div class="container-lg"><div id="hero" class="hero row"><div class="hero-content col-12"><div class="region region-hero-primary hero-content-primary"><div id="block-hero" class="block block-ctools block-entity-viewnode block-hero"> <article region="hero_primary" data-history-node-id="161170" class="node node--type-section-landing node--view-mode-hero clearfix"><div class="field field--name-field-hero field--type-entity-reference-revisions field--label-hidden field__items"><div class="field__item"><div class="row"><div class="col-md-12 hero-content-section"><h1>USPTO fee schedule</h1><p><span><strong>Effective January 19, 2025 (Last revised August 14, 2026)</strong></span></p><p>The fee schedule provides information and fee rates for USPTO's&nbsp;products and services.&nbsp;All payments must be paid in U.S. dollars for the full amount of the fee required.&nbsp;View the <a class="ck-anchor" href="/learning-and-resources/fees-and-payment/accepted-payment-methods" title="Link to Accepted Payment Methods page">Accepted payment methods</a> page or call the USPTO Contact Center at 571-272-1000 or 800-786-9199 for assistance.</p><p><a href="https://www.uspto.gov/patents-getting-started/using-legal-services/scam-prevention/non-uspto-solicitations"><span lang="EN"><strong>SCAM ALERT - Warning about non-USPTO solicitations</strong></span></a><span lang="EN"> and&nbsp;</span><a href="https://www.uspto.gov/subscription-center/2023/beware-spoofed-calls-impersonate-uspto-0" title="https://www.uspto.gov/subscription-center/2023/beware-spoofed-calls-impersonate-uspto-0" target="_blank"><strong>warning about spoofed calls that impersonate the USPTO</strong></a> requesting payments.</p></div></div></div></div> </article></div></div></div></div></div></div> </header><main role="main" id="main" class="uspto-enable-sticky-nav main-content bg-white"><div class="container-lg"><div class="row"><div class="col-12" id="content" role="main"> <a id="main-content" tabindex="-1"></a><div class="region region-highlighted"><div id="block-highlighted-alert-161170-92" data-disable-close="false" class="uspto-alert block block-ctools block-entity-viewnode block-highlighted-alert-161170-92" style="display:none"><div region="highlighted" data-history-node-id="161170" class="node node--type-section-landing node-section-landing node--view-mode-highlighted-alert view-mode-highlighted-alert block"><div class="container-lg p-0"><div class="wrapper-alert"><div class="alert alert-warning" aria-label="Site alert" role="alert"><div class="alert-icon"> <i class="material-icons">warning</i></div><div class="alert-content"><p><strong>Fee schedule changes effective August 14, 2026:</strong></p><p><strong>Conditions for Additional Information and Fee in Petitions Filed in Patent Applications and Patents Based on Unintentional Delay</strong></p><p>Applicable to any new petition filed after August 13, 2026.</p><p>The USPTO is revising its practice of requiring additional information for delays in taking certain actions in patent applications and patents from requiring additional information for delays exceeding two years to requiring additional information for delays exceeding one year. For more information, refer to the <a href="https://gcc02.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.federalregister.gov%2Fdocuments%2F2026%2F06%2F24%2F2026-12717%2Fconditions-for-additional-information-and-fee-in-petitions-filed-in-patent-applications-and-patents&amp;data=05%7C02%7CJeffrey.Young%40USPTO.GOV%7C482ea612205d4643f5f308def96208b4%7Cff4abfe983b540268b8ffa69a1cad0b8%7C0%7C0%7C639222396638266742%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&amp;sdata=ESkaGfiCfKVZ9e4Vn%2F%2BJQgQNjzh796nki0Ju%2FHVKw%2Bc%3D&amp;reserved=0">Federal Register Notice</a>. Fee code descriptions have been updated for the following fees:</p><p>Patent petition fees:&nbsp;</p><ul type="disc"><li><span>1453/2453/3453&nbsp;</span></li><li><span>1468/2468/3468</span></li><li><span>1454/2454/3454</span></li><li><span>1469/2469/3469</span></li><li><span>1784/2784/3784</span></li><li><span>1785/2785/3785</span></li></ul><p>Patent maintenance fees:</p><ul type="disc"><li><span>1558/2558/3558</span></li><li><span>1560/2560/3560</span></li></ul></div></div></div></div></div></div></div><div class="region region-content"><div data-drupal-messages-fallback class="hidden"></div><div id="block-pagetitle" class="block block-core block-page-title-block block-pagetitle clearfix"></div><div id="block-uspto-theme-system-main" class="block block-system block-system-main-block block-uspto-theme-system-main"> <article data-history-node-id="161170" class="node node--type-section-landing node-section-landing node--view-mode-full view-mode-full"><div class="node__content"><div class="clearfix text-formatted field field--name-body field--type-text-with-summary field--label-hidden field__item"><div class="col12"><div class="span6"><h2>Current fee schedule</h2></div><div class="span6"><p class="rteright"><a class="ck-anchor" href="/sites/default/files/documents/USPTO-fee-schedule_current.pdf" type="pdf" title="Printer-friendly fee schedule">Printer friendly version</a><a class="ck-anchor" id="Top"></a></p></div></div><div class="col12"><div class="span4"><h3><a href="#Patent%20Fees" title="Patent fees"><strong>Patent fees</strong></a></h3><ul><li><a href="#Patent%20Fees" title="Patent application filing fees">Application filing</a></li><li><a href="#Patent%20Search%20Fee" title="Patent search fees">Search</a></li><li><a href="#Patent%20Exam%20Fee" title="Patent examination fees">Examination</a></li><li><a href="#Patent%20issue%20and%20publication%20fees" title="Patent post-allowance fees">Issue and publication</a></li><li><a href="#Patent%20Extension%20Fee" title="Patent extension of time fees">Extension of time</a></li><li><a href="#Patent%20Maintenance%20Fee" title="Patent maintenance fees">Maintenance</a></li><li><a href="#Patent%20Misc%20Fee" title="Miscellaneous patent fees">Miscellaneous</a></li><li><a href="#Patent%20Post%20Issuance%20Fees" title="Patent post-issuance fees">Post issuance</a></li><li><a href="#PTAB%20Fees" title="Patent trial and appeal fees">Trial and appeal</a></li><li><a href="#Patent%20Petition%20Fee" title="Patent petition fees">Petition</a></li><li><a href="#Patent%20Service" title="Patent service fees">Service</a></li><li><a href="#Patent%20Enroll%20Fee" title="Patent enrollment fees">Enrollment</a></li><li><a href="#Patent-penalty-fines">Penalty fines</a></li></ul></div><div class="span4"><h3><a href="#PCT%20Nat%20Fee" title="Patent Cooperation Treaty (PCT) fees"><strong>Patent Cooperation Treaty fees</strong></a></h3><ul><li><a href="#PCT%20Nat%20Fee" title="PCT National Stage fees">National stage</a></li><li><a href="#PCT%20Intl%20Stage%20Fee" title="PCT International Stage fees">International stage</a></li><li><a href="#PCT%20Fees%20to%20Foreign" title="PCT fees to foreign offices">Fees to foreign offices</a></li></ul><h3><a href="#Hague-IntlDesignApp" title="Hague Agreement international design application fees">Hague - international design application fees</a></h3></div><div class="span4"><h3><a href="#Trademark%20Fees" title="Trademark fees"><strong>Trademark fees</strong></a></h3><ul><li><a href="#TM%20Application-related">Application-related</a></li><li><a href="#TM%20Petition%20and%20letter%20of%20protest">Petition and letter of protest</a></li><li><a href="#TM%20Post%20registration">Post registration</a></li><li><a href="#TM%20Trial%20and%20appeal">Trial and appeal</a></li><li><a href="#TM%20Madrid%20Fee" title="Trademark Madrid Protocol fees">Madrid Protocol</a></li><li><a href="#TM%20Serv%20Fee" title="Trademark service fees">Service</a></li><li><a href="#Fastener%20Fee" title="Fastener Quality Act fees">Fastener Quality Act</a></li></ul><h3><a href="#General%20Service%20Fees" title="General Service Fees"><strong>General service fees</strong></a></h3><div>&nbsp;</div></div></div><p>&nbsp;</p><p><a class="ck-anchor" id="Patent Fees"></a></p><h2>Patent fees</h2><p>The fees subject to reduction upon establishment of small entity status (37 CFR 1.27)&nbsp;or micro entity status (37 CFR 1.29)&nbsp;are shown in separate columns.&nbsp;Except for provisional applications, each application for a patent requires the appropriate search fee and examination fee in addition to the appropriate fees in the "Patent application filing fees" section below. This means each fee listed as a "Basic filing fee" in the "Patent application filing fees" section should be accompanied by the appropriate search fee listed&nbsp;in the "Patent search fees" section&nbsp;as well as the appropriate examination fee listed in the "Patent examination fees" section.&nbsp;The $400/$200 non-electronic filing fee (fee codes 1090/2090/3090 or 1690/2690/3690) must be paid in addition to the filing, search and examination fees, in each original nonprovisional utility application filed in paper with the USPTO. The only way to avoid payment of the non-electronic filing fee is by filing your nonprovisional utility application via Patent Center. The non-electronic filing fee does not apply to reissue, design, plant, or provisional applications.&nbsp;</p><table class="table" border="0" cellpadding="0" cellspacing="0"><thead><tr><th colspan="3"><h3>Patent application filing fees</h3></th><th colspan="3"><a href="#Top" title="Return to top of page">Back to top</a></th></tr><tr><th><strong>Fee code</strong></th><th><strong>37 CFR &sect; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</strong></th><th><strong>Description</strong></th><th><strong>Fee</strong></th><th><strong>Small entity fee</strong></th><th><strong>Micro entity fee</strong></th></tr></thead><tbody><tr><td>1011/2011/3011</td><td>1.16(a)</td><td>Basic filing fee - Utility (paper filing also requires non-electronic filing fee under 1.16(t))</td><td><span>350.00</span></td><td><span>140.00</span></td><td><span>70.00</span></td></tr><tr><td><a href="#Footnote%20-%20Pat%20App%20Fil" title="Go to footnote">4011&dagger;</a></td><td>1.16(a)</td><td>Basic filing fee - Utility (electronic filing for small entities)</td><td>n/a</td><td>70.00</td><td>n/a</td></tr><tr><td>1012/2012/3012</td><td>1.16(b)</td><td>Basic filing fee - Design</td><td><span>300.00</span></td><td><span>120.00</span></td><td><span>60.00</span></td></tr><tr><td>1017/2017/3017</td><td>1.16(b)</td><td>Basic filing fee - Design CPA</td><td><span>300.00</span></td><td><span>120.00</span></td><td><span>60.00</span></td></tr><tr><td>1013/2013/3013</td><td>1.16(c)</td><td>Basic filing fee - Plant</td><td><span>240.00</span></td><td><span>96.00</span></td><td><span>48.00</span></td></tr><tr><td>1005/2005/3005</td><td>1.16(d)</td><td>Provisional application filing fee</td><td><span>325.00</span></td><td><span>130.00</span></td><td><span>65.00</spa