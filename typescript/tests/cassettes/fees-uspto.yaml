ation size fee - for each additional 50 sheets that exceeds 100 sheets</td><td><span>450.00</span></td><td><span>180.00</span></td><td><span>90.00</span></td></tr><tr><td>1083/2083/3083</td><td>1.16(s)</td><td>Plant application size fee - for each additional 50 sheets that exceeds 100 sheets</td><td><span>450.00</span></td><td><span>180.00</span></td><td><span>90.00</span></td></tr><tr><td>1084/2084/3084</td><td>1.16(s)</td><td>Reissue application size fee - for each additional 50 sheets that exceeds 100 sheets</td><td><span>450.00</span></td><td><span>180.00</span></td><td><span>90.00</span></td></tr><tr><td>1085/2085/3085</td><td>1.16(s)</td><td>Provisional application size fee - for each additional 50 sheets that exceeds 100 sheets</td><td><span>450.00</span></td><td><span>180.00</span></td><td><span>90.00</span></td></tr><tr><td>1090/2090/3090</td><td>1.16(t)</td><td>Non-electronic filing fee &mdash; Utility (additional fee for applications filed in paper)</td><td>400.00</td><td>200.00</td><td>200.00</td></tr><tr><td><span>1054/2054/3054</span></td><td><span>1.16(u)</span></td><td><span>Non-DOCX filing surcharge</span></td><td><span>430.00</span></td><td><span>172.00</span></td><td><span>86.00</span></td></tr><tr><td>1053/2053/3053</td><td>1.17(i)(1)</td><td>Non-English translation</td><td><span>150.00</span></td><td><span>60.00</span></td><td><span>30.00</span></td></tr><tr><td><span>1055/2055/3055</span></td><td><span>1.17(w)(1)</span></td><td><span>Filing an application or presentation of benefit claim more than six years after earliest benefit date</span></td><td><span>2,700.00</span></td><td><span>1,080.00</span></td><td><span>540.00</span></td></tr><tr><td><span>1056/2056/3056</span></td><td><span>1.17(w)(2)</span></td><td><span>Filing an application or presentation of benefit claim more than nine years after earliest benefit date</span></td><td><span>4,000.00</span></td><td><span>1,600.00</span></td><td><span>800.00</span></td></tr><tr><td>1091/2091/3091<