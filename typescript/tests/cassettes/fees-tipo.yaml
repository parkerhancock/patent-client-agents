li>\n   </ul>\n  </div>\n  <h2 class=\"title\">Schedule of Patent Fees</h2>\n  <div class=\"function_panel\">\n   <div class=\"font_size\">\n    <span>Font Size：</span>\n    <ul>\n     <li><a href=\"#\" role=\"button\" class=\"small\">S</a></li>\n     <li><a href=\"#\" role=\"button\" class=\"medium\">M</a></li>\n     <li><a href=\"#\" role=\"button\" class=\"large\">L</a></li>\n    </ul>\n   </div>\n   <div class=\"function\">\n    <ul>\n     <li class=\"back\"><a href=\"#\" class=\"onclick\" role=\"button\" data-fn=\"windowsBack\" data-args=\"\">Back</a></li>\n     <li class=\"print\"><a href=\"#\" class=\"onclick\" role=\"button\" data-fn=\"windowsPrint\" data-args=\"\">Print</a></li>\n    </ul>\n   </div>\n   <div class=\"share\">\n    <ul>\n     <li><a href=\"#\" class=\"onclick\" role=\"button\" data-fn=\"openSharePage\" data-args=\"https://www.facebook.com/sharer/sharer.php?u=\" title=\"Facebook(Open in a new window)\"><img src=\"/wSite/styles/tipo/images/basic/icon_facebook.svg\" alt=\"Facebook\"></a></li>\n     <li><a href=\"#\" class=\"onclick\" role=\"button\" data-fn=\"openSharePage\" data-args=\"http://www.twitter.com/share?url=\" title=\"Twitter(Open in a new window)\"><img src=\"/wSite/styles/tipo/images/basic/icon_twitter.svg\" alt=\"X\"></a></li>\n     <li><a href=\"#\" class=\"onclick\" role=\"button\" data-fn=\"openSharePage\" data-args=\"http://line.naver.jp/R/msg/text/?\" title=\"Line(Open in a new window)\"><img src=\"/wSite/styles/tipo/images/basic/icon_line.svg\" alt=\"LINE\"></a></li>\n    </ul>\n   </div>\n  </div>\n  <section class=\"cp\">\n   <table align=\"center\" style=\"width: 100%;\">\n    <thead>\n     <tr>\n      <th scope=\"col\">&nbsp;</th>\n      <th scope=\"col\">Description</th>\n      <th scope=\"col\">Fee</th>\n     </tr>\n    </thead>\n    <caption>\n     Schedule of Patent Fees\n    </caption>\n    <tbody>\n     <tr>\n      <td>1</td>\n      <td>(1) Filing of an invention application<br>\n        (2) Conversion of a utility model application into an invention application<br>\n        (3) Division of an invention application<br>\n        (4) Re-examination of a design application</td>\n      <td>NT$3,500</td>\n     </tr>\n     <tr>\n      <td>2</td>\n      <td>(1) Filing of a utility model application<br>\n        (2) Conversion of an invention application or a design application into a utility model application<br>\n        (3) Division of a utility model application<br>\n        (4) Filing of a design application<br>\n        (5) Filing of a derivative design application<br>\n        (6) Conversion of an application into a design application or a derivative design application<br>\n        (7) Filing of a divisional design application</td>\n      <td>NT$3,000</td>\n     </tr>\n     <tr>\n      <td>3</td>\n      <td>Invalidation against a design patent</td>\n      <td>NT$8,000</td>\n     </tr>\n     <tr>\n      <td>4</td>\n      <td>(1) Substantive examination of an invention application (whose description, claims, abstract, and drawings in<br>\n        total do not exceed 50 pages and the number of claims is less than 10)<br>\n        (2) Re-examination of an invention application (whose description, claims, abstract, and drawings in total do not<br>\n        exceed 50 pages and the number of claims is less than 10)</td>\n      <td>NT$7,000</td>\n     </tr>\n     <tr>\n      <td>5</td>\n      <td>(1) Additional fee for substantive examination or re-examination of an invention application whose total number<br>\n        of claims exceed 10 (a fee of NT$800 is required for each additional claim)<br>\n        (2) Additional fee for Invalidation against an invention patent or a utility model patent. A fee of NT$800 is required<br>\n        for each claim</td>\n      <td>NT$800</td>\n     </tr>\n     <tr>\n      <td>6</td>\n      <td>Additional fee for substantive examination or re-examination of an invention whose description, claims, abstract,<br>\n        and drawings exceed 50 pages (a NT$500 fee is required for each addition of 50 pages; additional pages less than<br>\n        50 shall be counted as 50)</td>\n      <td>NT$500</td>\n     </tr>\n     <tr>\n      <td>7</td>\n      <td>(1) A technical evaluation report of a utility model patent NT$5,000 whose total number of claims is less than 10<br>\n        (2) Inspection of conducted experiments or submitted models or samples<br>\n        (3) Invalidation against an invention patent or a utility model patent (applicable where the invalidation is on a<br>\n        claim-by-claim basis)</td>\n      <td>NT$5,000</td>\n     </tr>\n     <tr>\n      <td>8</td>\n      <td>Each additional claim in a technical evaluation report of a utility model patent (whose total number of claims<br>\n        exceeds 10)</td>\n      <td>NT$600</td>\n     </tr>\n     <tr>\n      <td>9</td>\n      <td>Invalidation against an invention patent (applicable to patent term extension, where the patentee is not the owner<br>\n        of the ight to apply for an invention patent , or where the invention patent runs counter to the reciprocity principle)</td>\n      <td>NT$10,000</td>\n     </tr>\n     <tr>\n      <td>10</td>\n      <td>Invalidation against a utility model patent (applicable where the patentee is not the owner of the right to apply for<br>\n        a utility model patent , or where the utility model patent runs counter to the reciprocity principle)</td>\n      <td>NT$9,000</td>\n     </tr>\n     <tr>\n      <td>11</td>\n      <td>(1) Adding supplementary reasons or evidence to invalidation<br>\n        (2) Post-grant amendment to description, claims, or drawings of an invention patent<br>\n        (3) Post-grant amendment to description or drawings of a design patent<br>\n        (4) Post-grant amendment to description, claims, or drawings of a utility model patent (consolidated procedures<br>\n        for invalidation and post-grant amendment)<br>\n        (5) Reinstatement of priority claim<br>\n        (6) Correction of translation errors</td>\n      <td>NT$2,000</td>\n     </tr>\n     <tr>\n      <td>12</td>\n      <td>(1) Early laying-open of an invention application<br>\n        (2) An interview<br>\n        (3) Post-grant amendment to description, claims, or drawings of a utility model patent</td>\n      <td>NT$1,000</td>\n     </tr>\n     <tr>\n      <td>13</td>\n      <td>Accelerated examination of an invention application based on any of the following circumstances<br>\n        (1) the invention application is essential to commercial exploitation<br>\n        (2) the invention application is eligible under the TW-Support Using the PPH Agreement (TW-SUPA) Examination<br>\n        Pilot Program<br>\n        (3) the invention application is related to green technology</td>\n      <td>NT$4,000</td>\n     </tr>\n     <tr>\n      <td>14</td>\n      <td>(1) Recordation of changes to the applicant’s name, seal, or signature<br>\n        (2) Recordation of changes to the inventor, creator or designer, or the name thereof<br>\n        (3) Change of patent agent<br>\n        (4) Other changes to recordation of licensing, pledge, or trust of a patent right<br>\n        The fee is the same for more than two changes made simultaneously</td>\n      <td>NT$300</td>\n     </tr>\n     <tr>\n      <td>15</td>\n      <td>(1) Compulsory license of a patent<br>\n        (2) Repeal of compulsory license of a patent</td>\n      <td>NT$100,000</td>\n     </tr>\n     <tr>\n      <td>16</td>\n      <td>(1) Recordation of assignment or inheritance of the right to apply for a patent<br>\n        (2) Recordation of assignment or inheritance of the patent<br>\n        (3) Recordation of licensing or sublicensing of patent right<br>\n        (4) Deletion of licensing recordation<br>\n        (5) Recordation of pledge establishment of patent right<br>\n        (6) Deletion of pledge establishment recordation of patent right<br>\n        (7) Recordation of trust of patent right<br>\n        (8) Deletion of trust recordation of patent right<br>\n        (9) Recordation of attribution of trusted patent right</td>\n      <td>NT$2,000</td>\n     </tr>\n     <tr>\n      <td>17</td>\n      <td>Annuity for a granted invention patent or a granted utility model patent (1st-3rd year)</td>\n      <td>NT$2,500</td>\n     </tr>\n     <tr>\n      <td>18</td>\n      <td>A patentee who is a natural person, a school, or a small and medium-sized enterprise may request annuity<br>\n        reduction of an invention patent or a utility model patent in the amount of NT$800 for the 1st-3rd year, cutting<br>\n        the annuity down to NT$1,700</td>\n      <td>NT$1,700</td>\n     </tr>\n     <tr>\n      <td>19</td>\n      <td>(1) Annuity for a granted invention patent (4th-6th year)<br>\n        (2) Annuity for prolonged term of an invention patent</td>\n      <td>NT$5,000</td>\n     </tr>\n     <tr>\n      <td>20</td>\n      <td>A patentee who is a natural person, a school, or a small and medium-sized enterprise may request annuity<br>\n        reduction of an invention patent in the amount of NT$1,200 for the 4th-6th year, cutting the annuity down to<br>\n        NT$3,800</td>\n      <td>NT$3,800</td>\n     </tr>\n     <tr>\n      <td>21</td>\n      <td>Annuity for a granted invention patent (7th-9th year)</td>\n      <td>NT$8,000</td>\n     </tr>\n     <tr>\n      <td>22</td>\n      <td>Annuity for a granted invention patent (10th year and beyond)</td>\n      <td>NT$16,000</td>\n     </tr>\n     <tr>\n      <td>23</td>\n      <td>Annuity for a granted utility model patent (4th-6th year)</td>\n      <td>NT$4,000</td>\n     </tr>\n     <tr>\n      <td>24</td>\n      <td>A patentee who is a natural person, a school, or a small and medium-sized enterprise may request annuity<br>\n        reduction of a utility model patent in the amount of NT$1,200 for the 4th-6th year, cutting the annuity down<br>\n        to NT$2,800</td>\n      <td>NT$2,800`</td>\n     </tr>\n     <tr>\n      <td>25</td>\n      <td>Annuity for a granted utility model patent (7th year and beyond)</td>\n      <td>NT$8,000</td>\n     </tr>\n     <tr>\n      <td>26</td>\n      <td>Annuity for a granted design patent (1st-3rd year)</td>\n      <td>NT$800</td>\n     </tr>\n     <tr>\n      <td>27</td>\n      <td>A patentee who is a natural person, a school, or a small and medium-sized enterprise may request annuity<br>\n        reduction of a design patent in the amount of NT$800 for the 1st-3rd year, cutting the annuity down to NT$0</td>\n      <td>NT$0</td>\n     </tr>\n     <tr>\n      <td>28</td>\n      <td>Annuity for a granted design patent (4th-6th year)</td>\n      <td>NT$2,000</td>\n     </tr>\n     <tr>\n      <td>29</td>\n      <td>A patentee who is a natural person, a school, or a small and medium-sized enterprise may request annuity<br>\n        reduction of a design patent in the amount of NT$1,200 for the 4th-6th year, cutting the annuity down to NT$800</td>\n      <td>NT$800</td>\n     </tr>\n     <tr>\n      <td>30</td>\n      <td>Annuity for a granted design patent (7th year and beyond)</td>\n      <td>NT$3,000</td>\n     </tr>\n     <tr>\n      <td>31</td>\n      <td>(1) A patent certificate<br>\n        (2) A certified copy of a document</td>\n      <td>NT$1,000</td>\n     </tr>\n     <tr>\n      <td>32</td>\n      <td>Re-issuance or replacement of a patent certificate</td>\n      <td>NT$600</td>\n     </tr>\n     <tr>\n      <td>33</td>\n      <td>Issuance, re-issuance, or replacement of a patent attorney license</td>\n      <td>NT$1,500</td>\n     </tr>\n     <tr>\n      <td>34</td>\n      <td>Issuance, re-issuance, or replacement of a patent agent license</td>\n      <td>NT$1,500</td>\n     </tr>\n    </tbody>\n   </table>\n   <p>&nbsp;</p>\n   <div class=\"file_download\">\n    <h3>Download File</h3>\n    <ul>\n     <li><span class=\"file_name\">Schedule of Patent Fees</span> <span class=\"file_pdf\"><a href=\"/wSite/public/Attachment/007/f1743990952940.pdf\" title=\"Schedule of Patent Fees(PDF、Download File)\">PDF</a>70.24KB，Download&nbsp;2428&nbsp;times</span></li>\n    </ul>\n   </div>\n   <div class=\"bottomInfo\">\n    <ul>\n     <li>Publish Date：2016/08/22</li>\n     <li>Update： 2025/04/07</li>\n     <li>Organization：International &amp; Legal Affairs Office</li>\n     <li>Views：14351</li>\n    </ul>\n   </div>\n  </section>\n </div>\n</div><section class=\"fatfooter\">\n <div class=\"container\">\n  <button type=\"button\" name=\"展開選單/OPEN\" aria-label=\"導覽選單展開/收合\" class=\"btn btn-fatfooter\">收合</button>\n  <div class=\"topicSite\">\n   <div class=\"blockTitle\">\n    Subject Website\n   </div>\n   <ul>\n    <li><a href=\"/en/tipo2/324.html\" title=\"(Open in a new window)\" target=\"_blank\" rel=\"noopener noreferrer\">Patents</a></li>\n    <li><a href=\"/en/tipo2/339.html\" title=\"(Open in a new window)\" target=\"_blank\" rel=\"noopener noreferrer\">Trademarks</a></li>\n    <li><a href=\"/en/tipo2/346.html\" title=\"(Open in a new window)\" target=\"_blank\" rel=\"noopener noreferrer\"> Copyright</a></li>\n    <li><a href=\"/en/tipo2/350.html\" title=\"(Open in a new window)\" target=\"_blank\" rel=\"noopener noreferrer\">Trade Secrets</a></li>\n   </ul>\n  </div>\n  <div class=\"slideArea\">\n   <div class=\"leftBlock\">\n    <div class=\"subscribe\">\n     <div class=\"blockTitle\">\n      ePaper Subscription\n     </div>\n     <p>Subscribe to TIPO's monthly ePaper for the latest IP news</p><a href=\"/en/tipo2/360.html\" class=\"btn\" title=\"\">Subscribe</a>\n    </div>\n    <div class=\"serviceGrp\">\n     <a href=\"/en/tipo2/sitemap.html\" title=\"\"><img src=\"/wSite/public/Attachment/0/f1740463943593.svg\" alt=\"\">Sitemap</a> <a href=\"/en/tipo2/372-3214.html\" title=\"\"><img src=\"/wSite/public/Attachment/0/f1740463943771.svg\" alt=\"\">Mail</a> <a href=\"/en/tipo2/391.html\" title=\"\"><img src=\"/wSite/public/Attachment/0/f1740463943724.svg\" alt=\"\">FAQs</a>\n    </div>\n   </div>\n   <nav