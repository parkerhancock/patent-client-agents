            Issue date: 07/19/2022
            Filing date: 07/29/2020
            
            This is an electronic decision on the petition under 37 CFR 1.378(b), filed October 18, 2026 to accept
            unintentional delayed payment of the 3.5 year maintenance fee for the above-identified patent.
            
            The petition is GRANTED.
            
            The maintenance fee is accepted, and the above-identified patent reinstated as of October 18, 2026. This
            decision also constitutes notice that the fee has been accepted. An electronic copy of the petition and this
            decision has been created as an entry in the Image File Wrapper. Nevertheless, petitions should print and retain
            an independent copy.
            
            Telephone inquiries concerning this decision should be directed to the Patent Electronic Business Center (EBC)
            at 866-217-9197.
            
