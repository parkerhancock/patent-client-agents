      content: "<!DOCTYPE html>\r\n\t<html lang=\"en\">\r\n  <head>\r\n    <meta name=\"viewport\" content=\"width=device-width\" />\r\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge,chrome=1\" />\r\n    <meta http-equiv=\"cache-control\" content=\"no-cache, no-store, must-revalidate, private\" />\r\n    <meta http-equiv=\"pragma\" content=\"no-cache\" />\r\n<meta charset=\"utf-8\"/>\r\n<title>Intellectual Property Department - Forms and fees</title>\r\n\r\n<meta name=\"keywords\" content=\"\" />\r\n<meta name=\"description\" content=\"\" />\r\n<script type=\"text/javascript\"><!--\r\nvar zmsSectionInfoFile = \"/filemanager/ipd/en/content_97/_sec_info_97.xml\";\r\nvar zmsSectionImage = \"/filemanager/ipd/en/content_97/_sec_main-vis-Designs.jpg\";\r\nvar zmsCharsetID = 1;\r\nvar zmsCurrentContentId = 108;\r\nvar zmsParentContentId = \"97,\";\r\n//--></script>\r\n<script type='text/javascript'>\r\n// <![CDATA[\r\nvar complyWCAG = null;\r\nvar nonComplyWCAGContentUrl = ''; // Default\r\n// ]]>\r\n</script>\r\n<script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/template2.js\"></script>\r\n    <script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/breadcrumbdata_0.js\"></script>\r\n    <script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/breadcrumbdata_1.js\"></script>\r\n    <script type=\"text/javascript\"><!--\r\n      var zmsBreadcrumbParentList = [1,97,108];\r\n    //--></script>\r\n    <script type=\"text/javascript\"><!--\r\n      var reviewDateExists = false;\r\n      var revisionDateExists = true;\r\n      var revisionDate_Year = 2025;\r\n      var revisionDate_Month = 11;\r\n      var revisionDate_Day = 5;\r\n    //--></script>\r\n    \r\n  </head>\r\n  <body>\r\n    <script type=\"text/javascript\"><!--\r\n      var url = location.href;\r\n      if (url.indexOf(\"?print=1\")==-1 && url.indexOf(\"&print=1\")==-1) {\r\n        ShowHeader();\r\n      }else{\r\n        ShowPrintHeader();\r\n      }\r\n    //--></script>\r\n    <!-- CONTENT START --><p>Design applications can be filed electronically via our <a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/\" target=\"_blank\" rel=\"noopener noreferrer\">E-filing System</a> 24 hours a day from Monday to Sunday. <a href=\"/en/home/forms-and-fees/e-filing/index.html\" class=\"generalBtn\" data-fancybox=\"\" data-type=\"iframe\">Read more</a></p>\r\n<p>Design applications can also be sent to \"<em>Designs Registry, Intellectual Property Department, 24/F, Wu Chung House, 213 Queen's Road East, Wanchai, Hong Kong</em>\" by post or in person during the business hours <em>9:00 a.m. - 5:45 p.m. (Monday to Friday)</em>. <a href=\"/en/home/forms-and-fees/paper-filing/index.html\" class=\"generalBtn\" data-fancybox=\"\" data-type=\"iframe\">Read more</a></p>\r\n<p><strong>Do not attempt to modify the forms, as doing so will result in an invalid form which cannot be accepted by the Registry.</strong></p>\r\n<p>Please pay the prescribed fee, if applicable, on submission of the form. We do NOT accept cash delivery (i.e. cash sent through mail). <a href=\"/en/designs/faqs/index.html#ac25\" class=\"generalBtn\">Read more</a></p>\r\n<p></p>\r\n<p><b>Important Reminder: Applicants and their employees or agents must not offer an advantage as defined in the Prevention of Bribery Ordinance (Cap. 201) to any government officer in connection with their applications or while having dealings of any kind with government departments.</b></p>\r\n<div class=\"accordion-wrap trade-mark\">\r\n<div class=\"accordion-control-wrap clearfix\"><a class=\"a-control-btn expandBtn\" href=\"javascript:;\">Expand All</a> <a class=\"a-control-btn collaspeBtn\" href=\"javascript:;\">Collapse All</a></div>\r\n<div class=\"accordion\" id=\"d1\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n1\" aria-expanded=\"false\" id=\"accordion-control-n1\">Form D1<br /><span class=\"smallerTxt\">Application for registration of design(s)</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n1\" aria-labelledby=\"accordion-control-n1\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th colspan=\"2\" style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td colspan=\"3\"><strong>Filing fee</strong></td>\r\n</tr>\r\n<tr>\r\n<td width=\"76%\">&nbsp;</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">E-filing</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">Paper-filing</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td>1 design for articles not forming a set of articles<br /> (For each article to which the design is to be applied)</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$235</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$315</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td>1 design for 1 set of articles</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$470</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$630</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td colspan=\"3\">2 or more designs for articles not forming a set of articles (only applicable to same class of articles, please refer to <a href=\"/en/designs/apply-for-a-registered-design/how-to-classify-my-articles/index.html\">How to classify my articles</a>&nbsp;)</td>\r\n</tr>\r\n<tr>\r\n<td>For the first article to which the first design is to be applied</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$235</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$315</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td>For each other article to which any of the designs is to be applied</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$175</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$235</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td colspan=\"3\">2 or more designs for articles forming a set of articles (only applicable to same class of articles, please refer to <a href=\"/en/designs/apply-for-a-registered-design/how-to-classify-my-articles/index.html\">How to classify my articles</a>&nbsp;)</td>\r\n</tr>\r\n<tr>\r\n<td>For the first design</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$470</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$630</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td>For each other design</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$355</div>\r\n</td>\r\n<td width=\"12%\">\r\n<div align=\"center\">$470</div>\r\n</td>\r\n</tr>\r\n<tr>\r\n<td colspan=\"3\"><strong>Advertisement fee</strong></td>\r\n</tr>\r\n<tr>\r\n<td>For advertisement in the official journal of the registration of a design (per design)</td>\r\n<td colspan=\"2\">\r\n<div align=\"center\">$62</div>\r\n</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<center></center>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User with Full e-Service Account only)</a><a href=\"/en/designs/forms-and-fees/form-d1/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn paper-btn\">Paper-filing Only</a></div>\r\n<p class=\"t_center\"><a href=\"/filemanager/ipd/en/content_108/sample_d1_english.pdf\">D1 Sample (with explanatory notes)&nbsp;</a><br /><a href=\"/filemanager/ipd/common/Electronic%20Certificates_English.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Certificate of Registration</a></p>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d2\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n2\" aria-expanded=\"false\" id=\"accordion-control-n2\">Form D2<br /><span class=\"smallerTxt\">(i) Request for amendment of application<br />(ii) Correction of error in the register or in filed documents</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n2\" aria-labelledby=\"accordion-control-n2\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request for amendment of application (other than alteration of name, address, address for service or agent&rsquo;s address)</td>\r\n<td style=\"text-align: center;\">$135</td>\r\n</tr>\r\n<tr>\r\n<td>Correction of error in the register or in filed documents (other than correction of address, address for service or agent&rsquo;s address)</td>\r\n<td style=\"text-align: center;\">$135</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d2_english.pdf\" target=\"_blank\" class=\"generalBtn paper-btn\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d3\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n3\" aria-expanded=\"false\" id=\"accordion-control-n3\">Form D3<br /><span class=\"smallerTxt\">Request for reinstatement of application</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n3\" aria-labelledby=\"accordion-control-n3\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request for reinstatement of application</td>\r\n<td style=\"text-align: center;\">$195</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d3_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d4\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n4\" aria-expanded=\"false\" id=\"accordion-control-n4\">Form D4<br /><span class=\"smallerTxt\">Application for extension of time</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n4\" aria-labelledby=\"accordion-control-n4\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Application for extension of time</td>\r\n<td style=\"text-align: center;\">$310</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d4_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d5\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n5\" aria-expanded=\"false\" id=\"accordion-control-n5\">Form D5<br /><span class=\"smallerTxt\">(i) Application to register particulars of transactions affecting rights in registered designs<br />(ii) Notice of transactions affecting rights in applications<br />(iii) Application to cancel claim to be mortgagee or licensee</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n5\" aria-labelledby=\"accordion-control-n5\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Application to register particulars of transactions affecting rights in registered designs</td>\r\n<td style=\"text-align: center;\">$470</td>\r\n</tr>\r\n<tr>\r\n<td>Notice of transactions affecting rights in applications</td>\r\n<td style=\"text-align: center;\">$470</td>\r\n</tr>\r\n<tr>\r\n<td>Application to cancel claim to be mortgagee or licensee</td>\r\n<td style=\"text-align: center;\">Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User with Full e-Service Account only)</a><a href=\"/en/designs/forms-and-fees/form-d5/index.html\" class=\"generalBtn paper-btn\" data-fancybox=\"\" data-type=\"iframe\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d6\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n6\" aria-expanded=\"false\" id=\"accordion-control-n6\">Form D6<br /><span class=\"smallerTxt\">Application to the Registrar to revoke registration</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n6\" aria-labelledby=\"accordion-control-n6\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Application to the Registrar to revoke registration</td>\r\n<td style=\"text-align: center;\">$275</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><!--a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a--><a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn e-fill-btn\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d6_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a><!--a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn e-fill-btn\">E-filing (Registered User only) 2</a--></div>\r\n<!-- <p class=\"t_center\">**via Web-Form GE for uploading**<br /><br /><a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\">Details</a></p> --></div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d7\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n7\" aria-expanded=\"false\" id=\"accordion-control-n7\">Form D7<br /><span class=\"smallerTxt\">Filing of order, declaration or certificate of the court for revocation of registration or rectification of the register</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n7\" aria-labelledby=\"accordion-control-n7\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Filing of order, declaration or certificate of the court for revocation of registration or rectification of the register</td>\r\n<td style=\"text-align: center;\">Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn e-fill-btn\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d7_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a><!--a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn web-upload-btn\">Via Web-Form GE for uploading</a--></div>\r\n<!-- <p class=\"t_center\">**via Web-Form GE for uploading**<br /><br /><a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\">Details</a></p> --></div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d8\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n8\" aria-expanded=\"false\" id=\"accordion-control-n8\">Form D8<br /><span class=\"smallerTxt\">Notice to surrender registration</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n8\" aria-labelledby=\"accordion-control-n8\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Notice to surrender registration</td>\r\n<td style=\"text-align: center;\">Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User with Full e-Service Account only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d8_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d9\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n9\" aria-expanded=\"false\" id=\"accordion-control-n9\">Form D9<br /><span class=\"smallerTxt\">Filing of notice of intention to oppose, notice of opposition or counter-statement</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n9\" aria-labelledby=\"accordion-control-n9\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Filing of notice of intention to oppose</td>\r\n<td style=\"text-align: center;\">Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Filing of notice of opposition or counter-statement</td>\r\n<td style=\"text-align: center;\">$470</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn e-fill-btn\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/ds/d9_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a><!--a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn web-upload-btn\">Via Web-Form GE for uploading</a--></div>\r\n<!-- <p class=\"t_center\">**via Web-Form GE for uploading**<br /><br /><a href=\"/en/designs/forms-and-fees/web-form-ge/index.html\" data-fancybox=\"\" data-type=\"iframe\">Details</a></p> --></div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"d10\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n10\" aria-expanded=\"false\" id=\"accordion-control-n10\">Form D10<br /><span class=\"smallerTxt\">(i) Application for certified copies or extracts<br />(ii) Application for copies or extracts<br />(iii) Request for information<br />(iv) Request for inspection of document or register<br />(v) Request for certificate signed by the Registrar of Designs</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n10\" aria-labelledby=\"accordion-control-n10\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 76%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 24%; text-align: center;\">Fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Application for certified copies or extracts</td>\r\n<td style=\"text-align: center;\">$135</td>\r\n</tr>\r\n<tr>\r\n<td>Application for copies or extracts</td>\r\n<td style=\"text-align: center;\">$5 per page</td>\r\n</tr>\r\n<tr>\r\n<td>Request for information</td>\r\n<td style=\"text-align: center;\">Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request for inspection of document or register</td>\r\n<td style=\"text-align: center;\">Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request for certificate signed by the Registrar of Designs</td>\r\n<td style=\"text-align: center;\">$135</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filem