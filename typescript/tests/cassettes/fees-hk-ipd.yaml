 class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n16\" aria-labelledby=\"accordion-control-n16\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request for copy</td>\r\n<td>$6 per page</td>\r\n<td>Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request for certified copy</td>\r\n<td>$150 per certified copy</td>\r\n<td>Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request for certificate under section 79(2)</td>\r\n<td>$200 per copy</td>\r\n<td>Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t14_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"as\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n17\" aria-expanded=\"false\" id=\"accordion-control-n17\">Additional sheet for trade mark forms</a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n17\" aria-labelledby=\"accordion-control-n17\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Trade mark additional sheet</td>\r\n<td>Nil</td>\r\n<td>Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"/filemanager/ipd/en/share/forms_fees/Additional_sheet_eng.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n</div>\r\n<hr />\r\n<h2 id=\"cap43\">Trade marks forms and fees (Cap.43)</h2>\r\n<div>\r\n<p>If you wish to obtain a relevant form for Trade Marks Ordinance (Cap.43), please call our public enquiry hotline at 2961 6901 or write to us by fax (fax no. : 2893 3642) or at <a href=\"mailto:enquiry@ipd.gov.hk\">enquiry@ipd.gov.hk</a>. We will revert to you as soon as possible.</p>\r\n<p>You may also make the request via our public counter at <em>24/F, Wu Chung House, 213 Queen&rsquo;s Road East, Wanchai, Hong Kong</em> in the following office hours:</p>\r\n<p><em>Monday to Friday: 9:00 a.m. to 5:45 p.m.</em></p>\r\n<p>Please note that trade mark forms must be filed to the Trade Marks Registry by hand or by post.</p>\r\n<p>Personal data collected by the Registrar of Trade Marks in the forms delivered to the Registrar will be used for the purposes set out in the <a href=\"/en/privacy-policy-statement/personal-information-collection-statement/index.html\">Personal Information Collection Statement</a>.</p>\r\n</div>\r\n<div id=\"gtx-trans\" style=\"position: absolute; left: 553px; top: 1705.98px;\">\r\n<div class=\"gtx-trans-icon\"></div>\r\n</div>    <!-- CONTENT END -->\r\n    <script type=\"text/javascript\"><!--\r\n      if (url.indexOf(\"?print=1\")==-1 && url.indexOf(\"&print=1\")==-1) {\r\n        ShowFooter();\r\n      }else{\r\n        ShowPrintFooter();\r\n        window.print();\r\n      }\r\n    //--></script>\r\n    <div id=\"div_generated_pagename\" style=\"display:none;\">Forms and fees</div>\r\n    <script type=\"text/javascript\"><!--\r\n      function setTemplateVariables(){\r\n        var targetdiv, sourcediv;\r\n        targetdiv =