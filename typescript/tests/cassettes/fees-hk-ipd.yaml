      content: "<!DOCTYPE html>\r\n\t<html lang=\"en\">\r\n  <head>\r\n    <meta name=\"viewport\" content=\"width=device-width\" />\r\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge,chrome=1\" />\r\n    <meta http-equiv=\"cache-control\" content=\"no-cache, no-store, must-revalidate, private\" />\r\n    <meta http-equiv=\"pragma\" content=\"no-cache\" />\r\n<meta charset=\"utf-8\"/>\r\n<title>Intellectual Property Department - Forms and fees</title>\r\n\r\n<meta name=\"keywords\" content=\"\" />\r\n<meta name=\"description\" content=\"\" />\r\n<script type=\"text/javascript\"><!--\r\nvar zmsSectionInfoFile = \"/filemanager/ipd/en/content_69/_sec_info_69.xml\";\r\nvar zmsSectionImage = \"/filemanager/ipd/en/content_69/_sec_main-vis-Patents.jpg\";\r\nvar zmsCharsetID = 1;\r\nvar zmsCurrentContentId = 81;\r\nvar zmsParentContentId = \"69,\";\r\n//--></script>\r\n<script type='text/javascript'>\r\n// <![CDATA[\r\nvar complyWCAG = null;\r\nvar nonComplyWCAGContentUrl = ''; // Default\r\n// ]]>\r\n</script>\r\n<script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/template2.js\"></script>\r\n    <script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/breadcrumbdata_0.js\"></script>\r\n    <script type=\"text/javascript\"><!--\r\n      var zmsBreadcrumbParentList = [1,69,81];\r\n    //--></script>\r\n    <script type=\"text/javascript\"><!--\r\n      var reviewDateExists = false;\r\n      var revisionDateExists = true;\r\n      var revisionDate_Year = 2026;\r\n      var revisionDate_Month = 8;\r\n      var revisionDate_Day = 3;\r\n    //--></script>\r\n    \r\n  </head>\r\n  <body>\r\n    <script type=\"text/javascript\"><!--\r\n      var url = location.href;\r\n      if (url.indexOf(\"?print=1\")==-1 && url.indexOf(\"&print=1\")==-1) {\r\n        ShowHeader();\r\n      }else{\r\n        ShowPrintHeader();\r\n      }\r\n    //--></script>\r\n    <!-- CONTENT START --><p>Patent applications can be filed electronically via our <a href=\"https://efiling.ipd.gov.hk\" target=\"_blank\" rel=\"noopener noreferrer\">E-filing System</a> 24 hours a day from Monday to Sunday. <a href=\"/en/home/forms-and-fees/e-filing/index.html\" class=\"generalBtn\" data-fancybox=\"\" data-type=\"iframe\">Read more</a></p>\r\n<p>Patent applications can also be sent to &ldquo;<em>Patents Registry, Intellectual Property Department, 24/F, Wu Chung House, 213 Queen's Road East, Wanchai, Hong Kong</em>&rdquo; by post or in person during the business hours <em>9:00 a.m. - 5:45 p.m. (Monday to Friday)</em>. <a href=\"/en/home/forms-and-fees/paper-filing/index.html\" class=\"generalBtn\" data-fancybox=\"\" data-type=\"iframe\">Read more</a></p>\r\n<p>A request to record or a request for registration and grant in respect of a standard patent (R) application can be sent to us by fax (fax no.: (852) 2838 6315 / (852) 2574 4345) 24 hours a day from Monday to Friday.</p>\r\n<p><strong>Do not attempt to modify the forms, as doing so will result in an invalid form which cannot be accepted by the Registry.</strong></p>\r\n<p>Please pay the prescribed fee, if applicable, on submission of the form. We do NOT accept cash delivery (i.e. cash sent through mail). <a href=\"/en/patents/faqs/general/index.html#ac16\" class=\"generalBtn\">Read more</a></p>\r\n<p></p>\r\n<p><b>Important Reminder: Applicants and their employees or agents must not offer an advantage as defined in the Prevention of Bribery Ordinance (Cap. 201) to any government officer in connection with their applications or while having dealings of any kind with government departments.</b></p>\r\n<!--p>Please download the forms to local folder of your computer before editing. (Details please click <a href=\"/filemanager/ipd/en/share/forms_fees/DownloadGuide.pdf\" target=\"_blank\" aria-label=\"Please click here to download the form download guide\" rel=\"noopener noreferrer\">here</a>)</p-->\r\n<div class=\"accordion-wrap trade-mark\">\r\n<div class=\"accordion-control-wrap clear