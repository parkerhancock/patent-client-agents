      content: "<!DOCTYPE html>\r\n\t<html lang=\"en\">\r\n  <head>\r\n    <meta name=\"viewport\" content=\"width=device-width\" />\r\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge,chrome=1\" />\r\n    <meta http-equiv=\"cache-control\" content=\"no-cache, no-store, must-revalidate, private\" />\r\n    <meta http-equiv=\"pragma\" content=\"no-cache\" />\r\n<meta charset=\"utf-8\"/>\r\n<title>Intellectual Property Department - Forms and fees</title>\r\n\r\n<meta name=\"keywords\" content=\"\" />\r\n<meta name=\"description\" content=\"\" />\r\n<script type=\"text/javascript\"><!--\r\nvar zmsSectionInfoFile = \"/filemanager/ipd/en/content_36/_sec_info_36.xml\";\r\nvar zmsSectionImage = \"/filemanager/ipd/en/content_36/_sec_main-vis-TradeMarks.jpg\";\r\nvar zmsCharsetID = 1;\r\nvar zmsCurrentContentId = 47;\r\nvar zmsParentContentId = \"36,\";\r\n//--></script>\r\n<script type='text/javascript'>\r\n// <![CDATA[\r\nvar complyWCAG = null;\r\nvar nonComplyWCAGContentUrl = ''; // Default\r\n// ]]>\r\n</script>\r\n<script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/template2.js\"></script>\r\n    <script type=\"text/javascript\" src=\"/filemanager/ipd/system/en/js/breadcrumbdata_0.js\"></script>\r\n    <script type=\"text/javascript\"><!--\r\n      var zmsBreadcrumbParentList = [1,36,47];\r\n    //--></script>\r\n    <script type=\"text/javascript\"><!--\r\n      var reviewDateExists = false;\r\n      var revisionDateExists = true;\r\n      var revisionDate_Year = 2025;\r\n      var revisionDate_Month = 11;\r\n      var revisionDate_Day = 14;\r\n    //--></script>\r\n    \r\n  </head>\r\n  <body>\r\n    <script type=\"text/javascript\"><!--\r\n      var url = location.href;\r\n      if (url.indexOf(\"?print=1\")==-1 && url.indexOf(\"&print=1\")==-1) {\r\n        ShowHeader();\r\n      }else{\r\n        ShowPrintHeader();\r\n      }\r\n    //--></script>\r\n    <!-- CONTENT START --><h2>Trade marks forms and fees (Cap.559)</h2>\r\n<p>Trade mark applications can be filed electronically via our <a href=\"https://efiling.ipd.gov.hk/\" target=\"_blank\" rel=\"noopener noreferrer\">E-filing System</a> 24 hours a day from Monday to Sunday. <a href=\"/en/home/forms-and-fees/e-filing/index.html\" class=\"generalBtn\" data-fancybox=\"\" data-type=\"iframe\">Read more</a></p>\r\n<p>Trade mark applications can also be sent to \"<em>Trade Marks Registry, Intellectual Property Department, 24/F, Wu Chung House, 213 Queen's Road East, Wanchai, Hong Kong</em>\" by post or in person during the business hours <em>9:00 a.m. - 5:45 p.m. (Monday to Friday)</em>. <a href=\"/en/home/forms-and-fees/paper-filing/index.html\" class=\"generalBtn\" data-fancybox=\"\" data-type=\"iframe\">Read more</a></p>\r\n<p><strong>Do not attempt to modify the forms, as doing so will result in an invalid form which cannot be accepted by the Registry.</strong></p>\r\n<p>Please pay the prescribed fee, if applicable, on submission of the form. We do NOT accept cash delivery (i.e. cash sent through mail). <a href=\"/en/trade-marks/faqs/trade-marks-ordinance/index.html#a20\" class=\"generalBtn\">Read more</a></p>\r\n<p></p>\r\n<p><b>Important Reminder: Applicants and their employees or agents must not offer an advantage as defined in the Prevention of Bribery Ordinance (Cap. 201) to any government officer in connection with their applications or while having dealings of any kind with government departments.</b></p>\r\n<div class=\"accordion-wrap trade-mark\">\r\n<div class=\"accordion-control-wrap clearfix\"><a class=\"a-control-btn expandBtn\" href=\"javascript:;\">Expand All</a> <a class=\"a-control-btn collaspeBtn\" href=\"javascript:;\">Collapse All</a></div>\r\n<div class=\"accordion\" id=\"t1\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n1\" aria-expanded=\"false\" id=\"accordion-control-n1\">Form T1<br /><span class=\"smallerTxt\">Request for preliminary advice</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n1\" aria-labelledby=\"accordion-control-n1\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Preliminary advice on registrability under section 11 of the Trade Marks Ordinance</td>\r\n<td>$400</td>\r\n<td rowspan=\"2\">$200 per additional class</td>\r\n</tr>\r\n<tr>\r\n<td>Search of records &ndash; Preliminary advice on section 12 of the Trade Marks Ordinance</td>\r\n<td>$400</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/en/trade-marks/forms-and-fees/form-t1/index.html\" class=\"generalBtn paper-btn\" data-fancybox=\"\" data-type=\"iframe\">Paper-filing Only</a></div>\r\n<p class=\"t_center\"><a href=\"/filemanager/ipd/common/trade-marks/T1_English_Sample.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">T1 sample</a><br /><a href=\"/en/trade-marks/apply-for-a-trade-mark/commonly-used-description/index.html\">Commonly used descriptions of goods and services and their class numbers</a></p>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t2\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n2\" aria-expanded=\"false\" id=\"accordion-control-n2\">Form T2<br /><span class=\"smallerTxt\">Application for registration of a trade mark</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n2\" aria-labelledby=\"accordion-control-n2\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Application for registration of a trade mark (including certification mark and collective mark)</td>\r\n<td>$2,000</td>\r\n<td>$1,000 per additional class</td>\r\n</tr>\r\n<tr>\r\n<td>Application for registration of a series of trade mark</td>\r\n<td>$2,000</td>\r\n<td>$1,000 per additional class</td>\r\n</tr>\r\n<tr>\r\n<td>Application for registration of a defensive trade mark</td>\r\n<td>$2,300</td>\r\n<td>$1,150 per additional class</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n</div>\r\n<div class=\"inner\">\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/en/trade-marks/forms-and-fees/form-t2/index.html\" data-fancybox=\"\" data-type=\"iframe\" class=\"generalBtn paper-btn\">Paper-filing Only</a></div>\r\n<p class=\"t_center\"><a href=\"/filemanager/ipd/common/trade-marks/T2_English_Sample.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">T2 sample</a><br /><a href=\"/en/trade-marks/forms-and-fees/notes-tm-form-t2/index.html\">Explanatory notes on Trade Mark Form T2</a><!--br />Your attention is drawn to the &ldquo;<a href=\"/en/trade-marks/apply-for-a-trade-mark/common-deficiencies-and-irregularities/index.html\">Common deficiencies and irregularities of trade mark applications</a>&rdquo; before completing the Form T2.--><br /><a href=\"/en/trade-marks/apply-for-a-trade-mark/commonly-used-description/index.html\">Commonly used descriptions of goods or services and their class numbers</a>&nbsp;<br /><a href=\"/filemanager/ipd/common/Electronic%20Certificates_English.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Certificate of Registration</a></p>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t3\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n3\" aria-expanded=\"false\" id=\"accordion-control-n3\">Form T3<br /><span class=\"smallerTxt\">Request to divide application for registration</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n3\" aria-labelledby=\"accordion-control-n3\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request to divide application for registration (divide the specification of goods / services)</td>\r\n<td>$650</td>\r\n<td>Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request to divide application for registration (divide a series of marks)</td>\r\n<td>$650</td>\r\n<td>$2,000 for the first class and $1,000 for each additional class in respect of each additional application</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t3_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t4\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n4\" aria-expanded=\"false\" id=\"accordion-control-n4\">Form T4<br /><span class=\"smallerTxt\">(i) Request to merge applications for registration<br />(ii) Request to merge separate registrations</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n4\" aria-labelledby=\"accordion-control-n4\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request to merge applications for registration</td>\r\n<td rowspan=\"2\">Nil</td>\r\n<td rowspan=\"2\">Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request to merge separate registrations</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t4_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t5\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n5\" aria-expanded=\"false\" id=\"accordion-control-n5\">Form T5<br /><span class=\"smallerTxt\">Request to change name, address, address for service and/or agent&rsquo;s details</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n5\" aria-labelledby=\"accordion-control-n5\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request to change name, address, address for service or agent's details</td>\r\n<td>Nil</td>\r\n<td>Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t5_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t5a\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n6\" aria-expanded=\"false\" id=\"accordion-control-n6\">Form T5A<br /><span class=\"smallerTxt\">Request to amend application</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n6\" aria-labelledby=\"accordion-control-n6\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request to amend application</td>\r\n<td>Nil</td>\r\n<td>$1,000 per additional class for amendment of specification</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t5a_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t5b\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n7\" aria-expanded=\"false\" id=\"accordion-control-n7\">Form T5B<br /><span class=\"smallerTxt\">(i) Request to amend representation of trade mark<br />(ii) Request to delete trade mark in series</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n7\" aria-labelledby=\"accordion-control-n7\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request to amend representation of trade mark</td>\r\n<td rowspan=\"2\">Nil</td>\r\n<td rowspan=\"2\">Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Request to delete trade mark in series</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t5b_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t6\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n8\" aria-expanded=\"false\" id=\"accordion-control-n8\">Form T6<br /><span class=\"smallerTxt\">(i) Notice of opposition/objection<br />(ii) Application for revocation, declaration of invalidity, variation of a trade mark registration, or rectification of an error or omission in the register<br />(iii) Application for intervention in proceedings for revocation, declaration of invalidity, variation or rectification</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n8\" aria-labelledby=\"accordion-control-n8\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Notice of opposition/objection</td>\r\n<td rowspan=\"3\">$800</td>\r\n<td rowspan=\"3\">Nil</td>\r\n</tr>\r\n<tr>\r\n<td>Application for revocation, declaration of invalidity, variation of a trade mark registration or rectification of an error or omission in the register</td>\r\n</tr>\r\n<tr>\r\n<td>Application for intervention in proceedings for revocation, declaration of invalidity, variation or rectification</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t6_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t7\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n9\" aria-expanded=\"false\" id=\"accordion-control-n9\">Form T7<br /><span class=\"smallerTxt\">Counter-statement</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n9\" aria-labelledby=\"accordion-control-n9\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Counter-statement</td>\r\n<td>Nil</td>\r\n<td>Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t7_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t8\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n10\" aria-expanded=\"false\" id=\"accordion-control-n10\">Form T8<br /><span class=\"smallerTxt\">(i) Request for renewal of a trade mark registration<br />(ii) Request for restoration and renewal of a trade mark registration</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n10\" aria-labelledby=\"accordion-control-n10\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Request for renewal of a trade mark registration</td>\r\n<td>$2,670<br />(Late renewal charge: $500)</td>\r\n<td>$1,340 per additional class</td>\r\n</tr>\r\n<tr>\r\n<td>Request for restoration and renewal of a trade mark registration</td>\r\n<td>$4,000</td>\r\n<td>$1,340 per additional class</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (One-Time filer &amp; Registered User)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t8_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t9\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n11\" aria-expanded=\"false\" id=\"accordion-control-n11\">Form T9<br /><span class=\"smallerTxt\">Surrender of registered trade mark</span></a>\r\n<div class=\"accordion-content\" aria-hidden=\"true\" id=\"accordion-content-n11\" aria-labelledby=\"accordion-control-n11\">\r\n<div class=\"inner\">\r\n<div class=\"tbl-wrap\">\r\n<table class=\"colspanTable\">\r\n<thead>\r\n<tr>\r\n<th style=\"width: 60%; text-align: center;\">Descriptions</th>\r\n<th style=\"width: 20%; text-align: center;\">Fee (HKD)</th>\r\n<th style=\"width: 20%; text-align: center;\">Additional fee (HKD)</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<td>Surrender of registered mark</td>\r\n<td>Nil</td>\r\n<td>Nil</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div>\r\n<div class=\"btnWrap t_center\"><a href=\"https://efiling.ipd.gov.hk/nis-efiling/home/home.action#/home\" target=\"_blank\" class=\"generalBtn e-fill-btn\" rel=\"noopener noreferrer\">E-filing (Registered User with Full e-Service Account only)</a><a href=\"/filemanager/ipd/en/share/forms_fees/tm/t9_english.pdf\" class=\"generalBtn paper-btn\" target=\"_blank\" rel=\"noopener noreferrer\">Paper-filing Only</a></div>\r\n</div>\r\n</div>\r\n</div>\r\n<div class=\"accordion\" id=\"t10\"><a href=\"javascript:;\" class=\"accordion-btn\" role=\"button\" aria-controls=\"accordion-content-n12\" aria-expanded=\"false\" id=\"accordion-control-n12\">Form T10<br /><span class=\"smallerTxt\">(i) Application or notice to register registrable transaction (other 