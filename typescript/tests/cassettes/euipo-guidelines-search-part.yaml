            - Id: ish_2319054-2066608-16
              Content: "4.2.3.6 Verification of the evidence                   4.2.3.6 Verification of the evidence                                    The Office verifies that the trade mark particulars claimed in the notice of opposition are reflected in the evidence submitted, as an official document originating from the competent registration authority, or in the evidence accessible online            from a source recognised by the Office if the opponent relied on that.                                    The following details of the evidence will be checked\_(1):                                                            the issuing authority;                                    the filing [210] and/or registration numbers [111] (in certain countries these are, or were, different);                                    the territorial extent for international registrations (i.e. in which countries the mark is protected and for what goods and               services);                                                the filing [220], priority [300] and registration dates [151] (in certain countries, e.g. France, the filing and registration               dates found on the certificate are the same);                                                the representation of the sign [531, 540, 541, 546, 554, 556, 557, 571, 591].                                                            If the earlier mark is in colour, the opponent must submit evidence originating from an official source that contains a reproduction            of the mark in colour.                                    If the opponent has indicated in the notice of opposition that the earlier mark is in colour, but submits evidence showing            a black and white representation of the mark, the opposition based on that earlier right will be rejected as not substantiated            (25/10/2018, T‑359/17, ALDI / ALDO (fig.), EU:T:2018:720, §\_45; 04/06/2019, C‑822/18\_P, ALDI / ALDO (fig.), EU:C:2019:466, appeal dismissed; 27/03/2019, T‑265/18, Formata (fig.) / Formata (fig.) et al., EU:T:2019:197, §\_48-53).                                    The only exception is where a colour representation of the mark is not available in official publications of the competent registration authority            because, at the relevant point in time, that authority was not yet publishing marks in colour. This is typically the case            where the official online evidence contains a black and white representation of the mark accompanied by a colour claim indicating            the colours in words. In such a case, notwithstanding the black and white representation of the mark, it will be accepted            as proof of a mark in colour as long as the colour indications (available in or translated into the language of proceedings)            correspond to the colours of the mark indicated in the notice of opposition. In the rare situation where the official online            evidence contains a black and white representation of the mark accompanied by a colour claim in general terms (e.g. ‘colours            claimed’) but no indication of the colours in words, this will also be accepted (so long as this claim is available in or            translated into the language of proceedings).                                    The above exception does not cover the situation where what is available in official publications of the relevant registration            authority is not a colour representation as such, but a representation that includes the colours in words and their distribution within the mark (e.g. by using arrows that clearly indicate to which element of the mark the specific colour applies). Such a representation,            even if technically black and white, will be considered a ‘colour representation’, and the opponent is required to provide            a translation of the colour indications into the language of proceedings. The indication of generally recognised colour codes            (e.g. Pantone, Hex, RAL, RGB or CMYK) is considered equivalent to the indication of the colours in words in the language of            the proceedings. Indications within the representation regarding the colours and their distribution will not be considered            to be part of the representation as such, but as elements that affect the scope of protection of the mark.                                    If the opponent has provided no indication in the notice of opposition that the earlier mark is in colour, but submits evidence            showing a mark in colour, the opposition based on that earlier right will be rejected as not substantiated.                                                            The goods and services covered [511].                                    The expiry date of the registration (if given).                                    The owner [731, 732].                                    Other entries in the register affecting the legal or procedural status or the scope of protection of the mark (e.g. restrictions,               renewals, transfers, pending actions, the fact that the mark was registered due to acquired distinctiveness through use, etc.).                                                                                                                                 Parent topic: 4.2.3 Trade mark registrations or applications that are not EUTMs                                                1           The numbers in square brackets stand for standard INID codes (see in paragraph\_4.3.1).                           "
