            - Id: ish_2319054-2215187-16
              Content: "5.3.2.3 Affidavits                   5.3.2.3 Affidavits                                    Although the means of evidence listed, such as packages, labels, price lists, catalogues, invoices, photographs and newspaper            advertisements, do not present any particular problems, it is necessary to consider in some detail declarations as referred            to in Article\_97(1)(f) EUTMR. For general information, see the Guidelines, Part\_A, Section\_10, Evidence, 4.2\_Affidavits.                                                Distinction between admissibility and relevance (probative value)                                                The importance of declarations has been much debated. In this regard, there must be a clear differentiation between the admissibility            and the probative value of such evidence.                                    As far as admissibility is concerned, Article\_10(4) EUTMDR expressly mentions written statements referred to in Article\_97(1)(f) EUTMR as admissible means of proof of use. Article\_97(1) EUTMR cites means of giving evidence, among which are sworn or affirmed written statements or other statements with a similar effect            according to the law of the State in which they have been drawn up. Therefore, it has to be evaluated whether the statement            submitted constitutes a statement within the sense of Article\_97(1)(f) EUTMR.                                                Article\_97(1)(f) EUTMR does not specify by whom these statements should be signed, so there is no reason to consider that statements signed by the            parties to the proceedings themselves are not covered by this provision (16/12/2008, T‑86/07, Deitech, EU:T:2008:577, §\_46).                                    As far as the probative value of this kind of evidence is concerned, the Office, following the established case-law, makes a distinction between statements            coming from the sphere of the opponent themselves or their employees and statements drawn up by an independent source (09/12/2014,            T‑278/12, PROFLEX, EU:T:2014:1045, §\_51; 06/11/2014, T‑463/12, MB, EU:T:2014:935, §\_54).                                                Declarations by the proprietor or its employees                                                Statements coming from the sphere of the owner of the earlier mark (drawn up by the interested parties themselves or their            employees)are generally given less weight than independent evidence. This is because the perception of the party involved in the dispute            may be more or less affected by personal interests in the matter.                                    Generalisation should be avoided, since the exact value of such statements always depends on their concrete form and content,            and the final outcome depends on the overall assessment of the evidence in each individual case.                                    A change of ownership after the filing or priority date of the EUTM application may render declarations made by the new owners            void as the latter generally do not have any direct knowledge to form a basis for making declarations concerning use of the            mark by the previous owner (17/06/2004, R\_16/2004‑1, REPORTER / REPORTER, §\_23-24).                                    Nevertheless, in the case of a transfer or other succession in title, any new owner may rely on use by their predecessors            within the grace period concerned. Use made by a predecessor may be evidenced by the predecessor and by all other reliable            means, for instance, information from business records if the predecessor is not available.                                                Declarations by third parties                                                Statements (e.g. surveys) drawn up by an independent source are given more probative weight (19/01/2011, R\_1595/2008‑2, FINCONSUM ESTABLECIMIENTO FINANCIERO DE CREDITO / FINCONSUMO (FIG. MARK), §\_31).                                    This practice is in line with the case-law of the Court of Justice in the Chiemsee judgment (04/05/1999, C‑108/97 & C-109/97, Chiemsee, EU:C:1999:230), where the Court gave some indications of appropriate evidence for proving the acquired distinctiveness            of a mark in the market place. Although acquisition of distinctiveness is not per sethe same as genuine use, the former does comprise elements of evidence of use of a sign on the market. Consequently, case-law            relating to these can be used by analogy.                                                                                             Parent topic: 5.3.2 Means of evidence                                             "
