        <?DETDESC description="Detailed Description" end="lead"?>
        <p id="p-0037" num="0050"><figref idref="DRAWINGS">FIG. 1</figref> shows, in overall view, the device as claimed for repetitive nerve stimulation for breaking down fatty tissue by means of inductive magnetic fields, having a stimulation coil (<b>3</b>) replaceably attached to a stand (<b>1</b>) and accommodated in a plastic housing (<b>2</b>), a variable-height pedestal (<b>4</b>) with a foot pump (<b>5</b>) for adjustable positioning to tailor it individually to a patient's body, a pivotable camera (<b>6</b>) integrated in the stand (<b>1</b>) with an adjustment ring (<b>7</b>), for observing the muscle contractions triggered and for feeding back to a laptop (<b>9</b>) integrated in an operating console (<b>8</b>), said laptop comprising control software for computer-aided optimisation of the stimulation, a fan (<b>10</b>) for cooling the magnetic field coil (<b>3</b>), a pulse generator (<b>11</b>) for electrically actuating the magnetic field coil (<b>3</b>), a shielded cable channel (<b>12</b>) for the necessary electrical connecting wires between the stand (<b>1</b>) and the pulse generator (<b>11</b>) or the operating console (<b>8</b>) and a spotlight (<b>13</b>) for correctly illuminating the area of the body captured by the camera (<b>6</b>). It should be mentioned that the pulse generator (<b>11</b>) may advantageously be arranged directly on the stand (<b>1</b>) in order to minimise conduction losses. In this case, therefore, the cable channel (<b>12</b>) shown is dispensed with. Also shown is the power unit (<b>14</b>) belonging to the voltage supply of the device, which is configured and installed separately on account of the high heat levels produced, with output voltages of between 500 and 1000 V and the associated connecting cables (<b>15</b>).</p>
        <p id="p-0038" num="0051">The stand (<b>12</b>) approximately adapted to the magnetic field line pattern in the upper region consists essentially of a hollow frame (<b>16</b>) made of plastics with internally located ceramic retaining elements (<b>17</b>) for the precise positioning of the spaced-apart connecting leads (<b>18</b>, <b>19</b>) with a lead cross-section of 1.5 cm<sup>2 </sup>(<figref idref="DRAWINGS">FIG. 2<i>a, b</i></figref>). These connecting leads (<b>18</b>, <b>19</b>) ensure the passage of current between the pulse generator (<b>11</b>) and the stimulation coil (<b>3</b>). They may also be embodied as hollow conductors. Roughly level with a patient's waist, the stand (<b>1</b>) comprises a fixedly installed tubular air conveying channel (<b>20</b>) extending horizontally and transversely through the stand (<b>1</b>), with the connecting leads (<b>18</b>, <b>19</b>) inside it. The connecting leads (<b>18</b>, <b>19</b>) are passed from the air conveying channel (<b>20</b>) through sealed bores into the stand (<b>1</b>).</p>
        <p id="p-0039" num="0052"><figref idref="DRAWINGS">FIG. 1</figref> further shows the camera (<b>6</b>) also provided in the stand (<b>1</b>), which can be positioned by means of an adjustment ring (<b>7</b>) so that the part of the body being treated is reliably captured. A spotlight (<b>13</b>) at the upper end of the stand (<b>1</b>) serves to illuminate the part of the body being treated.</p>
        <p id="p-0040" num="0053">The variable-height pedestal (<b>4</b>) may comprise a mechanical lifting device which is operated and locked by means of a foot lever (<b>5</b>). A vertical upright is a possibility. Scissor-type supports arranged vertically above one another with a threaded spindle interposed horizontally may also be opened or closed for the height adjustment, the threaded spindle being rotated by hand or by an electric motor. A hydraulic lifting cylinder with a foot pump may be used as another means of adjusting the height of the pedestal (<b>4</b>).</p>
        <p id="p-0041" num="0054"><figref idref="DRAWINGS">FIG. 2<i>a </i></figref>shows the stand/stimulation coil connecting arrangement in detail, comprising the stand (<b>1</b>), the air conveying channel (<b>20</b>) and the fan (<b>10</b>) for cooling the connecting leads (<b>18</b>, <b>19</b>) and the stimulation coil (<b>3</b>). A closure sleeve (<b>21</b>) with bayonet closure, mounted to be axially movable and rotatable, covers the start of the air conveying channel (<b>20</b>) and the end of the stimulation coil (<b>3</b>) to prevent touching of the lead couplings.</p>
        <p id="p-0042" num="0055"><figref idref="DRAWINGS">FIG. 2<i>b </i></figref>is a sectional view of the stand/stimulation coil connecting arrangement. The air conveying channel (<b>20</b>) in the hollow frame (<b>16</b>) of the stand (<b>1</b>) comprises, at an end remote from the patient, the fan (<b>10</b>) with air outlet openings (<b>34</b>) which aspirates air through the air inlet openings (<b>22</b>) in the plastic housing (<b>2</b>) of the stimulation coil (<b>3</b>), through filter mats (<b>23</b>), past air guidance elements (not shown), the windings (<b>24</b>) of the stimulation coil (<b>3</b>) and the connecting leads (<b>18</b>, <b>19</b>), in order to cool it. The lead coupling (<b>25</b>) for the outgoing and return conductors of the connecting leads (<b>18</b>, <b>19</b>) is also shown.</p>
        <p id="p-0043" num="0056"><figref idref="DRAWINGS">FIG. 3<i>a </i></figref>shows the lead coupling (<b>25</b>) for outgoing and return conductors in section. Each end of a conductor in the stimulation coil (<b>3</b>) comprises a thickened, cylindrical end portion (<b>26</b>) with an external thread (<b>27</b>). A horizontal trapezoidal slot (<b>28</b>) is milled into this end portion (<b>26</b>). A trapezoidal tab (<b>29</b>) protruding from a thickened, cylindrical end portion (<b>30</b>) of one of the connecting leads (<b>18</b>) or (<b>19</b>) engages in said slot (<b>28</b>). An internally threaded screw bushing (<b>31</b>) which surrounds one of the thickened end portions (<b>30</b>) of the connecting leads (<b>18</b>) or (<b>19</b>) is screwed onto the external thread (<b>27</b>) of one end portion (<b>26</b>) in each case and connects the connecting leads (<b>18</b>, <b>19</b>) to the stimulation coil (<b>3</b>). By means of these two lead couplings which can be pushed on and screwed tight, the stimulation coil (<b>3</b>) is supported by the connecting leads (<b>18</b>, <b>19</b>). This special screw connection simultaneously serves to conduct electricity. As the conical flanks of the trapezoidal slot (<b>28</b>) lie with their surface against the flanks of the trapezoidal tab (<b>29</b>), there is also a slight contact resistance.</p>
        <p id="p-0044" num="0057"><figref idref="DRAWINGS">FIG. 3<i>b </i></figref>is a perspective view of the lead coupling used for outgoing and return conductors in the screwed state.</p>
        <p id="p-0045" num="0058"><figref idref="DRAWINGS">FIG. 4<i>a </i></figref>shows, for example, the stimulation coil (<b>3</b>) for treating the abdomen, in perspective view from the front (treatment side). The drawing shows a clampable protective cover (<b>32</b>) which has been removed, and a substantially trumpet-shaped plastic housing (<b>2</b>). On the inside of this trumpet-shaped plastic housing (<b>2</b>) are a plurality of ceramic retaining elements (<b>17</b>) for accommodating the windings (<b>24</b>) of the stimulation coil (<b>3</b>). The ends of the windings (<b>24</b>) of the stimulation coil (<b>3</b>) are guided parallel to the thickened end portions (<b>26</b>). The windings (<b>24</b>) for treatment of the abdomen themselves run substantially in an oval and cover an area of about 20 cm&#xd7;30 cm. The air inlet openings (<b>22</b>) can also be seen.</p>
        <p id="p-0046" num="0059"><figref idref="DRAWINGS">FIG. 4<i>b </i></figref>shows the stimulation coil (<b>3</b>) for treatment of the abdomen, in perspective view from behind (the stand side). Clearly visible are the thickened end portions (<b>26</b>) with the external threads (<b>27</b>), the respective trapezoidal slots (<b>28</b>), ceramic retaining elements (<b>17</b>) and a groove (<b>33</b>) in the plastic housing (<b>2</b>) of the stimulation coil (<b>3</b>) for guiding the axial and rotary movement of the closure sleeve (<b>21</b>).</p>
        <p id="p-0047" num="0060"><figref idref="DRAWINGS">FIGS. 5<i>a</i>, 5<i>b</i>, 5<i>c </i>and 5<i>d </i></figref>show various representations of a stimulation coil (<b>3</b>) for treating the buttocks region; (a) the housing viewed from in front, (b) the housing viewed from the side, (c) the housing viewed from above and (d) the configuration of the coil inside the housing, seen from the viewpoint of the person being treated. This stimulation coil (<b>3</b>) has the same internal construction as the stimulation coil (<b>3</b>) for treating the abdomen and essentially only differs in the external shape of the housing. The treatment side of the housing has a rounded-off square shape measuring about 15 cm&#xd7;15 cm. The protective cover (<b>32</b>) has a slightly concave curvature. The stimulation coil (<b>3</b>) itself comprises suitably shaped windings (<b>24</b>) extending in a square configuration. The back of the plastic housing (<b>2</b>) has a swan-necked shape so that the stimulation coil (<b>3</b>) can act slightly below the patient's waist.</p>
        <p id="p-0048" num="0061"><figref idref="DRAWINGS">FIGS. 6<i>a</i>, 6<i>b</i>, 6<i>c </i>and 6<i>d </i></figref>show various representations of a stimulation coil (<b>3</b>) for treating the thighs; (a) the housing viewed from in front, (b) the housing viewed from the side, (c) the housing viewed from above and (d) the configuration of the coil inside the housing, seen from the viewpoint of the person being treated. This stimulation coil (<b>3</b>) has the same basic construction as the stimulation coil (<b>3</b>) for treating the buttocks, the difference being that the treatment side has a rounded-off rectangular shape measuring about 10 cm&#xd7;20 cm, the protective cover having a slightly concave curvature extending in the vertical direction.</p>
        <p id="p-0049" num="0062"><figref idref="DRAWINGS">FIG. 7</figref> shows, by way of example, a basic circuit diagram of a conventional pulse generator (<b>11</b>) as used here, which only generates its own stimulation pulse producing unit in conjunction with the stimulation coil (L) (cf. lead couplings LK). Voltages of between 500 V and 1000 V coming from the separate power unit (<b>14</b>) are selected in stages of 50 V by means of electronic switches (not shown here) which are controlled either manually by means of the operating console (<b>8</b>) or by the computer (<b>9</b>), and applied to the reservoir capacitor (C<b>1</b>) at the input of the pulse generator (<b>11</b>), for storage. The selected charge voltage of this reservoir capacitor (C<b>1</b>) essentially determines the stimulation power and hence the amplitude level of the stimulation pulse that is to be generated. The actual energy store, the pulse capacitor (C<b>2</b>), is charged up and recharged by means of the thyristor circuits A and B. In principle the pulse capacitor (C<b>2</b>) forms with the stimulation coil (L) an oscillating circuit which is damped by the ohmic resistors of the connecting leads and couplings, generally shown in the drawing as ohmic resistor (R). Repetitive discharges of the pulse capacitor (C<b>2</b>) and hence the stimulation frequency f<sub>stim </sub>are controlled by means of two thyristors (T<b>1</b>, T<b>2</b>) connected in antiparallel manner and capable of carrying heavy current, which connect the pulse capacitor (C<b>2</b>) to the stimulation coil (L). As a result of the antiparallel connection of the thyristors (T<b>1</b>, T<b>2</b>), sinusoidal diphase voltage and current pulses may be generated (<figref idref="DRAWINGS">FIG. 8</figref> and associated description). Their pulse duration T can be adjusted by the connection or disconnection of capacitors (not shown here) connected in parallel to the pulse capacitor (C<b>2</b>), as this enables the overall capacity in the oscillating circuit and hence the oscillating circuit frequency f<sub>p </sub>(f<sub>p</sub>=1/(2&#x3c0;&#x221a;/LC) to be varied. Both the thyristor actuation for selecting the stimulation frequency f<sub>stim </sub>and also the number of parallel-connected capacitors for determining the pulse duration T can be manually pre-set on the operating console (<b>11</b>) or are controlled by the computer (<b>9</b>).</p>
        <p id="p-0050" num="0063"><figref idref="DRAWINGS">FIG. 8</figref> shows, by way of example, an idealised current flow in a stimulation coil (<b>3</b>) with diphase actuation by the pulse generator (<b>11</b>). A stimulation coil inductivity of 15&#xd7;10<sup>&#x2212;6 </sup>H, a charging voltage U<sub>C2 </sub>of 1000 V and a diphase stimulation pulse with a pulse duration T of 300 &#x3bc;s were assumed. After the thyristor (T<b>1</b>) is switched through (<figref idref="DRAWINGS">FIG. 7</figref>) a positive half-wave of a sinusoidal current flow with a maximum amplitude of about 3000 A is obtained. At time T/2, i.e. after half the pulse duration T has ended, the current I(t) in the oscillation circuit changes its polarity and the thyristor (T<b>2</b>) (<figref idref="DRAWINGS">FIG. 7</figref>) is switched through and takes over the current conduction until a complete sinusoidal oscillation has been reached. Meanwhile, the thyristor (T<b>1</b>) is blocked. The negative half-wave of the sinusoidal current flow thus produced also has a maximum amplitude of about 3000 A. As both thyristors (T<b>1</b>, T<b>2</b>) are blocked after a pulse duration T, further oscillation is prevented, so that only a diphase pulse is produced. Only after a stimulation pulse repeat time T has been reached which corresponds to the reciprocal of the stimulation frequency f<sub>stim</sub>, are the thyristors (T<b>1</b>, T<b>2</b>) switched through again in the manner described and the pulse-shaped current flow in the stimulation coil is obtained once more, as also shown in <figref idref="DRAWINGS">FIG. 8</figref>. The pulse-shaped currents shown then ensure, in the stimulation coil (<b>3</b>), a corresponding formation and breakdown of pulse-shaped magnetic alternating fields within a treatment time interval that can be set at the operating console (<b>8</b>) or is controlled by the computer (<b>9</b>).</p>
        <p id="p-0051" num="0064">If the thyristor T<b>2</b> is never switched through, a monophase current pulse is produced which consists only of the positive half-wave of the sinusoidal current flow I(t) shown in <figref idref="DRAWINGS">FIG. 8</figref>.</p>
