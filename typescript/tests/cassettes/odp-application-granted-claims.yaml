        <us-claim-statement>The invention claimed is:</us-claim-statement>
        <claims id="claims">
        <claim id="CLM-00001" num="00001">
        <claim-text>1. A method for reducing excess weight of a patient using a device including a power unit, at least one switch, a pulse capacitor and a stimulation coil, the method comprising:
        <claim-text>charging the pulse capacitor;</claim-text>
        <claim-text>switching the at least one switch;</claim-text>
        <claim-text>providing a current pulse having a peak current in a range of 500 A to 6000 A from the pulse capacitor to the stimulation coil in order to generate a pulsed magnetic field by the stimulation coil;</claim-text>
        <claim-text>cooling the stimulation coil; and</claim-text>
        <claim-text>applying diphasic sinusoidal pulses of the pulsed magnetic field with a pulse duration in a range of 100 &#x3bc;s to 300 &#x3bc;s to a muscle of the patient in order to cause a contraction of the muscle in order to reduce fatty tissue.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00002" num="00002">
        <claim-text>2. The method of <claim-ref idref="CLM-00001">claim 1</claim-ref>, further comprising applying the pulsed magnetic field to at least one body region of the patient including the thighs, buttocks, abdomen, or waist.</claim-text>
        </claim>
        <claim id="CLM-00003" num="00003">
        <claim-text>3. The method of <claim-ref idref="CLM-00001">claim 1</claim-ref>, wherein the stimulation coil is positioned in a plastic housing, and
        <claim-text>wherein the plastic housing comprises a concave curvature.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00004" num="00004">
        <claim-text>4. The method of <claim-ref idref="CLM-00001">claim 1</claim-ref>, wherein the stimulation coil includes a conductor having a cross-sectional area in a range of about 1 cm<sup>2 </sup>to 2 cm<sup>2</sup>.</claim-text>
        </claim>
        <claim id="CLM-00005" num="00005">
        <claim-text>5. The method of <claim-ref idref="CLM-00003">claim 3</claim-ref>,
        <claim-text>wherein the plastic housing-comprises at least one orifice for flowing a cooling media on a side which is different from a side closest to the patient.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00006" num="00006">
        <claim-text>6. The method of <claim-ref idref="CLM-00001">claim 1</claim-ref>, wherein the stimulation coil is a planar coil;
        <claim-text>wherein the stimulation coil is positioned inside a plastic housing; and</claim-text>
        <claim-text>wherein the stimulation coil is spaced apart from the plastic housing in order to enable flowing a cooling media between the stimulation coil and the plastic housing.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00007" num="00007">
        <claim-text>7. The method of <claim-ref idref="CLM-00001">claim 1</claim-ref>, further comprising replacing the stimulation coil with another stimulation coil.</claim-text>
        </claim>
        <claim id="CLM-00008" num="00008">
        <claim-text>8. A method for breaking down fatty tissue of a patient using a device including a power unit, at least one switch, a pulse capacitor, and a stimulation coil, the method comprising:
        <claim-text>placing the stimulation coil in a plastic housing proximate to the patient wherein the stimulation coil is not in contact with the patient;</claim-text>
        <claim-text>charging the pulse capacitor;</claim-text>
        <claim-text>switching the at least one switch;</claim-text>
        <claim-text>providing a current pulse having a peak current in a range of 500 A to 6000 A from the pulse capacitor to the stimulation coil in order to generate a pulsed time-varying magnetic field by the stimulation coil;</claim-text>
        <claim-text>cooling the stimulation coil with a fluid cooling media;</claim-text>
        <claim-text>applying diphasic sinusoidal pulses of the pulsed magnetic field to a muscle of the patient within a body region including at least one of the buttocks, abdomen, or waist in order to cause a repetitive contraction of the muscle and a breaking down of the fatty tissue.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00009" num="00009">
        <claim-text>9. The method of <claim-ref idref="CLM-00008">claim 8</claim-ref>, wherein the pulsed magnetic field has a pulse duration, and wherein the method further comprises adjusting the pulse duration via an operation console.</claim-text>
        </claim>
        <claim id="CLM-00010" num="00010">
        <claim-text>10. The method of <claim-ref idref="CLM-00009">claim 9</claim-ref>, wherein the stimulation coil is a planar coil, and
        <claim-text>wherein the stimulation coil is spaced apart from the plastic housing in order to enable flowing the fluid cooling media between the stimulation coil and the plastic housing.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00011" num="00011">
        <claim-text>11. The method of <claim-ref idref="CLM-00010">claim 10</claim-ref>, wherein the pulsed magnetic field has a magnet flow density in a range of 0.01 Tesla to 0.1 Tesla at 5 cm in front of a surface of the stimulation coil.</claim-text>
        </claim>
        <claim id="CLM-00012" num="00012">
        <claim-text>12. The method of <claim-ref idref="CLM-00011">claim 11</claim-ref>, further comprising inducing an electric field intensity in a range from 0.1 V/cm to 1 V/cm at a stimulation site of a tissue.</claim-text>
        </claim>
        <claim id="CLM-00013" num="00013">
        <claim-text>13. The method of <claim-ref idref="CLM-00012">claim 12</claim-ref>, wherein a frequency of the pulses is in a range of 10 Hz to 30 Hz.</claim-text>
        </claim>
        <claim id="CLM-00014" num="00014">
        <claim-text>14. The method of <claim-ref idref="CLM-00013">claim 13</claim-ref>, wherein the plastic housing comprises a concave curvature.</claim-text>
        </claim>
        <claim id="CLM-00015" num="00015">
        <claim-text>15. The method of <claim-ref idref="CLM-00014">claim 14</claim-ref>, further comprising applying the pulses of the pulsed magnetic field with a pulse duration in a range of 100 &#x3bc;s to 300 &#x3bc;s.</claim-text>
        </claim>
        <claim id="CLM-00016" num="00016">
        <claim-text>16. The method of <claim-ref idref="CLM-00015">claim 15</claim-ref>, wherein the stimulation coil includes a high-frequency wire.</claim-text>
        </claim>
        <claim id="CLM-00017" num="00017">
        <claim-text>17. A method for treating obesity of a patient using a device including a power unit, at least one switch, a pulse capacitor and a stimulation coil, the method comprising:
        <claim-text>placing the stimulation coil in a housing having a surface proximate to the patient;</claim-text>
        <claim-text>positioning the housing proximate to the patient;</claim-text>
        <claim-text>charging the pulse capacitor;</claim-text>
        <claim-text>switching the at least one switch in order to enable discharging the pulse capacitor into the stimulation coil and providing a current in a range of 500 A to 6000 A into the stimulation coil;</claim-text>
        <claim-text>generating a pulsed magnetic field by the stimulation coil; and</claim-text>
        <claim-text>applying diphasic pulses of the pulsed magnetic field to a muscle of the patient within a body region including at least one of the thighs, buttocks, abdomen, or waist in order to cause a contraction of the muscle in order to reduce fatty tissue of the patient; and</claim-text>
        <claim-text>cooling the stimulation coil.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00018" num="00018">
        <claim-text>18. The method of <claim-ref idref="CLM-00017">claim 17</claim-ref>, wherein the housing comprises a concave curvature.</claim-text>
        </claim>
        <claim id="CLM-00019" num="00019">
        <claim-text>19. The method of <claim-ref idref="CLM-00017">claim 17</claim-ref>, further comprising applying the pulses of the pulsed magnetic field with a pulse duration in a range of 100 &#x3bc;s to 300 &#x3bc;s.</claim-text>
        </claim>
        <claim id="CLM-00020" num="00020">
        <claim-text>20. The method of <claim-ref idref="CLM-00017">claim 17</claim-ref>, further comprising inducing an electric field intensity in a range from 0.1 V/cm to 1 V/cm at a stimulation site of a tissue.</claim-text>
        </claim>
        <claim id="CLM-00021" num="00021">
        <claim-text>21. The method of <claim-ref idref="CLM-00017">claim 17</claim-ref>, further comprising replacing the stimulation coil with another stimulation coil.</claim-text>
        </claim>
        <claim id="CLM-00022" num="00022">
        <claim-text>22. The method of <claim-ref idref="CLM-00021">claim 21</claim-ref>, wherein the pulsed magnetic field has a magnet flow density in a range of 0.01 Tesla to 0.1 Tesla at 5 cm in front of a surface of the stimulation coil.</claim-text>
        </claim>
        <claim id="CLM-00023" num="00023">
        <claim-text>23. The method of <claim-ref idref="CLM-00022">claim 22</claim-ref>, further comprising applying the pulses of the pulsed magnetic field with a stimulation frequency in a range of 10 Hz to 30 Hz for a treatment time in a range of 1 min to 45 min to the muscle of the patient.</claim-text>
        </claim>
        <claim id="CLM-00024" num="00024">
        <claim-text>24. The method of <claim-ref idref="CLM-00017">claim 17</claim-ref>, wherein the stimulation coil is oval.</claim-text>
        </claim>
        <claim id="CLM-00025" num="00025">
        <claim-text>25. A method for breaking down fatty tissue of a patient using a device including a power unit, at least one switch, a pulse capacitor and a stimulation coil, the method comprising:
        <claim-text>placing the stimulation coil in a plastic housing proximate to the patient wherein the stimulation coil is not in contact with the patient;</claim-text>
        <claim-text>charging the pulse capacitor;</claim-text>
        <claim-text>switching the at least one switch in order to enable providing a current in a range of 500 A to 6000 A to the stimulation coil and generating a pulsed magnetic field with the stimulation coil;</claim-text>
        <claim-text>applying diphasic pulses of the magnetic field to a muscle of the patient within a body region including at least one of the thighs, buttocks, abdomen, or waist in order to cause a repetitive contraction of the muscle in order to break down fatty tissue; and</claim-text>
        <claim-text>cooling the stimulation coil with a fluid cooling media.</claim-text>
        </claim-text>
        </claim>
        <claim id="CLM-00026" num="00026">
        <claim-text>26. The method of <claim-ref idref="CLM-00025">claim 25</claim-ref>, wherein the plastic housing comprises a concave curvature.</claim-text>
        </claim>
        <claim id="CLM-00027" num="00027">
        <claim-text>27. The method of <claim-ref idref="CLM-00026">claim 26</claim-ref>, wherein the stimulation coil is spaced apart from the plastic housing in order to enable flowing the fluid cooling media between the stimulation coil and the plastic housing.</claim-text>
        </claim>
        <claim id="CLM-00028" num="00028">
        <claim-text>28. The method of <claim-ref idref="CLM-00026">claim 26</claim-ref>, further comprising applying the pulses of the pulsed magnetic field with a stimulation frequency in a range of 10 Hz to 30 Hz.</claim-text>
        </claim>
        <claim id="CLM-00029" num="00029">
        <claim-text>29. The method of <claim-ref idref="CLM-00028">claim 28</claim-ref>, wherein the stimulation coil includes a high-frequency wire.</claim-text>
        </claim>
        <claim id="CLM-00030" num="00030">
        <claim-text>30. The method of <claim-ref idref="CLM-00025">claim 25</claim-ref>, further comprising increasing metabolism and/or reducing fatty tissue.</claim-text>
        </claim>
        <claim id="CLM-00031" num="00031">
        <claim-text>31. The method of <claim-ref idref="CLM-00025">claim 25</claim-ref>, further comprising increasing blood circulation or oxygen supply.</claim-text>
        </claim>
        <claim id="CLM-00032" num="00032">
        <claim-text>32. The method of <claim-ref idref="CLM-00025">claim 25</claim-ref>, further comprising applying the pulses of the pulsed magnetic field with a pulse duration in a range of 100 &#x3bc;s to 300 &#x3bc;s.</claim-text>
        </claim>
        </claims>
