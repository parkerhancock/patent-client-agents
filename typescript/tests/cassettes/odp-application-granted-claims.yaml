        <p id="p-0012" num="0011">The stimulation coil is actuated by means of a pulse generator (stimulator), which is installed separately from the stand. A stimulator of the kind currently used as a prototype in medical research (IMETUM, Central Institute for Medical Technology, Technical University of Munich, Concluding Report: &#x201c;Functional peripheral magnetic stimulation of motor functions in patients with central paresis, particularly hemiplegic paralysis&#x201d;, 2011) with a pulse length of 160 &#x3bc;s (diphase) may be used. The capacity of a capacitor is matched to the inductivity of the stimulation coil in order to tune the resonating frequency of an LC resonator consisting of the stimulation coil and the capacitor, to the frequency corresponding to the pulse duration. The electric fields required give rise to high currents through the coil in the range from 500 A to 6000 A.</p>
        <p id="p-0013" num="0012">The large area of the coil enables it to have an open, non-cast structure. As a result, the considerable Joule's heat produced in the coil can be removed by means of an air fan. Airflow is provided for effective cooling. Contamination and dust turbulence are prevented by filter mats.</p>
        <p id="p-0014" num="0013">The treatment times range from 1 min to 45 min. The long times can be achieved without overheating of the coil thanks to the effective cooling and the coil design.</p>
        <p id="p-0015" num="0014">The coil itself may, on account of its size, be produced as a self-supporting structure of solid metal (e.g. copper or aluminium). This assists the conduction of heat away from the coil conductor to its surface. The cross-section of the conductor is 1 cm<sup>2 </sup>to about 2 cm<sup>2</sup>. This large cross-section of the coil conductor, by comparison with that of coils used in site-selective magnetic field stimulation (focussing), reduces the ohmic resistance, thus reducing the Joule's heat.</p>
        <p id="p-0016" num="0015">Alternatively, the coil may also be produced from high-frequency wires, by conventional technology, to avoid skin and proximity effects. However, an estimation of the skin depth shows that this is not necessary with a pulse duration of about 200 &#x3bc;s.</p>
        <p id="p-0017" num="0016">In a solid construction, it may also be conceivable to use hollow conductors which are cooled by a coolant liquid.</p>
        <p id="p-0018" num="0017">The stimulation coil is encapsulated in a plastic housing. The housing ensures protection from contact voltage and at the same time directs the coolant air.</p>
        <p id="p-0019" num="0018">The fan produces a current of coolant air which reaches the coil through air inlet openings and air guiding elements fitted with filters which are provided in the plastic housing of the stimulation coil, and this coolant air is supplied to the air outlet openings of the fan through an air guide made of plastics which is arranged around the electric connecting leads to the coil. The fan may consequently be arranged at the back of the stand and outside the magnetic field of the stimulation coil, thus preventing any adverse effects on the electric fan motor.</p>
        <p id="p-0020" num="0019">As a result of the high currents, high mechanical forces occur between the conductor sections of the stimulation coil and the connecting leads. These are absorbed by ceramic retaining elements which maintain a spacing.</p>
        <p id="p-0021" num="0020">The electric connecting wires to the stimulation coil in the stand are of solid construction with no movable cables. This permits an optimum release of heat into the air, absorption of the magnetic forces and high operational reliability.</p>
        <p id="p-0022" num="0021">The stimulation coil is mounted on a holder which is formed by the solid current supply lines themselves. This holder positions the coil at an adequate distance from the stand; the unwanted eddy currents induced in the stand by the coil are minimised in this way.</p>
        <p id="p-0023" num="0022">A stimulation coil can easily be changed after opening a torsionally and axially mounted closure sleeve with a bayonet closure and loosening two screws for the connecting leads. This is significant, as different optimum coil shapes with different housings are used for different areas of the body (abdomen, thighs and buttocks).</p>
        <p id="p-0024" num="0023">The positioning of the stimulation coil relative to the patient can be varied by means of a variable-height pedestal. Thus the connecting leads to the stimulation coil can be made rigid in design and changes in the inductivity and input resistance caused by changes of position can be avoided.</p>
        <p id="p-0025" num="0024">Alternatively, positioning of the stimulation coil on the stand could be carried out by the use of clamping closures in vertical rails.</p>
        <p id="p-0026" num="0025">The stimulation of muscle contraction can be optimised by means of a feedback link. For this purpose, the contractions triggered by a stimulation coil are observed using a camera integrated into the stand and corresponding signals are transmitted to a computer (e.g. a laptop). This controls the electrical pulses located at the output of the pulse generator in terms of pulse form, duration, amplitude and treatment time, by means of a corresponding programme, depending on the signals received.</p>
        <p id="p-0027" num="0026">An embodiment of the invention which demonstrates further advantages and special features is shown in <figref idref="DRAWINGS">FIGS. 1 to 8</figref> and described in more detail hereinafter.</p>
