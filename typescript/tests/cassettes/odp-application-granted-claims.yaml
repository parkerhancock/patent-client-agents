        <description id="description">
        <?BRFSUM description="Brief Summary" end="lead"?>
        <heading id="h-0001" level="1">CROSS REFERENCE TO RELATED APPLICATION</heading>
        <p id="p-0002" num="0001">This application is related to and claims priority from the German PCT Patent Application No. PCT/IB2013/001896 filed on Jul. 2, 2013, which claims priority to German Patent Application No. 10 2012 013 534.3 filed on Jul. 5, 2012.</p>
        <p id="p-0003" num="0002">The present invention makes use of the effect of stimulating muscle contractions by contactless induction of electrical fields by means of pulse-shaped magnetic fields in the tissue. Pulsating magnetic fields are also capable of exciting ion transport by influencing the electric currents and measurably increasing metabolism. There is a demonstrable increase in blood circulation and an increased supply of oxygen. These effects are currently being medically evaluated from the point of view of the reactivation of muscles after illness or accident and have already led to corresponding inventions. Thus, from DE 10 2007 044 445 A1, a training device with magnetic stimulation is known wherein in conjunction with means for mechanically guiding an intended movement of a joint in a paralysed body part, this body part is stimulated to move. From US 2005/203332 A1, a device for the treatment of osteoporosis and other musculo-skeletal diseases is known in which the patient, lying on a couch, is surrounded at the respective part of the body by a cylindrical coil which generates an electromagnetic field. From U.S. Pat. No. 6,213,933 B1 a device and a method for dissolving blood clots in human body parts can be inferred, in which the patient lies on an elongated platform over which a transversely extending, longitudinally movable holder with a water-cooled magnetic field coil of the butterfly type is arranged for stimulation. In order to position the magnetic field coil, the holder is simply pushed over the part of the body that is to be treated. The frequency and duration of stimulation is controlled by an interactive programme on a PC. Another electromagnetic system known from US 2003/0158585 A1 uses ergonomic stimulating coils in the form of flexible flat or cylindrical coils, adapted to the contour of the particular body part, for therapeutic treatment, for stimulating nerves, muscles and other tissues of the human body.</p>
        <p id="p-0004" num="0003">Beyond this&#x2014;and not previously utilised&#x2014;muscle excitation by magnetic field stimulation leads to a breakdown of fatty tissue in the area around the muscles, as the Applicant has demonstrated by numerous experiments, particularly on obese and muscular test subjects. In slender test subjects, there is a development of muscle with no significant weight loss.</p>
        <p id="p-0005" num="0004">Admittedly, there were already devices and methods for treating obesity or excess weight by means of pulsating magnetic fields, but these either require, in addition to the field-generating coil, another permanent magnet in contact with the surface of the body (DE 100 62 050 A1) or they act indirectly through a magnetic field that activates the thyroid (DE 10 2009 043 728 A1) and also have to be applied to the body by means of a neck band.</p>
        <p id="p-0006" num="0005">Thus, using the experience and findings described above, the object of the invention is to provide a device and a method for repetitive nerve stimulation for breaking down fatty tissue by means of inductive magnetic fields, which permit easy patient-centred adjustment and control, in order to reduce fatty tissue in defined regions of the body, such as the abdomen, buttocks or thighs, in targeted manner and without any body contact.</p>
        <p id="p-0007" num="0006">This object is achieved by the device claimed in claim <b>1</b> and the method claimed in claim <b>14</b>. Advantageous embodiments of the invention are the subject of the sub-claims.</p>
        <p id="p-0008" num="0007">Advantages of the invention consist particularly in the contactless induction of excitation, the associated low levels of the pain stimulation that occurs with alternative electrical excitation, the large area of excitation and the ability to position the stimulation-producing coil to suit the individual body shape of the patient.</p>
        <p id="p-0009" num="0008">Essential components of the device are a large-area magnetic field coil through which current passes, hereinafter referred to as the stimulation coil, which is attached to a stand. Different coil shapes are provided for the treatment of the abdomen, buttocks and thighs.</p>
        <p id="p-0010" num="0009">The stimulation coil produces magnetic fields with peaks at a magnetic flow density of 0.01 T to 0.1 T at about 5 cm in front of the surface of the coil. The magnetic field can be varied over time and consists of diphase or monophase pulses with a pulse duration T of 100 &#x3bc;s to 300 &#x3bc;s. The repeat frequency of the pulses (stimulation frequency f<sub>p</sub>) is 10 Hz to 30 Hz. Maximum electric field intensities of 0.1 V/cm to 1 V/cm are achieved by induction at the stimulation site in the tissue. The magnetic field of the coil is approximately locally constant in magnitude throughout the volume of tissue to be treated. Parameters of a typical coil are shown in Table 1.</p>
        <p id="p-0011" num="0010">
