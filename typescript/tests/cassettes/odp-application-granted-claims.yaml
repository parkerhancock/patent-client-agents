        <abstract id="abstract">
        <p id="p-0001" num="0000">A device for breaking down fatty tissue using inductive magnetic fields includes a stimulation coil replaceably attached to a stand and accommodated in a plastic housing, a variable-height pedestal, and a pivotable camera integrated in the stand for observing muscle contractions that are triggered. An operating console features control software for computer-aided optimization of one or more stimuli, and a pulse generator for electrically actuating a magnetic field coil. A spotlight may be included for correctly illuminating the area of the body captured by the camera. A method for breaking down fatty tissue is also described.</p>
        </abstract>
