        abstracts:
        - content: >-
            Laitteisto (110-1, 110-2), sisältäen välineet vastaanottaa ortogonaalisen
            peitekoodin toiminnan konfiguraatio (301-1, 301-2); välineet fyysisen nousevan
            siirtotien jaetun kanavan lähetykseen käytettävän ortogonaalisen peitekoodin
            määrittämiseksi konfiguraation perusteella; välineet fyysisen nousevan siirtotien jaetun
            kanavan lähetyksen suorittamiseksi käyttäen määritettyä ortogonaalista peitekoodia
            (321, 322, 331, 332).
          language: FI
          ordinal: 1
        - content: >-
            An apparatus (110-1, 110-2), including means for receiving a configuration of
            orthogonal cover code operation (301-1, 301-2); means for determining an
            orthogonal cover code to use for a physical uplink shared channel transmission, based on
            the configuration; and means for performing the physical uplink shared channel
            transmission using the determined orthogonal cover code (321, 322, 331, 332).
          language: EN
          ordinal: 2
