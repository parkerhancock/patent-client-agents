/ul></li>                            </ul>\r\n                    </li>\r\n                                    <li class=\"nav_menu-item \">\r\n                        <a href=\"javascript:;\">裁判资料</a>\r\n                        <ul class=\"nav_submenu nav_submenu1\">\r\n                        <li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-32.html\">裁判要旨</a></li><li class='nav_submenu-item'><a href='/zh-cn/news/childrenmore-5-36.html'>法律法规</a><ul class='nav_submenu nav_submenu2'><li class='nav_submenu-item'><a href='/zh-cn/news/childrenmore-5-36.html'>综合性法律文件</a><ul class='nav_submenu nav_submenu3'><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-38.html\">实体性法律文件</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-39.html\">程序性法律文件</a></li></ul></li><li class='nav_submenu-item'><a href='/zh-cn/news/childrenmore-5-37.html'>专项法律文件</a><ul class='nav_submenu nav_submenu3'><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-40.html\">关于专利等专业技术型较强的知识产权案件管辖的有关规定</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-41.html\">专利</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-42.html\">著作权</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-43.html\">竞争与垄断</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-44.html\">集成电路布图设计</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-45.html\">植物新品种</a></li></ul></li></ul></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-48.html\">入库案例</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-20.html\">案例分析</a></li><li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-5-25.html\">精品裁判</a></li>                            </ul>\r\n                    </li>\r\n                                    <li class=\"nav_menu-item \">\r\n                        <a href=\"javascript:;\">数据分析</a>\r\n                        <ul class=\"nav_submenu nav_submenu1\">\r\n                        <li class=\"nav_submenu-item\"><a href=\"/zh-cn/news/more-23-24.html\">数说法庭</a></li>                            </ul>\r\n                    </li>\r\n                                    <li class=\"nav_menu-item \">\r\n                        <a href=\"/zh-cn/news/more-34-34.html\">知微课堂</a>\r\n                        <ul class=\"nav_submenu nav_submenu1\">\r\n                                                    </ul>\r\n                    </li>\r\n                                    <li class=\"nav_menu-item \">\r\n                        <a href=\"/zh-cn/news/more-33-33.html\">司法学术</a>\r\n                        <ul class=\"nav_submenu nav_submenu1\">\r\n                                                    </ul>\r\n                    </li>\r\n                            </ul>\r\n        </div>\r\n    </div>\r\n\r\n    \r\n    <div class=\"w_1200\">\r\n\t<div class=\"work search_list clearfix\">\r\n\t    <div class=\"jg\">为您找到相关结果约12个用时   0.044秒</div>\r\n\t\t<ul class=\"list\">\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"集成电路布图设计专有权保护范围的确定——“锂电池保护芯片”集成电路布图设计侵权案\" target=\"_blank\" href=\"/zh-cn/news/view-1161.html\">集成电路布图设计专有权保护范围的确定——“锂电池保护芯片”集成电路布图设计侵权案</a>               <span>       编者按：为切实加强社会主义法治宣传，积极讲好中国知识产权司法保护故事，及时发布最高人民法院知识产权法庭审判工作动态，助力实施创新驱动发展战略、营造国际一流营商环境，最高人民法院知识产权法庭微信公众号增设“每周一案”专栏。自2021年3...</span>\r\n\t\t\t\t<i class=\"date\">2021-04-07 11:11:13</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"集成电路布图设计独创性的认定——“锂电池保护芯片”集成电路布图设计侵权案\" target=\"_blank\" href=\"/zh-cn/news/view-1168.html\">集成电路布图设计独创性的认定——“锂电池保护芯片”集成电路布图设计侵权案</a>               <span>       编者按：为切实加强社会主义法治宣传，积极讲好中国知识产权司法保护故事，及时发布最高人民法院知识产权法庭审判工作动态，助力实施创新驱动发展战略、营造国际一流营商环境，最高人民法院知识产权法庭微信公众号增设“每周一案”专栏。自2021年3...</span>\r\n\t\t\t\t<i class=\"date\">2021-04-12 03:46:38</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"量产芯片委托开发合同的法律性质及其研发特点对违约责任的影响\" target=\"_blank\" href=\"/zh-cn/news/view-1880.html\">量产芯片委托开发合同的法律性质及其研发特点对违约责任的影响</a>               <span>量产芯片委托开发合同的法律性质及其研发特点对违约责任的影响——（2020）最高法知民终394号近日，最高人民法院对上诉人泰凌微电子（上海）股份有限公司（以下简称泰凌公司）与被上诉人深圳市星火原光电科技有限公司（以下简称星火原公司）涉量产芯片技术委...</span>\r\n\t\t\t\t<i class=\"date\">2022-03-22 10:12:32</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"芯片会穿越？伪证当罚！最高法知产法庭：严惩伪证倡诚信\" target=\"_blank\" href=\"/zh-cn/news/view-2709.html\">芯片会穿越？伪证当罚！最高法知产法庭：严惩伪证倡诚信</a>               <span>被诉专利侵权的公司在提出现有技术抗辩时，企图“粘贴”现有技术在实物中，就能瞒天过海？一、二审知识产权法庭法官“火眼金睛”，两次识破证据伪造点，对不诚信诉讼行为“开罚单”，有力维护诉讼秩序，彰显司法威严。现粘技术 法眼金睛破疑点“（2022）最高...</span>\r\n\t\t\t\t<i class=\"date\">2024-01-05 02:07:33</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"15.“指纹识别芯片技术”专利权属系列案\" target=\"_blank\" href=\"/zh-cn/news/view-2913.html\">15.“指纹识别芯片技术”专利权属系列案</a>               <span>编者按：2024年2月22日，最高人民法院发布了最高人民法院知识产权法庭成立五周年十大影响力案件案情介绍和100件典型案例名单。为方便社会各界了解相关案件基本情况，自2024年3月5日起，最高人民法院知识产权法庭微信公众号专设“五年百案”栏目，陆续发布100...</span>\r\n\t\t\t\t<i class=\"date\">2024-03-25 11:47:31</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"22.“锂电池保护芯片”集成电路布图设计侵权案\" target=\"_blank\" href=\"/zh-cn/news/view-2946.html\">22.“锂电池保护芯片”集成电路布图设计侵权案</a>               <span>编者按：2024年2月22日，最高人民法院发布了最高人民法院知识产权法庭成立五周年十大影响力案件案情介绍和100件典型案例名单。为方便社会各界了解相关案件基本情况，自2024年3月5日起，最高人民法院知识产权法庭微信公众号专设“五年百案”栏目，陆续发布100...</span>\r\n\t\t\t\t<i class=\"date\">2024-04-03 08:43:15</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"23.“空调专用微处理器控制芯片”技术开发合同案\" target=\"_blank\" href=\"/zh-cn/news/view-2947.html\">23.“空调专用微处理器控制芯片”技术开发合同案</a>               <span>编者按：2024年2月22日，最高人民法院发布了最高人民法院知识产权法庭成立五周年十大影响力案件案情介绍和100件典型案例名单。为方便社会各界了解相关案件基本情况，自2024年3月5日起，最高人民法院知识产权法庭微信公众号专设“五年百案”栏目，陆续发布100...</span>\r\n\t\t\t\t<i class=\"date\">2024-04-07 08:55:47</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"集成电路布图设计的独创性和芯片封装企业的责任认定\" target=\"_blank\" href=\"/zh-cn/news/view-3510.html\">集成电路布图设计的独创性和芯片封装企业的责任认定</a>               <span>集成电路布图设计的独创性和芯片封装企业的责任认定——（2022）最高法知民终565号近期，最高人民法院知识产权法庭审结一起侵害集成电路布图设计专有权纠纷上诉案件，在明确涉案布图设计独创性认定基础上，进一步阐述了芯片封装企业的责任认定标准以及将芯片...</span>\r\n\t\t\t\t<i class=\"date\">2024-10-09 09:10:46</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"人民日报 | 行法治之力 护农业“芯片”\" target=\"_blank\" href=\"/zh-cn/news/view-4184.html\">人民日报 | 行法治之力 护农业“芯片”</a>               <span>保护知识产权就是保护创新，对于种业发展尤为关键春天里，田野上，一粒粒良种破土而出、向阳生长，承载起端牢中国饭碗的希望。在深耕育种的农业专家眼中，耐住寂寞、埋头育种是前提，更大的挑战，往往在于新品种“入市”后的知识产权保护：种子“套牌”“白皮...</span>\r\n\t\t\t\t<i class=\"date\">2025-04-17 05:04:24</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"【新闻直播间】聚焦高端芯片等关键技术 最高法持续加大知识产权司法保护力度\" target=\"_blank\" href=\"/zh-cn/news/view-4216.html\">【新闻直播间】聚焦高端芯片等关键技术 最高法持续加大知识产权司法保护力度</a>               <span>最高人民法院今天（21日）召开新闻发布会，介绍人民法院知识产权司法保护工作的进展和成效，并发布《中国法院知识产权司法保护状况（2024年）》。点击观看数据显示，2024年，全国法院新收各类知识产权案件近53万件（其中一审47.99万件），审结54万余件（其中...</span>\r\n\t\t\t\t<i class=\"date\">2025-04-25 11:55:05</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"1平方厘米存储芯片背后的171起专利纠纷\" target=\"_blank\" href=\"/zh-cn/news/view-4353.html\">1平方厘米存储芯片背后的171起专利纠纷</a>               <span>数月争分夺秒，逐条把握50项权利要求，精准比照上百页行业标准，技术审查认定“标准必要专利”，南京中院实质性化解芯片专利纠纷，推动半导体高科技企业合作共赢——1平方厘米存储芯片背后的171起专利纠纷今年年初，在一场国际汽车电子产业峰会上，原告江波龙...</span>\r\n\t\t\t\t<i class=\"date\">2025-06-04 05:19:23</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"芯片封装企业的责任认定\" target=\"_blank\" href=\"/zh-cn/news/view-5689.html\">芯片封装企业的责任认定</a>               <span>芯片封装企业的责任认定——（2022）最高法知民终565号【裁判要旨】芯片在封装前后属于彼此独立的上下游产品，封装企业完成封装属于对上游产品的商业利用；在缺乏相关证据的情况下，不能当然认定封装企业知道或者有合理理由知道布图设计的权利状况。但是，布...</span>\r\n\t\t\t\t<i class=\"date\">2026-04-30 09:12:52</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t</ul>\r\n\r\n\t\t<div class=\"btm_row pagination clearfix\">\r\n\t\t\t\t\t\t\t<div class=\"fl count\">共<span class=\"num\">12</span>篇文章</div>\t\t\t\t\r\n\t\t\t\t\t\t\t\t\t\t</div>\t\t\r\n\t</div>\r\n</div>\r\n    <!-- footer -->\r\n    <div  class=\"footer en_footer\">\r\n        <div class=\"footer_border\">\r\n            <div class=\"footer_inner\">\r\n                <div class=\"wei\">\r\n                   