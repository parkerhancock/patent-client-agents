 <span>      12月12日上午，最高人民法院知识产权法庭“集中宣判周”第四天，公开宣判了一起“肝病无创诊断仪”侵害发明专利权纠纷案件。作为本案的法官助理，我向大家分享一下本案审理中的感受。本案件，二十多本卷宗、将近七万字的判决、双方当事人国内外互...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-12 07:45:46</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"最高法院知识产权法庭公布涉及“肝病无创诊断仪”专利的侵权纠纷二审案件判决（附判决书全文）\" target=\"_blank\" href=\"/zh-cn/news/view-273.html\">最高法院知识产权法庭公布涉及“肝病无创诊断仪”专利的侵权纠纷二审案件判决（附判决书全文）</a>               <span>扫码查看判决书全文</span>\r\n\t\t\t\t<i class=\"date\">2019-12-12 08:00:07</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"最高法院知识产权法庭“集中宣判周”收官：首例生物基因技术药物专利授权行政案件公开宣判\" target=\"_blank\" href=\"/zh-cn/news/view-274.html\">最高法院知识产权法庭“集中宣判周”收官：首例生物基因技术药物专利授权行政案件公开宣判</a>               <span>12月13日，最高人民法院知识产权法庭对首例生物基因技术药物专利申请复审行政案件公开宣判，维持一审判决，要求国家知识产权局重新作出审查决定。这标志着最高人民法院知识产权法庭2019年“集中宣判周”正式收官。 尚轶 摄作为“收官之作”的本案判决涉及名称...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-13 02:53:07</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"知识产权法庭首例生物基因技术药物专利案前情提要\" target=\"_blank\" href=\"/zh-cn/news/view-275.html\">知识产权法庭首例生物基因技术药物专利案前情提要</a>               <span>      最高人民法院知识产权法庭2019年“集中宣判周”迎来“收官之作”——法庭首例生物基因技术药物专利行政案件的公开宣判。本案是宣判案件中唯一的专利授权案件，涉及技术领域最为前沿，与创新联系最为直接，其确立的创造性判断标准将对科技创新产生...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-13 08:28:44</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"最高法院知识产权法庭公布“首例生物基因技术药物专利授权行政案件”判决（附判决书全文）\" target=\"_blank\" href=\"/zh-cn/news/view-276.html\">最高法院知识产权法庭公布“首例生物基因技术药物专利授权行政案件”判决（附判决书全文）</a>               <span>中华人民共和国最高人民法院行政判决书（2019）最高法知行终127号上诉人（原审被告）：国家知识产权局。住所地：中华人民共和国北京市海淀区蓟门桥西土城路6号。法定代表人：申长雨，该局局长。委托诉讼代理人：罗洋，该局审查员。委托诉讼代理人：史晶，该局...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 03:57:51</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"新华网：最高法知识产权法庭宣判首例生物基因技术药物专利授权行政案件\" target=\"_blank\" href=\"/zh-cn/news/view-278.html\">新华网：最高法知识产权法庭宣判首例生物基因技术药物专利授权行政案件</a>               <span>最高法知识产权法庭宣判首例生物基因技术药物专利授权行政案件最高人民法院知识产权法庭受理的首例生物基因技术药物专利申请复审行政案件13日公开宣判。法庭宣布维持一审判决，要求国家知识产权局重新作出审查决定。据介绍，该案涉及名称为“结合分子”的发明...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 05:36:25</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"中国新闻网：首例生物基因技术药物专利授权行政案件宣判\" target=\"_blank\" href=\"/zh-cn/news/view-280.html\">中国新闻网：首例生物基因技术药物专利授权行政案件宣判</a>               <span>首例生物基因技术药物专利授权行政案件宣判最高人民法院知识产权法庭13日对首例生物基因技术药物专利申请复审行政案件公开宣判，维持一审判决，要求中国国家知识产权局重新作出审查决定。本案判决涉及名称为“结合分子”的发明专利申请，属于单克隆抗体基因技...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 05:52:02</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"法制日报：首例生物基因技术药物专利授权行政案件公开宣判\" target=\"_blank\" href=\"/zh-cn/news/view-281.html\">法制日报：首例生物基因技术药物专利授权行政案件公开宣判</a>               <span>首例生物基因技术药物专利授权行政案件公开宣判最高人民法院知识产权法庭受理的首例生物基因技术药物专利申请复审行政案件今天公开宣判。法庭宣布维持一审判决，要求国家知识产权局重新作出审查决定。据介绍，该案涉及名称为“结合分子”的发明专利申请。“结...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 05:55:00</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"最高法知产法庭集中宣判周收官\n首例生物基因技术药物专利授权行政案件宣判\" target=\"_blank\" href=\"/zh-cn/news/view-284.html\">最高法知产法庭集中宣判周收官首例生物基因技术药物专利授权行政案件宣判</a>               <span>      12月13日上午，最高人民法院知识产权法庭对首例生物基因技术药物专利申请复审行政案件公开宣判，维持一审判决，要求国家知识产权局重新作出审查决定。这标志着最高人民法院知识产权法庭2019年“集中宣判周”正式收官。作为“收官之作”的本案判决...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 06:51:04</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"奏响激励创新时代最强音\n——评国家知产局与鹿特丹医学中心等发明专利申请驳回复审行政纠纷案\" target=\"_blank\" href=\"/zh-cn/news/view-285.html\">奏响激励创新时代最强音——评国家知产局与鹿特丹医学中心等发明专利申请驳回复审行政纠纷案</a>               <span>       2018年10月26日，第十三届全国人大常委会正式批准成立最高人民法院知识产权法庭，国家层面的知识产权案件上诉审理机制得以建成，自2019年3月27日敲响“第一槌”至今，最高人民法院知识产权法庭已经审理了一批技术类案件，通过集中统一的管辖体制...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 07:09:44</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"科技日报：最高人民法院知识产权法庭“集中宣判周”收官 首例生物基因技术药物专利授权行政案件公开宣判\" target=\"_blank\" href=\"/zh-cn/news/view-286.html\">科技日报：最高人民法院知识产权法庭“集中宣判周”收官 首例生物基因技术药物专利授权行政案件公开宣判</a>               <span>最高人民法院知识产权法庭“集中宣判周”收官 首例生物基因技术药物专利授权行政案件公开宣判最高人民法院知识产权法庭，13日对首例生物基因技术药物专利申请复审行政案件公开宣判，维持一审判决，要求国家知识产权局重新作出审查决定。这标志着最高人民法院...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-14 08:20:34</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"张广良：专利侵权判定规则的进一步完善\" target=\"_blank\" href=\"/zh-cn/news/view-289.html\">张广良：专利侵权判定规则的进一步完善</a>               <span>      近日，最高人民法院知识产权法庭就敦骏公司诉腾达公司专利侵权纠纷案公开进行了宣判。最高人民法院在此案中确立了网络通信领域中的多主体实施的方法专利的侵权判定标准，即“不可替代的实质性作用”标准，引起知识产权圈内人士的高度关注，并对 “...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-16 04:22:24</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t\t\t<li>\r\n\t\t\t\t<a title=\"人民法院报：专利侵权判定规则的进一步完善\" target=\"_blank\" href=\"/zh-cn/news/view-292.html\">人民法院报：专利侵权判定规则的进一步完善</a>               <span>专利侵权判定规则的进一步完善——以满足产业创新和实质化保护需求为目标中国人民大学法学院教授 张广良12月10日，最高人民法院知识产权法庭就敦骏公司诉腾达公司专利侵权纠纷案公开进行了宣判。最高人民法院在此案中确立了网络通信领域中的多主体实施的方法...</span>\r\n\t\t\t\t<i class=\"date\">2019-12-17 04:08:53</i>\r\n\t\t\t</li>\r\n\t\t\t\t\t</ul>\r\n\r\n\t\t<div class=\"btm_row pagination clearfix\">\r\n\t\t\t\t\t\t\t<div class=\"fl count\">共<span class=\"num\">556</span>篇文章</div>\t\t\t\t\r\n\t\t\t\t\t<a href=\"/search/index/content/%E4%B8%93%E5%88%A9/lang/zh-cn.html\">首页</a>\n<a href=\"/search/index/content/%E4%B8%93%E5%88%A9/lang/zh-cn.html\">上一页</a>\n<a href=\"/search/index/content/%E4%B8%93%E5%88%A9/lang/zh-cn.html\">1</a>\n<span class='current'>28</span>\n<a href=\"/search/index/content/%E4%B8%93%E5%88%A9/page/3/lang/zh-cn.html\">下一页</a>\n<a href=\"/search/index/content/%E4%B8%93%E5%88%A9/page/28/lang/zh-cn.html\">尾页</a>\t\t\t\t\t</div>\t\t\r\n\t</div>\r\n</div>\r\n    <!-- footer -->\r\n    <div  class=\"footer en_footer\">\r\n        <div class=\"footer_border\">\r\n            <div class=\"footer_inner\">\r\n                <div class=\"wei\">\r\n                    <dl>\r\n                        <dt><img src=\"/style/system/images/wei.jpg\" /></dt>\r\n                        <dd>官方微信</dd>\r\n                    </dl>\r\n                </div>\r\n\r\n                <!-- <div class=\"bottomnav\">\r\n                    <dl class=\"link_title\">\r\n                        <dd>友情链接