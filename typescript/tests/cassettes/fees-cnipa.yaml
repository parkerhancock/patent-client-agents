      content: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\t<meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge,chrome=1\"/>\n\t<meta name=\"renderer\" content=\"webkit\">\n\t<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n\t<meta name=\"format-detection\" content=\"telephone=no\">\n\t<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1, user-scalable=no\"/>\n\t<meta charset=\"UTF-8\"><script language=\"javascript\" src=\"/module/jslib/jquery/jquery.js\"></script>\n<script language=\"javascript\" src=\"/module/jslib/urite/urite.min.js\"></script>\n<link href=\"/module/jslib/tag/css/infotag.css\" type=text/css rel=stylesheet>\n\n<link href=\"/script/pagegray.css\" type=text/css rel=stylesheet>\n<meta name='WebId' content='2'>\n\n\t<link href=\"/images/100/hanweb.css\" rel=\"stylesheet\">\n\t<link href=\"/images/100/public.css\" rel=\"stylesheet\">\n\t<script src=\"/images/100/rem.js\"></script>\n\t<script src=\"/images/100/public.js\"></script>\n\t<title>China National Intellectual Property Administration Fees</title>\n<meta name='Maketime' content='2024-05-06 10:58:54'>\n<meta name=\"SiteName\" content=\"China National Intellectual Property Administration\">\n<meta name=\"SiteDomain\" content=\"https://english.cnipa.gov.cn\">\n<meta name=\"SiteIDCode\" content=\"\">\n<meta name=\"ColumnName\" content=\"Fees\">\n<meta name=\"ColumnDescription\" content=\"Fees\">\n<meta name=\"ColumnKeywords\" content=\"Fees\">\n<meta name=\"ColumnType\" content=\"Fees\">\n<meta name=\"channel\" content=\"Fees\">\r\n<meta name=\"chnlcatalog\" content=\"\">\r\n<meta name=\"server\" content=\"https://english.cnipa.gov.cn/col/col3000/index.html\">\r\n<meta name=\"i_webid\" content=\"2\">\r\n<meta name=\"i_columnid\" content=\"3000\">\r\n<meta name=\"i_articleid\" content=\"0\">\r\n<meta name=\"pagetype\" content=\"2\">\n</head>\n<body><div id='hiddenLocation' style='display:none;'><span id='ss_webid'>2</span><span id='col3_name'>Resources</span><span id='col3_url'>/col/col2940/index.html</span><span id='col2_name'>Patent</span><span id='col2_url'>/col/col2949/index.html</span><span id='col1_name'>Fees</span><span id='col1_url'>/col/col3000/index.html</span></div>\n<script src=\"/script/0/2208091057555841.js\"></script>\n\n<!---当前位置--->\n<div class=\"en_cur\">\r\n  <div class=\"w1200  en_pad10\">\r\n    <div class=\" en_cor  en_sm\"><table cellspacing=\"0\"cellpadding=\"0\"border=\"0\"><tr><td><a href=\"https://english.cnipa.gov.cn/index.html\"class=\"bt_link\">Home</a></td><td><table width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\">\n<tr>\n<td>><a href=\"https://english.cnipa.gov.cn/col/col2940/index.html\"class=\"bt_link\">Resources</a></td><td>><a href=\"https://english.cnipa.gov.cn/col/col2949/index.html\"class=\"bt_link\">Patent</a></td><td>><a href=\"https://english.cnipa.gov.cn/col/col3000/index.html\"class=\"bt_link\">Fees</a></td>\n</tr></table></td></tr></table> </div>\r\n  </div>\r\n</div>\n<!---主体--->\n\n<div class=\"w1200\">\n\t<!---一级栏目--->\n\t  <div class=\"column_first\">\r\n  <a href=\"/col/col2940/index.html\">Resources</a>\r\n</div>\n\t<div class=\"column_content\">\n\n\t\t<div class=\"w775\">\n\t\t\t<!---二级栏目--->\n\t\t\t<div class=\"column_second\"><ul><li><a href=\"/col/col2949/index.html\">Patent</a></li><li><a href=\"/col/col2950/index.html\">Trademark</a></li><li><a href=\"/col/col2951/index.html\">Geographical Indication</a></li><li><a href=\"/col/col2952/index.html\">Layout-design of Integrated Circuit</a></li> </ul> </div>\n\t\t\t<!---三级栏目--->\n\t\t\t<div class=\"column_thred\"><ul><li><a href=\"https://pss-system.cponline.cnipa.gov.cn/conventionalSearchEn \"target=\"_blank\" \">Patent Search</a></li><li><a href=\"/col/col2999/index.html\">Procedure</a></li><li><a href=\"/col/col3000/index.html\">Fees</a></li><li><a href=\"/col/col2977/index.html\">PCT</a></li><li><a href=\"https://english.cnipa.gov.cn/col/col2905/index.html \"target=\"_blank\" \">Geneva Act (Hague Agreement)</a></li><li><a href=\"/col/col3002/index.html\">Administrative Adjudication</a></li><li><a href=\"/col/col3189/index.html\">Authority File</a></li> </ul> </div>\n\t\t\t\r\n\r\n<div class=\"en_con\">\r\n<div class=\"en_article\">\r\n  <!--ZJEG_RSS.content.begin--><meta name=\"ContentStart\"/><p style=\"text-align: left;\">I. Payment Methods</p><p style=\"text-align: left;\">Applicants may choose the following payment methods:</p><p style=\"text-align: left;\">1. Online: China National Intellectual Property Administration&#39;s web-site <a href=\"http://cponline.cnipa.gov.cn\">http://cponline.cnipa.gov.cn</a></p><p style=\"text-align: left;\">2. Through Banks/Post Offices: Applicants may remit the payment to the Patent Office or its 34 local patent receiving agencies. The applicants should indicate the patent number and other necessary payment information for remittance.</p><p style=\"text-align: left;\">3. At Patent Office or Local Patent Receiving Agencies: Cash, checks, bank cards (debit and credit), mobile payment (WeChat, Alipay, UnionPay).&nbsp;</p><p style=\"text-align: left;\">In particular, fees for the Patent Cooperation Treaty (PCT) international phase can only be paid online, by remittance to the bank account of the Patent Office, or by going to the Patent Office in person. No other payment method is accepted.</p><p style=\"text-align: left;\">II. Patent Fee Schedule</p><p style=\"text-align: center;\">Patent Fee Schedule (In CNY)</p><div align=\"center\"><table style=\"border-collapse:collapse;border:none;\" cellspacing=\"0\" cellpadding=\"0\" border=\"1\"><tbody><tr style=\"height:61px;\"><td colspan=\"2\" style=\"border: 1px solid windowtext; padding: 0px 7px; word-break: break-all;\" width=\"568\" height=\"61\"><p style=\"text-align: left;\">Patent Fees – Domestic</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">I.Filing Fee</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\"><p style=\"text-align: left;\">1. Invention</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">900</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">2. Utility Model</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">500</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">3. Design</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">500</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">II.Additional Fee for Filing an Application &nbsp;</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1.Additional fee for each claim Exceeds 10 items</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">150</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><div style=\"text-align: left;\"><p style=\"text-align: left;\">2.Additional fee for each page of the Description of the Application Documents Exceeds page 30</p></div></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">50</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">Additional fee for each page of the Description of the Application Documents Exceeds page 300</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">100</p></td></tr><tr><td style=\"border-color: currentco