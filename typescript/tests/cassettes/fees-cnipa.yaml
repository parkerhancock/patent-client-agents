all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">VI.Reexamination Fee</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1. Invention</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1000</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">2. Utility Model</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">300</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">3. Design</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">300</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">VII.Annual Fee</p