order-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">3.Design</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1-3 Years (Each Year)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">600</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">4-5 Years (Each Year)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">900</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">6-8 Years (Each Year)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1200</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">9-10 Years (Each Year)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2000</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">11-15 Years (Each Year)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">3000</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">VIII. <a>Surcharge</a></p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">The amount of the surcharge shall be, for each month of late payment, 5% of the whole amount of the annual fee of the year within which the annual fee is due to be paid.</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">IX.Fee for Requesting Restoration of Right</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1000</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">X.Fee for Requesting Extension of Time Limit</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1.Fee for First Requesting Extension of Time Limit (Each Month)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">300</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">2. Fee for Second Requesting Extension of Time Limit (Each Month)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2000</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">XI.Fee for Making a Change in the Bibliographic Data</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1.Change of Inventor, Applicant, Patentee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">200</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">XII.Fee for Requesting for Evaluation Report of Patent</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1.Utility Model</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2400</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">2.Design</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2400</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">XIII.Fee for Requesting for Announcement of Invalidation of Patent</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\"><p style=\"text-align: left;\">1. Invention</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">3000</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">2. Utility Model</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1500</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">3. Design</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1500</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">XIV.Fee for Certification of Copies of Patent Document (Each Copy)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">30</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">Note:</p><p style=\"text-align: left;\">1. Reduction of payment for applicants or patentees having difficulties paying the fees are subject to the rules in the Measure on Reduction of Payment of Patent Fees.</p><p style=\"text-align: left;\">2.In case the applications for invention patent have already entered the substantive examination phase, but the applicant voluntarily withdraws the application prior to the expiration of the period for response to the first office action (except when a response to the office action has already been submitted), the applicant may request reimbursement of 50% of the fee for substantive examination.&nbsp;&nbsp;</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">Patent Fees – PCT Filing Fees</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">I.PCT Filing – International Phase</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">1.Fees Charged by CNIPA for WIPO&#39;s International Bureau</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">The fee schedule and reduction provisions of the fees charged by the China National Intellectual Property Administration (CNIPA) for the International Bureau (IB) of the World Intellectual Property Organization (WIPO) are subject to the provisions in the Regulations under the Patent Cooperation Treaty (PCT). Pursuant to A Memorandum of Understanding Concerning PCT Fees between the two organizations, from December 1, 2021, CNY formallybecame the pricing and clearing currency for international fees of PCT applications. The international fees for the PCT applications received on and later than December 1, 2021, and the handling fees for the request for the PCT international preliminary examination received on and later than December 1, 2021, both paid to the CNIPA, shall be subject to the CNY-based fee schedule available in the PCT section on the CNIPA website.</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">2.Fees Charged by CNIPA</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(1) Search Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2100</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">Additional Search Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2100</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(2) Priority Document Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">150</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(3) Preliminary Examination Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1500</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">Additional Preliminary Examination Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1500</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(4) Protest of the Unity of Invention Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">200</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(5)Copy Document Fee (Each Page)</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">2</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(6) Late Furnishing Fee</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">200</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">(7)Fee for Requesting Restoration of Right</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1000</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">(8)Surcharge is 50% of the unpaid fee. If the amount exceeds 50% of the international application fee (excluding the supplemental fee for filing), 50% of the international application fee should be charged.</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">II.PCT Applications Entering China&#39;s National Phase</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">1. Surcharge for the Late Entry</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1000</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">2. Fee for Correction of Translation</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">Preliminary Examination Phase</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">300</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">Substantive Examination Phase</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1200</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">3. Restoration Fee for Unity</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">900</p></td></tr><tr><td style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"395\" valign=\"top\"><p style=\"text-align: left;\">4. Restoration Fee for Priority Rights</p></td><td style=\"border-color: currentcolor windowtext windowtext currentcolor; border-style: none solid solid none; border-width: medium 1px 1px medium; padding: 0px 7px; word-break: break-all;\" width=\"173\" valign=\"top\"><p style=\"text-align: left;\">1000</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">Policy for other fees of PCT applications entering China&#39;s national phase is in accordance with the domestic section.&nbsp;</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">Patent Fees – International Design Filing Fees</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">International design applications are subject to the payment of following fees to the IB of WIPO: basic fee, publication fee, and standard designation fee or individual designation fee for each contracting party where protection is sought. Fees are governed by Common Regulations Under the 1999 Act and the 1906 Act of the Hague Agreement. WIPO&#39;s website offers the schedule of fees and a fee calculator. Under CNIPA Announcement No. 481 Interim Measures of Related Provisions after Accession to Hague Agreement, applicants shall pay all the fees stated in the Hague Agreement directly to the IB.</p><p style=\"text-align: left;\">Fees payable during the national phase of the international design applications designating China are in accordance with the domestic section.</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">Patent Fees – Charge as Agreed</p></td></tr><tr><td colspan=\"2\" style=\"border-color: currentcolor windowtext windowtext; border-style: none solid solid; border-width: medium 1px 1px; border-image: none 100% / 1 / 0 stretch; padding: 0px 7px; word-break: break-all;\" width=\"568\" valign=\"top\"><p style=\"text-align: left;\">Where CNIPA performs search and examination service for patent applications of other countries and regions, fees are subject to the fee schedule agreed by the two parties.</p></td></tr></tbody></table></div><meta name=\"ContentEnd\"/><!--ZJEG_RSS.content.end-->\r\n</div></div>\r\n\n\n\t\t</div>\n\t\t<script src=\"/script/0/2209151708433190.js\"></script>\n\t</div>\n</div>\n<!---底部--->\n<script src=\"/script/0/2208091057557201.js\"></script>\n\r\n<script language=\"javascript\"> $(\".column_second li\").each(function(){if($(this).find(\"a\").text().replace(/s+/g,\"\")==\"Patent\".replace(/s+/g,\"\")){$(this).addClass(\"cur\");}}) </script>\r\n  \r\n\n\r\n<script language=\"javascript\"> $(\".column_thred li\").each(function(){if($(this).find(\"a\").text().replace(/s+/g,\"\")==\"Fees\".replace(/s+/g,\"\")){$(this).addClass(\"cur\");}}) </script>\r\n  \r\n\n\n<!-- visitcount Begin --><iframe src='../../module/visitcount/visit.jsp?type=3&i_webid=2&i_columnid=3000&i_articleid=178639' name=\"vishidden\" id=\"vishidden\" frameborder=\"0\" style=\"width:0; height:0; display:none\"></iframe><!-- visitcount End -->\n\n</body>\n</html>"
