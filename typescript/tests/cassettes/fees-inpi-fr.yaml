          <div>
            <div class="visually-hidden">Contenu</div>
                      <div><p>Une réduction de 50 % sur les principales redevances de procédure sur les brevets peut être accordée :</p><ul><li data-list-item-id="ee9675b5db72148f0481cfe41c68a136f">Aux personnes physiques ;</li><li data-list-item-id="e37648ad3b7e780bde94b45d15b1edca3">Aux petites et moyennes entreprises (PME) de moins de 250 salariés, dont le capital n’est pas détenu à plus de 25 % par une entité ne remplissant pas ces premières conditions ;</li><li data-list-item-id="e8f6568b9a6b192c99773e95ad03304f1">Aux organismes à but non lucratif (OBNL) du secteur de l’enseignement ou de la recherche.</li></ul><p>La demande de réduction, avec la catégorie à laquelle appartient le demandeur, doit être effectuée lors du dépôt de la demande de brevet.</p></div>
