          <section itemprop="claims" itemscope>
            <h2>Claims (<span itemprop="count">7</span>)</h2>
            <aside>Translated from <span itemprop="translatedLanguage">Japanese</span></aside>
            <div itemprop="content" html><claims mxw-id="PCLM176347116" lang="EN" load-source="google">
            <claim num="1">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          細胞を培養する細胞培養装置であって、<br/>
          培養液を有する容器と、<br/>
          複数の細胞塊を含む前記培養液の画像を取得する細胞観察手段と、<br/>
          前記細胞観察手段により取得された画像に基づき、細胞塊のサイズを計測する計測手段と、<br/>
          前記計測手段により計測した細胞塊のサイズが閾値を超えた場合に、当該閾値を超えた細胞塊に対し超音波を照射する超音波照射手段と、を有することを特徴とする細胞培養装置。
        </span>A cell culture device for culturing cells, <br/> A container having a culture solution; <br/> Cell observation means for acquiring an image of the culture solution containing a plurality of cell masses; <br/> Based on the image acquired by the cell observation means, measurement means for measuring the size of the cell mass, <br/> An ultrasonic irradiation means for irradiating an ultrasonic wave to the cell mass exceeding the threshold when the size of the cell mass measured by the measurement means exceeds the threshold.</span>
              </claim-text>
            </claim>
            <claim num="2">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          請求項１に記載の細胞培養装置において、<br/>
          前記培養液を攪拌する攪拌手段を有し、<br/>
          前記細胞観察手段は前記攪拌手段により攪拌された培養液の画像を取得することを特徴とする細胞培養装置。
        </span>The cell culture device according to claim 1, <br/> A stirring means for stirring the culture solution; <br/> The cell culturing device, wherein the cell observation means acquires an image of the culture solution stirred by the stirring means.</span>
              </claim-text>
            </claim>
            <claim num="3">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          請求項２に記載の細胞培養装置において、<br/>
          前記細胞観察手段は予め定められた領域を撮影するように固定されていることを特徴とする細胞培養装置。
        </span>The cell culture device according to claim 2, <br/> The cell culturing apparatus, wherein the cell observation means is fixed so as to photograph a predetermined region.</span>
              </claim-text>
            </claim>
            <claim num="4">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          請求項１乃至３のいずれか一項に記載の細胞培養装置において、<br/>
          前記計測手段は計測する細胞塊のサイズは、細胞塊の直径であることを特徴とする細胞培養装置。
        </span>In the cell culture device according to any one of claims 1 to 3, <br/> The cell culture apparatus characterized in that the size of the cell mass measured by the measuring means is the diameter of the cell mass.</span>
              </claim-text>
            </claim>
            <claim num="5">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          請求項１乃至４のいずれか一項に記載の細胞培養装置において、<br/>
          前記培養液全体のうち前記閾値を超えた細胞塊は、前記超音波照射手段による超音波の照射範囲に含まれ、<br/>
          前記培養液全体のうち前記閾値を超えない細胞塊は、前記超音波照射手段による超音波の照射範囲に含まれないことを特徴とする細胞培養装置。
        </span>In the cell culture device according to any one of claims 1 to 4, <br/> The cell mass that exceeds the threshold value in the whole culture solution is included in the ultrasonic irradiation range by the ultrasonic irradiation means, <br/> A cell mass that does not exceed the threshold in the whole culture solution is not included in the ultrasonic irradiation range by the ultrasonic irradiation means.</span>
              </claim-text>
            </claim>
            <claim num="6">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          請求項１乃至５のいずれか一項に記載の細胞培養装置において、<br/>
          前記培養液の一部を循環させる流路を有し、<br/>
          前記流路を流れる培養液の画像を取得することを特徴とする細胞培養装置。
        </span>In the cell culture device according to any one of claims 1 to 5, <br/> Having a flow path for circulating a part of the culture solution; <br/> A cell culture device characterized by acquiring an image of a culture solution flowing through the flow path.</span>
              </claim-text>
            </claim>
            <claim num="7">
              <claim-text>
                <span class="notranslate"> <span class="google-src-text">
          請求項１乃至６のいずれか一項に記載の細胞培養装置において、<br/>
          前記容器の一部または全体が透明であることを特徴とする細胞培養装置。
        </span>In the cell culture device according to any one of claims 1 to 6, <br/> A cell culture apparatus, wherein a part or the whole of the container is transparent.</span>
              </claim-text>
            </claim>
          </claims>
