            <meta name="description" content="
             
              There is currently no method for controlling the diameter of cell mass suitable for suspension culture for mass production. Then, in view of the above situation, an object of the present invention is to provide a method for controlling the diameter of a cell mass and a cell culture apparatus to which the control method is applied. A culture apparatus according to the present invention controls the diameter of a cell mass by applying ultrasonic waves to a relatively large cell mass while floating in a culture solution. [Selection] Figure 1
             
           
