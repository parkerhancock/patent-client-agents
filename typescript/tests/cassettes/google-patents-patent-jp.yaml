          <section itemprop="abstract" itemscope>
            <h2>Abstract</h2>
            <aside>Translated from <span itemprop="translatedLanguage">Japanese</span></aside>
            <div itemprop="content" html><abstract mxw-id="PA296411338" lang="EN" source="national office" load-source="google">
            <p>
              <span class="notranslate"> <span class="google-src-text">【課題】現在、大量生産を目的とした、浮遊培養に適した細胞塊の直径制御方法は存在しない。そこで、本発明は、上述したような実情に鑑み、細胞塊の直径を制御する方法、当該制御方法を適用した細胞培養装置を提供することを目的とする。【解決手段】本発明に係る培養装置は、培養液中に浮遊する中で比較的に大きい細胞塊に超音波付与を行うことで、細胞塊の直径を制御する。【選択図】 図１</span>There is currently no method for controlling the diameter of cell mass suitable for suspension culture for mass production. Then, in view of the above situation, an object of the present invention is to provide a method for controlling the diameter of a cell mass and a cell culture apparatus to which the control method is applied. A culture apparatus according to the present invention controls the diameter of a cell mass by applying ultrasonic waves to a relatively large cell mass while floating in a culture solution. [Selection] Figure 1</span>
            </p>
          </abstract>
          </div>
          </section>
        
          <section itemprop="description" itemscope>
            <h2>Description</h2>
            <aside>Translated from <span itemprop="translatedLanguage">Japanese</span></aside>
            <div itemprop="content" html><description mxw-id="PDES182469922" lang="EN" load-source="google">
            <technical-field>
              <p num="0001">
                <span class="notranslate"> <span class="google-src-text">
          本発明は、人工多能性細胞のような細胞を培養する細胞培養装置に関する。
        </span>
          The present invention relates to a cell culture apparatus for culturing cells such as artificial pluripotent cells.
        </span>
              </p>
            </technical-field>
            <background-art>
              <p num="0002">
                <span class="notranslate"> <span class="google-src-text">
          動物細胞は、主に医療や医薬品等の産業で利用される。動物細胞の一種である幹細胞(人工多能性細胞など)は、様々な細胞に分化することが可能である。近年、幹細胞は損傷した臓器などを治療する、再生医療用の細胞性医薬品として利用され始めている。細胞性医薬品の生産は、幹細胞を培養し、増殖させることで得ることができる。
        </span>
          Animal cells are mainly used in the medical and pharmaceutical industries. Stem cells (such as induced pluripotent cells), which are a kind of animal cells, can differentiate into various cells. In recent years, stem cells have begun to be used as cellular medicines for regenerative medicine that treat damaged organs and the like. Cellular pharmaceutical production can be obtained by culturing and proliferating stem cells.
        </span>
              </p>
              <p num="0003">
                <span class="notranslate"> <span class="google-src-text">
          従来、再生医療で用いられる動物細胞の培養方法には接着培養が用いられてきた。接着培養は細胞を培養容器に接着させ培養する方法である。今まで、再生医療は細胞シートなど接着培養を用いた少量生産で行われてきた。幹細胞の一種である人工多能性細胞は、細胞塊を形成して増殖する。その細胞塊の直径は人工多能性細胞の特性(未分化状態、生存率)に影響を与える。そのため、人工多能性細胞など一部の細胞では、細胞塊の直径制御が必要である。この直径制御は細胞塊に物理的な力を加えて行われる。ここで言う物理的な力とは、ピペッティング操作で細胞に加えられるせん断応力などである。少量生産を目的とした接着培養では、人工多能性細胞の細胞塊への力の加え方に手作業によるピペッティングが用いられてきた。
        </span>
          Conventionally, adhesion culture has been used as a method for culturing animal cells used in regenerative medicine. Adhesion culture is a method in which cells are adhered to a culture vessel and cultured. Until now, regenerative medicine has been carried out in small-scale production using adhesion culture such as cell sheets. Artificial pluripotent cells, which are a type of stem cell, form a cell mass and proliferate. The diameter of the cell mass affects the properties (undifferentiated state, survival rate) of the induced pluripotent cells. Therefore, in some cells such as artificial pluripotent cells, it is necessary to control the diameter of the cell mass. This diameter control is performed by applying physical force to the cell mass. The physical force referred to here is a shear stress applied to cells by pipetting operation. In adhesion culture for the purpose of small-scale production, manual pipetting has been used to apply force to the cell mass of artificial pluripotent cells.
        </span>
              </p>
              <p num="0004">
                <span class="notranslate"> <span class="google-src-text">
          一般的に再生医療によって心疾患などを治療する場合は、幹細胞から心筋細胞に分化させた細胞が10<sup>9</sup>個必要になる。現在幹細胞の培養で主に用いられている接着培養の場合、一般的に用いられる直径10cmの培養皿1枚に、10<sup>7</sup>個程度の幹細胞を培養するのが限界である。もし接着培養で10<sup>9</sup>個の細胞を生産する場合、100枚の培養皿が必要となる。100枚の培養皿の培養、維持には多大な労力がかかってしまうため、接着培養は大量生産に向かない。
        </span>In general, when treating heart disease or the like by regenerative medicine, 10 <sup>9</sup> cells differentiated from stem cells into cardiomyocytes are required. In the case of adhesion culture, which is currently used mainly for culturing stem cells, the limit is that about 10 <sup>7</sup> stem cells can be cultured in one commonly used culture dish having a diameter of 10 cm. If 10 <sup>9</sup> cells are produced by adhesion culture, 100 culture dishes are required. Adhesive culture is not suitable for mass production because it takes a lot of labor to culture and maintain 100 culture dishes.</span>
              </p>
              <p num="0005">
                <span class="notranslate"> <span class="google-src-text">
          大量培養技術の１つとして、浮遊系培養技術の適用が検討されている。浮遊系培養でも、人工多能性細胞の場合細胞塊の直径が特性の維持に関わる。そのため、人工多能性細胞では、浮遊培養でも細胞塊の直径制御が必要である。人工多能性細胞の浮遊培養では、効率的に大量の細胞塊の直径を制御する必要がある。
        </span>
          As one of the mass culture techniques, application of a suspension culture technique is being studied. Even in suspension culture, in the case of induced pluripotent cells, the diameter of the cell mass is involved in maintaining the characteristics. Therefore, in artificial pluripotent cells, it is necessary to control the diameter of the cell mass even in suspension culture. In suspension culture of induced pluripotent cells, it is necessary to efficiently control the diameter of a large amount of cell mass.
        </span>
              </p>
              <p num="0006">
                <span class="notranslate"> <span class="google-src-text">
          従来技術では、浮遊培養において、細胞塊の直径を制御する方法として、メッシュを適応している。この制御方法は、一度に多くの細胞塊に適応可能だが、メッシュの目詰まりが問題になってしまう。実用化した際、メッシュの交換作業により、コストと作業効率が悪くなる可能性が高い。
        </span>
          In the prior art, mesh is applied as a method for controlling the diameter of a cell mass in suspension culture. This control method can be applied to many cell clusters at once, but mesh clogging becomes a problem. When put into practical use, there is a high possibility that the cost and work efficiency will deteriorate due to the replacement work of the mesh.
        </span>
              </p>
              <p num="0007">
                <span class="notranslate"> <span class="google-src-text">
          細胞塊に物理的な力を加える手段として、超音波を細胞に照射する手法が考えられる。従来の細胞に対する超音波の処理例は以下の通りである。特許文献１では、培養槽と攪拌翼と超音波照射手段を有する細胞培養装置が記載され、超音波を培養槽壁面に付着した細胞に照射することで、細胞を剥離する方法が開示されている。しかし、この方法は培養槽内の細胞全体に超音波を当ててしまうため、細胞によっては余分な物理的ストレスを受ける。
        </span>
          As a means for applying a physical force to the cell mass, a method of irradiating cells with ultrasonic waves can be considered. The example of the process of the ultrasonic wave with respect to the conventional cell is as follows. <figure-callout id="1" label="Patent Document" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">Patent Document</figure-callout> 1 describes a cell culture device having a culture tank, a stirring blade, and an ultrasonic irradiation means, and discloses a method of detaching cells by irradiating the cells attached to the wall of the culture tank with ultrasonic waves. . However, since this method applies ultrasonic waves to the entire cells in the culture tank, some cells are subjected to extra physical stress.
        </span>
              </p>
              <p num="0008">
                <span class="notranslate"> <span class="google-src-text">
          また超音波を細胞に照射する例として、特許文献２には、容器に付着した接着培養に対して局所的に超音波を与え、所望の細胞を培養容器から剥離する方法が記載されている。この超音波照射方法は、局所的な超音波付与が可能で、細胞に余分なストレスを与えることは無い。しかし、特許文献１と同様に、付着した細胞を剥すことを目的とした有効な技術であり、培養液中に浮遊する特定の細胞のみに超音波を照射することはできない。
        </span>
          As an example of irradiating cells with ultrasonic waves, Patent Document 2 describes a method in which ultrasonic waves are locally applied to an adhesion culture attached to a container and desired cells are detached from the culture container. This ultrasonic irradiation method can apply a local ultrasonic wave and does not apply extra stress to the cells. However, as in <figure-callout id="1" label="Patent Document" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">Patent Document</figure-callout> 1, it is an effective technique for the purpose of peeling attached cells, and it is not possible to irradiate only specific cells floating in the culture solution with ultrasonic waves.
        </span>
              </p>
            </background-art>
            <citation-list>
              <patent-literature>
                <p num="0009">
                  <patcit num="1">
                    <text>
                      <span class="notranslate"> <span class="google-src-text">特開平６−１４１８５０号公報</span>JP-A-6-141850</span>
                    </text>
                  </patcit>
                  <patcit num="2">
                    <text>
                      <span class="notranslate"> <span class="google-src-text">特開２０１４−１８１８５号公報</span>JP 2014-18185 A</span>
                    </text>
                  </patcit>
                </p>
              </patent-literature>
            </citation-list>
            
            <summary-of-invention>
              <tech-problem>
                <p num="0010">
                  <span class="notranslate"> <span class="google-src-text">
          現在、大量生産を目的とした、浮遊培養に適した細胞塊の直径制御方法は存在しない。そこで、本発明は、上述したような実情に鑑み、細胞塊の直径を制御する方法、当該制御方法を適用した細胞培養装置を提供することを目的とする。
        </span>
          Currently, there is no method for controlling the diameter of cell mass suitable for suspension culture for mass production. Then, in view of the above situation, an object of the present invention is to provide a method for controlling the diameter of a cell mass and a cell culture device to which the control method is applied.
        </span>
                </p>
              </tech-problem>
              <tech-solution>
                <p num="0011">
                  <span class="notranslate"> <span class="google-src-text">
          本発明に係る培養装置は、培養液中に浮遊する中で比較的に大きい細胞塊に超音波付与を行うことで、細胞塊の直径を制御する。
        </span>
          The culture apparatus according to the present invention controls the diameter of a cell mass by applying ultrasonic waves to a relatively large cell mass while floating in a culture solution.
        </span>
                </p>
              </tech-solution>
              <advantageous-effects>
                <p num="0012">
                  <span class="notranslate"> <span class="google-src-text">
          培養時に細胞塊の直径を容易に制御可能な細胞培養装置を提供できる。
        </span>
          A cell culture device capable of easily controlling the diameter of a cell mass during culture can be provided.
        </span>
                </p>
              </advantageous-effects>
            </summary-of-invention>
            
            <description-of-drawings>
              <p num="0013">
                <figref num="1">
                  <span class="notranslate"> <span class="google-src-text">本実施形態に係る細胞培養装置の一例である。</span>It is an example of the cell culture apparatus which concerns on this embodiment.</span>
                </figref>
                <figref num="2">
                  <span class="notranslate"> <span class="google-src-text">実施例２に係る細胞培養装置である。</span>2 is a cell culture device according to Example 2.</span>
                </figref>
                <figref num="3">
                  <span class="notranslate"> <span class="google-src-text">実施例３に係る細胞培養装置である。</span>3 is a cell culture device according to Example 3.</span>
                </figref>
                <figref num="4">
                  <span class="notranslate"> <span class="google-src-text">実施例４に係る細胞培養装置である。</span>4 is a cell culture device according to Example 4;</span>
                </figref>
                <figref num="5">
                  <span class="notranslate"> <span class="google-src-text">実施例５に係る細胞培養装置である。</span>10 is a cell culture device according to Example 5.</span>
                </figref>
              </p>
            </description-of-drawings>
            <description-of-embodiments>
              <p num="0014">
                <span class="notranslate"> <span class="google-src-text">
          以下、本実施形態に係る細胞培養装置を、図面を参照して詳細に説明する。本実施形態に係る細胞培養装置は、例えば、細胞自体が医薬品となる細胞の培養に適用できる。また、培養対象の細胞は、動物細胞、植物細胞、昆虫細胞、細菌、酵母、真菌及び藻類などをあげることができる。特に、iPS細胞などの細胞塊を凝集して培養する細胞が好ましい。
        </span>
          Hereinafter, the cell culture device according to the present embodiment will be described in detail with reference to the drawings. The cell culture device according to the present embodiment can be applied, for example, to culture of cells in which the cells themselves are pharmaceuticals. Examples of cells to be cultured include animal cells, plant cells, insect cells, bacteria, yeasts, fungi, and algae. In particular, cells in which cell clusters such as iPS cells are aggregated and cultured are preferred.
        </span>
              </p>
              <p num="0015">
                <span class="notranslate"> <span class="google-src-text">
          図１に本実施形態に係る細胞培養装置の一例を模式的に示す。細胞培養装置２０は容器本体１を備える。容器本体１は、大きさが異なる複数の細胞の凝集体である細胞塊を含む培養液３と、培養液３を攪拌する攪拌手段２と、超音波を発信する端子である超音波発信端子４とを有する。超音波発信端子４は培養液３の液面に接し、かつ蓋体８に配設されている。
        </span>
          FIG. 1 schematically shows an example of a cell culture device according to the present embodiment. The cell culture device 20 includes a <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1. The <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1 includes a <figure-callout id="3" label="culture solution" filenames="2019000001-7.png" state="{{state}}">culture solution</figure-callout> 3 including a cell mass that is an aggregate of a plurality of cells having different sizes, an agitation unit 2 that agitates the <figure-callout id="3" label="culture solution" filenames="2019000001-7.png" state="{{state}}">culture solution</figure-callout> 3, and an <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 that is a terminal that transmits ultrasonic waves. And have. The <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 is in contact with the liquid surface of the <figure-callout id="3" label="culture solution" filenames="2019000001-7.png" state="{{state}}">culture solution</figure-callout> 3 and is disposed on the <figure-callout id="8" label="lid body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">lid body</figure-callout> 8.
        </span>
              </p>
              <p num="0016">
                <span class="notranslate"> <span class="google-src-text">
          容器本体１の外部には、超音波を照射する超音波照射手段５と、超音波のサイズ等を計測する計測装置６と、細胞を観察する細胞観察手段７を備える。
        </span>
          Outside the container <figure-callout id="1" label="main body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">main body</figure-callout> 1, an <figure-callout id="5" label="ultrasonic irradiation unit" filenames="2019000001-3.png,2019000001-6.png" state="{{state}}">ultrasonic irradiation unit</figure-callout> 5 that irradiates ultrasonic waves, a <figure-callout id="6" label="measuring device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">measuring device</figure-callout> 6 that measures the size of ultrasonic waves, and a <figure-callout id="7" label="cell observation unit" filenames="2019000001-3.png" state="{{state}}">cell observation unit</figure-callout> 7 that observes cells are provided.
        </span>
              </p>
              <p num="0017">
                <span class="notranslate"> <span class="google-src-text">
          細胞塊が細胞観察手段７により撮影され、撮影画像を取得する。計測装置６でその撮影画像の解析が行われ、解析結果を基に撮影画像に写された細胞塊が超音波発信端子４からの超音波を受ける位置にあるとき、超音波照射手段５に計測装置６からシグナルが送られ、超音波発信端子４から超音波を発信する。
        </span>
          A cell mass is photographed by the cell observation means 7 to obtain a photographed image. The <figure-callout id="6" label="measurement device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">measurement device</figure-callout> 6 analyzes the captured image, and the ultrasonic irradiation means 5 performs measurement when the cell mass captured in the captured image is in a position to receive the ultrasonic wave from the <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 based on the analysis result. A signal is sent from the <figure-callout id="6" label="device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">device</figure-callout> 6, and an ultrasonic wave is transmitted from the <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4.
        </span>
              </p>
              <p num="0018">
                <span class="notranslate"> <span class="google-src-text">
          細胞観察手段７は、容器本体１の外部に配設したＣＣＤ素子を用いたカメラのなどで構成する。超音波発信端子４の先端の定められた領域に存在する細胞もしくは細胞塊を撮影し、画像データを取得する。
        </span>
          The cell observation means 7 is constituted by a camera using a CCD element disposed outside the <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1. A cell or a cell mass existing in a predetermined region at the tip of the ultrasonic <figure-callout id="4" label="wave transmitting terminal" filenames="2019000001-6.png" state="{{state}}">wave transmitting terminal</figure-callout> 4 is photographed to acquire image data.
        </span>
              </p>
              <p num="0019">
                <span class="notranslate"> <span class="google-src-text">
          細胞観察手段７は予め定められた領域を撮影するように固定しても良い。攪拌手段２により培養液３は攪拌され周回するので、細胞観察手段７を固定していても、培養液に含まれる各細胞塊を定期的に観察することができる。
        </span>
          The cell observation means 7 may be fixed so as to photograph a predetermined area. Since the <figure-callout id="3" label="culture solution" filenames="2019000001-7.png" state="{{state}}">culture solution</figure-callout> 3 is stirred and circulated by the stirring means 2, even if the cell observation means 7 is fixed, each cell mass contained in the culture solution can be regularly observed.
        </span>
              </p>
              <p num="0020">
                <span class="notranslate"> <span class="google-src-text">
          また、細胞観察手段７を固定せずに可動可能な形態としても良い。その際は培養液３の中にサイズの大きな細胞塊が生成されたらすぐに発見できるように、細胞観察手段７を細胞塊全体について観察可能な位置に配置する。
        </span>
          The cell observation means 7 may be movable without being fixed. In that case, the cell observation means 7 is arranged at a position where the entire cell mass can be observed so that it can be found as soon as a large cell mass is generated in the <figure-callout id="3" label="culture solution" filenames="2019000001-7.png" state="{{state}}">culture solution</figure-callout> 3.
        </span>
              </p>
              <p num="0021">
                <span class="notranslate"> <span class="google-src-text">
          計測装置６は、細胞塊を認識し、さらにその直径を計測する機能を持った、画像解析ソフトを搭載したコンピュータである。細胞観察手段７と超音波照射手段５と接続しており、細胞観察手段７が撮影した画像データを受信し、画像データ中の細胞塊の直径を計測し、あらかじめ定められた大きさを超えた細胞塊を発見したとき、超音波照射手段５にシグナルを送り、超音波照射手段５を作動させる。
        </span>
          The <figure-callout id="6" label="measuring device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">measuring device</figure-callout> 6 is a computer equipped with image analysis software that has a function of recognizing a cell mass and measuring its diameter. The cell observation means 7 and the ultrasonic irradiation means 5 are connected, and the image data taken by the cell observation means 7 is received, the diameter of the cell mass in the image data is measured, and exceeds a predetermined size. When a cell mass is found, a signal is sent to the ultrasonic irradiation means 5 to activate the ultrasonic irradiation means 5.
        </span>
              </p>
              <p num="0022">
                <span class="notranslate"> <span class="google-src-text">
          超音波照射手段５は計測装置６と超音波発信端子４と接続している。超音波照射手段５は圧電セラミックスを用いた方法をとる。また、超音波の出力は培養槽の一部にのみ超音波が届く程度の出力を用いる。もしくは、超音波発信端子４に反射器を取り付け局所的に超音波が伝達するようにしても良い。
        </span>
          The ultrasonic irradiation means 5 is connected to the <figure-callout id="6" label="measuring device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">measuring device</figure-callout> 6 and the <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4. The ultrasonic irradiation means 5 is a method using piezoelectric ceramics. Moreover, the output of an ultrasonic wave is used so that the ultrasonic wave reaches only a part of the culture tank. Alternatively, a reflector may be attached to the <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 so that ultrasonic waves are transmitted locally.
        </span>
              </p>
              <p num="0023">
                <span class="notranslate"> <span class="google-src-text">
          このように、培養液全体のうち閾値を超えた細胞塊は超音波照射手段５による超音波の照射範囲に含まれ、閾値を超えない細胞塊は超音波照射手段５による超音波の照射範囲に含まれない構成とする。超音波を照射された細胞塊はストレスを受けるので、サイズが閾値を超えない細胞塊に対して超音波を照射せず余分な物理的ストレスを与えないようにする。
        </span>
          Thus, the cell mass exceeding the threshold in the whole culture solution is included in the ultrasonic irradiation range by the ultrasonic irradiation means 5, and the cell mass not exceeding the threshold is in the ultrasonic irradiation range by the ultrasonic irradiation means 5. The configuration is not included. Since the cell mass irradiated with the ultrasonic wave is subjected to stress, the cell mass whose size does not exceed the threshold value is not irradiated with the ultrasonic wave so as to avoid applying an extra physical stress.
        </span>
              </p>
              <p num="0024">
                <span class="notranslate"> <span class="google-src-text">
          超音波照射手段５が照射する超音波の周波数は20Hz〜10GHzであることが望ましい。この周波数は所望の細胞塊が細分化するのに適切である。また超音波が培養槽の一部にのみ伝達される範囲を用いるのがさらに望ましい。細胞塊の細分化に必要な時間は、主に超音波の周波数に関係しているので、所望の細胞塊の大きさに合わせて決定することができる。
        </span>
          The frequency of the ultrasonic wave emitted by the ultrasonic wave irradiation means 5 is desirably 20 Hz to 10 GHz. This frequency is appropriate for the desired cell mass to be subdivided. It is further desirable to use a range in which ultrasonic waves are transmitted only to a part of the culture tank. Since the time required for subdividing the cell mass is mainly related to the frequency of the ultrasonic wave, it can be determined according to the size of the desired cell mass.
        </span>
              </p>
              <p num="0025">
                <span class="notranslate"> <span class="google-src-text">
          容器本体１は、一部もしくは全てが透明容器であり、ガラスやプラスチックなどを用いる。さらに、超音波の影響を最小限に留めるために、図４のように流路１５を取り付けても良いし、図５のようにプラスチック製の支柱１７と、プラスチック製の壁１８を取り付けても良い。流路１６はガラスやプラスチックなど透明な材質を用いる。
        </span>
          A part or all of the <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1 is a transparent container, and uses glass or plastic. Further, in order to minimize the influence of ultrasonic waves, the <figure-callout id="15" label="flow path" filenames="2019000001-6.png" state="{{state}}">flow path</figure-callout> 15 may be attached as shown in FIG. 4, or the <figure-callout id="17" label="plastic support" filenames="2019000001-7.png" state="{{state}}">plastic support</figure-callout> 17 and the plastic wall 18 may be attached as shown in FIG. good. The <figure-callout id="16" label="channel" filenames="2019000001-7.png" state="{{state}}">channel</figure-callout> 16 is made of a transparent material such as glass or plastic.
        </span>
              </p>
              <p num="0026">
                <span class="notranslate"> <span class="google-src-text">
          なお、図１に示した細胞培養装置２０は、回分培養(一回毎に新たな培地を用意し、そこへ株を植えて収穫まで培地を加えない方法)に適した構成となっているが、当該構成に限定されるものではない。流加培養(培養中に、培地自体や培地中の特定の成分を添加し、培養終了時までその生成物を抜き取らない方法)を適応する場合は添加培地装置を加えて構成することもできる。連続培養(一定の速度で培養系に培地を供給し、同時に同量の培養液を抜き取る方法)を適応する場合は、培養液抜き出しようのラインを設けても良いし、エアリフト型の培養装置に超音波照射手段と超音波発信端子と培養液観察手段を備えても良い。
        </span>
          The cell culture apparatus 20 shown in FIG. 1 has a configuration suitable for batch culture (a method in which a new medium is prepared every time, a strain is planted there, and no medium is added until harvest). However, the present invention is not limited to this configuration. In the case of adapting to fed-batch culture (a method in which the medium itself or a specific component in the medium is added during cultivation and the product is not extracted until the end of the culture), an addition medium apparatus can be added. When applying continuous culture (a method of supplying a culture medium to a culture system at a constant speed and simultaneously extracting the same amount of culture solution), a line for extracting the culture solution may be provided, or an airlift type culture device may be provided. You may provide an ultrasonic irradiation means, an ultrasonic transmission terminal, and a culture solution observation means.
        </span>
              </p>
              <embodiments-example>
                <p num="0027">
                  <span class="notranslate"> <span class="google-src-text">
          ＜実施例１＞<br/>
          図１の培養装置を市販の温度調節用のヒーター上で使用し、本実施形態を回分培養に適応したものが実施例１である。容器本体１を小規模のスピナーフラスコまたはガラス製の容器で構成する。
        </span>&lt;Example 1&gt; <br/> Example 1 is an example in which the culture apparatus of FIG. 1 is used on a commercially available temperature control heater and this embodiment is adapted to batch culture. The <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1 is composed of a small-scale spinner flask or a glass container.</span>
                </p>
                <p num="0028">
                  <span class="notranslate"> <span class="google-src-text">
          攪拌手段２として平羽根型の翼を用いて、回転数30rpmで培養液の攪拌を行った。細胞として市販の人工多能性細胞を用いた。また、細胞の培養液は、市販のDMEM/F12培地を主成分とする培地を用いた。
        </span>
          Using a flat blade type blade as the stirring means 2, the culture solution was stirred at a rotation speed of 30 rpm. Commercially available induced pluripotent cells were used as the cells. In addition, a medium mainly composed of a commercially available DMEM / F12 medium was used as a cell culture solution.
        </span>
                </p>
                <p num="0029">
                  <span class="notranslate"> <span class="google-src-text">
          外部に培養液観察手段７として、拡大撮影機能のついたデジタル顕微鏡を用いた。容器本体１の外部に設置され、培養液３中の細胞を撮影する。培養液観察手段７で録画された細胞塊の拡大画像をもとに、計測手段６により細胞塊の大きさを計測した。計測装置６としてコンピュータと市販の画像解析ソフトを用いた。取得した画像を市販の画像解析ソフトで二値化し、細胞塊を認識した。細胞が密集している部分を細胞塊とし、単体の細胞のみ検出された部分は細胞塊とはみなさなかった。細胞塊と認識した部分の直径を計測し、規定外に大きいか否かを判断した。細胞塊が規定外に大きい場合は超音波照射手段５を作動させ、細胞塊の細分化を行った。
        </span>
          A digital microscope with an enlarged photographing function was used as the culture medium observation means 7 outside. It is installed outside the <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1 and photographs the cells in the <figure-callout id="3" label="culture medium" filenames="2019000001-7.png" state="{{state}}">culture medium</figure-callout> 3. Based on the enlarged image of the cell mass recorded by the culture medium observation means 7, the size of the cell mass was measured by the measurement means 6. A computer and commercially available image analysis software were used as the measuring <figure-callout id="6" label="device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">device</figure-callout> 6. The acquired image was binarized with commercially available image analysis software, and the cell mass was recognized. The portion where the cells were dense was defined as a cell mass, and the portion where only a single cell was detected was not regarded as a cell mass. The diameter of the part recognized as a cell mass was measured, and it was judged whether it was larger than the specification. When the cell mass was excessively large, the ultrasonic irradiation means 5 was operated to subdivide the cell mass.
        </span>
                </p>
                <p num="0030">
                  <span class="notranslate"> <span class="google-src-text">
          細胞培養装置２０は、超音波照射手段５と、超音波発信端子４によって細胞塊に超音波を付与し細分化する。超音波発信端子４は培養液３に先端が接するように設置されている。またその先端は、培養液観察手段７で得られた動物細胞の拡大画像データを計測装置６が処理し、超音波付与を行うか否か決定した時に、処理した画像データ上にある細胞が、超音波が届く位置に流れる場所に位置する。攪拌されている培養液中の細胞は約0.3m/sで移動しており、培養液観察手段７から攪拌翼の回転方向に３秒後に超音波が照射されるため、約１０cm離れた所に1つ設置する。超音波照射手段５が用いる周波数は20Hz〜10GHzである。
        </span>
          The cell culture device 20 applies ultrasonic waves to the cell mass by the ultrasonic wave irradiation means 5 and the ultrasonic <figure-callout id="4" label="wave transmission terminal" filenames="2019000001-6.png" state="{{state}}">wave transmission terminal</figure-callout> 4 and subdivides them. The <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 is installed so that the tip is in contact with the <figure-callout id="3" label="culture solution" filenames="2019000001-7.png" state="{{state}}">culture solution</figure-callout> 3. In addition, when the <figure-callout id="6" label="measurement device" filenames="2019000001-4.png,2019000001-6.png" state="{{state}}">measurement device</figure-callout> 6 processes the enlarged image data of the animal cell obtained by the culture medium observation means 7 and determines whether or not to apply ultrasonic waves, the tip of the tip is the cell on the processed image data. Located in a location where ultrasonic waves can reach. The cells in the culture medium being stirred are moving at about 0.3 m / s, and ultrasonic waves are irradiated from the culture medium observation means 7 in the direction of rotation of the <figure-callout id="3" label="stirring blade" filenames="2019000001-7.png" state="{{state}}">stirring blade</figure-callout> 3 seconds later. Install one. The frequency used by the ultrasonic irradiation means 5 is 20 Hz to 10 GHz.
        </span>
                </p>
                <p num="0031">
                  <span class="notranslate"> <span class="google-src-text">
          この装置に50mLの市販の培地を入れ、人工多能性細胞を７日間培養した。７日間で、3×10<sup>5</sup>cellsから7×10<sup>7</sup>cellsまで細胞が増殖した。
        </span>50 mL of a commercially available medium was put into this apparatus, and artificial pluripotent cells were cultured for 7 days. In 7 days, the cells grew from 3 × 10 <sup>5</sup> cells to 7 × 10 <sup>7</sup> cells.</span>
                </p>
                <p num="0032">
                  <span class="notranslate"> <span class="google-src-text">
          培養開始前、細胞塊の直径は50〜100μmである。培養を開始すると、細胞塊は大きくなるが、大きくなり過ぎると細胞の特性(未分化状態、生存率)に悪い影響を与えるため、直径が閾値を超えた細胞塊に超音波照射手段５で超音波を照射する。この閾値は例えば300μmとする。超音波を照射された細胞塊は細分化され、培養終了時は200μm〜300μmになった。
        </span>
          Before the start of culturing, the diameter of the cell mass is 50-100 μm. When culturing is started, the cell mass becomes large, but if it becomes too large, cell characteristics (undifferentiated state, survival rate) are adversely affected. Irradiate sound waves. This threshold value is, for example, 300 μm. The cell mass irradiated with ultrasonic waves was subdivided and became 200 μm to 300 μm at the end of the culture.
        </span>
                </p>
                <p num="0033">
                  <span class="notranslate"> <span class="google-src-text">
        ＜実施例２＞ <br/>
          図２は実施例２に係る細胞培養装置を示す。実施例２は細胞培養装置を流加培養に適応したものである。蓋体８に5ng/mL線維芽細胞増殖因子を添加物用管路９と、添加物用管路９に接続された添加物を無菌的に保存するためのガラス瓶を取り付けたものである。5ng/mL線維芽細胞増殖因子は１日毎添加した。この装置に50mLの市販の培地を入れ、人工多能性細胞を７日間培養した。3×10<sup>5</sup>cellsから7.4×10<sup>7</sup>cellsまで細胞が増殖した。
        </span>&lt;Example 2&gt; <br/> FIG. 2 shows a cell culture apparatus according to the second embodiment. In Example 2, the cell culture apparatus is adapted for fed-batch culture. The <figure-callout id="8" label="lid" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">lid</figure-callout> 8 is provided with a 5 ng / mL fibroblast growth factor <figure-callout id="9" label="additive conduit" filenames="2019000001-4.png" state="{{state}}">additive conduit</figure-callout> 9 and a glass bottle for aseptically storing the additive connected to the <figure-callout id="9" label="additive conduit" filenames="2019000001-4.png" state="{{state}}">additive conduit</figure-callout> 9. 5 ng / mL fibroblast growth factor was added every day. 50 mL of a commercially available medium was put into this apparatus, and artificial pluripotent cells were cultured for 7 days. Cells grew from 3 × 10 <sup>5</sup> cells to 7.4 × 10 <sup>7</sup> cells.</span>
                </p>
                <p num="0034">
                  <span class="notranslate"> <span class="google-src-text">
          実施例１と同様に超音波照射手段５で細胞塊のサイズを制御したところ、細胞塊細胞塊の直径は、培養開始時の50〜100μmから、培養終了時は200μm〜300μmになった。さらに、流加培養に装置を適応したことで、細胞の維持のために毎日行っていた繊維芽細胞増殖因子の添加作業をする必要が無くなり、労働効率が良くなった。
        </span>
          When the size of the cell mass was controlled by the ultrasonic irradiation means 5 in the same manner as in Example 1, the diameter of the cell mass cell mass was changed from 50 to 100 μm at the start of the culture to 200 μm to 300 μm at the end of the culture. Furthermore, by adapting the apparatus to fed-batch culture, the work of adding fibroblast growth factor, which was performed every day for cell maintenance, was eliminated, and work efficiency was improved.
        </span>
                </p>
                <p num="0035">
                  <span class="notranslate"> <span class="google-src-text">
        ＜実施例３＞<br/>
          図３は本実施形態を連続培養に適応した実施例３を概略的にあらわしたものである。蓋体８に新鮮培地用管路１１と、新鮮培地用管路１１に接続した新鮮培地を無菌状態で保存できる新鮮培地保存用容器１４と、廃液用管路１２と、廃液用ガラス容器１３を設置した。新鮮培地用管路１１と廃液用管路１２には除菌フィルター１０を設置した。24時間毎に20分間培養装置の攪拌をとめ、細胞塊を培養液の底に沈めた。さらに上澄みを廃液用管路１２で吸引し、新しい培地を新鮮培地用管路１１で入れた。この装置に50mLの市販の培地を入れ、人工多能性細胞を７日間培養した。3×10<sup>5</sup>cellsから6.5×10<sup>7</sup>cellsまで細胞が増殖した。
        </span>&lt;Example 3&gt; <br/> FIG. 3 schematically shows Example 3 in which this embodiment is applied to continuous culture. A fresh medium conduit 11 on the <figure-callout id="8" label="lid" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">lid</figure-callout> 8, a fresh <figure-callout id="14" label="medium storage container" filenames="2019000001-5.png" state="{{state}}">medium storage container</figure-callout> 14 that can store the fresh medium connected to the fresh medium conduit 11 in an aseptic state, a <figure-callout id="12" label="waste liquid conduit" filenames="2019000001-5.png" state="{{state}}">waste liquid conduit</figure-callout> 12, and a waste <figure-callout id="13" label="liquid glass container" filenames="2019000001-5.png" state="{{state}}">liquid glass container</figure-callout> 13. installed. A <figure-callout id="10" label="sterilization filter" filenames="2019000001-4.png,2019000001-5.png" state="{{state}}">sterilization filter</figure-callout> 10 was installed in the fresh medium pipe 11 and the <figure-callout id="12" label="waste liquid pipe" filenames="2019000001-5.png" state="{{state}}">waste liquid pipe</figure-callout> 12. The culture apparatus was agitated for 20 minutes every 24 hours, and the cell mass was submerged in the bottom of the culture solution. Further, the supernatant was aspirated through the <figure-callout id="12" label="waste liquid line" filenames="2019000001-5.png" state="{{state}}">waste liquid line</figure-callout> 12, and a new medium was added through the fresh medium line 11. 50 mL of a commercially available medium was put into this apparatus, and artificial pluripotent cells were cultured for 7 days. Cells grew from 3 × 10 <sup>5</sup> cells to 6.5 × 10 <sup>7</sup> cells.</span>
                </p>
                <p num="0036">
                  <span class="notranslate"> <span class="google-src-text">
          実施例１と同様に超音波照射手段５で細胞塊のサイズを制御したところ、細胞塊の直径は、培養開始時の50〜100μmから、培養終了時は200μm〜300μmになった。さらに、連続培養に装置を適応したことで、細胞の維持に必要な培地交換をする必要が無くなり、労働効率が良くなった。
        </span>
          When the size of the cell mass was controlled by the ultrasonic irradiation means 5 as in Example 1, the diameter of the cell mass was changed from 50 to 100 μm at the start of the culture to 200 μm to 300 μm at the end of the culture. Furthermore, adapting the device to continuous culture eliminates the need for medium change necessary for cell maintenance, and improves labor efficiency.
        </span>
                </p>
                <p num="0037">
                  <span class="notranslate"> <span class="google-src-text">
        ＜実施例４＞<br/>
          図４は本実施形態における実施例４を概略的にあらわしたものである。容器本体１に流路１５を取り付け、培養液観察手段７を流路１５の外部に取り付け、超音波発信端子４を流路１５に取り付ける。この装置に50mLの市販の培地を入れ、人工多能性細胞を7日間培養した。3×10<sup>5</sup>cellsから7.5×10<sup>7</sup>cellsまで細胞が増殖した。
        </span>&lt;Example 4&gt; <br/> FIG. 4 schematically shows Example 4 in the present embodiment. A <figure-callout id="15" label="flow path" filenames="2019000001-6.png" state="{{state}}">flow path</figure-callout> 15 is attached to the <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1, the culture solution observation means 7 is attached to the outside of the <figure-callout id="15" label="flow path" filenames="2019000001-6.png" state="{{state}}">flow path</figure-callout> 15, and the <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 is attached to the <figure-callout id="15" label="flow path" filenames="2019000001-6.png" state="{{state}}">flow path</figure-callout> 15. 50 mL of a commercially available medium was put into this apparatus, and artificial pluripotent cells were cultured for 7 days. Cells grew from 3 × 10 <sup>5</sup> cells to 7.5 × 10 <sup>7</sup> cells.</span>
                </p>
                <p num="0038">
                  <span class="notranslate"> <span class="google-src-text">
          実施例１と同様に超音波照射手段５で細胞塊のサイズを制御したところ、細胞塊の直径は、培養開始時の50〜100μmから、培養終了時は200μm〜300μmになった。培養液中に含まれる細胞塊のうちで一部の細胞塊が流路１５を流れる。
        </span>
          When the size of the cell mass was controlled by the ultrasonic irradiation means 5 as in Example 1, the diameter of the cell mass was changed from 50 to 100 μm at the start of the culture to 200 μm to 300 μm at the end of the culture. A part of the cell mass contained in the culture fluid flows through the <figure-callout id="15" label="flow path" filenames="2019000001-6.png" state="{{state}}">flow path</figure-callout> 15.
        </span>
                </p>
                <p num="0039">
                  <span class="notranslate"> <span class="google-src-text">
          流路１５を取り付けたことで、取り付けない時より一部の細胞にのみ超音波が照射され易くなり、細胞への影響を最小限に抑えることができた。
        </span>
          By attaching the <figure-callout id="15" label="flow path" filenames="2019000001-6.png" state="{{state}}">flow path</figure-callout> 15, it becomes easier to irradiate only a part of the cells with ultrasonic waves than when it is not attached, and the influence on the cells can be minimized.
        </span>
                </p>
                <p num="0040">
                  <span class="notranslate"> <span class="google-src-text">
        ＜実施例５＞<br/>
          図５は本実施形態における実施例５を概略的にあらわしたものである。容器本体１の内部に5cmの長さをもつ支柱１６を用いて容器本体１と10cm<sup>2</sup>の正方形の板17を取り付けた。超音波発信端子４を板１７と容器本体１の壁面に設置した。この装置に50mLの市販の培地を入れ、人工多能性細胞を7日間培養した。3×10<sup>5</sup>cellsから8.0×10<sup>7</sup>cellsまで細胞が増殖した。
        </span>&lt;Example 5&gt; <br/> FIG. 5 schematically shows Example 5 in the present embodiment. The <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1 and a 10 cm <sup>2</sup> <figure-callout id="17" label="square plate" filenames="2019000001-7.png" state="{{state}}">square plate</figure-callout> 17 were attached to the inside of the <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1 by using a <figure-callout id="16" label="support column" filenames="2019000001-7.png" state="{{state}}">support column</figure-callout> 16 having a length of 5 cm. The <figure-callout id="4" label="ultrasonic transmission terminal" filenames="2019000001-6.png" state="{{state}}">ultrasonic transmission terminal</figure-callout> 4 was installed on the wall surface of the <figure-callout id="17" label="plate" filenames="2019000001-7.png" state="{{state}}">plate</figure-callout> 17 and the <figure-callout id="1" label="container body" filenames="2019000001-3.png,2019000001-4.png" state="{{state}}">container body</figure-callout> 1. 50 mL of a commercially available medium was put into this apparatus, and artificial pluripotent cells were cultured for 7 days. Cells grew from 3 × 10 <sup>5</sup> cells to 8.0 × 10 <sup>7</sup> cells.</span>
                </p>
                <p num="0041">
                  <span class="notranslate"> <span class="google-src-text">
          実施例１と同様に超音波照射手段５で細胞塊のサイズを制御したところ、細胞塊の直径は、培養開始時の50〜100μmから、培養終了時は200μm〜300μmになった。
        </span>
          When the size of the cell mass was controlled by the ultrasonic irradiation means 5 as in Example 1, the diameter of the cell mass was changed from 50 to 100 μm at the start of the culture to 200 μm to 300 μm at the end of the culture.
        </span>
                </p>
              </embodiments-example>
            </description-of-embodiments>
