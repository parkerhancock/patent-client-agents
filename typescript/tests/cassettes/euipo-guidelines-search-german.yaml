              Content: "4.5.4 Kombinierte Beurteilung                   4.5.4 Kombinierte Beurteilung                                    Der erforderliche Grad der Ähnlichkeit zwischen den Marken und zwischen den einander gegenüberstehenden Waren oder Dienstleistungen            lässt sich nicht im Voraus bestimmen, da andernfalls der Anwendungsbereich von Artikel\_8 Absatz\_3 UMV nicht flexibel genug wäre, um alle Möglichkeiten des Versuchs einer missbräuchlichen Verwendung der Marke des ursprünglichen            Inhabers durch einen Agenten zu umfassen. Die Beurteilung hängt von einer tatsächlichen Würdigung der jeweiligen Umstände            des Einzelfalls ab.                                    Es kann sein, dass (i)\_die Marken nicht identisch, aber die einander gegenüberstehenden Waren oder Dienstleistungen identisch            sind, (ii)\_die einander gegenüberstehenden Waren oder Dienstleistungen nicht identisch, die Marken jedoch identisch sind,            oder (iii)\_weder die Marken noch die einander gegenüberstehenden Waren und Dienstleistungen identisch sind.                                    Aus dem Begriff der „Unterscheidungskraft“ folgt, dass die Beurteilung der Auswirkungen von Abweichungen auf die ursprüngliche            Unterscheidungskraft der älteren Marke zwangsläufig mit einer Beurteilung in Bezug auf die Waren und Dienstleistungen einhergeht. Daher kann der Vergleich der Marken im Sinne von Artikel\_8 Absatz\_3 UMV nicht unabhängig von den Waren und Dienstleistungen erfolgen.                                    Da es im Wesentlichen darum geht, ob die angefochtene Marke dem ursprünglichen Inhaber zugeordnet werden kann, kann die Beurteilung            der Auswirkungen der Abweichungen auf die ursprüngliche Unterscheidungskraft der älteren Marke je nach den betreffenden Waren und Dienstleistungen der angefochtenen            Marke unterschiedlich ausfallen. Wenn beispielsweise alle angefochtenen Waren denen der älteren Marke in gleichem Maße ähnlich            wären, könnte es immer noch sein, dass die angefochtene Marke nur in Bezug auf einige von ihnen dem ursprünglichen Inhaber            zugeordnet würde, nicht aber in Bezug auf andere, weil sich die Änderungen auf die ursprüngliche Unterscheidungskraft der            älteren Marke in Bezug auf diese anderen angefochtenen Waren unterschiedlich auswirken.                                                                                             Übergeordnetes Thema: 4.5 Beziehung zwischen den Marken und zwischen den Waren und Dienstleistungen                                             "
