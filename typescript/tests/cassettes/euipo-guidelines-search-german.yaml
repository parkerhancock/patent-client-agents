            - Id: ish_2319052-2228478-16
              Content: "4.2 Beispiele                   4.2 Beispiele                                    Beispielsweise ist es in technischen Bereichen wie denjenigen, die Rechner, Maschinen, Motoren und Werkzeuge betreffen, wahrscheinlicher,            dass einzelne Buchstaben\_als technische, Modell- oder Katalogreferenzen, statt als Herkunftshinweis wahrgenommen werden; die            Tatsache, dass dies der Fall ist, sollte jedoch aus einer faktenbasierten Beurteilung abgeleitet werden.                                    Je nach Ergebnis der vorhergehenden Prüfung könnte eine Marke, die aus einem als Standardzeichen dargestellten Einzelbuchstaben            besteht, gemäß Artikel\_7 Absatz\_1 Buchstabe\_b\_UMV aus dem Grund zu beanstanden sein, dass ihr die immanente Unterscheidungskraft für die betreffenden Waren bzw. Dienstleistungen            oder Teilen von diesen fehlt.                                    Dies wäre beispielsweise der Fall bei einer Marke, die aus dem Einzelbuchstaben „C“ für „Fruchtsäfte“ besteht, da dieser Buchstabe            allgemein benutzt wird, um auf Vitamin C hinzuweisen. Die maßgeblichen Verkehrskreise würden den Buchstaben\_nicht als ein            Zeichen wahrnehmen, welches auf den betrieblichen Ursprung dieser Waren hinweisen würde.                                    Ein weiteres Beispiel für fehlende Unterscheidungskraft wäre eine aus Einzelbuchstaben bestehende Marke, die in Bezug auf            die Art von Spielzeugwürfeln angemeldet wird, die häufig verwendet wird, um Kindern beizubringen, wie Wörter gebildet werden.            In diesem Beispiel werden die einzelnen Buchstaben nicht als Zeichen verwendet, durch die auf die betriebliche Herkunft der            betroffenen Waren hingewiesen würde.                                    Obwohl es in diesem Fall keine direkte beschreibende Beziehung zwischen den Buchstaben und den Waren gibt, würde einer aus            einem Einzelbuchstaben bestehenden Marke die Unterscheidungskraft fehlen, da die Verbraucher – wenn es um Spielzeugwürfel            geht – eher daran gewöhnt sind, einzelne Buchstaben\_eher so sehen, dass sie entweder funktionelle oder praktische Konnotationen            besitzen, aber nicht als Angabe zur betrieblichen Herkunft.                                    Wenn jedoch nicht festgestellt werden kann, dass ein bestimmter einzelner Buchstabe frei von jeder Unterscheidungskraft in            Bezug auf die betreffenden Waren bzw. Dienstleistungen ist, dann sollte er akzeptiert werden, selbst wenn er in Standardzeichen            oder in einer recht elementaren Weise dargestellt ist.                                    So wurde beispielsweise der Buchstabe  für Transportwesen; Verpackung und Lagerung von Waren; Organisation von Reisen in Klasse\_39 und Dienstleistungen zur Verpflegung und zur vorübergehenden Beherbergung von Gästen in Klasse\_43 akzeptiert (30/09/2010, R\_1008/2010-2, W (Bildmarke), §\_12-21).                                    Weitere Beispiele siehe Richtlinien, Teil\_B, Prüfung, Abschnitt\_4, Absolute Eintragungshindernisse, Kapitel\_4, Beschreibende Marken (Artikel\_7 Absatz\_1 Buchstabe\_c\_UMV).                                                                                             Übergeordnetes Thema: 4 Einzelbuchstaben\_1                                                1           Dieser Abschnitt befasst sich mit Einzelbuchstaben im Verhältnis zu Artikel\_7 Absatz\_1 Buchstabe\_b\_UMV. Einzelbuchstaben im Verhältnis zu Artikel\_7 Absatz\_1 Buchstabe\_c\_UMV werden in den Richtlinien, Teil\_B, Prüfung, Abschnitt\_4, Absolute Eintragungshindernisse, Kapitel\_4, Beschreibende Marken (Artikel\_7 Absatz\_1               Buchstabe\_c\_UMV), Abschnitt\_2.8, behandelt.                           "
