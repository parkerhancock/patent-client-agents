            - Id: ish_2319054-1789652-16
              Content: "6.1 Special provisions with respect to the accession of new Member States                   6.1 Special provisions with respect to the accession of new Member States                                    In accordance with the provisions of the EU accession treaties, an EUTM applied for before the date of accession of a given            Member State may only be rejected for reasons that already existed before the date of accession. Hence, in the Office’s examination            proceedings, acquired distinctiveness must be demonstrated only with respect to Member States of the EU at the time of the            EUTM application, and not those that have joined the EU subsequently.                                                                                             Parent topic: 6 Territorial aspects                                             "
