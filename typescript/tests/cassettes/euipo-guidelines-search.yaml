              Content: "1.3.3 Factual monopoly                   1.3.3 Factual monopoly                                    The fact that the applicant is the only person offering the goods and services for which the mark is descriptive is not relevant            for Article\_7(1)(c) EUTMR. However, in this case the applicant will be more likely to succeed on acquired distinctiveness.                                                                                             Parent topic: 1.3 Common misunderstandings                                             "
