            - Id: ish_2319054-2066092-16
              Content: "4.3 The relevant part of the EU                   4.3 The relevant part of the EU                                    Where the objection is not based on the meaning of a word, the ground for refusal will normally pertain to the European Union            as a whole. However, the relevant public's perception of the sign, the practice in trade, or the use of the goods and services            claimed may be different in some parts of the European Union.                                    The Office’s objections for signs containing verbal elements will always identify the language in which the sign is meaningful.            Where the objection is based on the meaning of a word, the ground for refusal generally applies to part of the EU only (Article\_7(2) EUTMR). The relevant part of the EU will depend on the language, terms used and goods and services.                                    The part of the EU affected by the objection is relevant in relation to the possibility for the applicant to file evidence            to support its claim for acquired distinctiveness through use under Article\_7(3) EUTMR (see the Guidelines, Part\_B, Examination, Section\_4, Absolute grounds for refusal, Chapter\_14, Acquired distinctiveness through use (Article\_7(3)               EUTMR), paragraph\_6 and in particular 6.2 Language area).                                    The explicit mention of a territory or of an EU national language in the refusal will also affect the applicant’s right to            request the conversion of the EUTM application into one or more national application(s). The conversion is precluded (i) if            a Member State is expressly indicated in the Office decision, for that Member State (Article\_140(3) EUTMR in combination with Article\_139(2)(b)EUTMR), (ii) if the language of a Member State is mentioned, for all the Member States in which that language is one of the official languages (Article\_140(4) EUTMR). (see the Guidelines, Part\_E, Register operations, Section\_2, Conversion, Chapter\_4, Grounds precluding conversion, paragraph\_4.2).                                    The Office is not obliged to indicate the relevant part of the territory in its refusal (confirmed by the General Court, (07/07/2021,            T‑464/20, YOUR DAILY PROTEIN (fig.), EU:T:2021:421, §\_60-62 and 09/03/2022, T‑204/21, Rugged, EU:T:2022:116)). However, when the territory is specifically relevant for the objection (e.g. for non-EU national            languages or when the specific situation in a Member State is the basis of an objection under public policy and morality),            its specific indication will be included in the decision.                                                                                             4.3.1 Relevant territory and objections based on EU national languages                                                   4.3.2 Relevant territory and objections based on EU regional languages and non-EU languages                                                                                                   Parent topic: 4 European criteria                                             "
