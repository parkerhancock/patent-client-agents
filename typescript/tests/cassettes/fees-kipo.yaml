1&amp;catmenu=ek03_08_04\" >AI-related patent applications</a></li>\r\n\t\t\t\t\t\t\t<li><a href=\"/en/HtmlApp?c=92012&amp;catmenu=ek03_08_05\" >AI and patentability</a></li>\r\n\t\t\t\t\t\t</ul>\r\n\t\t\t\t\t</li>\r\n\t\t\t\t\t<li><a href=\"/en/HtmlApp?c=92006&amp;catmenu=ek03_06_01\" class=\"off\">Patent Examination Guidelines</a></li>\r\n\t\t\t\t\t<li><a href=\"/en/HtmlApp?c=30300&amp;catmenu=ek03_07_01\" class=\"off\">Trials &amp; Appeals</a></li>\r\n\t\t\t\t</ul>\r\n            </div>\r\n\t<!-- ** left(end line) ******************************************************************************** -->\r\n\t\r\n\t<!-- ** center(start line) **************************************************************************** -->\r\n\t    \t<div id=\"content\"><div  id=\"forPrint\">\r\n\t    \t\r\n\t\t<!-- ** current page ******** -->\r\n\t\t<!-- add line -->\r\n\t\t\r\n\t\t\r\n\t\t\r\n\t<div class=\"locate\">\r\n\t<ul class=\"location\">\r\n\t\t<li class=\"home\"><a href=\"/en\">HOME</a></li>\r\n\t\t\t<li><a href=\"javascript:;\">Patents &amp; Utility Models</a></li>\r\n\t\t\t\t\t<li><a href=\"javascript:;\">Fees and Payments</a></li>\r\n \t\t\t\t</ul>\r\n\t<h2>\r\n\t<!-- 1. About MOIP start -->\r\n\t\t\t\t\t\tFees and Payments\r\n \t\t \t<!-- 3. Patents & Utility Models end -->\r\n \t<!-- 4. Trademarks & Designs start -->\r\n\t\t</h2>\r\n<!-- add line -->\r\n<!-- print btn -->\r\n\t<p class=\"btn_print\"><a class=\"print\" onclick=\"jsPrint()\">Print</a></p>\r\n</div>\r\n<!-- print btn -->\r\n\r\n\t\t<!-- ** current page ******** -->\r\n\r\n<!-- ** TEXT AREA(start line) ************************************************************ -->\r\n\r\n<article class=\"txt\">\n                <p>The following information covers the most common fees for patent and utility model applications. The fees have been in effect since August 1, 2023. Please <a href=\"/en/HtmlApp?c=20500&amp;catmenu=ek01_08_01\">contact us</a> for further information on payments and other fees. </p>\n                <div class=\"link_box\">\n                    <h5 class=\"type_02\"><a href=\"#a1\">Patent fees</a></h5>\n                    <h5 class=\"type_02\"><a href=\"#a2\">Utility model fees</a></h5>\n                    <h5 class=\"type_02\"><a href=\"#a3\">Payment methods</a></h5>\n                    <h5 class=\"type_02\"><a href=\"#a4\">PCT fees and payment</a></h5>\n                </div>\n                <a name=\"a1\"></a>\n                <h5 class=\"type_02\">Patent fees</h5>\n                <div class=\"table_wrap\">\n                <table class=\"tbl\">\n                    <caption class=\"hidden\">\n                    Patent fees\n                    </caption>\n                    <colgroup>\n                    <col class=\"col1\">\n                    <col class=\"col2\">\n                    </colgroup>\n                    <tbody>\n                        <tr>\n                            <th>Description</th>\n                            <th>Fee(KRW)</th>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Application Fee</td>\n                        </tr>\n                        <tr>\n                            <td>Patent Application (Electronic)</td>\n                            <td class=\"right\"> 46,000 </td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Patent Application (Paper)<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each page when the total of the description, drawing,<br>\n                                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;and abstract exceeds 20 pages </td>\n                            <td class=\"right\">66,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">1,000</td>\n                        </tr>\n                        <tr>\n                            <td>Application for an extension of the term of a patent right, for each application</td>\n                            <td class=\"right\">300,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Examination Fee</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\" valign=\"top\">Application for a priority claim<br>\n                                &nbsp;&nbsp;a. Basic fee <br>\n                                &nbsp;&nbsp;b. Additional fee for each priority claim</td>\n                            <td class=\"right\"> 18,000(electronic)<br>\n                                20,000(paper-based)</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">18,000(electronic)<br>\n                                20,000(paper-based) </td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Request for substantive examination<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each patent claim </td>\n                            <td class=\"right\"> 166,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">51,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Request for reexamination<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each patent claim </td>\n                            <td class=\"right\"> 100,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">10,000</td>\n                        </tr>\n                        <tr>\n                            <td>Request for a preferential examination</td>\n                            <td class=\"right\">200,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Annual Fee</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">1 to 3 years (Grant fee is included)<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim</td>\n                            <td class=\"right\"> 13,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">12,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">4 to 6 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\"> 36,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">20,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">7 to 9 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\"> 90,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">34,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">10 to 12 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\"> 216,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">49,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">13 to 15 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\"> 324,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 49,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">16 to 25 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\"> 324,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 49,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Others</td>\n                        </tr>\n                        <tr>\n                            <td>Converted application fee<br>\n                                &nbsp;&nbsp;Utility model application into Patent application(On-line)</td>\n                            <td class=\"right\"> 46,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">&nbsp;&nbsp;Utility model application into Patent application(Paper)<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each page when the total of the description, drawing,<br>\n                                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;and abstract exceeds 20 pages<br></td>\n                            <td class=\"right\"> 66,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 1,000</td>\n                        </tr>\n                    </tbody>\n                </table>\n                </div>\n                <br>\n                <p align=\"right\" class=\"sl_pt10 sl_pr10\"><a href=\"#top\"><img src=\"/resource/images/eng/03_patents/top_bu.png\" alt=\"top button\"></a></p>\n                <br>\n                <br>\n                <!-- line --> \n                <a name=\"a2\"></a>\n                <h5 class=\"type_02\">Utility model fees</h5>\n                <div class=\"table_wrap\">\n                <table class=\"tbl\" summary=\"\">\n                    <caption class=\"hidden\">\n                    Utility model fees\n                    </caption>\n                    <colgroup>\n                    <col class=\"col1\">\n                    <col class=\"col2\">\n                    </colgroup>\n                    <tbody>\n                        <tr>\n                            <th class=\"table07thleft\">Description</th>\n                            <th>Fee (KRW)</th>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Application Fee</td>\n                        </tr>\n                        <tr>\n                            <td>Utility model Application (On-line)</td>\n                            <td class=\"right\"> 20,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Utility model Application (Paper)<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each page when the total of the description, drawing,<br>\n                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;and abstract exceeds 20 pages </td>\n                            <td class=\"right\">                                30,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 1,000<br></td>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Examination Fee</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\" valign=\"top\">Application for a Priority Claim<br>\n                                &nbsp;&nbsp;a. Basic fee\n                                <br>\n                                &nbsp;&nbsp;b. Additional fee for each priority claim</td>\n                            <td class=\"right\">                                18,000(electronic application)<br>\n                                20,000(paper-based application) </td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 18,000(electronic application)<br>\n                                20,000(paper-based application)</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Request for substantive examination<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each utility model claim </td>\n                            <td class=\"right\">71,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 19,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Request for a reexamination<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each utility model claim </td>\n                            <td class=\"right\">50,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">5,000</td>\n                        </tr>\n                        <tr>\n                            <td>Request for preferential examination</td>\n                            <td class=\"right\">100,000 </td>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Annual Fee</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">1 to 3 years (Grant fee is included)<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\">12,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 4,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">4 to 6 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\">25,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">9,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">7 to 9 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\">60,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 14,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">10 to 12 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\">160,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 20,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">13 to 15 years<br>\n                                &nbsp;&nbsp;a. Annual basic fee <br>\n                                &nbsp;&nbsp;b. Annual additional fee for each claim </td>\n                            <td class=\"right\"> 240,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 20,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"bg_sky\" colspan=\"2\">Others</td>\n                        </tr>\n                        <tr>\n                            <td>Converted application fee<br>\n                                &nbsp;&nbsp;Patent application into Utility model application (On-line)</td>\n                            <td class=\"right\">20,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">&nbsp;&nbsp;Patent application into Utility model application (Paper)<br>\n                                &nbsp;&nbsp;a. Basic fee<br>\n                                &nbsp;&nbsp;b. Additional fee for each page when the total of the description, drawing,<br>\n                                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;and abstract exceeds 20 pages<br></td>\n                            <td class=\"right\">30,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 1,000</td>\n                        </tr>\n                    </tbody>\n                </table>\n                </div>\n                <p align=\"right\" class=\"sl_pt10 sl_pr10\"><a href=\"#top\"><img src=\"/resource/images/eng/03_patents/top_bu.png\" alt=\"top button\"></a></p>\n                \n                <!-- line --> \n                <a name=\"a3\"></a>\n                <h5 class=\"type_02\">Payment methods</h5>\n                <p>All fees are paid either by <strong>direct deposit to a bank</strong> in Korea or by means of a <strong>giro</strong> (electronic billing system). To utilize either method, you will need a residential or business address in Korea because of the unique online certificate system. Please note that the fees are NOT paid directly to KIPO or a KIPO account. </p>\n                <p><strong>If you have a residential address in Korea,</strong> you are legally entitled to handle application procedures yourself. When you receive an application number, you should submit a Certificate of the Facts of Alien Registration, which is issued by the Korean Immigration Office or your local district (Gu) office. </p>\n                <p>There are three ways you can make the payment. First, you can use the electronic application system to <a href=\"https://www.patent.go.kr/smart/jsp/ka/menu/fee/main/FeeMain02.do\" target=\"_blank\">pay the fees online</a> or via an <a href=\"http://www.giro.or.kr/\" target=\"_blank\"> Internet giro.</a> This cannot be done from abroad because of the unique online certificate system used in Korea.</p>\n                <p>Second, you can visit our office in person and submit <a href=\"https://www.moip.go.kr/upload/en/download/Form23_25.zip\" target=\"_blank\">form(23,25),</a> at which time they will issue you a receipt. Once you are issued the receipt, you can pay the fee at any bank in Korea, though the fee should be paid by the next day.</p>\n                <p>Third, you can send a Korean postal money order with the completed payment form. *Please note that all documentation must be in Korean, not English. For further information, please contact our customer service center (1544-8080, Korean only).</p>\n                <p><strong>If you do not have a residential or business address in Korea, </strong> you should appoint a representative to pursue application procedures including the payment of fees. The representative must have a residential or business address in Korea and could be a friend or relative, not necessarily a patent attorney. If you do appoint a representative, please note you will also need to submit a power of attorney for the representative <a href=\"https://www.moip.go.kr/upload/en/download/Form2.zip\" target=\"_blank\"> (Form 2)</a>.</p>\n                <p>If you would like to appoint a patent attorney, contact the <a href=\"http://www.kpaa.or.kr/\" target=\"_blank\">Korean Patent Attorneys Association</a> at:</p>\n                <ul class=\"list_01\">\n                    <li>Tel: +82 (2) 3486-3486</li>\n                    <li>Fax: +82 (2) 3486-3511</li>\n                    <li>E-mail:<a href=\"mailto:kpaa@kpaa.or.kr\"> kpaa@kpaa.or.kr</a></li>\n                </ul>\n                <p align=\"right\" class=\"sl_pt10 sl_pr10\"><a href=\"#top\"><img src=\"/resource/images/eng/03_patents/top_bu.png\" alt=\"top button\"></a></p>\n                \n                <!-- line --> \n                <a name=\"a4\"></a>\n                <h5 class=\"type_02\">PCT fees</h5>\n                <div class=\"table_wrap\">\n                <table class=\"tbl\">\n                    <caption class=\"hidden\">\n                    PCT fees\n                    </caption>\n                    <tbody>\n                        <tr>\n                            <th>Description</th>\n                            <th>Fee (KRW)</th>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Request for international preliminary examination (IPEA/KR) <br>\n                                &nbsp;&nbsp;a. Examination fee<br>\n                                &nbsp;&nbsp;b. Handling fee</td>\n                            <td class=\"right\"> 450,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\"> 357,000</td>\n                        </tr>\n                        <tr>\n                            <td rowspan=\"2\">Request for international application search under PCT (ISA/KR) <br>\n                                &nbsp;&nbsp;a. Application in Korean<br>\n                                &nbsp;&nbsp;b. Application in English</td>\n                            <td class=\"right\"> 450,000</td>\n                        </tr>\n                        <tr>\n                            <td class=\"right border_L\">1,200,000</td>\n                        </tr>\n                    </tbody>\n                </table>\n                </div>\n                <p>Please check handling fee before paying it since it is frequently changed </p>\n                <h5 class=\"type_04\">PCT fees payment</h5>\n                <p>During the international phase of an international application under the PCT, an applicant can pay the fees directly to MOIP by <strong>wire transfer</strong> or <strong><a href=\"https://patent.go.kr/smart/jsp/kiponet/fe/feepayment/FEPctChargeList.do\" target=\"_blank\" title=\"New window\">credit cards</a>.</strong> For the transfer of fees to MOIP, please refer to the following bank information:</p>\n                <p>Swift code: NACFKRSE<br>\n                    Name of bank: National Agricultural Cooperative Federation, Government Complex Daejeon Branch<br>\n                    Account number: 676-01-011484<br>\n                    Name of beneficiary: MOIP</p>\n                <p>The above-identified bank information is also used for the payment of the other fees related to the PCT procedures of the Ministry of Intellectual Property (MOIP) as an International Searching Authority and/or International Preliminary Examining Authority.</p>\n                <p>When the fees are transferred to the ISA/KR and/or IPEA/KR**, an applicant's attention\n                    is requested for\n                    the following matters.</p>\n                <p>1. The PCT international application number should be indicated and it is strongly recommended to indicate the name of the invitation/notification concerned.<br>\n                    2. The sender's charges which have to be paid by the sender should be considered for the purpose of transferring the exact amounts of the fees.</p>\n                <p>* ISA : International Searching Authority<br>\n                    * IPEA : International Preliminary Examining Authority</p>\n                <!-- update date : S-->\n                <ul class=\"update_date\">\n                    <li>Last updated 10 February 2026</li>\n                    <li>Intellectual Property Information Policy Division</li>\n                </ul>\n                </ul>\n                    <!--// update date : E--> \n                    \n                </article>\r\n<br /><br />\r\n\r\n<!-- ** TEXT AREA(start line) ************************************************************ -->\r\n\r\n\t\t\t</div></div>\r\n        </div>\r\n    </div>\r\n    <!--// container E--> \r\n<!-- ** middle(end line) ******************************************************************************************************************************************* -->\r\n\r\n\r\n<!-- ** bottom(start line) ***************************************************************************************************************************************** -->\r\n    <!-- footer :S-->\n    <div class=\"footer\">\n        <ul>\n            <li>Copyright(c) MINISTRY OF INTELLECTUAL PROPERTY. All Rights Reserved.</li>\n            <li>Government Complex Daejeon Building 4, 189, Cheongsa-ro, Seo-gu, Daejeon, 35208, Republic of Korea</li>\n            <li><a href=\"/en/HtmlApp?c=90000&amp;catmenu=ek08_01_01\">Sitemap</a> <a href=\"/en/HtmlApp?c=20500&amp;catmenu=ek01_08_01\">Contact Us</a> <a href=\"/en/HtmlApp?c=97003&amp;catmenu=ek07_06_02\">Related Sites</a></li>\n            <!--<li class=\"top\" data-button=\"1\">top</li>-->\n            \n        </ul>\n        \n    </div>\n    <!--// footer :  E--> <!-- ** bottom(end line) ******************************************************************************************************************************************* -->\r\n\r\n</div>\r\n</body>\r\n</html>"
