href=\"javascript:;\">Trademarks &amp; Designs</a></li>\r\n\t\t \t\t\t<li><a href=\"javascript:;\">Fees and Payments</a></li>\r\n \t\t\t\t</ul>\r\n\t<h2>\r\n\t<!-- 1. About MOIP start -->\r\n\t\t\t \t\t\tFees and Payments\r\n \t\t \t<!-- 4. Trademarks & Designs end -->\r\n \t<!-- 5. PCT ISA Portal start -->\r\n\t\t</h2>\r\n<!-- add line -->\r\n<!-- print btn -->\r\n\t<p class=\"btn_print\"><a class=\"print\" onclick=\"jsPrint()\">Print</a></p>\r\n</div>\r\n<!-- print btn -->\r\n\r\n<!-- ** current page ******** -->\r\n\r\n<!-- ** TEXT AREA(start line) ************************************************************ -->\r\n<script type=\"text/javascript\">\nfunction classch(val){\n\n\tif(val == 'a1'){\n\t\t$('#tab1').attr('class','on');\n\t\t$('#tab2').attr('class','off');\n\t\t$('#tab3').attr('class','off');\n\t\t\n\t\t\n\t}else if(val == 'a2'){\n\t\t$('#tab2').attr('class','on');\n\t\t$('#tab1').attr('class','off');\n\t\t$('#tab3').attr('class','off');\n\t\t\n\t\t\n\t}else{\n\t\t$('#tab3').attr('class','on');\n\t\t$('#tab1').attr('class','off');\n\t\t$('#tab2').attr('class','off');\n\t}\n\n}\n\n</script>\n\n<article class=\"txt\">\n                    <p>The following information is based on the most commonly charged fees for trademark and design applications. The fees outlined below have been in effect since August 1, 2023. Please contact us for further information on payments and other fees.</p>\n                    <ul class=\"tab type_free\">\n                        <li><a href=\"#a1\" onclick=\"javascript:classch('a1');\" class=\"on\" id=\"tab1\">Trademark fees</a></li>\n                        <li><a href=\"#a2\" onclick=\"javascript:classch('a2');\" id=\"tab2\">Design fees</a></li>\n                        <li><a href=\"#a3\" onclick=\"javascript:classch('a3');\" id=\"tab3\">Payment methods</a></li>\n                    </ul>\n                    \n                    <!-- line -->\n                    <a name=\"a1\"></a>\n                    <h4 class=\"type_03\">Trademark fees</h4>\n                    <div class=\"table_wrap\">\n                    <table class=\"tbl\">\n                        <caption class=\"hidden\">\n                        Trademark fees\n                        </caption>\n                        <colgroup>\n                        <col class=\"col1\">\n                        <col class=\"col2\">\n                        </colgroup>\n                        <tbody>\n                            <tr>\n                                <th>Description</th>\n                                <th>Fee (KRW)</th>\n                            </tr>\n                            <tr>\n                                <td colspan=\"2\" class=\"bg_sky\">Application Fee</td>\n                            </tr>\n                            <tr>\n                                <td>Trademark application fee for each class (Electronic)</td>\n                                <td> 52,000 </td>\n                            </tr>\n                            <tr>\n                                <td class=\"table07tdleft table07tdbottom\">Trademark application fee for each class (Paper) <br>\n                                    * Additional charge per number of designated goods exceeding 10 for each class(Electronic &amp; Paper) </td>\n                                <td>62,000<br>\n                                    2,000</td>\n                            </tr>\n                            <tr>\n                                <td colspan=\"2\" class=\"bg_sky\">Examination Fee</td>\n                            </tr>\n                            <tr>\n                                <td>Application for a priority claim</td>\n                                <td> 18,000(electronic application)<br>\n                                    20,000(paper-based application) </td>\n                            </tr>\n                            <tr>\n                                <td>Request for a preferential examination</td>\n                                <td>160,000</td>\n                            </tr>\n                            <tr>\n                                <td colspan=\"2\" class=\"bg_sky\">Registration Fee</td>\n                            </tr>\n                            <tr>\n                                <td rowspan=\"2\">Registration for establishment of right<br>\n                                    &nbsp;&nbsp;a. Single lump sum payment<br>\n                                    &nbsp;&nbsp; - Basic fee : for each class<br>\n                                    &nbsp;&nbsp; - Additional fee for each class<br>\n                                    &nbsp;&nbsp;* Additional charge per number of designated goods exceeding 10 designated goods for each class<br>\n                                    &nbsp;&nbsp;b. Two installments<br>\n                                    &nbsp;&nbsp; - Basic fee for each installment <br>\n                                    &nbsp;&nbsp; - Additional fee for each class<br>\n                                    &nbsp;&nbsp; * Additional charge per number of designated goods exceeding 10 for each class</td>\n                                <td><br>201,000<br>2,000<br></td>\n                            </tr>\n                            <tr>\n                                <td class=\"border_L\">122,000<br>1,000</td>\n                            </tr>\n                            <tr>\n                                <td>Additional registration of designated goods<br>\n                                    *\tAdditional charge per number of designated goods exceeding 10 for each class</td>\n                                <td> 201,000 <br>\n                                    2,000</td>\n                            </tr>\n                            <tr>\n                                <td rowspan=\"2\">Renewal of registration <br>\n                                    &nbsp;&nbsp;a. Single lump sum payment<br>\n                                    &nbsp;&nbsp; - Basic fee : for each class<br>\n                                    &nbsp;&nbsp; - Additional fee for each class :<br>\n                                    &nbsp;&nbsp;* Additional charge per number of designated goods exceeding 10 for each class<br>\n                                    &nbsp;&nbsp;b. Two installments<br>\n                                    &nbsp;&nbsp; - Basic fee for each installment <br>\n                                    &nbsp;&nbsp; - Additional fee for each class<br>\n                                    &nbsp;&nbsp;* Additional charge per number of designated goods exceeding 10 for each class</td>\n                                <td><br>300,000<br>2,000</td>\n                            </tr>\n                            <tr>\n                                <td class=\"border_L\">184,000<br>1,000</td>\n                            </tr>\n                            <tr>\n                                <td class=\"table07tdleft table07tdbottom\" rowspan=\"2\">Late renewal of registration (When renewal is applied for after the expiration of the term of registration):<br>\n                                    &nbsp;&nbsp;a. Single lump sum payment<br>\n                                    &nbsp;&nbsp; - Basic fee : for each class<br>\n                                    &nbsp;&nbsp; - Additional fee for each class :<br>\n                                    &nbsp;&nbsp;* Additional charge per number of designated goods exceeding 10 for each class<br>\n                                    &nbsp;&nbsp;b. Two installments<br>\n                                    &nbsp;&nbsp; - Basic fee for each installment <br>\n                                    &nbsp;&nbsp; - Additional fee for each class <br>\n                                    &nbsp;&nbsp;* Additional charge per number of designated goods exceeding 10 for each class</td>\n                                <td><br>\n                                    330,000<br>\n           