for each design </td>\n                                <td><br>\n                                    25,000<br>\n                                    35,000<br>\n                                    70,000<br>\n                                    140,000<br>\n                                    210,000</td>\n                            </tr>\n                            <tr>\n                                <td class=\"table07tdleft table07tdbottom\">Partial-substantive examination<br>\n                                    &nbsp;&nbsp;a. 1 to 3 years, annually, for each design (Grant fee is included) <br>\n                                    &nbsp;&nbsp;b. 4 to 20 years, annually, for each design</td>\n                                <td><br>\n                                    25,000<br>\n                                    34,000</td>\n                            </tr>\n                            <tr>\n                                <td colspan=\"2\" class=\"bg_sky\">Others</td>\n                            </tr>\n                            <tr>\n                                <td>Converting non-substantive examination into substantive examination (Electronic): </td>\n                                <td>53,000</td>\n                            </tr>\n                            <tr>\n                                <td>Converting non-substantive examination into substantive examination (Paper) : </td>\n                                <td>63,000</td>\n                            </tr>\n                            <tr>\n                                <td>Request for a secret design, for each design : </td>\n                                <td>18,000(electronic application) <br>\n                                    20,000(paper-based application) </td>\n                            </tr>\n                            <tr>\n                                <td>Request for laying-open of a design application, for each case : </td>\n                                <td>21,000(electronic application)<br>\n                                    24,000(paper-based application) </td>\n                            </tr>\n                            <tr>\n                                <td>Filling an opposition to a registration, for each design : </td>\n                                <td>50,000</td>\n                            </tr>\n                            <tr>\n                                <td rowspan=\"3\">Divisional application fee: <br>\n                                    When dividing a multiple-design application, for each divided application,<br>\n                                    <br>\n                                    a. In case of division into same application<br>\n                                    <br>\n                                    <br>\n                                    <br>\n                                    <br>\n                                    <br>\n                                    <br>\n                                    b. In case of division partial substantive examination application into substantive examination application<br>\n                                    <br>\n                                    <br>\n                                    <br>\n                                    <br>\n                                    c. others <br></td>\n                                <td><br>\n                                    <br>\n                                    10,000<br>\n                                    (electronic application)<br>\n                                    20,000<br>\n                                    (paper-based application)</td>\n                            </tr>\n                            <tr>\n                                <td class=\"border_L\">59,000<br>\n                                    (electronic application)<br>\n                                    69,000<br>\n                                    (paper-based application)</td>\n                            </tr>\n                            <tr>\n                                <td class=\"border_L\">Application fee </td>\n                            </tr>\n                        </tbody>\n                    </table>\n                    </div>\n                    <p align=\"right\" class=\"sl_pt10 sl_pr10\"><a href=\"#top\"><img src=\"/resource/images/eng/common/top_bu.png\" alt=\"top button\"></a></p>\n                    <br>\n                    <br>\n                    \n                    <!-- line --> \n                    <a name=\"a3\"></a>\n                    <h4 class=\"type_03\">Payment methods</h4>\n                    <p>All fees can be paid either by direct deposit to a bank in Korea, or by means of a giro (electronic billing system). To utilize either method, you will need a residential or business address in Korea because of the unique online certificate system. Please note that the fees are NOT paid directly to MOIP or a MOIP account.</p>\n                    <p><strong>If you have a residential address in Korea</strong>, you are legally entitled to handle application procedures yourself. When you receive an application number, you should submit a Certificate of the Facts of Alien Registration, which is issued by the Korean Immigration Office or your local district (Gu) office.</p>\n                    <p>There are three ways you can make the payment. First, you can use the electronic application system to <a href=\"https://www.patent.go.kr\" target=\"_blank\" class=\"btn_s04\">pay the fees online</a> or via a <a href=\"http://www.giro.or.kr/\" target=\"_blank\">giro online.</a>This can't be done from abroad because of the unique online certificate system used in Korea.</p>\n                    <p>Second, you can visit our office in person and submit a fee document, <!-- <a href=\"/upload/en/download/Form23_25.zip\" target=\"_blank\" class=\"btn_s04\">form(23,25)</a> -->at which time they will issue you a receipt. Once you are issued the receipt, you can pay the fee at any bank in Korea, and the fee is to be paid by the next day.</p>\n                    <p>Third, you can send a Korean postal money order with the completed payment form. *Please note that all documentation must be in Korean, not English. For further information, please contact our customer service center (1544-8080, Korean only).</p>\n                    <p>If you do not have a residential or business address in Korea, you should appoint a representative to complete all application procedures. If you do appoint a representative, please note you will also need to submit a power of attorney for the representative. <a href=\"/upload/en/download/Form2.zip\" target=\"_blank\" class=\"btn_s04\">(Form 2)</a></p>\n                    <p>If you would like to appoint a patent attorney, contact the <a href=\"http://www.kpaa.or.kr/\" target=\"_blank\" class=\"btn_s04\">Korean Patent Attorneys Association</a> at:</p>\n                    <p>Tel: +82 (2) 3486-3486<br>\n                        Fax: +82 (2) 3486-3511<br>\n                        E-mail: <a href=\"mailto:kpaa@kpaa.or.kr\" class=\"btn_s04\">kpaa@kpaa.or.kr</a></p>\n                    \n                    <!-- update date : S-->\n                    <ul class=\"update_date\">\n                        <li>Last updated 01 February 2024</li>\n                        <li>Intellectual Property Information Policy Division</li>\n                    </ul>\n                    <!--// update date : E--> \n                    \n                </article>\r\n<br /><br />\r\n<!-- ** TEXT AREA(start line) ************************************************************ -->\r\n\t\t\t\t</div>\r\n\t\t\t</div>\r\n        </div>\r\n    </div>\r\n    <!--// container E--> \r\n<!-- ** middle(end line) ******************************************************************************************************************************************* -->\r\n\r\n<!-- ** bottom(start line) *************************