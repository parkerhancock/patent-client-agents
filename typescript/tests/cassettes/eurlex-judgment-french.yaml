      content: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"xhtml-strict.dtd\">\r\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\r\n<!-- fmx2xhtml # converter_version:9.2.0 # generated_on:20200504-0612 -->\r\n<head>\n   <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"/>\n   <link type=\"text/css\" rel=\"stylesheet\"\n         href=\"http://publications.europa.eu/resource/presentation-style-sheet/jur/jur.css\"/>\n   <title>62017CJ0650</title>\n</head>\n<body>\n   <p class=\"sum-title-1\">\n      <a id=\"judgment\"> </a>ARRÊT DE LA COUR (quatrième chambre)</p>\n   <p class=\"sum-title-1\">30 avril 2020 (<span class=\"note\">\n         <a id=\"c-ECR_62017CJ0650_FR_01-E0001\" href=\"#t-ECR_62017CJ0650_FR_01-E0001\">*1</a>\n      </span>)</p>\n   <p class=\"index\">« Renvoi préjudiciel – Propriété intellectuelle et industrielle – Règlement (CE) n<span class=\"super\">o</span> 469/2009 – Certificat complémentaire de protection pour les médicaments – Conditions d’obtention – Article 3, sous a) – Notion de “produit protégé par un brevet de base en vigueur” – Critères d’appréciation »</p>\n   <p class=\"normal\">Dans l’affaire C‑650/17,</p>\n   <p class=\"normal\">ayant pour objet une demande de décision préjudicielle au titre de l’article 267 TFUE, introduite par le Bundespatentgericht (Cour fédérale des brevets, Allemagne), par décision du 17 octobre 2017, parvenue à la Cour le 21 novembre 2017, dans la procédure</p>\n   <p class=\"normal\">\n      <span class=\"bold\">Royalty Pharma Collection Trust</span>\n   </p>\n   <p class=\"pnormal\">contre</p>\n   <p class=\"normal\">\n      <span class=\"bold\">Deutsches Patent- und Markenamt,</span>\n   </p>\n   <p class=\"normal\">LA COUR (quatrième chambre),</p>\n   <p class=\"normal\">composée de M. M. Vilaras, président de chambre, MM. S. Rodin, D. Šváby, M<span class=\"super\">me</span> K. Jürimäe (rapporteure) et M. N. Piçarra, juges,</p>\n   <p class=\"normal\">avocat général : M. G. Hogan,</p>\n   <p class=\"normal\">greffier : M. D. Dittert, chef d’unité,</p>\n   <p class=\"normal\">vu la procédure écrite et à la suite de l’audience du 27 juin 2019,</p>\n   <p class=\"normal\">considérant les observations présentées :</p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">pour Royalty Pharma Collection Trust, par M<span class=\"super\">es</span> D. Bühler, M. Stief et A. Wünsche, Rechtsanwälte,</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">pour le gouvernement français, par M<span class=\"super\">me</span> A.-L. Desjonquères ainsi que par MM. J. Traband et E. Leclerc, en qualité d’agents,</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">pour le gouvernement néerlandais, par M<span class=\"super\">mes</span> M. Bulterman et M. A. M. de Ree, en qualité d’agents,</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">pour la Commission européenne, par MM. É. Gippini Fournier et T. Scharf ainsi que par M<span class=\"super\">me</span> J. Samnadda, en qualité d’agents,</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"normal\">ayant entendu l’avocat général en ses conclusions à l’audience du 11 septembre 2019,</p>\n   <p class=\"normal\">rend le présent</p>\n   <p class=\"sum-title-1\">\n      <span class=\"bold\">Arrêt</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point1\">1</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">La demande de décision préjudicielle porte sur l’interprétation de l’article 3, sous a), du règlement (CE) n<span class=\"super\">o</span> 469/2009 du Parlement européen et du Conseil, du 6 mai 2009, concernant le certificat complémentaire de protection pour les médicaments (<a href=\"http://publications.europa.eu/resource/oj/JOL_2009_152_R_TOC\"\n                  hreflang=\"fr\"\n                  onclick=\"target='CourtTab';\">JO 2009, L 152, p. 1</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point2\">2</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Cette demande a été présentée dans le cadre d’une procédure opposant Royalty Pharma Collection Trust (ci-après « Royalty Pharma ») au Deutsches Patent- und Markenamt (Office allemand des brevets et des marques, Allemagne) (ci-après le « DPMA ») au sujet du refus de ce dernier de délivrer un certificat complémentaire de protection (ci-après le « CCP ») pour la sitagliptine utilisée pour le traitement du diabète sucré.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"sum-title-1\">\n      <span class=\"bold\">Le cadre juridique</span>\n   </p>\n   <p class=\"title-grseq-2\">\n      <span class=\"bold\">\n         <span class=\"italic\">La CBE</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point3\">3</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Sous l’intitulé « Étendue de la protection », l’article 69 de la convention sur la délivrance de brevets européens, signée à Munich le 5 octobre 1973, dans sa version applicable au litige au principal (ci‑après la « CBE »), stipule :</p>\n            <p class=\"normal\">« (1)   L’étendue de la protection conférée par le brevet européen ou par la demande de brevet européen est déterminée par les revendications. Toutefois, la description et les dessins servent à interpréter les revendications.</p>\n            <p class=\"normal\">(2)   Pour la période allant jusqu’à la délivrance du brevet européen, l’étendue de la protection conférée par la demande de brevet européen est déterminée par les revendications contenues dans la demande telle que publiée. Toutefois, le brevet européen tel que délivré ou tel que modifié au cours de la procédure d’opposition, de limitation ou de nullité détermine rétroactivement la protection conférée par la demande, pour autant que cette protection ne soit pas étendue. »</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point4\">4</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">L’article 1<span class=\"super\">er</span> du protocole interprétatif de cet article 69, qui fait partie intégrante de la CBE, en vertu de l’article 164, paragraphe 1, de cette dernière, prévoit :</p>\n            <p class=\"normal\">« L’article 69 ne doit pas être interprété comme signifiant que l’étendue de la protection conférée par le brevet européen est déterminée au sens étroit et littéral du texte des revendications et que la description et les dessins servent uniquement à dissiper les ambiguïtés que pourraient recéler les revendications. Il ne doit pas davantage être interprété comme signifiant que les revendications servent uniquement de ligne directrice et que la protection s’étend également à ce que, de l’avis d’un homme du métier ayant examiné la description et les dessins, le titulaire du brevet a entendu protéger. L’article 69 doit, par contre, être interprété comme définissant entre ces extrêmes une position qui assure à la fois une protection équitable au titulaire du brevet et un degré raisonnable de sécurité juridique aux tiers. »</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"title-grseq-2\">\n      <span class=\"bold\">\n         <span class=\"italic\">Le droit de l’Union</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point5\">5</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Les considérants 3 à 5, 7, 9 et 10 du règlement n<span class=\"super\">o</span> 469/2009 énoncent :</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">« (3)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Les médicaments, et notamment ceux résultant d’une recherche longue et coûteuse, ne continueront à être développés dans [l’Union européenne] et en Europe que s’ils bénéficient d’une réglementation favorable prévoyant une protection suffisante pour encourager une telle recherche.</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">(4)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">À l’heure actuelle, la période qui s’écoule entre le dépôt d’une demande de brevet pour un nouveau médicament et l’autorisation de mise sur le marché dudit médicament réduit la protection effective conférée par le brevet à une durée insuffisante pour amortir les investissements effectués dans la recherche.</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">(5)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Ces circonstances conduisent à une insuffisance de protection qui pénalise la recherche pharmaceutique.</p>\n                  </td>\n               </tr>\n            </table>\n            <p class=\"normal\">[...]</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">(7)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Il convient de prévoir une solution uniforme au niveau [de l’Union] et de prévenir ainsi une évolution hétérogène des législations nationales aboutissant à de nouvelles disparités qui seraient de nature à entraver la libre circulation des médicaments au sein de [l’Union] et à affecter, de ce fait, directement le fonctionnement du marché intérieur.</p>\n                  </td>\n               </tr>\n            </table>\n            <p class=\"normal\">[...]</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">(9)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">La durée de la protection conférée par le [CCP] devrait être déterminée de telle sorte qu’elle permette une protection effective suffisante. À cet effet, le titulaire, à la fois d’un brevet et d’un [CCP], doit pouvoir bénéficier au total de quinze années d’exclusivité au maximum à partir de la première autorisation de mise sur le marché, dans [l’Union], du médicament en question.</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">(10)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Néanmoins, tous les intérêts en jeu, y compris ceux de la santé publique, dans un secteur aussi complexe et sensible que le secteur pharmaceutique, devraient être pris en compte. À cet effet, le [CCP] ne saurait être délivré pour une durée supérieure à cinq ans. La protection qu’il confère devrait en outre être strictement limitée au produit couvert par l’autorisation de sa mise sur le marché en tant que médicament. »</p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point6\">6</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">L’article 1<span class=\"super\">er</span> de ce règlement dispose :</p>\n            <p class=\"normal\">« Aux fins du présent règlement, on entend par :</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">a)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">“médicament” : toute substance ou composition présentée comme possédant des propriétés curatives ou préventives à l’égard des maladies humaines ou animales, ainsi que toute substance ou composition pouvant être administrée à l’homme ou à l’animal en vue d’établir un diagnostic médical ou de restaurer, de corriger ou de modifier des fonctions organiques chez l’homme ou l’animal ;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">b)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">“produit” : le principe actif ou la composition de principes actifs d’un médicament ;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">c)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">“brevet de base” : un brevet qui protège un produit en tant que tel, un procédé d’obtention d’un produit ou une application d’un produit et qui est désigné par son titulaire aux fins de la procédure d’obtention d’un [CCP] ;</p>\n                  </td>\n               </tr>\n            </table>\n            <p class=\"normal\">[...] »</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point7\">7</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">L’article 3 dudit règlement, intitulé « Conditions d’obtention du [CCP] », prévoit :</p>\n            <p class=\"normal\">« Le [CCP] est délivré, si, dans l’État membre où est présentée la demande visée à l’article 7 et à la date de cette demande :</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">a)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">le produit est protégé par un brevet de base en vigueur ;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">b)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">le produit, en tant que médicament, a obtenu une autorisation de mise sur le marché en cours de validité [...]</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">c)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">le produit n’a pas déjà fait l’objet d’un [CCP]</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">d)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">l’autorisation mentionnée au point b) est la première autorisation de mise sur le marché du produit, en tant que médicament. »</p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point8\">8</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">L’article 4 du même règlement, intitulé « Objet de la protection », dispose :</p>\n            <p class=\"normal\">« Dans les limites de la protection conférée par le brevet de base, la protection conférée par le [CCP] s’étend au seul produit couvert par l’autorisation de mise sur le marché du médicament correspondant, pour toute utilisation du produit, en tant que médicament, qui a été autorisée avant l’expiration du [CCP]. »</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point9\">9</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Aux termes de l’article 5 du règlement n<span class=\"super\">o</span> 469/2009, relatif aux « [e]ffets du [CCP] » :</p>\n            <p class=\"normal\">« Sous réserve de l’article 4, le [CCP] confère les mêmes droits que ceux qui sont conférés par le brevet de base et est soumis aux mêmes limitations et aux mêmes obligations. »</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point10\">10</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">L’article 13 de ce règlement, intitulé « Durée du [CCP] », prévoit, à son paragraphe 1 :</p>\n            <p class=\"normal\">« Le [CCP] produit effet au terme légal du brevet de base pour une durée égale à la période écoulée entre la date du dépôt de la demande du brevet de base et la date de la première autorisation de mise sur le marché dans [l’Union], réduite d’une période de cinq ans. »</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"sum-title-1\">\n      <span class=\"bold\">Le litige au principal et les questions préjudicielles</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point11\">11</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Royalty Pharma est titulaire du brevet européen (DE) EP 1084705 (ci‑après le « brevet de base en cause au principal »), demandé le 24 avril 1997. Ce brevet divulgue une méthode de réduction du taux de glucose sanguin des mammifères par injection d’inhibiteurs de l’enzyme dipeptidyl peptidase IV (ci-après la « DP IV »), ce qui contribue à la régulation du taux de sucre dans le sang.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point12\">12</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">La sitagliptine fait partie des inhibiteurs de la DP IV. Ce produit a été développé par un preneur de licence du brevet de base en cause au principal après la date de dépôt de la demande de ce brevet. Ce preneur de licence a obtenu un nouveau brevet couvrant la sitagliptine, lequel a servi de brevet de base pour la délivrance d’un CCP.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point13\">13</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Le 17 décembre 2014, Royalty Pharma a déposé une demande de CCP pour la sitagliptine auprès du DPMA, sur le fondement du brevet de base en cause au principal et d’une autorisation de mise sur le marché (ci-après l’« AMM ») délivrée le 21 mars 2007 par l’Agence européenne des médicaments (EMA) pour le médicament commercialisé sous le nom de Januvia.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point14\">14</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Cette demande a été rejetée le 12 avril 2017 par le DPMA, au motif que la condition requise à l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 n’était pas remplie. Cet office a considéré que, si la sitagliptine répond bien à la définition fonctionnelle de l’inhibiteur de DP IV donnée par les revendications du brevet de base en cause au principal, ce brevet ne comporte pas la moindre divulgation spécifique de ce produit, de sorte que le principe actif concret n’a pas été livré à l’homme du métier.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point15\">15</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Ainsi, selon le DPMA, l’objet de la protection dudit brevet ne correspond pas au médicament développé ultérieurement et commercialisé sous le nom de Januvia. Il serait donc contraire aux objectifs du règlement n<span class=\"super\">o</span> 469/2009 de délivrer un CCP pour un produit qui n’a pas été divulgué par le brevet de base en cause au principal.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point16\">16</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Royalty Pharma a formé un recours contre cette décision devant le Bundespatentgericht (Cour fédérale des brevets, Allemagne). Elle fait valoir qu’il n’est pas nécessaire, aux fins qu’un produit bénéficie de la protection conférée par un brevet de base en vigueur, que ce dernier indique le nom chimique ou la structure du principe actif protégé, l’exposé des caractéristiques fonctionnelles de ce principe étant suffisant à cette fin. Elle soutient que la sitagliptine répond à la définition fonctionnelle d’une catégorie de principe actif visée dans le brevet de base en cause au principal. Selon elle, n’importe quel inhibiteur de DP IV pour traiter le diabète sucré relève du « cœur de l’invention brevetée » en cause au principal, qui recouvre l’ensemble des composés spécifiques répondant à cette définition. La Cour n’aurait pas interprété l’article 3 du règlement n<span class=\"super\">o</span> 469/2009 en ce sens que l’obtention d’un CCP pour un principe actif est subordonnée à la condition que ce principe actif soit indiqué sous sa forme individualisée dans les revendications du brevet de base. De surcroît, la Cour aurait souligné l’importance de la notion de « cœur de l’activité inventive ».</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point17\">17</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">En outre, Royalty Pharma fait observer que les juridictions du Royaume-Uni interprètent la jurisprudence de la Cour en ce sens. Elle relève qu’il existe toutefois des divergences d’interprétation entre les États membres, qui risquent de perdurer si la Cour n’apporte pas une clarification sur ce point.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point18\">18</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Le Bundespatentgericht (Cour fédérale des brevets) relève que la Cour a jugé que, aux fins d’interpréter l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, il convient d’avoir égard à l’objet de la protection du brevet de base qui doit être recherché en interprétant les revendications de ce brevet. À ce titre, les revendications auraient la double fonction de définir l’objet de la protection conférée par le brevet et de déterminer l’étendue de cette protection, laquelle va au-delà de cet objet. Or, la juridiction de renvoi comprend la jurisprudence de la Cour en ce sens qu’il conviendrait, aux fins d’interpréter cet article, de tenir compte de l’objet de la protection et non de l’étendue de celle-ci. Ainsi, un principe actif ne remplirait la condition énoncée par ledit article que si ce principe actif est décrit à ce point concrètement dans les revendications du brevet de base qu’il est clair qu’il relève de l’objet de la protection de ce brevet.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point19\">19</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Contrairement à ce qu’affirme Royalty Pharma, la juridiction de renvoi considère que la notion de « cœur de l’activité inventive » n’est pas pertinente pour l’interprétation de l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009. De la même façon, la décision du Bundesgerichtshof (Cour fédérale de justice, Allemagne), du 11 septembre 2013 (X ZB 8/12), rendue sur les inhibiteurs de la DP IV, n’apporterait pas de réponse sur l’interprétation de cet article, mais préciserait uniquement l’exigence de suffisance de description lorsqu’une définition fonctionnelle est utilisée dans les revendications d’un brevet.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point20\">20</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Cela étant, la juridiction de renvoi souligne les divergences fondamentales qui existent entre les États membres sur l’interprétation à retenir des critères dégagés par la jurisprudence de la Cour relatifs à l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009. Cette juridiction renvoie notamment à l’interprétation retenue par la High Court of Justice (England &amp; Wales), Chancery Division (patents court) [Haute Cour de justice (Angleterre et pays de Galles), division de la Chancery (chambre des brevets), Royaume-Uni] à cet égard, pour laquelle la notion de « cœur de l’activité inventive » est applicable à l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point21\">21</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Dans ces conditions, le Bundespatentgericht (Cour fédérale des brevets) a décidé de surseoir à statuer et de poser à la Cour les questions préjudicielles suivantes :</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">« 1)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Un produit n’est-il protégé par le brevet de base en vigueur, conformément à l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, que lorsqu’il relève de l’objet de la protection défini par les revendications du brevet en étant ainsi livré à l’homme du métier en tant que mode de réalisation concret ?</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">2)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Les conditions requises à l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 ne sont-elles dès lors pas suffisamment remplies lorsque le produit en question répond certes à la définition fonctionnelle générale que les revendications du brevet donnent d’une catégorie de principe actif sans pour autant être individualisé en tant que mode concret de réalisation à tirer de l’enseignement protégé par le brevet de base ?</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count\">3)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">Un produit n’est-il déjà plus protégé par le brevet de base en vigueur, conformément à l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, lorsqu’il relève certes de la définition fonctionnelle donnée dans les revendications du brevet mais n’a été développé qu’après la date de dépôt de la demande du brevet de base dans une activité inventive autonome ? »</p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point22\">22</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À la suite du prononcé de l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>), la Cour a demandé au Bundespatentgericht (Cour fédérale des brevets) si, au regard de cet arrêt, elle souhaitait maintenir sa demande de décision préjudicielle et, le cas échéant, pour quels motifs.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point23\">23</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Par lettre en date du 21 août 2018, cette juridiction a indiqué à la Cour qu’elle maintenait cette demande en arguant, en substance, du fait qu’il est nécessaire de promouvoir une pratique uniforme au niveau des États membres pour les différents cas de figure de l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009. Or, il ne ressortirait pas clairement de l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>), lu à la lumière de la jurisprudence antérieure de la Cour et des conclusions de l’avocat général dans l’affaire ayant donné lieu à cet arrêt, si la notion de « cœur de l’activité inventive » a une quelconque pertinence aux fins d’interpréter l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009. Il conviendrait donc que la Cour apporte une précision sur ce point.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"sum-title-1\">\n      <span class=\"bold\">Sur la demande de réouverture de la procédure orale</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point24\">24</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Par une lettre déposée au greffe de la Cour le 23 septembre 2019, Royalty Pharma a demandé la réouverture de la procédure orale, conformément à l’article 83 du règlement de procédure de la Cour.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point25\">25</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Au soutien de sa demande, Royalty Pharma fait valoir deux arguments. D’une part, M. l’avocat général aurait fondé ses conclusions sur un exposé des faits erroné, en ce que, au point 14 de celles-ci, il a affirmé que Royalty Pharma avait déposé une demande de CCP pour la sitagliptine sur le fondement du brevet de base EP 1412357, en cause dans l’arrêt du 8 décembre 2011, Merck Sharp &amp; Dohme (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2011%3A812\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑125/10</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2011%3A812\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2011:812</a>), alors que cette demande était fondée sur le brevet de base EP 1084705. D’autre part, M. l’avocat général se serait écarté de la jurisprudence issue de l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point26\">26</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À cet égard, il ressort d’une jurisprudence constante que la Cour peut d’office ou sur proposition de l’avocat général, ou encore à la demande des parties, ordonner la réouverture de la procédure orale, conformément à l’article 83 de son règlement de procédure, si elle considère qu’elle est insuffisamment éclairée, que l’affaire doit être tranchée sur la base d’un argument qui n’a pas été débattu entre les parties ou encore que l’une des parties a soumis un fait nouveau de nature à exercer une influence décisive sur la décision de la Cour. En revanche, le statut de la Cour de justice de l’Union européenne et le règlement de procédure ne prévoient pas la possibilité pour les parties de déposer des observations en réponse aux conclusions présentées par l’avocat général (arrêt du 21 mars 2019, Abraxis Bioscience, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2019%3A238\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑443/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2019%3A238\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2019:238</a>, point <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2019%3A238#point16\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">16</a> et jurisprudence citée).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point27\">27</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">S’agissant des erreurs factuelles qu’il conviendrait de rectifier, elles ne sont pas de nature à exercer une influence décisive sur la décision que la Cour adopte dans le cadre d’une demande de décision préjudicielle et, partant, à justifier une réouverture de la phase orale de la procédure. S’agissant de l’argument relatif à l’interprétation propre à M. l’avocat général de l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>), il y a lieu de relever que, par cet argument, Royalty Pharma souhaite, en réalité, répondre à certains points des conclusions de M. l’avocat général. Or, il découle de la jurisprudence citée au point précédent du présent arrêt que le dépôt de telles observations n’est pas prévu par les textes régissant la procédure devant la Cour.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point28\">28</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Au demeurant, la Cour considère, M. l’avocat général entendu, qu’elle est suffisamment éclairée pour répondre aux questions posées par la juridiction de renvoi et que tous les arguments nécessaires pour trancher la présente affaire ont déjà été débattus au cours de la procédure.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point29\">29</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Par conséquent, il convient de rejeter la demande de réouverture de la procédure orale.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"sum-title-1\">\n      <span class=\"bold\">Sur les questions préjudicielles</span>\n   </p>\n   <p class=\"title-grseq-2\">\n      <span class=\"bold\">\n         <span class=\"italic\">Observations liminaires</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point30\">30</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À titre liminaire, il y a lieu de relever que, ainsi que cela est mentionné au point 23 du présent arrêt, la juridiction de renvoi a décidé de maintenir sa demande de décision préjudicielle afin d’obtenir certaines clarifications quant à la portée de l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>), aux fins de la résolution du litige au principal. Plus précisément, cette juridiction s’interroge sur le point de savoir si la notion de « cœur de l’activité inventive » est pertinente aux fins d’interpréter l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009. Elle constate que, dans cet arrêt, la Cour s’est prononcée sans faire état des critiques émises par l’avocat général Wathelet dans ses conclusions dans l’affaire Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A278\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A278\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:278</a>), en particulier au point 73 de celles-ci, sur l’usage de cette notion aux fins de déterminer l’objet de la protection conférée par un brevet de base. La juridiction de renvoi en déduit que, en n’ayant pas explicitement écarté l’application de cette notion, aux fins d’apprécier si une combinaison de principes actifs pouvait bénéficier de la protection conférée par un brevet de base en vigueur, la Cour pourrait avoir implicitement consacré ladite notion. La juridiction de renvoi souligne, en outre, que les interrogations relatives à la notion de « cœur de l’activité inventive » seraient à la source de nombreuses divergences d’interprétation de l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 entre les juridictions et les offices nationaux compétents.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point31\">31</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À cet égard, il convient d’observer que, dans la réponse qu’elle a apportée à la question posée dans l’affaire ayant donné lieu à l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, points <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point34\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">34</a> et <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point35\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">35</a>), la Cour n’a pas employé la notion de « cœur de l’activité inventive », alors même que la juridiction de renvoi l’y invitait dans sa demande de décision préjudicielle. Au contraire, dans cet arrêt, la Cour a rappelé le rôle essentiel des revendications, en application de l’article 69 de la CBE et de l’article 1<span class=\"super\">er</span> du protocole interprétatif de cet article 69, confirmant ainsi que l’objet de la protection conférée par un CCP doit se limiter aux caractéristiques techniques de l’invention couverte par le brevet de base, telles que revendiquées par ce brevet (arrêt du 25 juillet 2018, Teva UK e.a., <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, point <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point46\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">46</a>), et non pas s’étendre au « cœur de l’activité inventive ».</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point32\">32</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Ce faisant, la Cour s’est clairement fondée sur une interprétation de l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, dans le cadre de laquelle la notion de « cœur de l’activité inventive » n’est pas pertinente.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"title-grseq-2\">\n      <span class=\"bold\">\n         <span class=\"italic\">Sur les première et deuxième questions</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point33\">33</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Par ses première et deuxième questions, qu’il convient d’examiner ensemble, la juridiction de renvoi demande, en substance, si l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 doit être interprété en ce sens qu’un produit est protégé par un brevet de base en vigueur, au sens de cette disposition, lorsqu’il répond à une définition fonctionnelle générale employée par l’une des revendications du brevet de base et relève nécessairement de l’invention couverte par ce brevet, sans pour autant être individualisé en tant que mode concret de réalisation à tirer de l’enseignement dudit brevet.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point34\">34</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À cet égard, il convient de rappeler que la Cour a, de manière constante, souligné le rôle essentiel des revendications aux fins de déterminer si un produit est protégé par un brevet de base au sens de cette disposition (arrêt du 25 juillet 2018, Teva UK e.a., <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, point <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point34\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">34</a> ainsi que jurisprudence citée).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point35\">35</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">En ce qui concerne, en particulier, le brevet européen, il convient de relever que, aux termes de l’article 69 de la CBE, l’étendue de la protection qu’il confère est déterminée par les revendications d’un tel brevet. Les indications figurant à l’article 1<span class=\"super\">er</span> du protocole interprétatif de cet article 69 précisent que ces revendications doivent permettre d’assurer à la fois une protection équitable au titulaire du brevet et un degré raisonnable de sécurité juridique aux tiers. Ainsi, elles ne doivent ni uniquement servir de lignes directrices ni être lues comme signifiant que l’étendue de la protection conférée par un brevet est déterminée par le sens étroit et littéral du texte des revendications (arrêt du 25 juillet 2018, Teva UK e.a., <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, point <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point35\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">35</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point36\">36</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À ce titre, la Cour a jugé que l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 ne s’oppose pas, en principe, à ce qu’un principe actif répondant à une définition fonctionnelle figurant dans les revendications d’un brevet de base délivré par l’Office européen des brevets puisse être considéré comme étant protégé par ce brevet, à la condition toutefois que, sur la base de telles revendications, interprétées notamment à la lumière de la description de l’invention, ainsi que le prescrivent l’article 69 de la CBE et le protocole interprétatif de celui-ci, il soit possible de conclure que ces revendications visaient, implicitement mais nécessairement, le principe actif en cause, et ce de manière spécifique (arrêt du 25 juillet 2018, Teva UK e.a., <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, point <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point36\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">36</a> ainsi que jurisprudence citée).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point37\">37</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">La Cour en a déduit que, aux fins de vérifier si un produit donné est protégé par un brevet de base en vigueur, au sens de l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, il convient de vérifier, lorsque ce produit n’est pas explicitement mentionné dans les revendications de ce brevet, si ledit produit est nécessairement et spécifiquement visé dans l’une de ces revendications. À cette fin, deux conditions cumulatives doivent être remplies. D’une part, le produit doit nécessairement relever, pour l’homme du métier, à la lumière de la description et des dessins du brevet de base, de l’invention couverte par ce brevet. D’autre part, l’homme du métier doit être en mesure d’identifier ce produit de façon spécifique à la lumière de l’ensemble des éléments divulgués par ledit brevet, et sur la base de l’état de la technique à la date de dépôt ou de priorité du même brevet (voir, en ce sens, arrêt du 25 juillet 2018, Teva UK e.a., <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, point <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point52\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">52</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point38\">38</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Dans l’affaire au principal, il ressort de la décision de renvoi que, si la sitagliptine n’est pas explicitement mentionnée dans les revendications du brevet de base, elle répond à la définition fonctionnelle employée par l’une des revendications de ce brevet. Dans ces conditions, sous réserve des vérifications qu’il appartient à la juridiction de renvoi d’effectuer, la sitagliptine relève nécessairement, en tant qu’inhibiteur de la DP IV, de l’invention couverte par le brevet de base et, partant, la première condition fixée dans l’arrêt du 25 juillet 2018, Teva UK e.a. (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>), est remplie.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point39\">39</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">En revanche, des doutes peuvent être émis sur le point de savoir si la sitagliptine, qui n’est pas identifiée individuellement dans le fascicule du brevet de base en cause au principal, remplit la seconde des deux conditions cumulatives identifiées au point 37 du présent arrêt. Plus précisément, les doutes de la juridiction de renvoi portent, en substance, sur le point de savoir si, en se plaçant à la date de dépôt ou de priorité du brevet de base, et à la lumière de l’ensemble des éléments divulgués par ce brevet, la sitagliptine est spécifiquement identifiable par l’homme du métier alors même qu’elle n’est pas individualisée en tant que mode concret de réalisation dans le fascicule du brevet de base. La juridiction de renvoi cherche ainsi à déterminer quel est le degré de spécificité de la divulgation du produit requis par l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point40\">40</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Afin de déterminer si la seconde condition visée au point 37 du présent arrêt est remplie, il revient, plus particulièrement, à la juridiction de renvoi de vérifier si l’objet du CCP concerné est compris dans les limites de ce que l’homme du métier est objectivement en mesure, à la date du dépôt ou de priorité du brevet de base, de déduire directement et sans équivoque du fascicule de ce brevet tel qu’il a été déposé, en se fondant sur ses connaissances générales dans le domaine considéré à la date de dépôt ou de priorité et à la lumière de l’état de la technique à la date de dépôt ou de priorité.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point41\">41</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Il s’ensuit que, même lorsque le produit faisant l’objet du CCP n’est pas individualisé en tant que mode concret de réalisation à tirer de l’enseignement du brevet de base, l’octroi d’un CCP n’est, en principe, pas exclu.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point42\">42</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Pour autant, lorsque le produit n’est pas explicitement divulgué par les revendications du brevet de base, mais relève d’une définition fonctionnelle générale, telle que celle employée par le brevet de base en cause au principal, l’homme du métier doit être en mesure de déduire directement et sans ambiguïté du fascicule du brevet tel que déposé que le produit faisant l’objet du CCP relève de l’objet de la protection de ce brevet.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point43\">43</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Il résulte de ce qui précède qu’il convient de répondre aux première et deuxième questions que l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 doit être interprété en ce sens qu’un produit est protégé par un brevet de base en vigueur, au sens de cette disposition, lorsqu’il répond à une définition fonctionnelle générale employée par l’une des revendications du brevet de base et relève nécessairement de l’invention couverte par ce brevet, sans pour autant être individualisé en tant que mode concret de réalisation à tirer de l’enseignement dudit brevet, dès lors qu’il est spécifiquement identifiable, à la lumière de l’ensemble des éléments divulgués par le même brevet, par l’homme du métier, sur la base de ses connaissances générales dans le domaine considéré à la date de dépôt ou de priorité du brevet de base et de l’état de la technique à cette même date.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"title-grseq-2\">\n      <span class=\"bold\">\n         <span class=\"italic\">Sur la troisième question</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point44\">44</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Par sa troisième question, la juridiction de renvoi demande si l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 doit être interprété en ce sens qu’un produit n’est pas protégé par le brevet de base en vigueur, au sens de cette disposition, lorsque, bien que relevant de la définition fonctionnelle contenue dans les revendications de ce brevet, il a été développé après la date de dépôt de la demande du brevet de base, au terme d’une activité inventive autonome.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point45\">45</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">À cet égard, il y a lieu de rappeler que, aux fins d’appliquer la condition fixée par l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, l’objet de la protection conférée par le brevet de base doit être déterminé à la date de dépôt ou de priorité de ce brevet. En effet, s’il pouvait être tenu compte de résultats issus de recherches intervenues après la date de dépôt ou de priorité dudit brevet, un CCP pourrait permettre à son titulaire de bénéficier indûment d’une protection pour ces résultats, alors même que ceux-ci n’étaient pas connus à l’une ou l’autre de ces dates.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point46\">46</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">La Cour a souligné que le CCP n’a pas pour vocation d’étendre le champ de la protection conférée par le brevet de base au-delà de l’invention couverte par ce brevet. Il serait contraire à l’objectif du règlement n<span class=\"super\">o</span> 469/2009, selon lequel l’octroi de la période d’exclusivité supplémentaire au moyen d’un CCP vise à encourager la recherche et, pour ce faire, à permettre un amortissement des investissements effectués dans cette recherche, d’octroyer un CCP pour un produit qui ne relève pas de l’invention qui fait l’objet du brevet de base, dans la mesure où un tel CCP ne porterait pas sur les résultats de la recherche revendiqués par ce brevet (voir, en ce sens, arrêt du 25 juillet 2018, Teva UK e.a., <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">EU:C:2018:585</a>, points <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point39\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">39</a> ainsi que <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point40\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"fr\"\n                  class=\"CourtLink\">40</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point47\">47</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Il s’ensuit qu’un produit faisant l’objet d’un CCP ou d’une demande de CCP qui a été développé, après la date de dépôt ou de priorité du brevet de base, au terme d’une activité inventive autonome, ne saurait être considéré comme relevant de l’objet de la protection conférée par ce brevet.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point48\">48</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Le fait qu’un tel produit relève de la définition fonctionnelle donnée dans les revendications du brevet de base ne saurait infirmer cette interprétation. En effet, ainsi qu’il ressort de la réponse aux première et deuxième questions, un produit ne saurait être considéré comme étant protégé par un brevet de base en vigueur, au sens de l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009, que si, du point de vue de l’homme du métier, se fondant sur ses connaissances générales dans le domaine considéré à la date de dépôt ou de priorité de ce brevet, et sur la base de l’état de la technique à cette même date, ce produit est spécifiquement identifiable, à la lumière de l’ensemble des éléments divulgués par ledit brevet.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point49\">49</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Or, tel n’est pas le cas d’un produit développé, après la date de dépôt ou de priorité du brevet de base, au terme d’une activité inventive autonome.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point50\">50</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Compte tenu de ce qui précède, il convient de répondre à la troisième question que l’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 doit être interprété en ce sens qu’un produit n’est pas protégé par un brevet de base en vigueur, au sens de cette disposition, lorsque, bien que relevant de la définition fonctionnelle donnée dans les revendications de ce brevet, il a été développé après la date de dépôt de la demande du brevet de base, au terme d’une activité inventive autonome.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"sum-title-1\">\n      <span class=\"bold\">Sur les dépens</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"count\" id=\"point51\">51</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"normal\">La procédure revêtant, à l’égard des parties au principal, le caractère d’un incident soulevé devant la juridiction de renvoi, il appartient à celle-ci de statuer sur les dépens. Les frais exposés pour soumettre des observations à la Cour, autres que ceux desdites parties, ne peuvent faire l’objet d’un remboursement.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\"> </td>\n         <td valign=\"top\">\n            <p class=\"normal\">Par ces motifs, la Cour (quatrième chambre) dit pour droit :</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\"> </td>\n         <td valign=\"top\">\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count bold\">\n                        <span class=\"bold\">1)</span>\n                     </p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">\n                        <span class=\"bold\">L’article 3, sous a), du règlement (CE) n<span class=\"super\">o</span> 469/2009 du Parlement européen et du Conseil, du 6 mai 2009, concernant le certificat complémentaire de protection pour les médicaments, doit être interprété en ce sens qu’un produit est protégé par un brevet de base en vigueur, au sens de cette disposition, lorsqu’il répond à une définition fonctionnelle générale employée par l’une des revendications du brevet de base et relève nécessairement de l’invention couverte par ce brevet, sans pour autant être individualisé en tant que mode concret de réalisation à tirer de l’enseignement dudit brevet, dès lors qu’il est spécifiquement identifiable, à la lumière de l’ensemble des éléments divulgués par le même brevet, par l’homme du métier, sur la base de ses connaissances générales dans le domaine considéré à la date de dépôt ou de priorité du brevet de base et de l’état de la technique à cette même date.</span>\n                     </p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\"> </td>\n         <td valign=\"top\">\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"count bold\">\n                        <span class=\"bold\">2)</span>\n                     </p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"normal\">\n                        <span class=\"bold\">L’article 3, sous a), du règlement n<span class=\"super\">o</span> 469/2009 doit être interprété en ce sens qu’un produit n’est pas protégé par un brevet de base en vigueur, au sens de cette disposition, lorsque, bien que relevant de la définition fonctionnelle donnée dans les revendications de ce brevet, il a été développé après la date de dépôt de la demande du brevet de base, au terme d’une activité inventive autonome.</span>\n                     </p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tbody>\n         <tr>\n            <td> </td>\n            <td>\n               <div class=\"signaturecase\">\n                  <p class=\"normal\">Signatures</p>\n               </div>\n            </td>\n         </tr>\n      </tbody>\n   </table>\n   <hr class=\"note\"/>\n   <p class=\"note\">(<span class=\"note\">\n         <a id=\"t-ECR_62017CJ0650_FR_01-E0001\" href=\"#c-ECR_62017CJ0650_FR_01-E0001\">*1</a>\n      </span>)\tLangue de procédure : l’allemand.</p>\n</body>\r\n</html>\r\n"
