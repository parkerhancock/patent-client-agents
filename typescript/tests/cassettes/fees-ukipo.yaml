                <div class="govspeak"><h2 id="introduction">1. Introduction </h2>
        
        <p>On 1 April 2026, the government will be increasing fees for designs, patents, and trade marks. The fee changes have been laid in parliament under the statutory instrument:  <a rel="external" href="https://www.legislation.gov.uk/uksi/2026/183/contents/made">The Intellectual Property Fees (Miscellaneous Amendments, Revocation and Transitional Provisions) Rules 2026</a>.</p>
        
        <p>The Intellectual Property Office (<abbr title="Intellectual Property Office">IPO</abbr>) has prepared this guidance for customers who may have fees due around 1 April 2026 and explains when and how the new fees will apply.  Please note you are responsible for paying the correct fee.</p>
        
        <p>In this guidance, “old fee” refers to the fee amount which applies before 1 April 2026, and “new fee” to the amount which applies on and after 1 April 2026. </p>
        
        <h2 id="fee-changes">2. Fee changes </h2>
        
        <p>You can view the old and new fees for each right:  </p>
        
        <p><a href="https://www.gov.uk/csv-preview/698b663346be5092a1cfd89c/Patents_list_of_current_and_new_fees___4_.csv">Patents fees table</a> </p>
        
        <p><a href="https://www.gov.uk/csv-preview/690a33c57a88fd270a95fda9/Trade_marks_list_of_current_and_new_fees.csv">Trade marks fees table</a></p>
        
        <p><a href="https://www.gov.uk/csv-preview/694140e158a21370f58f2f98/Registered-Designs-list-of-current-and-new-fees.csv">Registered designs fees table</a></p>
        
        <p><a href="https://www.gov.uk/csv-preview/694140fa5431f4f94d7f0a9c/Unregistered-Designs-list-of-current-and-new-fees.csv">Unregistered designs fees table</a></p>
        
        <h2 id="when-the-new-fees-will-be-introduced">3. When the new fees will be introduced </h2>
        
        <p>The new fees will take effect on 1 April 2026. Fees will be charged at the old fee rate up to and including 31 March 2026. </p>
        
        <h2 id="why-fees-are-increasing">4. Why fees are increasing </h2>
        
        <p>The <abbr title="Intellectual Property Office">IPO</abbr>’s fees have not increased since 2018 for patents, 2016 for designs and 1998 for trade marks. During this time, the <abbr title="Intellectual Property Office">IPO</abbr> has avoided fee increases by improving efficiency and investing in digital services using existing reserves. However there has been a 32% rise in inflation since 2016.   </p>
        
        <p>Fees will increase by an average of 25% on 1 April 2026. This increase will allow the <abbr title="Intellectual Property Office">IPO</abbr> to address both the rise in inflation and future cost pressures that cannot be fully offset through further efficiency savings or existing reserves. The fee increases will mean the <abbr title="Intellectual Property Office">IPO</abbr> can continue to invest in its systems and provide high quality services. </p>
        
        <h2 id="application-fees">5.  Application fees </h2>
        
        <p>If you are applying for a trade mark, patent or registered design, or paying an application fee  on or  after 1 April 2026, you will  generally pay the new fee. </p>
        
        <p>Please note that using the ‘save for later’ or ‘draft’ function does not count as submitting the application. You will have to pay the new fee if submitting the application on or after  1 April 2026.  </p>
        
        <p>If you are applying for a trade mark or a registered design, then you may need to consider the specific points set out below.  </p>
        
        <h3 id="designs-deferral-fee">5.1. Designs: deferral fee </h3>
        
        <p>If you make a request to register a deferred design on or after 1 April 2026, the new fee will apply, even if your original application was submitted before that date.  </p>
        
        <h3 id="trade-marks-period-of-grace">5.2. Trade Marks: period of grace</h3>
        
        <p>If you apply for a trade mark before 1 April 2026, and you are relying on the period of grace to pay the application fee on or after 1 April 2026, you will pay the old fee, provided it is paid within the deadline given. This includes any additional class or series fees.   </p>
        
        <h3 id="trade-marks-right-start">5.3. Trade Marks: Right Start </h3>
        
        <p>If you have submitted a Right Start application for a trade mark and paid the initial  fee before 1 April 2026, the fee you will pay to complete your registration will be the old fee (provided it is paid within the deadline given, even if that is  on or after 1 April 2026).   </p>
        
        <h2 id="renewal-fees">6. Renewal fees </h2>
        
        <p>To stay in force, IP rights must be renewed on a regular basis – patents every year, designs every 5 years, and trade marks every 10 years.   </p>
        
        <p>The renewal fee is normally due by a specific date or within a specific period. It can be paid up to 3 months in advance for patents, and up to 6 months in advance for designs and trade marks. There is also a 6 month period in which you can pay the fee late, although this is subject to a separate late renewal fee.  </p>
        
        <p>Whether you pay the old or new fee for your renewal will depend on the date your renewal is due and when you pay the renewal fee.  This does not apply to the late renewal  fee. If you are paying for a renewal that is late on or after 1 April 2026, any late renewal fee will be the new fee.   </p>
        
        <p>You should consult the table below to see which fee will apply in your circumstances:</p>
        
        <table>
          <thead>
            <tr>
              <td></td>
              <th scope="col">Payment made before 1 April 2026</th>
              <th scope="col">Payment made on or after 1 April 2026 (with no late fee due)</th>
              <th scope="col">Payment made on or after 1 April 2026 (late fee due)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Renewal due date before 1 April 2026</th>
              <td>Old fee</td>
              <td>Old fee</td>
              <td>Old renewal fee + new late fee</td>
            </tr>
            <tr>
              <th scope="row">Renewal due date on or after 1 April 2026</th>
              <td>Old fee</td>
              <td>New Fee</td>
              <td>New renewal fee + new late fee</td>
            </tr>
          </tbody>
        </table>
        
        <p>The following IP rights can be renewed in advance before 1 April 2026:</p>
        
        <ul>
          <li>patents with a renewal due date in April or May 2026 (those with a renewal date in June 2026 can only be renewed from 1 April 2026 onwards)</li>
          <li>trade marks with a renewal due date up to and including 30 September 2026 </li>
          <li>designs with a renewal due date up to and including 30 September 2026</li>
        </ul>
        
        <h2 id="patent-grant-fees">7. Patent grant fees</h2>
        
        <p>If a notification of grant under section 18(4) is issued before 1 April 2026, and a grant fee is required, the old fees for excess claims and excess pages will apply - even if you pay the fee on or after 1 April 2026 (more information on this is outlined under rule 30A in <a href="https://www.gov.uk/government/publications/the-patents-rules-2007-and-patents-fees-rules-2007">The Patents Rules and Fees Rules 2007</a>).</p>
        
        <p>If this applies to you, and you are paying the grant fee on or after 1 April, please note that due to technical limitations, our online payment service will only calculate the fee for excess claims and pages based on the new fee amount. You may either:</p>
        
        <ul>
          <li>file using the online service, paying the new fees, and we will refund the difference after filing, or</li>
          <li>file using our <a href="https://www.gov.uk/government/publications/grant-fee-for-patent-application">paper form</a> and pay the old fees directly.</li>
        </ul>
        
        <h2 id="international-fees">8. International fees</h2>
        
        <h3 id="international-trade-mark-fees">8.1 International trade mark fees</h3>
        
        <p>Fees for international trade marks are paid in Swiss francs directly to the World Intellectual Property Organisation (<abbr title="World Intellectual Property Organisation">WIPO</abbr>). There are individual fees for international trade marks that designate the UK, and these will also increase on 1 April 2026. You can find the updated fees in <a rel="external" href="https://www.wipo.int/documents/d/madrid-system/information-notices-en-2026-madrid_2026_5_e.pdf">the Madrid System Information Notice no. 5/2026</a>.</p>
        
        <h3 id="international-trade-mark-renewals">8.2 International trade mark renewals</h3>
        
        <p>You can pay renewal fees for international trade marks up to 6 months before the renewal due date.</p>
        
        <p>Under rule 34(7)(d) of the Madrid Regulations, the old fee will apply if:</p>
        
        <ul>
          <li>you pay the renewal fee before 1 April 2026, even when the renewal due date is on or after 1 April 2026</li>
          <li>the renewal fee is due before 1 April 2026 but is paid on or after that date</li>
        </ul>
        
        <p>The new fee will apply if the renewal fee is both due and paid on or after 1 April 2026.</p>
        
        <p>If you pay more than 6 months before the renewal due date, <abbr title="World Intellectual Property Organisation">WIPO</abbr> will treat the payment as being received 6 months before the due date. This may affect whether the old fee or the new fee applies.</p>
        
        <h2 id="what-happens-if-you-pay-the-old-fee-by-mistake">9. What happens if you pay the old fee by mistake</h2>
        
        <p>You have to pay the correct fee by the date it is due. If you pay only part of the fee that is due, your form or request will not be treated as having been submitted until you pay the remainder. If you do not pay the remainder in time, you may miss a deadline. This could have serious implications for your application or right.</p>
        
        <h2 id="enquiries">10. Enquiries</h2>
        
        <p>If you have any questions about the contents of this guidance, please contact our customer support centre. You can <a href="https://www.gov.uk/government/organisations/intellectual-property-office/about/access-and-opening">find out when the customer support centre is open for enquiries</a> at the ‘contact details’ section of our office access and opening times page.</p>
        
        <ul>
          <li>email: <a href="mailto:information@ipo.gov.uk">information@ipo.gov.uk</a>
        </li>
          <li>telephone: 0300 300 2000</li>
        </ul>
        
        </div>
        
        
