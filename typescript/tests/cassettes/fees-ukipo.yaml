          "mainEntity": [
            {
              "@type": "Question",
              "name": "1. Introduction ",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#introduction",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#introduction",
                "text": "\u003cp\u003eOn 1 April 2026, the government will be increasing fees for designs, patents, and trade marks. The fee changes have been laid in parliament under the statutory instrument:  \u003ca rel=\"external\" href=\"https://www.legislation.gov.uk/uksi/2026/183/contents/made\"\u003eThe Intellectual Property Fees (Miscellaneous Amendments, Revocation and Transitional Provisions) Rules 2026\u003c/a\u003e.\u003c/p\u003e\u003cp\u003eThe Intellectual Property Office (\u003cabbr title=\"Intellectual Property Office\"\u003eIPO\u003c/abbr\u003e) has prepared this guidance for customers who may have fees due around 1 April 2026 and explains when and how the new fees will apply.  Please note you are responsible for paying the correct fee.\u003c/p\u003e\u003cp\u003eIn this guidance, “old fee” refers to the fee amount which applies before 1 April 2026, and “new fee” to the amount which applies on and after 1 April 2026. \u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "2. Fee changes ",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#fee-changes",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#fee-changes",
                "text": "\u003cp\u003eYou can view the old and new fees for each right:  \u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.gov.uk/csv-preview/698b663346be5092a1cfd89c/Patents_list_of_current_and_new_fees___4_.csv\"\u003ePatents fees table\u003c/a\u003e \u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.gov.uk/csv-preview/690a33c57a88fd270a95fda9/Trade_marks_list_of_current_and_new_fees.csv\"\u003eTrade marks fees table\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.gov.uk/csv-preview/694140e158a21370f58f2f98/Registered-Designs-list-of-current-and-new-fees.csv\"\u003eRegistered designs fees table\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://www.gov.uk/csv-preview/694140fa5431f4f94d7f0a9c/Unregistered-Designs-list-of-current-and-new-fees.csv\"\u003eUnregistered designs fees table\u003c/a\u003e\u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "3. When the new fees will be introduced ",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#when-the-new-fees-will-be-introduced",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#when-the-new-fees-will-be-introduced",
                "text": "\u003cp\u003eThe new fees will take effect on 1 April 2026. Fees will be charged at the old fee rate up to and including 31 March 2026. \u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "4. Why fees are increasing ",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#why-fees-are-increasing",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#why-fees-are-increasing",
                "text": "\u003cp\u003eThe \u003cabbr title=\"Intellectual Property Office\"\u003eIPO\u003c/abbr\u003e’s fees have not increased since 2018 for patents, 2016 for designs and 1998 for trade marks. During this time, the \u003cabbr title=\"Intellectual Property Office\"\u003eIPO\u003c/abbr\u003e has avoided fee increases by improving efficiency and investing in digital services using existing reserves. However there has been a 32% rise in inflation since 2016.   \u003c/p\u003e\u003cp\u003eFees will increase by an average of 25% on 1 April 2026. This increase will allow the \u003cabbr title=\"Intellectual Property Office\"\u003eIPO\u003c/abbr\u003e to address both the rise in inflation and future cost pressures that cannot be fully offset through further efficiency savings or existing reserves. The fee increases will mean the \u003cabbr title=\"Intellectual Property Office\"\u003eIPO\u003c/abbr\u003e can continue to invest in its systems and provide high quality services. \u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "5.  Application fees ",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#application-fees",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#application-fees",
                "text": "\u003cp\u003eIf you are applying for a trade mark, patent or registered design, or paying an application fee  on or  after 1 April 2026, you will  generally pay the new fee. \u003c/p\u003e\u003cp\u003ePlease note that using the ‘save for later’ or ‘draft’ function does not count as submitting the application. You will have to pay the new fee if submitting the application on or after  1 April 2026.  \u003c/p\u003e\u003cp\u003eIf you are applying for a trade mark or a registered design, then you may need to consider the specific points set out below.  \u003c/p\u003e\u003ch3 id=\"designs-deferral-fee\"\u003e5.1. Designs: deferral fee \u003c/h3\u003e\u003cp\u003eIf you make a request to register a deferred design on or after 1 April 2026, the new fee will apply, even if your original application was submitted before that date.  \u003c/p\u003e\u003ch3 id=\"trade-marks-period-of-grace\"\u003e5.2. Trade Marks: period of grace\u003c/h3\u003e\u003cp\u003eIf you apply for a trade mark before 1 April 2026, and you are relying on the period of grace to pay the application fee on or after 1 April 2026, you will pay the old fee, provided it is paid within the deadline given. This includes any additional class or series fees.   \u003c/p\u003e\u003ch3 id=\"trade-marks-right-start\"\u003e5.3. Trade Marks: Right Start \u003c/h3\u003e\u003cp\u003eIf you have submitted a Right Start application for a trade mark and paid the initial  fee before 1 April 2026, the fee you will pay to complete your registration will be the old fee (provided it is paid within the deadline given, even if that is  on or after 1 April 2026).   \u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "6. Renewal fees ",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#renewal-fees",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#renewal-fees",
                "text": "\u003cp\u003eTo stay in force, IP rights must be renewed on a regular basis – patents every year, designs every 5 years, and trade marks every 10 years.   \u003c/p\u003e\u003cp\u003eThe renewal fee is normally due by a specific date or within a specific period. It can be paid up to 3 months in advance for patents, and up to 6 months in advance for designs and trade marks. There is also a 6 month period in which you can pay the fee late, although this is subject to a separate late renewal fee.  \u003c/p\u003e\u003cp\u003eWhether you pay the old or new fee for your renewal will depend on the date your renewal is due and when you pay the renewal fee.  This does not apply to the late renewal  fee. If you are paying for a renewal that is late on or after 1 April 2026, any late renewal fee will be the new fee.   \u003c/p\u003e\u003cp\u003eYou should consult the table below to see which fee will apply in your circumstances:\u003c/p\u003e\u003ctable\u003e\n  \u003cthead\u003e\n    \u003ctr\u003e\n      \u003ctd\u003e\u003c/td\u003e\n      \u003cth scope=\"col\"\u003ePayment made before 1 April 2026\u003c/th\u003e\n      \u003cth scope=\"col\"\u003ePayment made on or after 1 April 2026 (with no late fee due)\u003c/th\u003e\n      \u003cth scope=\"col\"\u003ePayment made on or after 1 April 2026 (late fee due)\u003c/th\u003e\n    \u003c/tr\u003e\n  \u003c/thead\u003e\n  \u003ctbody\u003e\n    \u003ctr\u003e\n      \u003cth scope=\"row\"\u003eRenewal due date before 1 April 2026\u003c/th\u003e\n      \u003ctd\u003eOld fee\u003c/td\u003e\n      \u003ctd\u003eOld fee\u003c/td\u003e\n      \u003ctd\u003eOld renewal fee + new late fee\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003cth scope=\"row\"\u003eRenewal due date on or after 1 April 2026\u003c/th\u003e\n      \u003ctd\u003eOld fee\u003c/td\u003e\n      \u003ctd\u003eNew Fee\u003c/td\u003e\n      \u003ctd\u003eNew renewal fee + new late fee\u003c/td\u003e\n    \u003c/tr\u003e\n  \u003c/tbody\u003e\n\u003c/table\u003e\u003cp\u003eThe following IP rights can be renewed in advance before 1 April 2026:\u003c/p\u003e\u003cul\u003e\n  \u003cli\u003epatents with a renewal due date in April or May 2026 (those with a renewal date in June 2026 can only be renewed from 1 April 2026 onwards)\u003c/li\u003e\n  \u003cli\u003etrade marks with a renewal due date up to and including 30 September 2026 \u003c/li\u003e\n  \u003cli\u003edesigns with a renewal due date up to and including 30 September 2026\u003c/li\u003e\n\u003c/ul\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "7. Patent grant fees",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#patent-grant-fees",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#patent-grant-fees",
                "text": "\u003cp\u003eIf a notification of grant under section 18(4) is issued before 1 April 2026, and a grant fee is required, the old fees for excess claims and excess pages will apply - even if you pay the fee on or after 1 April 2026 (more information on this is outlined under rule 30A in \u003ca href=\"https://www.gov.uk/government/publications/the-patents-rules-2007-and-patents-fees-rules-2007\"\u003eThe Patents Rules and Fees Rules 2007\u003c/a\u003e).\u003c/p\u003e\u003cp\u003eIf this applies to you, and you are paying the grant fee on or after 1 April, please note that due to technical limitations, our online payment service will only calculate the fee for excess claims and pages based on the new fee amount. You may either:\u003c/p\u003e\u003cul\u003e\n  \u003cli\u003efile using the online service, paying the new fees, and we will refund the difference after filing, or\u003c/li\u003e\n  \u003cli\u003efile using our \u003ca href=\"https://www.gov.uk/government/publications/grant-fee-for-patent-application\"\u003epaper form\u003c/a\u003e and pay the old fees directly.\u003c/li\u003e\n\u003c/ul\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "8. International fees",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#international-fees",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#international-fees",
                "text": "\u003ch3 id=\"international-trade-mark-fees\"\u003e8.1 International trade mark fees\u003c/h3\u003e\u003cp\u003eFees for international trade marks are paid in Swiss francs directly to the World Intellectual Property Organisation (\u003cabbr title=\"World Intellectual Property Organisation\"\u003eWIPO\u003c/abbr\u003e). There are individual fees for international trade marks that designate the UK, and these will also increase on 1 April 2026. You can find the updated fees in \u003ca rel=\"external\" href=\"https://www.wipo.int/documents/d/madrid-system/information-notices-en-2026-madrid_2026_5_e.pdf\"\u003ethe Madrid System Information Notice no. 5/2026\u003c/a\u003e.\u003c/p\u003e\u003ch3 id=\"international-trade-mark-renewals\"\u003e8.2 International trade mark renewals\u003c/h3\u003e\u003cp\u003eYou can pay renewal fees for international trade marks up to 6 months before the renewal due date.\u003c/p\u003e\u003cp\u003eUnder rule 34(7)(d) of the Madrid Regulations, the old fee will apply if:\u003c/p\u003e\u003cul\u003e\n  \u003cli\u003eyou pay the renewal fee before 1 April 2026, even when the renewal due date is on or after 1 April 2026\u003c/li\u003e\n  \u003cli\u003ethe renewal fee is due before 1 April 2026 but is paid on or after that date\u003c/li\u003e\n\u003c/ul\u003e\u003cp\u003eThe new fee will apply if the renewal fee is both due and paid on or after 1 April 2026.\u003c/p\u003e\u003cp\u003eIf you pay more than 6 months before the renewal due date, \u003cabbr title=\"World Intellectual Property Organisation\"\u003eWIPO\u003c/abbr\u003e will treat the payment as being received 6 months before the due date. This may affect whether the old fee or the new fee applies.\u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "9. What happens if you pay the old fee by mistake",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#what-happens-if-you-pay-the-old-fee-by-mistake",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#what-happens-if-you-pay-the-old-fee-by-mistake",
                "text": "\u003cp\u003eYou have to pay the correct fee by the date it is due. If you pay only part of the fee that is due, your form or request will not be treated as having been submitted until you pay the remainder. If you do not pay the remainder in time, you may miss a deadline. This could have serious implications for your application or right.\u003c/p\u003e"
              }
            },
            {
              "@type": "Question",
              "name": "10. Enquiries",
              "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#enquiries",
              "acceptedAnswer": {
                "@type": "Answer",
                "url": "https://www.gov.uk/government/publications/intellectual-property-office-new-fees-from-1-april-2026/new-fees-from-1-april-2026-for-designs-trade-marks-and-patents#enquiries",
                "text": "\u003cp\u003eIf you have any questions about the contents of this guidance, please contact our customer support centre. You can \u003ca href=\"https://www.gov.uk/government/organisations/intellectual-property-office/about/access-and-opening\"\u003efind out when the customer support centre is open for enquiries\u003c/a\u003e at the ‘contact details’ section of our office access and opening times page.\u003c/p\u003e\u003cul\u003e\n  \u003cli\u003eemail: \u003ca href=\"mailto:information@ipo.gov.uk\"\u003einformation@ipo.gov.uk\u003c/a\u003e\n\u003c/li\u003e\n  \u003cli\u003etelephone: 0300 300 2000\u003c/li\u003e\n\u003c/ul\u003e"
              }
            }
          ]
        }
