              Content: "5.4 Invisible component Component parts of complex products not visible during normal use                    5.4 Invisible component Component parts of complex products not visible during normal use                                                 Features of a European Union design applied to, or incorporated in, a ‘component part of a complex product’, will be disregarded               if they are invisible during normal use of the complex product in question (Article\_4(2) EUDR and Recital\_13 Amending Regulation).                                                            Features of a European Union design applied to, or incorporated in, a ‘component part of a complex product’ will be disregarded               if they are not visible during normal use of the complex product in question (Article\_5(2) EUDR and Recital\_11 EUDR).                                                            ‘                           Complex product                           ’ means a product that is composed of multiple components that can be replaced, permitting disassembly and reassembly of the               product (Article\_4(3) EUDR).                                                            ‘Complex product’ means             The saddle of a product that bicycle or motorcycle, for example, is composed of multiple components that can be replaced, permitting disassembly and reassembly of the product (Article 3(3) EUDR).               For instance, the visibility requirement does not apply to a European Union design representing the appearance of a dustbin as a whole because though dustbins may be complex products,               they are not component parts of complex products (23/06/2008, ICD No 4 919). component part of a complex product within the meaning of Article\_4(3)EUDR. The bicycle or motorcycle itself qualifies as a complex product;               the saddle can be replaced through disassembly and reassembly, and without it, the complex product could not be subject to               normal use (16/02/2023, C‑472/21, Monz Handelsgesellschaft Internation, EU:C:2023:105, §\_34).                                       Likewise, the requirement under Article 4(2) EUDR does not apply to             By contrast, an electrode designed to be inserted into a welding torch given, inter alia, its consumable nature, the absence of disassembly and reassembly of the torch when the electrode is replaced,               and the fact that the torch is regarded cannot qualify as complete without the electrode (22/03/2023, a component part according to Article\_5(2) EUDR. This is due to its consumable nature, the fact that replacing it does not require disassembling               and reassembling the torch, because the torch is regarded as complete even without the electrode and the interchangeability               of the electrode (22/03/2023, T‑617/21, Welding torches (part of -), EU:T:2023:152, §\_55-69).                                                                                                         Table 1.                         REUD                         EUD No 1292122‑0001 (5 of 7 views)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         An assessment in abstracto of the visibility of the component part incorporated into a complex product, unconnected to any practical situation of use            of the product, is not sufficient to allow a component part to benefit from protection as a design. Visibility of a component            part of a complex product should be assessed from the perspective of the end user of that product, but also from the perspective            of an external observer (16/02/2023, C‑472/21C‑472/21, Monz Handelsgesellschaft International, EU:C:2023:105, §\_45-46).                                                ‘Normal use’ means use by the end user, excluding maintenance, servicing or repair work (Article\_4(3) EUDR). ‘Normal use’               is the use made in accordance with the purpose for which the complex product is intended.                                                            ‘Normal use’ covers acts performed during the principal use of a complex product as well as acts which must customarily be               carried out by the end user in connection with such use (which, depending of the product, may include its storage and transportation)               (16/02/2023,                            C‑472/21                           , Monz Handelsgesellschaft International, EU:C:2023:105, §\_55-56).                                                            ‘                           Normal use                           ’ means use by the end user, excluding maintenance, servicing or repair work (Article\_5(3) EUDR). ‘Normal use’ is the use               made in accordance with the purpose for which the complex product is intended. It covers acts performed during the principal               use of a complex product as well as acts that must customarily be carried out by the end user in connection with such use               (which, depending of the product, may include its storage and transportation) (16/02/2023,                            C‑472/21                           , Monz Handelsgesellschaft International, EU:C:2023:105, §\_55-56).                                                            For instance, for safety reasons, an electrical connector is a component part that is normally incorporated in a casing in               order to be shielded from any contact with potential users when a complex product, such as a train or an electric vehicle,               is in operation. The fact that this component part of a complex product can theoretically be made visible when inserted in               a transparent casing or cover constitutes a purely hypothetical and random criterion that must be disregarded (03/08/2009,                                          Visibility                            during normal use must be a real possibility and not be based on unlikely scenarios. For example, for safety reasons, an               electrical connector is normally enclosed by a casing to prevent contact with potential users during the operation of a complex               product, such as a train or an electric vehicle, meaning that it is not normally visible. The argument that such a component               could theoretically become visible if inserted in a transparent casing or cover is a purely hypothetical and random criterion               that must be disregarded (03/08/2009,             R\_1052/2008‑3, Contacteurs électriques, Electrical contactors, § 42-53).                                     Where none of the features of a European Union design applied to a component part (e.g. a heat exchanger insert) is visible            during normal use of the complex product (e.g. a heat exchanger), the European Union design will be invalidated as a whole            (20/01/2015, T‑616/13, Heat Exchanger Inserts, HEAT EXCHANGER INSERTS, EU:T:2015:30, § 14-16).                                     However, Article 4(2) 5(2) EUDR does not require a component part to be clearly visible in its entirety at every moment of use of the complex product. It is sufficient if enough for the whole of the component can to be seen some of the time in such a way that all its essential features can be apprehended (16/02/2023, C‑472/21C‑472/21, Monz Handelsgesellschaft International, EU:C:2023:105, §\_45).                                                                                                                        Parent topic: 5 The Different Grounds for Invalidity                                             "
