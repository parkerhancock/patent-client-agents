      content: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"xhtml-strict.dtd\">\r\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\r\n<!-- fmx2xhtml # converter_version:9.3.0 # generated_on:20200819-1010 -->\r\n<head>\n   <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"/>\n   <link type=\"text/css\" rel=\"stylesheet\" href=\"cj-convex.css\"/>\n   <title>62017CJ0650</title>\n</head>\n<body>\n   <p class=\"coj-sum-title-1\">\n      <a id=\"judgment\"> </a>JUDGMENT OF THE COURT (Fourth Chamber)</p>\n   <p class=\"coj-sum-title-1\">30 April 2020 (<span class=\"coj-note\">\n         <a id=\"c-ECR_62017CJ0650_EN_01-E0001\" href=\"#t-ECR_62017CJ0650_EN_01-E0001\">*1</a>\n      </span>)</p>\n   <p class=\"coj-index\">(Reference for a preliminary ruling — Intellectual and industrial property — Regulation (EC) No 469/2009 — Supplementary protection certificate for medicinal products — Conditions for obtaining such a certificate — Article 3(a) — Concept of a ‘product protected by a basic patent in force’ — Assessment criteria)</p>\n   <p class=\"coj-normal\">In Case C‑650/17,</p>\n   <p class=\"coj-normal\">REQUEST for a preliminary ruling under Article 267 TFEU from the Bundespatentgericht (Federal Patent Court, Germany), made by decision of 17 October 2017, received at the Court on 21 November 2017, in the proceedings</p>\n   <p class=\"coj-normal\">\n      <span class=\"coj-bold\">Royalty Pharma Collection Trust</span>\n   </p>\n   <p class=\"coj-pnormal\">v</p>\n   <p class=\"coj-normal\">\n      <span class=\"coj-bold\">Deutsches Patent- und Markenamt,</span>\n   </p>\n   <p class=\"coj-normal\">THE COURT (Fourth Chamber),</p>\n   <p class=\"coj-normal\">composed of M. Vilaras, President of the Chamber, S. Rodin, D. Šváby, K. Jürimäe (Rapporteur) and N. Piçarra, Judges,</p>\n   <p class=\"coj-normal\">Advocate General: G. Hogan,</p>\n   <p class=\"coj-normal\">Registrar: D. Dittert, Head of Unit,</p>\n   <p class=\"coj-normal\">having regard to the written procedure and further to the hearing on 27 June 2019,</p>\n   <p class=\"coj-normal\">after considering the observations submitted on behalf of:</p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Royalty Pharma Collection Trust, by D. Bühler, M. Stief and A. Wünsche, Rechtsanwälte,</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">the French Government, by A.-L. Desjonquères, J. Traband and E. Leclerc, acting as Agents,</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">the Netherlands Government, by M. Bulterman and M.A.M. de Ree, acting as Agents,</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\">–</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">the European Commission, by É. Gippini Fournier, T. Scharf and J. Samnadda, acting as Agents,</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-normal\">after hearing the Opinion of the Advocate General at the sitting on 11 September 2019,</p>\n   <p class=\"coj-normal\">gives the following</p>\n   <p class=\"coj-sum-title-1\">\n      <span class=\"coj-bold\">Judgment</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point1\">1</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">The present request for a preliminary ruling concerns the interpretation of Article 3(a) of Regulation (EC) No 469/2009 of the European Parliament and of the Council of 6 May 2009 concerning the supplementary protection certificate for medicinal products (<a href=\"http://publications.europa.eu/resource/oj/JOL_2009_152_R_TOC\"\n                  hreflang=\"en\"\n                  onclick=\"target='CourtTab';\">OJ 2009 L 152, p. 1</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point2\">2</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">The request has been made in proceedings between Royalty Pharma Collection Trust (‘Royalty Pharma’) and the Deutsches Patent- und Markenamt (German Patent and Trade Mark Office, Germany) (‘the DPMA’) concerning the DPMA’s refusal to issue a supplementary protection certificate (‘the SPC’) for sitagliptin used for the treatment of <span class=\"coj-italic\">diabetes mellitus</span>.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-sum-title-1\">\n      <span class=\"coj-bold\">Legal context</span>\n   </p>\n   <p class=\"coj-title-grseq-2\">\n      <span class=\"coj-bold\">\n         <span class=\"coj-italic\">The EPC</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point3\">3</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Under the heading ‘Extent of protection’, Article 69 of the Convention on the Grant of European Patents, signed in Munich on 5 October 1973, in the version applicable to the dispute in the main proceedings, (‘the EPC’), stipulates as follows:</p>\n            <p class=\"coj-normal\">‘(1)   The extent of the protection conferred by a European patent or a European patent application shall be determined by the claims. Nevertheless, the description and drawings shall be used to interpret the claims.</p>\n            <p class=\"coj-normal\">(2)   For the period up to grant of the European patent, the extent of the protection conferred by the European patent application shall be determined by the claims contained in the application as published. However, the European patent as granted or as amended in opposition, limitation or revocation proceedings shall determine retroactively the protection conferred by the application, in so far as such protection is not thereby extended.’</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point4\">4</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Article 1 of the Protocol on the Interpretation of Article 69, which forms an integral part of the EPC, pursuant to Article 164(1) of the latter, provides:</p>\n            <p class=\"coj-normal\">‘Article 69 should not be interpreted as meaning that the extent of the protection conferred by a European patent is to be understood as that defined by the strict, literal meaning of the wording used in the claims, the description and drawings being employed only for the purpose of resolving an ambiguity found in the claims. Nor should it be taken to mean that the claims serve only as a guideline and that the actual protection conferred may extend to what, from a consideration of the description and drawings by a person skilled in the art, the patent proprietor has contemplated. On the contrary, it is to be interpreted as defining a position between these extremes which combines a fair protection for the patent proprietor with a reasonable degree of legal certainty for third parties.’</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-title-grseq-2\">\n      <span class=\"coj-bold\">\n         <span class=\"coj-italic\">EU law</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point5\">5</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Recitals 3 to 5, 7, 9 and 10 of Regulation No 469/2009 state as follows:</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">‘(3)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">Medicinal products, especially those that are the result of long, costly research, will not continue to be developed in the [European Union] and in Europe unless they are covered by favourable rules that provide for sufficient protection to encourage such research.</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(4)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">At the moment, the period that elapses between the filing of an application for a patent for a new medicinal product and authorisation to place the medicinal product on the market makes the period of effective protection under the patent insufficient to cover the investment put into the research.</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(5)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">This situation leads to a lack of protection which penalises pharmaceutical research.</p>\n                  </td>\n               </tr>\n            </table>\n            <p class=\"coj-normal\">…</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(7)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">A uniform solution at [EU] level should be provided for, thereby preventing the heterogeneous development of national laws leading to further disparities which would be likely to create obstacles to the free movement of medicinal products within the [European Union] and thus directly affect the functioning of the internal market.</p>\n                  </td>\n               </tr>\n            </table>\n            <p class=\"coj-normal\">…</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(9)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">The duration of the protection granted by the [SPC] should be such as to provide adequate effective protection. For this purpose, the holder of both a patent and [an SPC] should be able to enjoy an overall maximum of 15 years of exclusivity from the time the medicinal product in question first obtains authorisation to be placed on the market in the [European Union].</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(10)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">All the interests at stake, including those of public health, in a sector as complex and sensitive as the pharmaceutical sector should nevertheless be taken into account. For this purpose, the [SPC] cannot be granted for a period exceeding five years. The protection granted should furthermore be strictly confined to the product which obtained authorisation to be placed on the market as a medicinal product.’</p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point6\">6</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Article 1 of that regulation provides:</p>\n            <p class=\"coj-normal\">‘For the purposes of this Regulation, the following definitions shall apply:</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(a)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">“medicinal product” means any substance or combination of substances presented for treating or preventing disease in human beings or animals and any substance or combination of substances which may be administered to human beings or animals with a view to making a medical diagnosis or to restoring, correcting or modifying physiological functions in humans or in animals;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(b)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">“product” means the active ingredient or combination of active ingredients of a medicinal product;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(c)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">“basic patent” means a patent which protects a product as such, a process to obtain a product or an application of a product, and which is designated by its holder for the purpose of the procedure for grant of [an SPC];</p>\n                  </td>\n               </tr>\n            </table>\n            <p class=\"coj-normal\">…’</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point7\">7</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Article 3 of that regulation, entitled ‘Conditions for obtaining [an SPC]’, provides:</p>\n            <p class=\"coj-normal\">‘[An SPC] shall be granted if, in the Member State in which the application referred to in Article 7 is submitted and at the date of that application:</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(a)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">the product is protected by a basic patent in force;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(b)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">a valid authorisation to place the product on the market as a medicinal product has been granted …;</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(c)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">the product has not already been the subject of [an SPC];</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(d)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">the authorisation referred to in point (b) is the first authorisation to place the product on the market as a medicinal product.’</p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point8\">8</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Article 4 of that regulation, entitled ‘Subject matter of protection’, provides:</p>\n            <p class=\"coj-normal\">‘Within the limits of the protection conferred by the basic patent, the protection conferred by [an SPC] shall extend only to the product covered by the authorisation to place the corresponding medicinal product on the market and for any use of the product as a medicinal product that has been authorised before the expiry of the [SPC].’</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point9\">9</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Under Article 5 of Regulation No 469/2009, relating to the ‘effects of the [SPC]’:</p>\n            <p class=\"coj-normal\">‘Subject to the provisions of Article 4, the [SPC] shall confer the same rights as conferred by the basic patent and shall be subject to the same limitations and the same obligations.’</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point10\">10</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Under the heading ‘Duration of the [SPC]’, Article 13 of that regulation provides paragraph 1:</p>\n            <p class=\"coj-normal\">‘The [SPC] shall take effect at the end of the lawful term of the basic patent for a period equal to the period which elapsed between the date on which the application for a basic patent was lodged and the date of the first authorisation to place the product on the market in the [European Union], reduced by a period of five years.’</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-sum-title-1\">\n      <span class=\"coj-bold\">The dispute in the main proceedings and the questions referred for a preliminary ruling</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point11\">11</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Royalty Pharma is the proprietor of European patent (DE) EP 1084705 (‘the basic patent at issue in the main proceedings’), applied for on 24 April 1997. That patent discloses a method for lowering blood sugar levels in mammals through the administration of inhibitors of the enzyme dipeptidyl peptidase IV (‘DP IV’), which contributes to the regulation of blood sugar levels.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point12\">12</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Sitagliptin belongs to the group of DP IV inhibitors. That product was developed by a licensee of the basic patent at issue in the main proceedings after the date on which the application for that patent was filed. That licensee obtained a new patent covering sitagliptin, which served as the basic patent for the grant of an SPC.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point13\">13</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">On 17 December 2014, Royalty Pharma filed an application for an SPC for sitagliptin with the DPMA, on the basis of the basic patent at issue in the main proceedings and of an authorisation to place a medicinal product on the market (‘MA’) issued on 21 March 2007 by the European Medicines Agency (EMA) for the medicinal product marketed under the name ‘Januvia’.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point14\">14</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">That application was rejected by the DPMA on 12 April 2017, on the ground that the condition laid down in Article 3(a) of Regulation No 469/2009 had not been satisfied. The DPMA stated that, although sitagliptin does indeed satisfy the functional definition of the DP IV inhibitor in the claims of the basic patent at issue in the main proceedings, that patent does not contain any specific disclosure of that product whatsoever, with the result that the precise active ingredient was not provided to the expert.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point15\">15</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Thus, according to the DPMA, the subject matter of the protection afforded by that patent does not correspond to the medicinal product subsequently developed and marketed under the name ‘Januvia’. It would therefore, it held, be contrary to the objectives of Regulation No 469/2009 to grant an SPC for a product which has not been disclosed by the basic patent at issue in the main proceedings.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point16\">16</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Royalty Pharma brought an action against that decision before the Bundespatentgericht (Federal Patent Court, Germany). It submits that it is not necessary, in order for a product to be afforded the protection conferred by a basic patent in force, that that patent should indicate the chemical name or structure of the protected active ingredient, since the description of the functional characteristics of that active ingredient is sufficient for that purpose. It submits that sitagliptin satisfies the functional definition of a category of active ingredient referred to in the basic patent at issue in the main proceedings. In its view, any DP IV inhibitor to treat <span class=\"coj-italic\">diabetes mellitus</span> comes within ‘the core of the patented invention’ at issue in the main proceedings, which covers all the specific compounds satisfying that definition. The Court of Justice, it submits, has not interpreted Article 3 of Regulation No 469/2009 as meaning that the grant of an SPC for an active ingredient is subject to the condition that that active ingredient be indicated in its individualised form in the claims of the basic patent. Moreover, the Court has pointed out the importance of ‘the core inventive advance’.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point17\">17</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Royalty Pharma also observes that the courts of the United Kingdom interpret the case-law of the Court of Justice to that effect. It states that there are, however, differences of interpretation between the Member States, which are liable to persist if the Court does not clarify that point.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point18\">18</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">The Bundespatentgericht (Federal Patent Court) notes that the Court of Justice has held that, for the purposes of interpreting Article 3(a) of Regulation No 469/2009, regard must be had to the subject matter of protection of the basic patent, which must be determined by interpreting the claims of that patent. In this respect, it finds, the claims have the dual function of defining the subject matter of the protection conferred by the patent and of determining the extent of that protection, which goes beyond that subject matter. The referring court understands the Court’s case-law as meaning that, for the purposes of interpreting that article, account should be taken of the subject matter of the protection and not of the extent of that protection. Thus, an active ingredient will satisfy the condition laid down by that article only if that active ingredient is described in such a specific way in the claims of the basic patent as to make it clear that it forms part of the subject matter of the protection afforded by that patent.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point19\">19</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Contrary to Royalty Pharma’s assertions, the referring court states that the concept of ‘core inventive advance’ is not relevant for the interpretation of Article 3(a) of Regulation No 469/2009. Similarly, the decision of the Bundesgerichtshof (Federal Court of Justice, Germany) of 11 September 2013 (X ZB 8/12) on DP IV inhibitors does not provide an answer on the interpretation of that article, but merely specifies the requirement of sufficient description where a functional definition is used in the claims of a patent.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point20\">20</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">That being the case, the referring court notes the fundamental differences existing between the Member States as to the interpretation of the criteria defined in the case-law of the Court relating to Article 3(a) of Regulation No 469/2009. The referring court mentions, inter alia, the interpretation adopted by the High Court of Justice (England and Wales), Chancery Division (Patents Court) in this connection, for which the concept of ‘core inventive advance’ is applicable to Article 3(a) of Regulation No 469/2009.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point21\">21</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In those circumstances, the Bundespatentgericht (Federal Patent Court) decided to stay the proceedings and to refer the following questions to the Court of Justice for a preliminary ruling:</p>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">‘(1)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">Is a product protected by a basic patent in force pursuant to Article 3(a) of Regulation [No 469/2009] only if it forms part of the subject matter of protection defined by the claims and is thus provided to the expert as a specific embodiment?</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(2)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">Is it not therefore sufficient for the requirements of Article 3(a) of Regulation [No 469/2009] if the product in question satisfies the general functional definition of a class of active ingredients in the claims, but is not otherwise indicated in individualised form as a specific embodiment of the method protected by the basic patent?</p>\n                  </td>\n               </tr>\n            </table>\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count\">(3)</p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">Is a product not protected by a basic patent in force under Article 3(a) of Regulation [No 469/2009] if it is covered by the functional definition in the claims, but was developed only after the filing date of the basic patent as a result of an independent inventive step?’</p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point22\">22</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Following the delivery of the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>), the Court asked the Bundespatentgericht (Federal Patent Court) whether, in the light of that judgment, it wished to maintain its request for a preliminary ruling and, if so, on what grounds.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point23\">23</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">By letter of 21 August 2018, the Bundespatentgericht (Federal Patent Court) informed the Court that it was maintaining that request, arguing, in essence, that there is a need to promote uniform practice at Member-State level in the various situations described in Article 3(a) of Regulation No 469/2009. It stated, however, that it is not clear from the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>), read in the light of the earlier case-law of the Court and the Opinion of the Advocate General in the case which gave rise to that judgment, whether the concept of ‘core inventive advance’ is of any relevance for the purposes of interpreting Article 3(a) of Regulation No 469/2009. The Court, it submitted, should therefore provide further clarification on that point.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-sum-title-1\">\n      <span class=\"coj-bold\">The request to have the oral procedure reopened</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point24\">24</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">By a letter lodged at the Court Registry on 23 September 2019, Royalty Pharma requested that the oral procedure be reopened pursuant to Article 83 of the Rules of Procedure of the Court of Justice.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point25\">25</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In support of its request, Royalty Pharma puts forward two arguments. First, it contends, the Advocate General based his Opinion on an incorrect account of the facts, in so far as, in point 14 of that Opinion, he stated that Royalty Pharma had filed an SPC application for sitagliptin on the basis of basic patent EP 1412357, at issue in the judgment of 8 December 2011, Merck Sharp &amp; Dohme (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2011%3A812\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑125/10</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2011%3A812\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2011:812</a>), whereas that application was based on basic patent EP 1084705. Second, it contends, the Advocate General departed from the case-law arising from the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point26\">26</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In this regard, it is a matter of settled case-law that the Court may, of its own motion, on a proposal from the Advocate General, or at the request of the parties, order the reopening of the oral procedure under Article 83 of its Rules of Procedure if it considers that it lacks sufficient information or that the case must be decided on the basis of an argument which has not been debated between the parties or that one of the parties has submitted a new fact which is of such a nature as to be a decisive factor for the decision of the Court. By contrast, neither the Statute of the Court of Justice of the European Union nor the Rules of Procedure make provision for the parties to submit observations in response to the Advocate General’s Opinion (judgment of 21 March 2019, Abraxis Bioscience, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2019%3A238\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑443/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2019%3A238\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2019:238</a>, paragraph <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2019%3A238#point16\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">16</a> and the case-law cited).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point27\">27</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">With regard to factual errors which should be corrected, these are not of such a nature as to have a decisive influence on the decision adopted by the Court in the context of a request for a preliminary ruling and, therefore, to justify a reopening of the oral part of the procedure. With regard to the argument relating to the Advocate General’s own interpretation of the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>), it must be noted that, by that argument, Royalty Pharma is in fact seeking to respond to certain points of the Advocate General’s Opinion. However, it follows from the case-law cited in the preceding paragraph of the present judgment that there is no provision in the texts governing procedure before the Court for the lodging of such observations.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point28\">28</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Moreover, the Court considers, after hearing the Advocate General, that it has sufficient information to answer the questions raised by the referring court and that all the arguments necessary for the determination of the present case have already been debated in the course of the proceedings.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point29\">29</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Consequently, the request to have the oral procedure reopened must be rejected.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-sum-title-1\">\n      <span class=\"coj-bold\">Consideration of the questions referred</span>\n   </p>\n   <p class=\"coj-title-grseq-2\">\n      <span class=\"coj-bold\">\n         <span class=\"coj-italic\">Preliminary observations</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point30\">30</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">As a preliminary point, it should be noted that, as stated in paragraph 23 of the present judgment, the referring court decided to maintain its request for a preliminary ruling in order to obtain further clarification as to the scope of the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>), for the purposes of resolving the dispute in the main proceedings. More specifically, that court is uncertain whether the concept of ‘core inventive advance’ is relevant for the purposes of interpreting Article 3(a) of Regulation No 469/2009. The referring court notes that, in that judgment, the Court ruled without addressing Advocate General Wathelet’s criticism in his Opinion in Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A278\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A278\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:278</a>), particularly in point 73 of that Opinion, on the use of that concept for the purpose of determining the subject matter of protection conferred by a basic patent. The referring court infers from this that, by not expressly ruling out the application of that concept, for the purposes of assessing whether a combination of active ingredients could be afforded the protection conferred by a basic patent in force, the Court may have implicitly affirmed that concept. The referring court also states that the questions relating to the concept of ‘core inventive advance’ give rise to numerous divergences in the interpretation of Article 3(a) of Regulation No 469/2009 as between the competent national courts and the authorities.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point31\">31</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In this regard, it should be observed that, in its reply to the question raised in the case which gave rise to the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraphs <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point34\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">34</a> and <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point35\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">35</a>), the Court did not employ the concept of ‘core inventive advance’, even though the referring court called on it to do so in its request for a preliminary ruling. On the contrary, in that judgment, the Court recalled the key role played by the claims, under Article 69 of the EPC and Article 1 of the Protocol on the Interpretation of Article 69, thus confirming that the subject matter of the protection conferred by an SPC must be restricted to the technical specifications of the invention covered by the basic patent, such as claimed in that patent (judgment of 25 July 2018, Teva UK and Others, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraph <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point46\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">46</a>), and not extend to the ‘core inventive advance’.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point32\">32</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In so doing, the Court clearly relied on an interpretation of Article 3(a) of Regulation No 469/2009, in the context of which the concept of ‘core inventive advance’ is not relevant.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-title-grseq-2\">\n      <span class=\"coj-bold\">\n         <span class=\"coj-italic\">The first and second questions</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point33\">33</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">By its first and second questions, which it is appropriate to examine together, the referring court asks, in essence, whether Article 3(a) of Regulation No 469/2009 must be interpreted as meaning that a product is protected by a basic patent in force, within the meaning of that provision, if it satisfies a general functional definition used by one of the claims of the basic patent and necessarily comes within the scope of the invention covered by that patent, but is not otherwise indicated in individualised form as a specific embodiment of the method of that patent.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point34\">34</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In that regard, it should be borne in mind that the Court has consistently emphasised the key role played by the claims for the purposes of determining whether a product is protected by a basic patent within the meaning of that provision (judgment of 25 July 2018, Teva UK and Others, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraph <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point34\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">34</a> and the case-law cited).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point35\">35</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">So far as the European patent, in particular, is concerned, it should be noted that, pursuant to Article 69 of the EPC, the extent of the protection conferred is determined by the claims conferred by such a patent. The information in Article 1 of the Protocol on the Interpretation of Article 69 of the EPC states that those claims must ensure both a fair protection for the patent proprietor and a reasonable degree of legal certainty for third parties. Thus, they must not serve merely as a guideline, nor can they be interpreted as meaning that the extent of the protection conferred by a patent is that defined by the narrow, literal meaning of the wording used in the claims (judgment of 25 July 2018, Teva UK and Others, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraph <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point35\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">35</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point36\">36</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In this respect, the Court has held that Article 3(a) of Regulation No 469/2009 does not, in principle, preclude an active ingredient which is given a functional definition in the claims of a basic patent issued by the European Patent Office from being regarded as protected by the patent, on condition, however, that it is possible, on the basis of those claims as interpreted in, inter alia, the light of the description of the invention, as required under Article 69 of the EPC and the Protocol on the Interpretation of that provision, to conclude that the claims relate implicitly but necessarily and specifically to the active ingredient in question (judgment of 25 July 2018, Teva UK and Others, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraph <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point36\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">36</a> and the case-law cited).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point37\">37</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">The Court inferred from this that, in order to ascertain whether a particular product is protected by a basic patent in force, within the meaning of Article 3(a) of Regulation No 469/2009, it is necessary to ascertain, where that product is not expressly mentioned in the claims of that patent, whether that product is necessarily and specifically covered by one of those claims. To that end, two cumulative conditions must be satisfied. First, the product must, from the point of view of a person skilled in the art and in the light of the description and drawings of the basic patent, necessarily come under the invention covered by that patent. Second, the person skilled in the art must be able to identify that product specifically in the light of all the information disclosed by that patent, on the basis of the prior art at the filing date or priority date of the patent concerned (see, to that effect, judgment of 25 July 2018, Teva UK and Others, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraph <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point52\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">52</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point38\">38</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In the case in the main proceedings, it is apparent from the order for reference that, although the claims of the basic patent do not refer expressly to sitagliptin, the latter meets the functional definition used by one of the claims of that patent. In those circumstances, subject to verifications to be carried out by the referring court, sitagliptin, as a DP IV inhibitor, necessarily comes within the scope of the invention covered by the basic patent and, therefore, the first condition laid down in the judgment of 25 July 2018, Teva UK and Others (<a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>), is satisfied.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point39\">39</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">By contrast, doubts may be expressed as to whether sitagliptin, which is not individually identified in the specification of the basic patent at issue in the main proceedings, satisfies the second of the two cumulative conditions identified in paragraph 37 of the present judgment. More specifically, the referring court’s doubts concern, in essence, whether, by reference to the filing date or priority date of the basic patent, and in the light of all the information disclosed by that patent, sitagliptin is specifically identifiable by a person skilled in the art even though it is not individualised as a specific embodiment in the specification of the basic patent. The referring court thus seeks to determine the level of disclosure of the product that is required by Article 3(a) of Regulation No 469/2009.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point40\">40</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In order to determine whether the second condition referred to in paragraph 37 of the present judgment is satisfied, it is, more specifically, for the referring court to ascertain whether the subject matter of the SPC concerned is within the limits of what a person skilled in the art is objectively able, at the filing date or priority date of the basic patent, to infer directly and unequivocally from the specification of that patent as filed, based on that person’s general knowledge in the relevant field at the filing date or priority date, and in the light of the prior art at the filing date or priority date.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point41\">41</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">It follows that, even where the product which is the subject of the SPC is not in individualised form as a specific embodiment of the method of that patent, the grant of an SPC is not, in principle, excluded.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point42\">42</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In so far as, where the product is not explicitly disclosed by the claims of the basic patent, but is covered by a general functional definition, such as that used by the basic patent at issue in the main proceedings, a person skilled in the art must be able to infer directly and unambiguously from the specification of the patent as filed that the product which is the subject of the SPC comes within the scope of the protection afforded by that patent.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point43\">43</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">It follows from the foregoing that the answer to the first and second questions is that Article 3(a) of Regulation No 469/2009 must be interpreted as meaning that a product is protected by a basic patent in force, within the meaning of that provision, if it corresponds to a general functional definition used by one of the claims of the basic patent and necessarily comes within the scope of the invention covered by that patent, but is not otherwise indicated in individualised form as a specific embodiment of the method of that patent, provided that it is specifically identifiable, in the light of all the information disclosed by that patent, by a person skilled in the art, based on that person’s general knowledge in the relevant field at the filing date or priority date of the basic patent and on the prior art at that date.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-title-grseq-2\">\n      <span class=\"coj-bold\">\n         <span class=\"coj-italic\">The third question</span>\n      </span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point44\">44</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">By its third question, the referring court asks whether Article 3(a) of Regulation No 469/2009 must be interpreted as meaning that a product is not protected by the basic patent in force, within the meaning of that provision, if, although it is covered by the functional definition in the claims of that patent, it was developed after the filing date of the application for the basic patent, following an independent inventive step.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point45\">45</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In that regard, it must be observed that, for the purposes of applying the condition laid down by Article 3(a) of Regulation No 469/2009, the subject matter of the protection conferred by the basic patent must be determined at the filing date or priority date of that patent. Were the results from research which took place after the filing date or priority date of that patent to be taken into account, an SPC could enable its holder unduly to enjoy protection for those results, even though they were not known on one or other of those dates.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point46\">46</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">The Court has stated that it is not the purpose of the SPC to extend the protection conferred by the basic patent beyond the invention which that patent covers. It would be contrary to the objective of Regulation No 469/2009, according to which the grant of the additional period of exclusivity by the use of SPCs is intended to encourage research and, to that end, to ensure that the investments made in such research are covered, to grant an SPC for a product which is not covered by the invention which is the subject of the basic patent, inasmuch as such an SPC would not relate to the results of the research claimed under that patent (see, to that effect, judgment of 25 July 2018, Teva UK and Others, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xml;notice=branch\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">C‑121/17</a>, <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/pdf\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">EU:C:2018:585</a>, paragraphs <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point39\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">39</a> and <a href=\"http://publications.europa.eu/resource/ecli/ECLI%3AEU%3AC%3A2018%3A585#point40\"\n                  onclick=\"target='CourtTab';\"\n                  type=\"application/xhtml+xml\"\n                  hreflang=\"en\"\n                  class=\"coj-CourtLink\">40</a>).</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point47\">47</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">It follows that a product which is the subject of an SPC or an SPC application, and which was developed after the filing date or priority date of the basic patent, following an independent inventive step, cannot be regarded as coming within the scope of the subject matter of the protection conferred by that patent.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point48\">48</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">The fact that such a product comes under the functional definition given in the claims of the basic patent cannot invalidate that interpretation. As is apparent from the answer to the first and second questions, a product can be regarded as being protected by a basic patent in force, within the meaning of Article 3(a) of Regulation No 469/2009, only if, from the point of view of a person skilled in the art, based on that person’s general knowledge in the relevant field at the filing date or priority date of that patent, and on the basis of the prior art at that date, that product is specifically identifiable in the light of all the information disclosed by that patent.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point49\">49</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">However, that is not the case for a product which was developed after the filing date or priority date of the basic patent, following an independent inventive step.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point50\">50</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">In the light of the foregoing, the answer to the third question is that Article 3(a) of Regulation No 469/2009 must be interpreted as meaning that a product is not protected by a basic patent in force, within the meaning of that provision, if, although it is covered by the functional definition given in the claims of that patent, it was developed after the filing date of the application for the basic patent, following an independent inventive step.</p>\n         </td>\n      </tr>\n   </table>\n   <p class=\"coj-sum-title-1\">\n      <span class=\"coj-bold\">Costs</span>\n   </p>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\">\n            <p class=\"coj-count\" id=\"point51\">51</p>\n         </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">Since these proceedings are, for the parties to the main proceedings, a step in the action pending before the national court, the decision on costs is a matter for that court. Costs incurred in submitting observations to the Court, other than the costs of those parties, are not recoverable.</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\"> </td>\n         <td valign=\"top\">\n            <p class=\"coj-normal\">On those grounds, the Court (Fourth Chamber) hereby rules:</p>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\"> </td>\n         <td valign=\"top\">\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count coj-bold\">\n                        <span class=\"coj-bold\">1.</span>\n                     </p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">\n                        <span class=\"coj-bold\">Article 3(a) of Regulation (EC) No 469/2009 of the European Parliament and of the Council of 6 May 2009 concerning the supplementary protection certificate for medicinal products must be interpreted as meaning that a product is protected by a basic patent in force, within the meaning of that provision, if it corresponds to a general functional definition used by one of the claims of the basic patent and necessarily comes within the scope of the invention covered by that patent, but is not otherwise indicated in individualised form as a specific embodiment of the method of that patent, provided that it is specifically identifiable, in the light of all the information disclosed by that patent, by a person skilled in the art, based on that person’s general knowledge in the relevant field at the filing date or priority date of the basic patent and on the prior art at that date.</span>\n                     </p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tr>\n         <td valign=\"top\"> </td>\n         <td valign=\"top\">\n            <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n               <col width=\"5%\"/>\n               <col width=\"95%\"/>\n               <tr>\n                  <td valign=\"top\">\n                     <p class=\"coj-count coj-bold\">\n                        <span class=\"coj-bold\">2.</span>\n                     </p>\n                  </td>\n                  <td valign=\"top\">\n                     <p class=\"coj-normal\">\n                        <span class=\"coj-bold\">Article 3(a) of Regulation No 469/2009 must be interpreted as meaning that a product is not protected by a basic patent in force, within the meaning of that provision, if, although it is covered by the functional definition given in the claims of that patent, it was developed after the filing date of the application for the basic patent, following an independent inventive step.</span>\n                     </p>\n                  </td>\n               </tr>\n            </table>\n         </td>\n      </tr>\n   </table>\n   <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">\n      <col width=\"5%\"/>\n      <col width=\"95%\"/>\n      <tbody>\n         <tr>\n            <td> </td>\n            <td>\n               <div class=\"coj-signaturecase\">\n                  <p class=\"coj-normal\">[Signatures]</p>\n               </div>\n            </td>\n         </tr>\n      </tbody>\n   </table>\n   <hr class=\"coj-note\"/>\n   <p class=\"coj-note\">(<span class=\"coj-note\">\n         <a id=\"t-ECR_62017CJ0650_EN_01-E0001\" href=\"#c-ECR_62017CJ0650_EN_01-E0001\">*1</a>\n      </span>)\tLanguage of the case: German.</p>\n</body>\r\n</html>\r\n"
