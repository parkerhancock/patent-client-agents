본 발명은 자동차에 사용되는 VR센서를 몰딩형으로 제작하는 방법에 관한 발명으로, 특히 자동차의 기능향상이나 자동화등을 위한 데이타로서의 차속등을 센싱하여 이를 처리하는 제어기둥에 송신하는 센서등을 제작하는 개량된 제작법에 관한 발명이다. 본 발명은 VR센서를 제작함에 있어서; ①수지개의 보빈(13)을 사출하는 공정과 ,②이에 마그네트(12)와 포일피스(15)를 삽입하는 공정과, ③리드프레임(11)을 융착하는 공정과, ④애나멜드코일(14)을 상기 보빈(13)에 권선하여 보빈어셈블리(1)를 완성하는 공정과, ⑤상기 보빈어셈블리(1)의 외주를 몰딩하는 공정과 ⑥와이어(141)를 상기 리드프레임(11)에 연결하는 공정과, ⑦상기 리드프레임(11)에서 인출되는 와이어(141)와 리드 프레임 상부를 몰딩하는 공정 및⑧ 상기⑤ 공정으로 형성되는 케이블 아웃렛몰딩(23)을 감쌓는 외피하우징(24)을 몰딩하는 공정으로 이루어진 것으로, 저렴하고도 손쉽게 제작이 되며, 밀봉이나 방수는 물론 전기적인 절연성능도 향상되며 완충작용도 되므로 기능부의 보호에도 완벽을 기하로서 있는 효과적인 발명인 것이다.

&lt;astrtCont&gt;
본 발명은 공작기계의 축 회전 정밀도 측정을 위한 정전 용량형 센서 시스템에 관한 것으로서 보다 상세하게는 용도에 적합하도록 개발된 정정 용량형 센서와 이의 신호처리를 통한 초정밀 회전 정밀도 측정 시스템에 관한 것이다.본 발명은 상술한 바와 같이 일반적인 변위 측정 센서로 측정하기 곤란한 정밀 주축의 회전 정밀도 측정을 위해, 측정 대상물의 형상 오차를 제거한 축의 운동 성분 만을 측정하기 위한 시스템을 제공함에 있다.본 발명의 특징은 NT40 표준 척에 쉽게 장착할 수 있는 마스터 실린더와; 상기 마스터 실린더 원주면을 모두 감싸는 4조로 구성된 넓은 면적의 판형 정전 용량형 센서로 구성된 원통형 센서 시스템에 있다.본 발명의 다른 특징은 4쌍의 센서 및 가드 판이 원통형 센서 형상에 서로 전기적으로 분리되도록 제작하는 방법과; 상기 각 센서 및 가드 판에 센서 선 및 가드선을 연결하는 방법과 상기 센서로부터 나온 신호의 처리 회로로의 연결 선의 제작 단계와, 상기 센서를 원통형 틀에 고정하여 에폭시 몰딩의 과정으로 제작하는 단계와; 마지막 연삭 공정을 통하여 원통형 센서에서 센서 및 가드가 분리되며 필요한 형상 정밀도를 내는 단계로 이루어지는 원통형 센서의 제조 방법이 포함된다.
&lt;/astrtCont&gt;

&lt;astrtCont&gt;
1. 청구범위에 기재된 발명이 속하는 기술분야온도센서소자 및 동 소자를 갖춘 온도센서2. 발명이 해결하려고 하는 기술적 과제내열성에 뛰어나고, 열응답성이 빠르고, 저항치가 안정하고, 또한 그 경시변화가 작은 신뢰성이 높은 온도센서소자를 제공함. 3. 발명의 해결방법의 요지온도센서소자는, 온도에 따라서 전기저항이 변화하는 감열성 재료로 이루어진 감열막, 상기 감열막의 막두께 방향의 전기저항을 검지하도록 배열된 전극막, 이것들을 지지하는 내열성 절연재로 이루어진 기판, 상기 감열막과 기판 쪽의 전극막과의 사이에 배치된 확산방지막, 및 상기 감열막, 전극막을 전극막의 리드빼내기부를 제외하고 피복하는 내열성 절연재로 이루어진 막을 구비한다.감열막에는, 식(Al1-x-yCrxFey)2O3(0.05≤x＋y≤0.95,0≤y/(x＋y)≤0.6)으로 표시되고, 확산방지막에는, 식(Al1-x-yCrxFey)2O3(0≤x＋y≤0.95)으로 표시되는 커런덤형 결정구조의 산화물이 사용된다.4. 발명의 중요한 용도자동차 엔진의 배기계통에 사용되는 촉매컨버터등에서 촉매온도를 측정하는데 사용됨.
&lt;/astrtCont&gt;

1. 청구범위에 기재된 발명이 속하는 기술분야선반에 설치한 암의 선단에 부착하여 베이트의 설정위치를 검출하여 그검출신호를 송출하는 터치센서에 있어서, 터치센서의 암선단에 부착하는, 기부의 프랜지를 제1프랜지와 제2프랜지로 분리하여 제1프랜지는 센서와 일체적으로 만들고,제2프랜지는 상설암의 선단에 부착토록 구성하며 제1프랜지와 제2프랜지사이는 착탈이 용이한 체결수단으로 체결하는 것과 함께 제2프랜지의 암선단에 부착하는 면보다 터치센서의 접촉중심까지의 거리는 제1프랜지와 제2프랜지를 분리하기전의 프랜지가 암의 선단에 부착하는 면보다 터치센서의 접촉의 중심선까지의 거리와 거의 동등하게 구성하는 것을 특징으로하는 터치센서 및 터치센서의 개조방법.2. 발명이 해결하려고 하는 기술적 과제선반에 부착한 암내부의 리드선, 또는 암전체를 변경하지 않고 터치센서를 경신하도록한 개조방법을 제공함과 함께, 상기 개조된 구성을 처음부터 채용함으로 터치센서의 경신을 극히 용이하게한 구성.3. 발명의 해결방법요지터치센서의 암선단에 부착한 기부의프랜지를 제1프랜지와 제2프랜지로 분리하여 착탈용이한 체결수단으로 체결함과 동시에 제2프랜지의 암선단에 부착하는 면보다 터치센서의 접촉의 중심선까지의 거리는 제1프랜지와 제2프랜지에 분리하기 전의 프랜지가 암의 선단에 부착하는 면보다 터치센서의 접촉중심선까지의 거리와 거의 동등하게 구성...(이하생략)

&lt;astrtCont&gt;
본 발명은 여러 상이한 영역으로부터의 적외선을 감지하는 다중 센서 요소를 포함하는 방사 온도계에 관한 것이다. 또한, 본 발명은 다중 적외선 센서 요소를 구비한 방사 센서에 관한 것이며, 또한 이러한 방사 센서를 구비한 방사 온도계에 의하여 온도를 결정하는 방법에 관한 것이다. 방사 센서(10)는 하나 이상의 센서 요소(30)와 연관되어 있는 다중 광학 요소(50, 45, 55)로 구성되며, 이들 광학 요소는 입체각을 형성하여 이 입체각 범위로 나오는 방사선이 각 센서 요소 또는 센서 요소에 충돌할 수 있다. 본 발명에 의한 방사 센서가 설치된 귀 온도계에 의해 열을 측정하는 본 발명의 방법은 공지되어 있는 사실, 즉 고막이 이도(耳導)보다 온도가 더 높다는 사실을 기초로 한다. 따라서, 센서 요소의 일부, 즉 고막을 모니터하는 센서 요소는 이도를 모니터하는 나머지 센서 요소보다 높은 온도를 감지한다. 센서 요소로부터 나오는 상당히 더 큰 온도 신호만이 산정된다.
&lt;/astrtCont&gt;

&lt;astrtCont&gt;
본 발명은 스퍼터링을 이용한 박막형 미소온도센서의 제작공정과 상기 공정에 의해 제작된 박막형 미소온도센서에 관한 발명이다. 본 발명은 종래의 열전대로 온도를 측정하는 경우에 미소영역의 온도를 쉽게 측정하지 못하는 단점을 개선하고, 종래의 다이오드센서(Diode sensor)나 저항온도검출기(Resistance Thermal Detector, 약칭으로 RTD)와 같이 온도에 따른 전압신호의 캘리브레이션 (Calibration)을 행하는 후공정이 불필요한 박막형 미소온도센서를 제공함에 그 목적이 있다. 또한 본 발명에 의한 박막형 미소온도센서의 제작방법은 기존의 다이오드 센서나 저항온도검출기의 제작공정과 달리 아주 단순한 공정을 사용하여 간편하게 제작할 수 있어 시간과 비용을 절감하는 효과가 있다.
&lt;/astrtCont&gt;

&lt;astrtCont&gt;
본 발명은 시트형 방식으로 서로 연결된 필름들로서 액체 또는 가스 시료내의 분석물질을 결정하기 위한 센서 카드에 관한 것으로서, 다시 말해서 이는 개구부(10-24,26,28,29)를 가지며 상기 시료와 마주하는 센서 필름(4) 및 전기 태핑을 위한 개구부(64,66)를 가지며 상기 시료로부터 이격된 덮개 필름(6), 상기 센서 필름(4)과 상기 덮개 필름(6) 사이에 제공되고 배열된 적어도 하나의 센서 또는 센서의 일부(48,50,52,56)를 가진다. 본 발명에 따르면, 상기 센서 필름(4) 및 상기 덮개 필름(6) 사이에 적어도 하나의 중간 필름(8)이 제공되는데, 상기 중간 필름(8)에는 절개부(36,38,40,42,44,46)가 제공되고, 상기 절개부(36,38) 중 하나에 상기 센서(48,50,52,56)가 배열된다. 본 발명에 따른 센서 카드는, 상기 센서 카드가 분석 시스템 내에서 유동 채널을 부분적으로 형성하는 플레이트에 연결되는 때에, 액체 시료에 대한 유동 채널의 신뢰할 수 있는 밀봉을 가져오는 균일한 두께를 가진다는 이점을 가진다. 나아가, 본 발명은 그러한 센서 카드를 제조하는 방법에 관한 것이다.

&lt;astrtCont&gt;
1. 청구범위에 기재된 발명이 속한 기술분야본 발명은, 다공성 실리콘 층을 이용한 습도 감지용 센서의 제조 방법 및 그에 의해 제조된 센서에 관한 것임.2. 발명이 해결하려고 하는 기술적 과제본 발명은, 다공성 실리콘 및 폴리이미드 박막을 이용하고 초소형 전자정밀기계(micro electro mechanical system; MEMS) 구조의 에칭 영역을 사용함으로써, 센서 외부에 열려진 부분을 없애 사용상의 안정성을 확보하기 위한, 다공성 실리콘 층을 이용한 습도 감지용 센서의 제조 방법 및 그에 의해 제조된 센서를 제공하는데 그 목적이 있음.3. 발명의 해결방법의 요지본 발명은, 다공성 실리콘 층을 이용한 습도 감지용 센서의 제조 방법에 있어서, n 타입의 제 1실리콘 웨이퍼를 에칭하여 제 1경사면을 생성하는 단계, 상기 제 1실리콘 웨이퍼에 p 타입의 확산 영역을 생성하고, 이를 불산에서 전기분해하여 다공성 실리콘층을 생성하여, 상부구조를 구성하는 단계, n 타입의 제 2실리콘 웨이퍼를 에칭하여 제 2경사면을 생성하는 단계, 상기 제 2실리콘 웨이퍼에 p 타입의 확산에 의하여 저항 영역을 생성하고, 이 저항 영역의 외부 연결을 위한 p+ 전극부 및 금속 전극부를 형성하는 단계, 상기 제 2경사면에 폴리이미드를 스핀 코팅하고 경화하여, 하부구조를 구성하는 단계, 및 상기 상부구조 및 상기 하부구...(이하생략)

1. 청구범위에 기재된 발명이 속한 기술분야본 발명은, 고주파 초음파 센서용 음향 정합층 및 그를 이용한 초음파 센서의 제조 방법에 관한 것임.2. 발명이 해결하려고 하는 기술적 과제본 발명은, 기존에 음향 임피던스 정합층으로 사용하고 있는 에폭시와 알루미나 파우더 복합물 이외에 두께 조절과 공정이 아주 용이한 실리콘 웨이퍼를 음향 정합층으로 사용함으로써, 광대역 특성을 갖는 동시에 상대적으로 높은 감도를 가지도록 하기 위한, 고주파 초음파 센서용 음향 정합층을 제공하는데 그 목적이 있음.3. 발명의 해결방법의 요지본 발명은, 압전 세라믹과, 상기 압전 세라믹의 후면에 도포되는 텅스턴이 섞인 고무 재질의 후면재와, 상기 압전 세라믹의 전면에 접합되고, 두께가 파장의 1/4인 제1 정합층과, 상기 제1 정합층의 전면에 접합되고, 두께가 파장의 1/4인 제2 정합층과, 상기 제2 정합층의 전면에 접합되고, 상기 제1 정합층보다 그 음향 임피던스 및 결합계수가 낮은 지연재와, 상기 지연재의 전면에 접합되는 결합재를 포함하여 구성되며, 상기 결합재와의 임피던스 정합을 위한 고주파 초음파 센서의 음향 정합층에 있어서, 상기 제1 정합층은 실리콘 웨이퍼 재질로 구성되고, 상기 제2 정합층은 에폭시 복합재 재질로 구성되며, 상기 지연재는 플라스틱 재질로 구성되고, 상기 각각은 하기의 식으로 표현되는 것을 특징으...(이하생략)

&lt;astrtCont&gt;
본 발명은 접촉연소식 센서를 마이크로화하여 보상소자를 구비하는 복합가스센서를 제공함으로써, 반도체식 복합센서보다 정밀하게 가스 반응 패턴을 측정할 수 있는 복합 가스센서를 제공하는데 그 목적이 있다. 상기와 같은 목적을 달성하기 위하여 본 발명은, 실리콘 기판 양면에 얇은 절연층을 형성하여 센서기판을 형성하는 단계; 상기 센세기판의 일측 절연층의 중앙부를, 국부적으로 식각하여 윈도우를 형성하여 실리콘 기판이 노출되도록 하는 윈도우 형성단계; 상기 기판에 형성된 윈도우 상부를 가로질러 양측으로 절연층까지 연장되며, 히터, 감지수단 및 전극으로 기능하는 하나의 도선 패턴을 형성하는 도선형성단계; 상기 윈도우 상에 도선패턴이 형성된 기판하부를 식각하여 홈을 형성하는 홈형성단계; 및 상기 도선패턴 상부에 백금(Pt), 팔라듐(Pd) 등의 촉매를 고분산시킨 패이스트 형태의 소형 알루미나 담채를 도포하여 접촉연소식 감지물질을 형성하는 감지물질형성단계를 포함하는 접촉연소식 소형 가스센서 제조방법을 제공한다. 또한, 본 발명은 기판; 상기 기판 상에 형성되는 두전극; 상기 두 전극을 서로 전기적으로 연결하여 열을 제공하는 히터, 가스감지수단으로 각용하는 하나의 도선; 상기 도선 상부에 촉매를 고분산(high dispersion)시킨 패이스트 형태의 ㅅ형 알루미...(이하생략)
&lt;/astrtCont&gt;

&lt;astrtCont&gt;
센서노드를 이용한 리더간의 충돌방지 방법 및 그 방법이 적용된 센서 리더 노드 장치가 개시된다. 본 발명은 센서네트워크와 RFID 네트워크가 결합되어 있는 환경에서 센서 노드의 특성을 이용한 RFID 리더 충돌 방지에 대한 방법을 제안한다. 본 발명은 센서정보 요청 메시지를 브로드캐스트하는 단계, 상기 메시지를 수신한 센서 노드들로부터 상기 요청 메시지의 응답신호를 수신하는 단계, 상기 응답신호의 세기가 소정의 크기 이상인 센서 노드들을 이웃 노드들로 설정하는 단계 및 상기 이웃 노드들이 비충돌 상태이면, 상기 태그를 리드하는 단계를 포함한다. 또한, 본 발명은 센서정보 요청 메시지를 브로드캐스트하는 메시지 송신부, 상기 메시지를 수신한 센서 노드들로부터 상기 요청 메시지의 응답신호를 수신하는 메시지 수신부, 상기 응답신호의 세기가 소정의 크기 이상인 센서 노드들을 이웃 노드들로 설정하는 이웃노드 설정부 및 상기 이웃 노드들이 비충돌 상태이면, 상기 태그를 리드하는 리더부를 포함한다.본 발명에 의하면, 리더와 센서가 결합되어 있는 환경에서, 센서 노드들간의 거리에 따라 리더들 간의 동기를 맞추어 충돌을 방지함으로써, 전체 시스템의 부하를 감소시키고, 시스템을 관리하는데 자원 낭비를 방지하며, 시스템의 처리율 및 효율을 향상시킬 수 있다.

본 발명은 이미지 센서용 화소 회로 및 샘플 및 홀더의 제어방법, 및 이미지 센서에 관한 발명으로서, 보다 구체적으로 CMOS형 이미지 센서용 화소 회로 및 샘플 및 홀더의 제어방법, 및 CMOS형 이미지 센서에 관한 발명이다. 본 발명은 CMOS 이미지 센서용 화소 회로의 제어방법에 있어서, (a) 포토다이오드와 플로팅 확산 영역 사이에 연결된 제1 트랜지스터와 상기 플로팅 확산 영역과 오버플로우 캐패시터 사이에 연결된 제2 트랜지스터를 오프 상태로 유지하며 상기 플로팅 확산 영역을 리셋하는 단계; (b) 상기 제1 트랜지스터를 오프 상태로 유지하고 상기 플로팅 확산 영역을 리셋이 해제된 상태로 유지하며 상기 제2 트랜지스터를 온하여, 상기 포토다이오드로부터 플로팅 확산 영역으로 오버플로우되는 오버플로우 전하를 상기 오버플로우 캐패시터에 저장하는 단계; (c) 상기 (a) 단계 및 상기 (b) 단계를 적어도 1회 이상 반복하는 단계; 및 (d) 상기 포토다이오드에 축적된 전하에 대응하는 저조도 전압 및 상기 오버플로우 캐패시터에 저장된 오버플로우 전하에 대응하는 고조도 전압이 출력되는 단계를 포함하는 제어방법을 제공한다.
&lt;/astrtCont&gt;

센싱소자의 면적을 증가시킬 수 있는 이미지 센서 및 이의 구동방법, 그리고, 이미지 센서의 단위픽셀 및 이의 구동방법이 게시된다. 본 발명의 이미지 센서의 단위픽셀은 저장노드; 외부의 에너지에 의하여 전하를 발생하는 센싱소자로서, 상기 저장노드와 데이터 라인에 접속되어 형성되는 상기 센싱소자; 및 상기 저장노드를 게이트 라인에 커플링하는 저장소자를 구비한다. 본 발명의 이미지 센서의 단위픽셀의 구현을 위해서는, 센싱소자, 저장소자, 게이트 라인 및 데이터 라인만이 필수적으로 요구된다. 따라서, 본 발명의 단위픽셀에 의하면, 레이아웃 면적이 크게 감소한다. 다시 기술하면, 본 발명의 이미지 센서의 단위픽셀에 의하면, 감소된 레이아웃 면적을 센싱소자의 영역으로 활당함으로써, 주어진 단위픽셀의 레이아웃 면적에서 센싱소자의 면적이 증가될 수 있으며, 그에 따라 빛의 대한 센싱이 용이하게 된다.
&lt;/astrtCont&gt;

본 발명은 이산화탄소센서 및 상기 이산화탄소센서가 구비된 이산화탄소 측정장치에 관한 것으로서, 기준전극이 구비되는 기준전극안착홈이 형성된 고체전해질을 이용하고, 센서가 구비되는 센서안착홈이 형성된 가열수단을 이용하여 고정력을 높여 내구성을 향상시키고 규격화가 가능하여 대량생산이 용이하고, 센서 신호의 신뢰성 및 안정성을 높일 수 있는 이산화탄소센서 및 상기 이산화탄소센서가 구비된 이산화탄소 측정장치에 관한 것이다. 본 발명에 따른 이산화탄소센서는 일측 면에 내측으로 함입된 기준전극안착홈이 형성된 고체전해질, 상기 고체전해질의 기준전극안착홈에 형성되는 기준전극, 상기 고체전해질의 타측 면에 형성되는 감지전극, 및 상기 기준전극 및 감지전극과 각각 연결되어 연장되는 한 쌍의 기전력리드선 을 포함하여 형성되는 것을 특징으로 한다. 한편, 본 발명에 따른 이산화탄소 측정장치는 일측 면에 상기 이산화탄소센서가 구비되는 센서안착홈이 형성되는 가열수단, 및 상술한 바와 같은 특징을 가지는 이산화탄소센서를 포함하여 형성되는 것을 특징으로 한다. 이에 따라, 본 발명의 이산화탄소센서 및 상기 이산화탄소센서가 구비된 이산화탄소 측정장치는 기준전극을 정확한 위치에 형성하고, 가열수단에 센서를 정확한 위치에 형성 가능하여 제조의 편의성을 높여 생산성을 향상시킬 수 있으며, 내구성을 높여 사용수명을 증대시킬 수 있는 장...(이하생략)
&lt;/astrtCont&gt;
