openapi: 3.0.3
info:
  title: Petition Decisions API
  version: 1.0.0
  description: The Petition Decisions API for searching and downloading USPTO patent petition decisions data, at no cost - with several ways to do it. To learn about the ODP API Rate Limits, please visit to the <a href="https://data.uspto.gov/apis/api-rate-limits" target="_blank">API Rate Limits page</a>. <br><br> <b>Before proceeding</b>, you must have an ODP API key in order to access these Swagger UI resources. Once you have obtained an API key, you can pass the API key into a REST API call in the x-api-key header of the request. For more details and steps to generate an API key visit to the <a href="https://data.uspto.gov/apis/getting-started" target="_blank">Getting Started page</a>.<br><br>For example, the request to retrieve a single petition decision record by its unique petition decision record identifier, might look like as below.<br><br><code>curl -X "GET" "https://api.uspto.gov/api/v1/petition/decisions/6779f1be-0f3b-5775-b9d3-dcfdb83171c3" -H "X-API-KEY:YOUR_API_KEY"</code><br><br></br>For example search petition decisions using a JSON request body looks something like this.<br><br><code>curl -X "POST" "https://api.uspto.gov/api/v1/petition/decisions/search" -H "X-API-KEY:YOUR_API_KEY" -d "{\"q\":\"finalDecidingOfficeName:OFFICE OF PETITIONS\"}"</br></code>  
  contact:
    email: data@uspto.gov
    url: https://data.uspto.gov/apis/getting-started
    name: USPTO

servers:
  - url: https://api.uspto.gov
    description: Petition Decisions API

security:
  - ApiKeyAuth: []

tags:
  - name: Petition Decision Search
    description: Search, retrieve and download USPTO patent petition decisions.

paths:
  /api/v1/petition/decisions/search:
    x-ip-domain: Patent
    x-service-type: ["Search", "Dissemination"]
    x-content-type: Petition Decisions
    get:
      tags:
        - Petition Decision Search
      summary: Search petition decisions by query parameters
      description: >
        Search petition decisions using query string parameters.
        All parameters are optional. When no query parameters are supplied,
        the top 25 petition decisions sorted by petitionMailDate desc are returned.
      operationId: searchPetitionDecisionsGet
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/facets'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/rangeFilters'
      responses:
        '200':
          $ref: '#/components/responses/SearchSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Petition Decision Search
      summary: Search petition decisions by JSON request body
      description: >
        Search petition decisions using a JSON request body.
        All fields are optional. Empty request body returns the top 25
        petition decisions sorted by petitionMailDate desc.
      operationId: searchPetitionDecisionsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetitionDecisionSearchRequest'
      responses:
        '200':
          $ref: '#/components/responses/SearchSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/petition/decisions/search/download:
    x-ip-domain: Patent
    x-service-type: ["Search", "Dissemination"]
    x-content-type: Petition Decisions
    get:
      tags:
        - Petition Decision Search
      summary: Download petition decisions by query parameters
      description: >
        Download petition decisions as CSV or JSON using query string parameters.
        All parameters are optional. Facets are not supported on this endpoint.
        When no query parameters are supplied, the top 25 petition decisions
        sorted by petitionMailDate desc are returned.
      operationId: downloadPetitionDecisionsGet
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/rangeFilters'
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          $ref: '#/components/responses/DownloadSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Petition Decision Search
      summary: Download petition decisions by JSON request body
      description: >
        Download petition decisions as CSV or JSON using a JSON request body.
        All fields are optional. Facets are not supported on this endpoint.
      operationId: downloadPetitionDecisionsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetitionDecisionDownloadRequest'
      responses:
        '200':
          $ref: '#/components/responses/DownloadSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/petition/decisions/{petitionDecisionRecordIdentifier}:
    x-ip-domain: Patent
    x-service-type: ["Search", "Dissemination"]
    x-content-type: Petition Decisions
    get:
      tags:
        - Petition Decision Search
      summary: Get a single petition decision by record identifier
      description: >
        Retrieve a single petition decision record by its unique
        petition decision record identifier.
      operationId: getPetitionDecisionById
      parameters:
        - name: petitionDecisionRecordIdentifier
          in: path
          required: true
          description: Unique petition decision record identifier.
          schema:
            type: string
          examples:
            example1:
              summary: Petition decision record identifier
              value: 6779f1be-0f3b-5775-b9d3-dcfdb83171c3
      responses:
        '200':
          description: Single petition decision record retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetitionDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  # ----------------------------------------------------------------
  # Parameters
  # ----------------------------------------------------------------
  parameters:
    q:
      name: q
      in: query
      required: false
      description: >
        A search query string which accepts boolean operators (AND, OR, NOT),
        wildcards (*), and exact phrases ("").
      allowReserved: true
      schema:
        type: string
      examples:
        noSearchText:
          summary: No conditions
          description: Empty — no conditions applied
          value:
        exactPhrase:
          summary: Exact phrase
          value: Denied
          description: Search text 'Denied' across all searchable data fields
        booleanAnd:
          summary: Boolean AND
          value: Denied AND Patented
          description: Search for 'Denied' AND 'Patented' across all searchable fields
        searchByField:
          summary: Search by field value
          value: applicationNumberText:11512156
          description: Search data for application number 11512156
        booleanOr:
          summary: Boolean OR
          value: decisionTypeCodeDescriptionText:Denied OR finalDecidingOfficeName:OFFICE
          description: >
            Search where decisionTypeCodeDescriptionText is Denied
            OR finalDecidingOfficeName is OFFICE
        wildcard:
          summary: Wildcard
          value: firstApplicantName:BRANT*
          description: Search where firstApplicantName starts with BRANT
        range:
          summary: Date range
          value: petitionMailDate:[2021-08-04 TO 2021-09-04]
          description: Search where petitionMailDate is between 2021-08-04 and 2021-09-04
        comparison:
          summary: Comparison
          value: decisionTypeCode:>524
          description: Search all records where decisionTypeCode is greater than 524

    sort:
      name: sort
      in: query
      required: false
      description: Field to sort by followed by sort order (asc or desc).
      schema:
        type: string
      examples:
        noSort:
          summary: No sort
          description: Default sort applied
          value:
        ascending:
          summary: Ascending
          value: petitionMailDate asc
          description: Sort by petitionMailDate ascending
        descending:
          summary: Descending
          value: petitionMailDate desc
          description: Sort by petitionMailDate descending

    offset:
      name: offset
      in: query
      required: false
      description: Position in the dataset to start returning records from.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return. Max 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 25
      example: 25

    facets:
      name: facets
      in: query
      required: false
      description: >
        Comma-separated list of field names to aggregate.
        Not supported on /search/download.
      schema:
        type: string
      examples:
        noFacets:
          summary: No facets
          value:
          description: No faceting applied
        facetsExample:
          summary: Facets example
          value: firstInventorToFileIndicator,finalDecidingOfficeName
          description: Facet by firstInventorToFileIndicator and finalDecidingOfficeName

    fields:
      name: fields
      in: query
      required: false
      description: >
        Comma-separated field names to include in the response.
        Returns all fields if omitted.
      schema:
        type: string
      examples:
        allFields:
          summary: All fields
          value:
          description: Returns all available fields
        selectedFields:
          summary: Selected fields
          value: petitionDecisionRecordIdentifier,patentNumber,firstApplicantName,petitionMailDate,decisionPetitionTypeCode,decisionTypeCodeDescriptionText,decisionMailDate,finalDecidingOfficeName,decisionDate,petitionIssueConsideredTextBag,technologyCenter
          description: Returns only the specified fields

    filters:
      name: filters
      in: query
      required: false
      description: >
        Filter data by providing field name and value pairs.
        Separate multiple values with a comma for multi-value filters.
      schema:
        type: string
      examples:
        noFilter:
          summary: No filter
          value:
          description: No filter applied
        singleValueFilter:
          summary: Single value filter
          value: decisionTypeCodeDescriptionText DENIED
          description: Filter where decisionTypeCodeDescriptionText is DENIED
        quotedValueFilter:
          summary: Quoted value filter
          value: businessEntityStatusCategory 'Small'
          description: Filter where businessEntityStatusCategory is Small
        dateFilter:
          summary: Date filter
          value: decisionDate 2023-10-18
          description: Filter where decisionDate is 2023-10-18
        multiValueFilter:
          summary: Multi-value filter
          value: ruleBag 1.76,1.78
          description: Filter where ruleBag is 1.76 or 1.78

    rangeFilters:
      name: rangeFilters
      in: query
      required: false
      description: >
        Filter data by a range of values. Applicable for number and date fields.
        Date values must be in YYYY-MM-DD format.
      schema:
        type: string
      examples:
        noRangeFilter:
          summary: No range filter
          value:
          description: No range filter applied
        dateRangeFilter:
          summary: Date range filter
          value: petitionMailDate 2021-01-01:2025-01-01
          description: Filter where petitionMailDate is between 2021-01-01 and 2025-01-01
        numberRangeFilter:
          summary: Number range filter
          value: ruleBag 1.76:1.90
          description: Filter where ruleBag is between 1.76 and 1.90

    format:
      name: format
      in: query
      required: false
      description: Download format. Defaults to csv if not specified.
      schema:
        type: string
        enum: [json, csv]
        default: csv
      examples:
        csv:
          summary: CSV format
          value: csv
        json:
          summary: JSON format
          value: json

  # ----------------------------------------------------------------
  # Responses
  # ----------------------------------------------------------------
  responses:
    SearchSuccess:
      description: Successful search response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PetitionDecisionSearchResponse'

    DownloadSuccess:
      description: Successful download response.
      headers:
        Content-Disposition:
          schema:
            type: string
          description: "attachment; filename=petition-decisions-{requestId}.csv"
      content:
        text/csv:
          schema:
            type: string
            format: binary
        application/json:
          schema:
            $ref: '#/components/schemas/PetitionDecision'

    BadRequest:
      description: Bad Request — validation error in the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response400'

    Unauthorized:
      description: Unauthorized — missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response401'

    Forbidden:
      description: Forbidden — authenticated but not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response403'

    NotFound:
      description: Not Found — no records match the search criteria.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response404'

    InternalServerError:
      description: Internal Server Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response500'

  # ----------------------------------------------------------------
  # Schemas
  # ----------------------------------------------------------------
  schemas:

    PetitionDecisionSearchRequest:
      type: object
      description: >
        Search request body. All fields are optional.
        Empty request returns top 25 records sorted by petitionMailDate desc.
      properties:
        q:
          type: string
          description: >
            Free-text or advanced Lucene query string. Searches across all
            searchable fields. Supports boolean (OR/AND/NOT), wildcards (BRANT*),
            phrases ("Show cause"), and field-specific queries
            (finalDecidingOfficeName:OFFICE OF PETITIONS).
          example: finalDecidingOfficeName:OFFICE OF PETITIONS
        filters:
          type: array
          description: List of exact match filters.
          items:
            $ref: '#/components/schemas/PetitionDecisionFilter'
        rangeFilters:
          type: array
          description: List of range filters.
          items:
            $ref: '#/components/schemas/PetitionDecisionRange'
        sort:
          type: array
          description: Sort order. Defaults to petitionMailDate desc.
          items:
            $ref: '#/components/schemas/PetitionDecisionSort'
        fields:
          type: array
          description: Fields to include in response. Returns all if omitted.
          items:
            type: string
          example:
            - applicationNumberText
            - patentNumber
            - firstApplicantName
            - petitionMailDate
            - decisionPetitionTypeCode
            - decidedPetitionTypeCodeDescriptionText
            - decisionMailDate
            - finalDecidingOfficeName
            - businessEntityStatusCategory
            - groupArtUnitNumber
        pagination:
          $ref: '#/components/schemas/Pagination'
          facets:
            type: array
            description: Fields to aggregate. Not supported on /search/download.
            items:
              type: string
            example:
              - finalDecidingOfficeName
              - businessEntityStatusCategory
    PetitionDecisionDownloadRequest:
      type: object
      description: >
        Download request body. All fields are optional.
        Empty request returns top 25 records sorted by petitionMailDate desc.
        Facets are not supported on this endpoint.
      properties:
        q:
          type: string
          description: >
            Free-text or advanced Lucene query string. Searches across all
            searchable fields. Supports boolean (OR/AND/NOT), wildcards (BRANT*),
            phrases ("Show cause"), and field-specific queries
            (finalDecidingOfficeName:OFFICE OF PETITIONS).
          example: finalDecidingOfficeName:OFFICE OF PETITIONS
        filters:
          type: array
          description: List of exact match filters.
          items:
            $ref: '#/components/schemas/PetitionDecisionFilter'
        rangeFilters:
          type: array
          description: List of range filters.
          items:
            $ref: '#/components/schemas/PetitionDecisionRange'
        sort:
          type: array
          description: Sort order. Defaults to petitionMailDate desc.
          items:
            $ref: '#/components/schemas/PetitionDecisionSort'
        fields:
          type: array
          description: Fields to include in response. Returns all if omitted.
          items:
            type: string
          example:
            - applicationNumberText
            - patentNumber
            - firstApplicantName
            - petitionMailDate
            - decisionPetitionTypeCode
            - decidedPetitionTypeCodeDescriptionText
            - decisionMailDate
            - finalDecidingOfficeName
            - decisionDate
            - technologyCenter
            - businessEntityStatusCategory
        pagination:
          $ref: '#/components/schemas/Pagination'
        format:
          type: string
          description: Download format. Defaults to csv if not specified.
          enum: [ json, csv ]
          default: csv
          example: csv
    PetitionDecisionSearchResponse:
      type: object
      description: Search response containing matching petition decision records.
      properties:
        count:
          type: integer
          description: Total number of matching records.
          example: 1
        requestIdentifier:
          type: string
          format: uuid
          description: Unique request identifier for traceability.
          example: 07c5c24d-bf8e-458c-9427-a038500d6e98
        petitionDecisionDataBag:
          type: array
          description: List of matching petition decision records.
          items:
            $ref: '#/components/schemas/PetitionDecision'
        facets:
          type: object
          description: Aggregation results per requested facet field.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FacetValue'
          example:
            firstInventorToFileIndicator:
              - value: "false"
                count: 4126
              - value: "true"
                count: 2136
            finalDecidingOfficeName:
              - value: OFFICE OF PETITIONS
                count: 7355
              - value: INTERNATIONAL DIVISION
                count: 120
    PetitionDecision:
      type: object
      description: A single petition decision record.
      properties:
        petitionDecisionRecordIdentifier:
          type: string
          format: uuid
          description: Unique identifier for the petition decision record.
          example: 5d899d97-2bba-50a9-b01d-d87b38c70c55
        applicationNumberText:
          type: string
          description: USPTO patent application number.
          example: "15569871"
        applicationStatusDescriptionText:
          type: string
          description: Current status description of the patent application.
          example: Patent Expired Due to NonPayment of Maintenance Fees Under 37 CFR 1.362
        applicationStatusDate:
          type: string
          format: date
          description: Date of the application status.
          example: "2009-05-04"
        businessEntityStatusCategory:
          type: string
          description: Business entity size category of the applicant.
          example: Small
        customerNumber:
          type: integer
          description: USPTO customer number associated with the application.
          example: 23628
        decisionDate:
          type: string
          format: date
          description: Date the petition decision was issued.
          example: "2024-03-20"
        decisionMailDate:
          type: string
          format: date
          description: Date the petition decision was mailed to the applicant.
          example: "2024-03-25"
        decisionPetitionTypeCode:
          type: integer
          description: Numeric code identifying the type of petition decision.
          example: 551
        decidedPetitionTypeCode:
          type: string
          description: Code representing the decided petition type.
          example: C
        decisionPetitionTypeCodeDescriptionText:
          type: string
          description: Description of the petition type decision code.
          example: To Withdraw A Holding of Abandonment in Pre-Exam Status
        decidedPetitionTypeCodeDescriptionText:
          type: string
          description: Description of the decided petition outcome.
          example: DENIED
        documentBag:
          type: array
          description: List of documents associated with this petition decision.
          items:
            $ref: '#/components/schemas/PetitionDecisionDocument'
        finalPetitionDecisionIndicator:
          type: boolean
          description: Indicates whether this is a final petition decision.
          example: false
        finalDecidingOfficeName:
          type: string
          description: Name of the office that made the final decision.
          example: OFFICE OF PETITIONS
        firstApplicantName:
          type: string
          description: Name of the first applicant on the patent application.
          example: BIOVERATIV THERAPEUTICS INC.
        firstInventorToFileIndicator:
          type: boolean
          description: Indicates whether this is a first inventor to file application.
          example: true
        groupArtUnitNumber:
          type: string
          description: USPTO group art unit number assigned to the application.
          example: "1646"
        technologyCenter:
          type: string
          description: USPTO technology center handling the application.
          example: "1646"
        inventionTitle:
          type: string
          description: Title of the invention as stated in the patent application.
          example: RECEPTOR TYROSINE KINASE BIOMARKERS
        inventorBag:
          type: array
          description: List of inventor names associated with the application.
          items:
            type: string
          example:
            - David Clarke
            - Daniel Rolfe
        actionTakenByCourtName:
          type: string
          description: Name of court that took action, if applicable.
          example: None
        courtActionIndicator:
          type: boolean
          description: Indicates whether court action has been taken.
          example: false
        lastModifiedDateTime:
          type: string
          format: date-time
          description: Timestamp of when the record was last ingested into the system.
          example: "2025-04-23T02:47:58"
        patentNumber:
          type: string
          description: USPTO patent number if the application has been granted.
          example: "8894782"
        petitionIssueConsideredTextBag:
          type: array
          description: List of petition issues considered in this decision.
          items:
            type: string
          example:
            - Review of Technology Center: New ground of rejection in examiner's answer
        petitionMailDate:
          type: string
          format: date
          description: Date the petition was mailed.
          example: "2022-09-12"
        prosecutionStatusCode:
          type: integer
          format: int64
          description: Numeric code representing the prosecution status at the time of petition.
          example: 161
        prosecutionStatusCodeDescriptionText:
          type: string
          description: Description of the prosecution status at time of petition.
          example: During examination
        ruleBag:
          type: array
          description: List of CFR rules cited in the petition decision.
          items:
            type: string
          example:
            - 37 CFR 1.26(a)
            - 37 CFR 1.113
        statuteBag:
          type: array
          description: List of USC statutes cited in the petition decision.
          items:
            type: string
          example:
            - 35 USC 134
        ocrSearchText:
          type: string
          maxLength: 500
          description: >
            OCR extracted text content from the petition decision document.
            Returns up to 500 characters with search term highlighting.
          example: "United States Patent and Trademark Office Commissioner for Patents P.O. Box 1450 Alexandria, VA 22313-1450..."
    PetitionDecisionDocument:
      type: object
      description: A document associated with a petition decision record.
      properties:
        documentCode:
          type: string
          description: Code identifying the type of document.
          example: PETDEC
        documentCodeDescriptionText:
          type: string
          description: Description of the document type code.
          example: Petition Decision
        documentIdentifier:
          type: string
          description: Unique identifier for the document.
          example: M98QOH0NWFYTX17
        downloadOptionBag:
          type: array
          description: List of available download options for this document.
          items:
            type: object
            properties:
              mimeTypeIdentifier:
                type: string
                description: MIME type of the downloadable document.
                example: PDF
              documentURI:
                type: string
                format: uri
                description: URI to download the document.
                example: https://data.uspto.gov/ui/download/applications/16123123/M98QOH0NWFYTX17.pdf
        officialDate:
          type: string
          format: date-time
          description: Official date and time of the document.
          example: "2020-08-31T01:20:29.000-0400"
    PetitionDecisionFilter:
      type: object
      description: >
        Exact match filter. Provide the field name from the dataset
        and one or more values to filter by.
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: Field name to filter on.
          example: decidedPetitionTypeCodeDescriptionText
        value:
          type: array
          description: List of values to filter by.
          items:
            type: string
          example:
            - DENIED
    PetitionDecisionRange:
      type: object
      description: >
        Range filter. Provide a field name from the dataset along with
        valueFrom and valueTo. Date fields must use YYYY-MM-DD format.
      required:
        - field
      properties:
        field:
          type: string
          description: Field name to apply the range filter on.
          example: petitionMailDate
        valueFrom:
          type: string
          description: Range start value inclusive. Date format YYYY-MM-DD.
          example: "2022-08-04"
        valueTo:
          type: string
          description: Range end value inclusive. Date format YYYY-MM-DD.
          example: "2025-08-04"
    PetitionDecisionSort:
      type: object
      description: >
        Sort clause. Provide the field to sort by and the sort direction.
      required:
        - field
        - order
      properties:
        field:
          type: string
          description: Field name to sort by.
          example: petitionMailDate
        order:
          type: string
          description: Sort direction. Case-insensitive.
          enum: [ asc, desc ]
          example: desc
    Pagination:
      type: object
      description: Pagination options for controlling result set size and offset.
      properties:
        offset:
          type: integer
          format: int32
