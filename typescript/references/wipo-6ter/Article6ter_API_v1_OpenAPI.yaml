openapi: 3.0.0
info:
  title: WIPO Article Sixter API
  description: API for retrieving information stored in the Article 6ter database.
  version: 1.2.0
servers:
  - url: https://6ter.wipo.int/api/v1
    description: Article 6ter API
  - url: https://cdn.express.sixter.sdd.acc.web1.wipo.int/api/v1/
    description: Acceptance API Server
  - url: https://cdn.express.sixter.sdd.dev.web1.wipo.int/api/v1/
    description: Development API Server
paths:
  /signs:
    get:
      summary: Details about all the signs, including basic search
      operationId: SignSearch
      tags: [Endpoints]
      parameters:
        - in: query
          name: count
          schema:
            type: boolean
          example: true
        - in: query
          name: offset
          schema:
            type: integer
          example: 0
        - in: query
          name: limit
          schema:
            type: integer
          example: 25
        - in: query
          name: keywords
          schema:
            type: string
          description: Use space as separator between keywords. The search is a full text search  performed on all fields of a sign. To retrieve all signs use "*" as the keyword. For specific searches, use relevant text as the keyword.
          example: '*'
        - in: query
          name: searchType
          schema:
            type: string
            enum: [ANY, ALL, PHRASE , STARTS_WITH]
          example: ANY
          description: The search type determines how the search engine interprets the keywords. "ANY" means that the search engine will return results that contain any of the keywords. "ALL" means that the search engine will return results that contain all the keywords. "PHRASE" means that the search engine will return results that contain the exact phrase. "STARTS_WITH" means that the search engine will return results that begin with the provided phrase.
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [KEY, REL]
          example: KEY
          description: Sorting by "KEY" entails arranging items based on their sign numbers. Sorting by "REL" involves organizing items based on the relevance determined by the search engine
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseTimeMs:
                    type: integer
                  total:
                    type: integer
                  limit:
                    type: string
                  offset:
                    type: string
                  records:
                    type: array
                    items: {}
        # '204':
        #   description: Record not found
        #   content:
        #     application/json:
        #       schema:
        #         type: object
        #         properties:
        #           code: 
        #             type: string
        #             example: NO_CONTENT
        #           message: 
        #             type: string
        #             example: No record found for the given signId
        #           details: 
        #             type: string
        #             example: No record found for the given signId
        #           target: 
        #             type: string
        #             example: /v1/signs
        #           method: 
        #             type: string
        #             example: GET
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: 
                    type: string
                    example: BAD_REQUEST
                  message: 
                    type: string
                    example: Invalid request paramerters
                  details: 
                    type: string
                    example: Exception informaton generated by the server
                  target: 
                    type: string
                    example: /v1/signs
                  method: 
                    type: string
                    example: GET
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: 
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message: 
                    type: string
                    example: Eror while serving the request
                  details: 
                    type: string
                    example: Exception informaton generated by the server
                  target: 
                    type: string
                    example: /v1/signs
                  method: 
                    type: string
                    example: GET
  /signs/{signId}:
    get:
      summary: Details about a specific sign
      description: Retrieve sign details by its unique signId.
      tags: [Endpoints]
      parameters:
        - name: signId
          in: path
          description: signId
          required: true
          type: string
          example: AD0001
      responses:
        '200':
          description: Sign details
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseTimeMs:
                    type: integer
                  details:
                    type: object
        '204':
          description: Record not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: 
                    type: string
                    example: NO_CONTENT
                  message: 
                    type: string
                    example: No record found for the given signId
                  details: 
                    type: string
                    example: No record found for the given signId
                  target: 
                    type: string
                    example: /v1/signs/signId
                  method: 
                    type: string
                    example: GET
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: 
                    type: string
                    example: BAD_REQUEST
                  message: 
                    type: string
                    example: Invalid request paramerters
                  details: 
                    type: string
                    example: Exception informaton generated by the server
                  target: 
                    type: string
                    example: /v1/signs/signId
                  method: 
                    type: string
                    example: GET
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: 
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message: 
                    type: string
                    example: Eror while serving the request
                  details: 
                    type: string
                    example: Exception informaton generated by the server
                  target: 
                    type: string
                    example: /v1/signs/signId
                  method: 
                    type: string
                    example: GET
  /publication:
    get:
      summary: Get publication file download information
      description: Returns the download URLs and metadata (last modified date, file size) for the Article 6ter publication ZIP archive and its MD5 checksum file.
      operationId: getPublicationInfo
      tags: [Endpoints]
      responses:
        '200':
          description: Publication file information
          content:
            application/json:
              schema:
                type: object
                properties:
                  zip:
                    type: object
                    properties:
                      url:
                        type: string
                        example: 'https://6ter.wipo.int/files/6ter.zip'
                      available:
                        type: boolean
                        example: true
                      lastModified:
                        type: string
                        format: date-time
                        example: '2026-07-01T10:00:00Z'
                      size:
                        type: integer
                        description: File size in bytes
                        example: 437123456
                  md5:
                    type: object
                    properties:
                      url:
                        type: string
                        example: 'https://6ter.wipo.int/files/6ter.md5'
                      available:
                        type: boolean
                        example: true
                      lastModified:
                        type: string
                        format: date-time
                        example: '2026-07-01T10:00:00Z'
                      size:
                        type: integer
                        example: 36
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    example: Error while serving the request
                  details:
                    type: string
                  target:
                    type: string
                    example: /v1/publication
                  method:
                    type: string
                    example: GET
  /last-updated:
    get:
      summary: Get last update date of the Article 6ter database
      operationId: getLastUpdate
      tags: [Endpoints]
      responses:
        '200':
          description: Date of the last update
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastUpdated:
                    type: string
                    format: date
                    example: '2022-09-30'
                  responseTimeMs:
                    type: integer
                    example: 77
