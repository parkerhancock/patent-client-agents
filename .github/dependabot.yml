version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # pypdf 6.15+ changes layout-mode spacing and breaks the PRH fee PDF
      # parser; see the pin in pyproject.toml.
      - dependency-name: "pypdf"
        versions: [">=6.15"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
