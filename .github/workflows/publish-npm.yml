name: Publish to npm

# Tag-triggered release of the public TypeScript packages:
# @patent-client-agents/client, @patent-client-agents/waf-session and
# @patent-client-agents/mcp. hosted and waf-worker stay private.
#
# The tag prefix is `ts-v`, so these releases never trigger the PyPI
# workflow (which listens for `v*`), and the TypeScript and Python versions
# move independently.
#
# To ship a new release:
#   1. Bump `version` in all three package.json files on main (they release
#      together). Keep the MCP connector_version literal in step.
#   2. `git tag ts-v0.1.0 && git push origin ts-v0.1.0` (version must match).
#   3. Watch this workflow run.
#
# Publishing reads the NPM_TOKEN repository secret: an npm automation or
# granular token with publish rights on the @patent-client-agents scope.
# `bun publish` rewrites workspace:^ dependencies to ^<version>.

on:
  push:
    tags:
      - 'ts-v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

      - name: Extract versions and compare
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#ts-v}"
          echo "Tag version: $TAG"
          for pkg in client waf-session mcp; do
            V=$(jq -r .version "typescript/packages/$pkg/package.json")
            echo "$pkg: $V"
            if [ "$TAG" != "$V" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match typescript/packages/$pkg version $V. Bump all three package.json files first, commit, then retag."
              exit 1
            fi
          done
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.verify.outputs.version }} to npm
    needs: verify
    runs-on: ubuntu-latest
    # Add protection rules (required reviewers) to this environment in the
    # repository settings if releases should wait for approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@patent-client-agents/mcp/v/${{ needs.verify.outputs.version }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: Run the TypeScript checks (lint, typecheck, tests, smokes)
        run: bun run check

      - name: Publish in dependency order
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for pkg in client waf-session mcp; do
            NAME=$(jq -r .name "packages/$pkg/package.json")
            # Idempotent retries: skip a version that is already published.
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$NAME@$VERSION already published; skipping."
              continue
            fi
            # prepack rebuilds dist from source before packing.
            (cd "packages/$pkg" && bun publish --access public)
          done
