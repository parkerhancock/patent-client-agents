name: Publish to PyPI

# Tag-triggered release pipeline. Tagging `vX.Y.Z` on main builds the wheel
# + sdist, verifies the tag matches the pyproject version, runs the test
# suite one more time, and publishes to PyPI via OIDC trusted publishing
# (no long-lived API token stored anywhere).
#
# To ship a new release:
#   1. Bump `version` in pyproject.toml on main.
#   2. `git tag v0.3.0 && git push origin v0.3.0` (version must match).
#   3. Watch this workflow run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Standalone CI runs against pca's own repo, not the parent monorepo —
# so `tool.uv.sources` workspace directives can't resolve. Tell every uv
# invocation in this workflow to ignore sources and resolve from PyPI.
env:
  UV_NO_SOURCES: "1"

jobs:
  verify:
    name: Verify tag matches pyproject version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

      - name: Extract versions and compare
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
          echo "Tag version:       $TAG"
          echo "pyproject version: $PY_VERSION"
          if [ "$TAG" != "$PY_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (parsed version $TAG) does not match pyproject version $PY_VERSION. Bump pyproject first, commit, then retag."
            exit 1
          fi
          echo "version=$PY_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Replay test suite on Python ${{ matrix.python-version }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.10"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (library + MCP + dev)
        run: uv sync --all-extras --group dev

      - name: Run test suite (VCR replay; no network)
        run: uv run pytest -q

  build:
    name: Build wheel + sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.10"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build distributions
        run: uv build

      - name: List artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish ${{ needs.verify.outputs.version }} to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The `pypi` environment matches the one configured on PyPI's trusted-
    # publisher page. GitHub enforces any protection rules on it (approval,
    # required reviewers, etc.) before this job runs.
    environment:
      name: pypi
      url: https://pypi.org/project/patent-client-agents/${{ needs.verify.outputs.version }}/
    permissions:
      # Required for OIDC trusted publishing. No PyPI token needed.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          # Skip re-publishing if the version already exists (makes the
          # workflow idempotent for retries).
          skip-existing: true
