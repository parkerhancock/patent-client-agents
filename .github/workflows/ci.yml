name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Standalone CI runs against pca's own repo, not the parent monorepo —
# so `tool.uv.sources` workspace directives can't resolve. Tell every uv
# invocation in this workflow to ignore sources and resolve from PyPI.
env:
  UV_NO_SOURCES: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.10"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage-manifest:
    name: Validate coverage + atlas manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.10"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --group dev --all-extras
      - name: Validate manifests
        run: uv run python scripts/build_coverage.py --check

      - name: Validate MCP tool counts in docs
        run: uv run python scripts/mcp_tool_counts.py --check-docs

      - name: Purge jsDelivr coverage cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsS https://purge.jsdelivr.net/gh/parkerhancock/patent-client-agents@main/coverage/atlas.json
          curl -fsS https://purge.jsdelivr.net/gh/parkerhancock/patent-client-agents@main/coverage/coverage.json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.10"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run type checking
        run: uv run ty check src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.10"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run tests with coverage
        # Coverage floor: 60% (current baseline: ~71% as of 2026-05-19).
        # Floor is set conservatively to catch regressions, not chase
        # 100%. Raise the floor when we comfortably clear the next +5%.
        run: |
          uv pip install pytest-cov
          uv run pytest --cov=patent_client_agents --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
